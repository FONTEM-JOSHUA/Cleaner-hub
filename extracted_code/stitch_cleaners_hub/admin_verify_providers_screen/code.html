<!DOCTYPE html>
<html class="light" lang="en">
<head>

    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Verify Providers - Admin - Cleaners Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#87CEEB",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101b22",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]

        <!-- Header -->

            <div class="flex items-center gap-3">

            </div>
            <div class="relative">
                <span class="material-symbols-outlined text-gray-400">search</span>
            </div>
        </div>

        <!-- Pending Count -->

        </div>

        <!-- Provider List -->

                            <p class="text-xs text-gray-500">Service: Home Cleaning</p>
                        </div>
                    </div>
                    <span class="text-[10px] font-bold text-gray-400">2h ago</span>
                </div>
                <div class="bg-gray-50 dark:bg-gray-800/50 p-3 rounded-xl mb-4 flex gap-2">
                    <div class="flex-1 text-center border-r border-gray-200 dark:border-gray-700">
                        <p class="text-[10px] text-gray-400 uppercase">ID Verified</p>
                        <span class="material-symbols-outlined text-green-500 text-sm">check_circle</span>
                    </div>
                    <div class="flex-1 text-center">
                        <p class="text-[10px] text-gray-400 uppercase">Background</p>
                        <span class="material-symbols-outlined text-orange-500 text-sm">pending</span>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button class="flex-1 bg-green-500 text-white font-bold py-2 rounded-xl text-sm active:scale-95 transition-transform">Approve</button>
                    <button class="flex-1 bg-red-50 text-red-500 font-bold py-2 rounded-xl text-sm active:scale-95 transition-transform">Decline</button>
                    <button class="size-10 bg-gray-100 flex items-center justify-center rounded-xl material-symbols-outlined">visibility</button>
                </div>
            </div>

            <!-- Provider Card 2 -->
            <div class="bg-white dark:bg-[#1A2633] rounded-2xl p-4 shadow-sm border border-transparent dark:border-gray-800">
                <div class="flex items-start justify-between mb-4">
                    <div class="flex items-center gap-3">
                        <div class="size-12 rounded-full bg-cover bg-center" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDFuq9bulH-_P8nvFzpm2-H6FOMgxvtY4cCmHsOxH5WZ3BQYdsUVrAcNvgawQo1G30LYQkusPmvB9oDvuLTqBHJOWkGzMt_1ob4dq5J1Rbg74RFPNVlY7ydUD3qe0H92YQvIOenAuwXD4-77JLhIF06mEw_WiNPZIBP6hW-kUpM8yP-g6npBGs3-NrDmH7iE-sDLYl2gqAqMW906SQZ_KQrg8VYnUUt2McXozJhOzwp8NiQ6ITxZkgQKZzUeIa9TJ0yrqYR5g6r-McL');"></div>

                        <p class="text-[10px] text-gray-400 uppercase">ID Verified</p>
                        <span class="material-symbols-outlined text-green-500 text-sm">check_circle</span>
                    </div>
                    <div class="flex-1 text-center">
                        <p class="text-[10px] text-gray-400 uppercase">Background</p>
                        <span class="material-symbols-outlined text-green-500 text-sm">check_circle</span>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button class="flex-1 bg-green-500 text-white font-bold py-2 rounded-xl text-sm active:scale-95 transition-transform">Approve</button>
                    <button class="flex-1 bg-red-50 text-red-500 font-bold py-2 rounded-xl text-sm active:scale-95 transition-transform">Decline</button>

</html>
