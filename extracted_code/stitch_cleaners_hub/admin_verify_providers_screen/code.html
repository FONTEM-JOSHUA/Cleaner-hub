<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Verify Providers - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#42b0f0",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101b22",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "1.5rem",
                        "xl": "2rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#111518] dark:text-white antialiased">
    <div class="relative mx-auto flex h-screen max-w-md flex-col bg-background-light dark:bg-background-dark overflow-hidden shadow-2xl">
        <!-- Top App Bar -->
        <div class="flex items-center justify-between bg-white dark:bg-[#101b22] p-4 pb-2 border-b border-gray-100 dark:border-gray-800 sticky top-0 z-10">
            <button class="flex size-10 items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 cursor-pointer text-gray-900 dark:text-white">
                <span class="material-symbols-outlined text-2xl">arrow_back</span>
            </button>
            <h2 class="flex-1 text-center text-lg font-bold leading-tight tracking-tight text-gray-900 dark:text-white">Verify Providers</h2>
            <div class="size-10"></div>
        </div>

        <!-- Content -->
        <div class="flex-1 overflow-y-auto p-4 space-y-4">
            <div class="bg-white dark:bg-[#15232d] rounded-2xl p-4 shadow-sm border border-gray-100 dark:border-gray-800">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-bold text-gray-500 uppercase text-xs tracking-wider">Pending Approval (3)</h3>
                    <span class="text-[10px] font-bold bg-orange-100 text-orange-600 px-2 py-0.5 rounded-full">Urgent</span>
                </div>

                <div class="space-y-4">
                    <!-- Provider 1 -->
                    <div class="flex flex-col gap-3 p-3 rounded-xl bg-gray-50 dark:bg-gray-800/50">
                        <div class="flex items-center gap-3">
                            <div class="h-12 w-12 rounded-full bg-cover bg-center" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAhkBlodaTswPUAhNv7gpWya8dSNw36zSKmKNgfpKxFy1jR264hOoLgRcjtwPfvjkWZbKhEyLrnJ194EvS6aFYAzTuYEK0q7kw_1ULq-0SXBgiMUsPfPpRNnq3BdhUKyLDumtF2Ogbztg3We881uTuhUCLQlxwT9ZBo6VAhkXKNMBLvcNi0vH46ZK1dtq1x47haujsR2g7qal27jw-SG5A26HrpfNKtMn45CwbQXoQ5ruHuZafnvHAS2ZSIoOufuQMSIGxfmnV6LLnx')"></div>
                            <div class="flex-1">
                                <p class="font-bold text-sm">Jane Smith</p>
                                <p class="text-xs text-gray-500">Cleaner • Applied 2h ago</p>
                            </div>
                            <button class="text-primary text-xs font-bold">Details</button>
                        </div>
                        <div class="flex gap-2">
                            <button class="flex-1 py-2 bg-green-500 text-white text-xs font-bold rounded-lg hover:bg-green-600 transition-colors">Approve</button>
                            <button class="flex-1 py-2 bg-red-500 text-white text-xs font-bold rounded-lg hover:bg-red-600 transition-colors">Decline</button>
                        </div>
                    </div>

                    <!-- Provider 2 -->
                    <div class="flex flex-col gap-3 p-3 rounded-xl bg-gray-50 dark:bg-gray-800/50">
                        <div class="flex items-center gap-3">
                            <div class="h-12 w-12 rounded-full bg-cover bg-center" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAqWdl5u3EnPHI-Y4NXI3DVPo38B9OrsDOq2AFo1K9iW38CR-vh-qg91o7xv0_3pc5_QZIRgsG6Fdpk_QuZcr2_xB8QamQpQIKqSN8PZhjO_zkAaIqWwjSeAdZBlncnbdBuK9xd_45d9kZNgSIdFHI5Nwlwf_jTBD39H380neFXZ2fzUmxXfoujgy5nwz7bhiN_crc2LPxDWDizLujOnZEHMiVydWMjut-vmi5tG-kQcXJfbbQdOXfB06I-4-k5yZvHm0X7so06b-sL')"></div>
                            <div class="flex-1">
                                <p class="font-bold text-sm">Michael Ross</p>
                                <p class="text-xs text-gray-500">Cook • Applied 5h ago</p>
                            </div>
                            <button class="text-primary text-xs font-bold">Details</button>
                        </div>
                        <div class="flex gap-2">
                            <button class="flex-1 py-2 bg-green-500 text-white text-xs font-bold rounded-lg hover:bg-green-600 transition-colors">Approve</button>
                            <button class="flex-1 py-2 bg-red-500 text-white text-xs font-bold rounded-lg hover:bg-red-600 transition-colors">Decline</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white dark:bg-[#15232d] rounded-2xl p-4 shadow-sm border border-gray-100 dark:border-gray-800">
                <h3 class="font-bold text-gray-500 uppercase text-xs tracking-wider mb-4">Verification Steps</h3>
                <div class="space-y-3">
                    <div class="flex items-center gap-3">
                        <div class="h-8 w-8 rounded-full bg-blue-100 text-primary flex items-center justify-center">
                            <span class="material-symbols-outlined text-lg">id_card</span>
                        </div>
                        <div class="flex-1">
                            <p class="text-sm font-semibold">Identity Check</p>
                            <p class="text-[10px] text-gray-400">Verifying government ID</p>
                        </div>
                        <span class="material-symbols-outlined text-green-500">check_circle</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="h-8 w-8 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center">
                            <span class="material-symbols-outlined text-lg">history</span>
                        </div>
                        <div class="flex-1">
                            <p class="text-sm font-semibold">Background Check</p>
                            <p class="text-[10px] text-gray-400">Scanning criminal records</p>
                        </div>
                        <span class="material-symbols-outlined text-orange-400">pending</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
