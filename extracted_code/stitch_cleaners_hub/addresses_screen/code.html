<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>My Addresses - Cleaner Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#87CEEB",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101b22",
                        "surface-light": "#ffffff",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white antialiased">
    <div class="relative flex h-full min-h-screen w-full flex-col max-w-md mx-auto bg-background-light dark:bg-background-dark shadow-xl">
        <!-- Header -->
        <header class="flex items-center px-6 pt-12 pb-4 bg-white dark:bg-background-dark sticky top-0 z-10 border-b border-slate-100 dark:border-slate-800">
            <button class="flex items-center justify-center size-10 rounded-full bg-slate-100 dark:bg-slate-800" onclick="window.dispatchEvent(new CustomEvent('navigate', {detail: 'PROFILE'}))">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <h1 class="ml-4 text-xl font-bold">My Addresses</h1>
        </header>

        <main class="flex-1 overflow-y-auto p-6 space-y-4">
            <!-- Address 1 -->
            <div class="p-4 bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 flex items-start gap-4">
                <div class="size-10 rounded-full bg-blue-50 dark:bg-blue-900/30 text-primary flex items-center justify-center shrink-0">
                    <span class="material-symbols-outlined">home</span>
                </div>
                <div class="flex-1">
                    <div class="flex justify-between items-start">
                        <h3 class="font-bold">Home</h3>
                        <span class="bg-primary/10 text-primary text-[10px] font-bold px-2 py-0.5 rounded-full">DEFAULT</span>
                    </div>
                    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">123 Sky Blue Lane, Apt 4B, New York, NY 10001</p>
                </div>
                <button class="text-slate-400">
                    <span class="material-symbols-outlined text-xl">edit</span>
                </button>
            </div>

            <!-- Address 2 -->
            <div class="p-4 bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 flex items-start gap-4">
                <div class="size-10 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 flex items-center justify-center shrink-0">
                    <span class="material-symbols-outlined">work</span>
                </div>
                <div class="flex-1">
                    <h3 class="font-bold">Office</h3>
                    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">456 Broadway, Suite 200, New York, NY 10012</p>
                </div>
                <button class="text-slate-400">
                    <span class="material-symbols-outlined text-xl">edit</span>
                </button>
            </div>

            <!-- Add New -->
            <button class="w-full py-4 border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-2xl flex items-center justify-center gap-2 text-slate-500 hover:bg-white dark:hover:bg-slate-800 transition-colors mt-8">
                <span class="material-symbols-outlined">add</span>
                <span class="font-bold">Add New Address</span>
            </button>
        </main>
    </div>
</body>
</html>
