<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>My Addresses - Cleaners Hub</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#87CEEB",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-slate-50 font-display text-slate-900 antialiased">
    <div class="relative flex min-h-screen w-full flex-col max-w-md mx-auto bg-slate-50 shadow-xl">
        <header class="flex items-center px-4 pt-12 pb-4 sticky top-0 bg-white z-10 border-b border-slate-100">
            <button class="flex size-10 items-center justify-center rounded-full hover:bg-slate-100">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <h1 class="text-lg font-bold ml-2">My Addresses</h1>
        </header>

        <main class="flex-1 p-4 space-y-4">
            <!-- Address 1 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-start gap-4">
                <div class="size-10 rounded-full bg-primary/10 text-primary flex items-center justify-center shrink-0">
                    <span class="material-symbols-outlined">home</span>
                </div>
                <div class="flex-1">
                    <div class="flex justify-between items-start">
                        <h3 class="font-bold">Home</h3>
                        <span class="text-[10px] font-bold bg-primary/10 text-primary px-2 py-0.5 rounded-full uppercase">Default</span>
                    </div>
                    <p class="text-sm text-slate-500 mt-1">123 Maple Street, Apt 4B</p>
                    <p class="text-sm text-slate-500">San Francisco, CA 94103</p>
                </div>
                <button class="text-slate-400">
                    <span class="material-symbols-outlined">edit</span>
                </button>
            </div>

            <!-- Address 2 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-start gap-4">
                <div class="size-10 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center shrink-0">
                    <span class="material-symbols-outlined">work</span>
                </div>
                <div class="flex-1">
                    <h3 class="font-bold text-slate-700">Office</h3>
                    <p class="text-sm text-slate-500 mt-1">500 Howard St, Suite 300</p>
                    <p class="text-sm text-slate-500">San Francisco, CA 94105</p>
                </div>
                <button class="text-slate-400">
                    <span class="material-symbols-outlined">edit</span>
                </button>
            </div>
        </main>

        <footer class="p-6 bg-white border-t border-slate-100">
            <button class="w-full py-4 bg-primary text-white font-bold rounded-full shadow-lg shadow-primary/30 active:scale-95 transition-transform flex items-center justify-center gap-2">
                <span class="material-symbols-outlined">add</span>
                Add New Address
            </button>
        </footer>
    </div>
</body>
</html>
