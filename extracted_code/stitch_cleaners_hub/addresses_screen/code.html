<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>My Addresses</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
</head>
<body class="bg-[#f5f5f5] dark:bg-[#101b22] font-inter">
    <div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white dark:bg-[#101b22] shadow-sm">
        <div class="flex items-center bg-white dark:bg-[#101b22] p-4 pb-2 justify-between sticky top-0 z-10 border-b border-gray-100 dark:border-gray-800">
            <div class="text-[#111518] dark:text-white flex size-12 shrink-0 items-center justify-start cursor-pointer">
                <span class="material-symbols-outlined">arrow_back_ios</span>
            </div>
            <h2 class="text-lg font-bold flex-1 text-center pr-12">My Addresses</h2>
        </div>
        <div class="p-4 space-y-4">
            <div class="p-4 border border-gray-100 rounded-2xl flex items-center gap-4 bg-white shadow-sm">
                <span class="material-symbols-outlined text-primary p-2 bg-primary/10 rounded-full">home</span>
                <div class="flex-1">
                    <p class="font-bold">Home</p>
                    <p class="text-xs text-gray-500">123 Harmony Street, Apt 4B</p>
                </div>
                <span class="material-symbols-outlined text-gray-400">edit</span>
            </div>
            <div class="p-4 border border-gray-100 rounded-2xl flex items-center gap-4 bg-white shadow-sm">
                <span class="material-symbols-outlined text-primary p-2 bg-primary/10 rounded-full">work</span>
                <div class="flex-1">
                    <p class="font-bold">Office</p>
                    <p class="text-xs text-gray-500">456 Tech Park, Building 2</p>
                </div>
                <span class="material-symbols-outlined text-gray-400">edit</span>
            </div>
            <button class="w-full py-4 border-2 border-dashed border-gray-200 text-gray-400 font-bold rounded-2xl">+ Add New Address</button>
        </div>
    </div>
</body>
</html>
