<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Booking Confirmed - Cleaner Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#87CEEB",
                        "background-light": "#ffffff",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    }
                },
            },
        }
    </script>
    <style>
        @keyframes sparkle {
            0%, 100% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
        }
        .sparkle-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #FFD700;
            border-radius: 50%;
            animation: sparkle 1s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-background-light font-display text-slate-900 antialiased overflow-hidden">
    <div class="relative flex h-screen w-full flex-col max-w-md mx-auto bg-white shadow-xl items-center justify-center p-8 text-center">
        <!-- Success Animation Container -->
        <div class="relative mb-8">
            <!-- Animated Checkmark -->
            <div class="size-24 rounded-full bg-green-100 flex items-center justify-center relative z-10">
                <span class="material-symbols-outlined text-green-500 text-6xl font-bold">check</span>
            </div>

            <!-- Sparkles -->
            <div class="sparkle-dot" style="top: -10px; left: 10px; animation-delay: 0s;"></div>
            <div class="sparkle-dot" style="top: 20px; right: -10px; animation-delay: 0.2s;"></div>
            <div class="sparkle-dot" style="bottom: -5px; left: 40px; animation-delay: 0.4s;"></div>
            <div class="sparkle-dot" style="top: 10px; right: 50px; animation-delay: 0.6s;"></div>
            <div class="sparkle-dot" style="bottom: 30px; left: -15px; animation-delay: 0.8s;"></div>
        </div>

        <h1 class="text-3xl font-bold mb-4">Booking Confirmed!</h1>
        <p class="text-slate-500 mb-8 leading-relaxed">
            Your service has been scheduled successfully. You can track your professional's arrival in the My Bookings section.
        </p>

        <div class="w-full space-y-4">
            <button class="w-full py-4 bg-primary text-white font-bold rounded-2xl shadow-lg shadow-primary/30" onclick="window.dispatchEvent(new CustomEvent('navigate', {detail: 'MY_BOOKINGS'}))">
                View My Bookings
            </button>
            <button class="w-full py-4 bg-slate-100 text-slate-600 font-bold rounded-2xl" onclick="window.dispatchEvent(new CustomEvent('navigate', {detail: 'CLIENT_HOME'}))">
                Back to Home
            </button>
        </div>
    </div>
</body>
</html>
