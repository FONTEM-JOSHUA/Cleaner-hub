<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Booking Confirmed</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
</head>
<body class="bg-white dark:bg-[#101b22] font-inter">
    <div class="relative flex h-full min-h-screen w-full flex-col items-center justify-center p-8 max-w-md mx-auto text-center">
        <div class="h-24 w-24 bg-green-100 rounded-full flex items-center justify-center text-green-500 mb-6">
            <span class="material-symbols-outlined" style="font-size: 60px;">check_circle</span>
        </div>
        <h1 class="text-2xl font-bold mb-2">Booking Confirmed!</h1>
        <p class="text-gray-500 mb-10">Your service has been scheduled successfully. You can track your provider in the My Bookings section.</p>

        <div class="w-full space-y-4">
            <button class="w-full py-4 bg-primary text-white font-bold rounded-2xl shadow-lg">Track Service</button>
            <button class="w-full py-4 text-primary font-bold">Go to Home</button>
        </div>
    </div>
</body>
</html>
