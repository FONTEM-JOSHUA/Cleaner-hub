<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>My Earnings</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#42b0f0",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101b22",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1a2630",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "1.5rem", "xl": "2rem", "2xl": "2.5rem", "full": "9999px" },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white antialiased overflow-x-hidden">
    <div class="sticky top-0 z-50 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-md border-b border-gray-200/50 dark:border-gray-800/50 px-4 py-3">
        <div class="flex items-center justify-between">
            <button class="flex size-10 items-center justify-center rounded-full hover:bg-gray-200 dark:hover:bg-gray-800 transition">
                <span class="material-symbols-outlined text-slate-900 dark:text-white">arrow_back</span>
            </button>
            <h2 class="text-lg font-bold leading-tight">My Earnings</h2>
            <button class="flex size-10 items-center justify-center rounded-full">
                <span class="material-symbols-outlined">ios_share</span>
            </button>
        </div>
    </div>

    <div class="px-4 py-6 max-w-lg mx-auto">
        <!-- Summary Card -->
        <div class="bg-primary rounded-3xl p-6 text-white shadow-lg shadow-blue-200 dark:shadow-none mb-6">
            <p class="text-blue-100 text-sm font-medium mb-1">Total Balance</p>
            <h1 class="text-4xl font-black mb-6">$1,240.50</h1>
            <div class="flex gap-4">
                <button class="flex-1 bg-white text-primary font-bold py-3 rounded-2xl text-sm">Withdraw</button>
                <button class="flex-1 bg-white/20 text-white font-bold py-3 rounded-2xl text-sm backdrop-blur-sm">History</button>
            </div>
        </div>

        <!-- Weekly Stats -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-surface-light dark:bg-surface-dark p-4 rounded-2xl shadow-sm">
                <p class="text-gray-500 text-xs font-medium uppercase tracking-wider mb-1">This Week</p>
                <p class="text-xl font-bold">$450.00</p>
                <p class="text-green-500 text-[10px] font-bold">+12% from last week</p>
            </div>
            <div class="bg-surface-light dark:bg-surface-dark p-4 rounded-2xl shadow-sm">
                <p class="text-gray-500 text-xs font-medium uppercase tracking-wider mb-1">Jobs Done</p>
                <p class="text-xl font-bold">12</p>
                <p class="text-blue-500 text-[10px] font-bold">4.9 average rating</p>
            </div>
        </div>

        <!-- Recent Transactions -->
        <h3 class="text-lg font-bold mb-4">Recent Transactions</h3>
        <div class="space-y-3">
            <div class="flex items-center justify-between p-4 bg-surface-light dark:bg-surface-dark rounded-2xl shadow-sm">
                <div class="flex items-center gap-3">
                    <div class="size-10 rounded-full bg-green-100 dark:bg-green-900/30 flex items-center justify-center text-green-600">
                        <span class="material-symbols-outlined">cleaning_services</span>
                    </div>
                    <div>
                        <p class="text-sm font-bold">Deep Cleaning</p>
                        <p class="text-xs text-gray-500">Oct 24, 2023</p>
                    </div>
                </div>
                <p class="font-bold text-green-600">+$85.00</p>
            </div>
            <div class="flex items-center justify-between p-4 bg-surface-light dark:bg-surface-dark rounded-2xl shadow-sm">
                <div class="flex items-center gap-3">
                    <div class="size-10 rounded-full bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center text-blue-600">
                        <span class="material-symbols-outlined">account_balance_wallet</span>
                    </div>
                    <div>
                        <p class="text-sm font-bold">Withdrawal to Bank</p>
                        <p class="text-xs text-gray-500">Oct 22, 2023</p>
                    </div>
                </div>
                <p class="font-bold text-gray-900 dark:text-white">-$500.00</p>
            </div>
        </div>
    </div>
</body>
</html>
