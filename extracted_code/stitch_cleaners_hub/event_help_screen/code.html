<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Event Help - Cleaners Hub</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#87CEEB",
                        "background-light": "#ffffff",
                        "surface-light": "#f6f7f8",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light font-display text-slate-900 antialiased">
    <div class="relative flex min-h-screen w-full flex-col max-w-md mx-auto bg-background-light shadow-xl">
        <header class="flex items-center px-6 pt-12 pb-4 sticky top-0 bg-white z-10 border-b border-slate-100">
            <button class="flex items-center justify-center size-10 rounded-full hover:bg-slate-100">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <h1 class="text-xl font-bold ml-2">Event Help</h1>
        </header>

        <main class="flex-1 px-6 py-6 overflow-y-auto">
            <div class="bg-primary/10 rounded-2xl p-6 mb-8 text-center">
                <div class="size-16 rounded-full bg-primary text-white flex items-center justify-center mx-auto mb-4">
                    <span class="material-symbols-outlined text-3xl">celebration</span>
                </div>
                <h2 class="text-2xl font-bold mb-2">Planning an Event?</h2>
                <p class="text-slate-600">Get professional help for parties, weddings, and special gatherings.</p>
            </div>

            <h3 class="font-bold text-lg mb-4">Select Event Type</h3>
            <div class="grid grid-cols-2 gap-4 mb-8">
                <button class="flex flex-col items-center gap-3 p-4 rounded-2xl bg-surface-light border-2 border-transparent hover:border-primary transition-all">
                    <span class="material-symbols-outlined text-3xl text-primary">cake</span>
                    <span class="font-medium">Birthday Party</span>
                </button>
                <button class="flex flex-col items-center gap-3 p-4 rounded-2xl bg-surface-light border-2 border-transparent hover:border-primary transition-all">
                    <span class="material-symbols-outlined text-3xl text-primary">favorite</span>
                    <span class="font-medium">Wedding</span>
                </button>
                <button class="flex flex-col items-center gap-3 p-4 rounded-2xl bg-surface-light border-2 border-transparent hover:border-primary transition-all">
                    <span class="material-symbols-outlined text-3xl text-primary">groups</span>
                    <span class="font-medium">Corporate</span>
                </button>
                <button class="flex flex-col items-center gap-3 p-4 rounded-2xl bg-surface-light border-2 border-transparent hover:border-primary transition-all">
                    <span class="material-symbols-outlined text-3xl text-primary">home</span>
                    <span class="font-medium">House Warming</span>
                </button>
            </div>

            <h3 class="font-bold text-lg mb-4">What help do you need?</h3>
            <div class="space-y-3">
                <label class="flex items-center gap-3 p-4 rounded-xl border border-slate-200 cursor-pointer">
                    <input type="checkbox" class="rounded text-primary focus:ring-primary"/>
                    <span>Pre-event deep cleaning</span>
                </label>
                <label class="flex items-center gap-3 p-4 rounded-xl border border-slate-200 cursor-pointer">
                    <input type="checkbox" class="rounded text-primary focus:ring-primary"/>
                    <span>Waitstaff & Serving</span>
                </label>
                <label class="flex items-center gap-3 p-4 rounded-xl border border-slate-200 cursor-pointer">
                    <input type="checkbox" class="rounded text-primary focus:ring-primary"/>
                    <span>Post-event cleanup</span>
                </label>
            </div>
        </main>

        <footer class="p-6 border-t border-slate-100 bg-white">
            <button class="w-full py-4 bg-primary text-white font-bold rounded-full shadow-lg shadow-primary/30">
                Get Custom Quote
            </button>
        </footer>
    </div>
</body>
</html>
