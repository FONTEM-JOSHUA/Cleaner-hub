<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Event Help</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
</head>
<body class="bg-[#f5f5f5] dark:bg-[#101b22] font-inter">
    <div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white dark:bg-[#101b22] shadow-sm">
        <div class="flex items-center bg-white dark:bg-[#101b22] p-4 pb-2 justify-between sticky top-0 z-10 border-b border-gray-100 dark:border-gray-800">
            <div class="text-[#111518] dark:text-white flex size-12 shrink-0 items-center justify-start cursor-pointer">
                <span class="material-symbols-outlined">arrow_back_ios</span>
            </div>
            <h2 class="text-lg font-bold flex-1 text-center pr-12">Event Help</h2>
        </div>
        <div class="p-4 space-y-4">
            <div class="bg-primary/10 p-4 rounded-2xl border border-primary/20">
                <h3 class="font-bold text-primary mb-2">Parties & Weddings</h3>
                <p class="text-sm text-gray-600">Get a team of professionals to help with your special event. From setup to cleanup.</p>
            </div>
            <div class="space-y-3">
                <label class="block text-sm font-bold">Event Type</label>
                <select class="w-full p-3 rounded-xl border border-gray-200 bg-white">
                    <option>Birthday Party</option>
                    <option>Wedding</option>
                    <option>Corporate Event</option>
                    <option>Other</option>
                </select>
            </div>
            <button class="w-full py-4 bg-primary text-white font-bold rounded-2xl shadow-lg mt-4">Find Event Team</button>
        </div>
    </div>
</body>
</html>
