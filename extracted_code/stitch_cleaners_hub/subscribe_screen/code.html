<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Subscribe</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
</head>
<body class="bg-[#f5f5f5] dark:bg-[#101b22] font-inter">
    <div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white dark:bg-[#101b22] shadow-sm">
        <div class="flex items-center bg-white dark:bg-[#101b22] p-4 pb-2 justify-between sticky top-0 z-10 border-b border-gray-100 dark:border-gray-800">
            <div class="text-[#111518] dark:text-white flex size-12 shrink-0 items-center justify-start cursor-pointer">
                <span class="material-symbols-outlined">arrow_back_ios</span>
            </div>
            <h2 class="text-lg font-bold flex-1 text-center pr-12">Subscribe</h2>
        </div>
        <div class="p-4 space-y-6">
            <h2 class="text-xl font-bold text-center">Save more with monthly plans</h2>
            <div class="space-y-4">
                <div class="p-6 border-2 border-primary rounded-2xl bg-primary/5 relative">
                    <div class="absolute top-0 right-0 bg-primary text-white text-[10px] font-bold px-3 py-1 rounded-bl-xl uppercase">Best Value</div>
                    <h3 class="text-lg font-bold">Weekly Plan</h3>
                    <p class="text-sm text-gray-500">4 visits per month</p>
                    <p class="text-2xl font-bold mt-4">$120<span class="text-sm font-normal text-gray-400">/month</span></p>
                    <p class="text-xs text-green-500 font-bold">Save 10%</p>
                </div>
                <div class="p-6 border border-gray-100 rounded-2xl bg-white shadow-sm">
                    <h3 class="text-lg font-bold">Bi-Weekly Plan</h3>
                    <p class="text-sm text-gray-500">2 visits per month</p>
                    <p class="text-2xl font-bold mt-4">$70<span class="text-sm font-normal text-gray-400">/month</span></p>
                </div>
            </div>
            <button class="w-full py-4 bg-primary text-white font-bold rounded-2xl shadow-lg">Start Subscription</button>
        </div>
    </div>
</body>
</html>
