<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Chat - Cleaners Hub</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#87CEEB",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-slate-50 font-display text-slate-900 antialiased h-screen flex flex-col">
    <!-- Chat Header -->
    <header class="flex items-center bg-white px-4 py-3 justify-between shadow-sm sticky top-0 z-10">
        <button class="flex size-10 items-center justify-center rounded-full hover:bg-slate-100">
            <span class="material-symbols-outlined">arrow_back</span>
        </button>
        <div class="flex items-center gap-3 flex-1 ml-2">
            <div class="bg-center bg-cover rounded-full h-10 w-10 border border-slate-200" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuB11SWyk69MKuAueTAteTTASrLOIWgCJYB47hihIygSiI2DYUs8bOFTNhyoynj1aBAMSqdz4GuUsIDICDxGR9_CkUKLrF2g2SVLDgvxQW49ipTTMGrCeHZJEhEaRYbbFz4B_TAbxFeGhm-ysJJvf-SHx-yFevt3rtloFfqBcJiVo1NBcDEj-094suT7wWhbw76XRQ88QUfldAK7QUqhFpgcdVq_tE51zlHQe0DljkXDOY5IakF922NE8fw40xmakkEq1zYZWHYgoc8z");'></div>
            <div class="flex flex-col">
                <h2 class="text-sm font-bold leading-tight">Sarah Jenkins</h2>
                <span class="text-primary text-[10px] font-bold">Online</span>
            </div>
        </div>
        <button class="flex items-center justify-center rounded-full size-10 text-slate-400 hover:text-primary transition-colors">
            <span class="material-symbols-outlined">call</span>
        </button>
    </header>

    <!-- Chat Messages -->
    <main class="flex-1 overflow-y-auto p-4 space-y-4">
        <div class="flex justify-center">
            <span class="bg-slate-200 text-slate-500 text-[10px] font-bold px-3 py-1 rounded-full uppercase">Today</span>
        </div>

        <!-- Received Message -->
        <div class="flex justify-start">
            <div class="flex flex-col max-w-[80%] gap-1">
                <div class="bg-white p-3 rounded-2xl rounded-tl-none shadow-sm text-sm">
                    Hi! Just confirming our appointment for today at 2 PM.
                </div>
                <span class="text-[9px] text-slate-400 ml-1">10:30 AM</span>
            </div>
        </div>

        <!-- Sent Message -->
        <div class="flex justify-end">
            <div class="flex flex-col items-end max-w-[80%] gap-1">
                <div class="bg-primary text-white p-3 rounded-2xl rounded-tr-none shadow-sm text-sm">
                    Yes, that works perfectly for me. See you then!
                </div>
                <div class="flex items-center gap-1">
                    <span class="text-[9px] text-slate-400">10:32 AM</span>
                    <span class="material-symbols-outlined text-[12px] text-primary">done_all</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Chat Input -->
    <footer class="p-3 bg-white border-t border-slate-100">
        <div class="flex items-center gap-2">
            <button class="flex items-center justify-center size-10 rounded-full text-slate-400 hover:text-primary">
                <span class="material-symbols-outlined">add_circle</span>
            </button>
            <div class="flex-1 bg-slate-100 rounded-full px-4 py-2 flex items-center">
                <input class="bg-transparent border-none focus:ring-0 text-sm w-full p-0" placeholder="Type a message..." type="text"/>
            </div>
            <button class="flex items-center justify-center size-10 rounded-full bg-primary text-white shadow-md active:scale-95 transition-transform">
                <span class="material-symbols-outlined text-[20px]">send</span>
            </button>
        </div>
        <!-- Quick Actions Row -->
        <div class="flex justify-around mt-3">
            <button class="flex flex-col items-center gap-0.5">
                <span class="material-symbols-outlined text-slate-400 text-xl">photo_camera</span>
                <span class="text-[9px] text-slate-500 font-bold uppercase">Photo</span>
            </button>
            <button class="flex flex-col items-center gap-0.5">
                <span class="material-symbols-outlined text-slate-400 text-xl">location_on</span>
                <span class="text-[9px] text-slate-500 font-bold uppercase">Location</span>
            </button>
            <button class="flex flex-col items-center gap-0.5">
                <span class="material-symbols-outlined text-slate-400 text-xl">mic</span>
                <span class="text-[9px] text-slate-500 font-bold uppercase">Voice</span>
            </button>
        </div>
    </footer>
</body>
</html>
