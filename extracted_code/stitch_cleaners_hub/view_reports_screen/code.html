<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Financial Reports</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#87CEEB",
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#f5f5f5] dark:bg-[#101b22] font-inter">
    <div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white dark:bg-[#101b22] shadow-sm">
        <!-- Header -->
        <div class="flex items-center bg-white dark:bg-[#101b22] p-4 pb-2 justify-between sticky top-0 z-10 border-b border-gray-100 dark:border-gray-800">
            <div class="text-[#111518] dark:text-white flex size-12 shrink-0 items-center justify-start cursor-pointer transition-opacity hover:opacity-70">
                <span class="material-symbols-outlined" style="font-size: 24px;">arrow_back_ios</span>
            </div>
            <h2 class="text-[#111518] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Financial Reports</h2>
        </div>

        <!-- Content -->
        <div class="flex-1 overflow-y-auto p-4 space-y-6">
            <!-- Stats Grid -->
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white dark:bg-[#1a2633] p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-800">
                    <p class="text-xs text-gray-500 mb-1 uppercase tracking-wider">Total Revenue</p>
                    <p class="text-2xl font-bold text-[#111518] dark:text-white">$45,230</p>
                    <p class="text-[10px] text-green-500 font-bold mt-1">+12% from last month</p>
                </div>
                <div class="bg-white dark:bg-[#1a2633] p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-800">
                    <p class="text-xs text-gray-500 mb-1 uppercase tracking-wider">Active Users</p>
                    <p class="text-2xl font-bold text-[#111518] dark:text-white">1,284</p>
                    <p class="text-[10px] text-green-500 font-bold mt-1">+5% from last month</p>
                </div>
            </div>

            <!-- Chart Placeholder -->
            <div class="bg-white dark:bg-[#1a2633] p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-800">
                <h3 class="font-bold mb-4">Weekly Earnings</h3>
                <div class="h-40 flex items-end justify-between gap-2 px-2">
                    <div class="w-full bg-primary/30 rounded-t h-[40%]"></div>
                    <div class="w-full bg-primary/30 rounded-t h-[60%]"></div>
                    <div class="w-full bg-primary/30 rounded-t h-[45%]"></div>
                    <div class="w-full bg-primary/30 rounded-t h-[80%]"></div>
                    <div class="w-full bg-primary rounded-t h-[95%]"></div>
                    <div class="w-full bg-primary/30 rounded-t h-[70%]"></div>
                    <div class="w-full bg-primary/30 rounded-t h-[50%]"></div>
                </div>
                <div class="flex justify-between mt-2 px-1">
                    <span class="text-[10px] text-gray-400">Mon</span>
                    <span class="text-[10px] text-gray-400">Tue</span>
                    <span class="text-[10px] text-gray-400">Wed</span>
                    <span class="text-[10px] text-gray-400">Thu</span>
                    <span class="text-[10px] text-gray-400">Fri</span>
                    <span class="text-[10px] text-gray-400">Sat</span>
                    <span class="text-[10px] text-gray-400">Sun</span>
                </div>
            </div>

            <!-- Recent Transactions -->
            <div class="space-y-3">
                <h3 class="font-bold">Recent Transactions</h3>
                <div class="bg-white dark:bg-[#1a2633] p-3 rounded-xl shadow-sm border border-gray-100 dark:border-gray-800 flex justify-between items-center">
                    <div>
                        <p class="text-sm font-bold">Booking #4829</p>
                        <p class="text-[10px] text-gray-400">Oct 22, 2023</p>
                    </div>
                    <p class="font-bold text-green-500">+$85.00</p>
                </div>
                <div class="bg-white dark:bg-[#1a2633] p-3 rounded-xl shadow-sm border border-gray-100 dark:border-gray-800 flex justify-between items-center">
                    <div>
                        <p class="text-sm font-bold">Booking #4828</p>
                        <p class="text-[10px] text-gray-400">Oct 21, 2023</p>
                    </div>
                    <p class="font-bold text-green-500">+$120.00</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
