<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Invite Friends</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
</head>
<body class="bg-white dark:bg-[#101b22] font-inter">
    <div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white dark:bg-[#101b22] shadow-sm">
        <div class="flex items-center bg-white dark:bg-[#101b22] p-4 pb-2 justify-between sticky top-0 z-10">
            <div class="text-[#111518] dark:text-white flex size-12 shrink-0 items-center justify-start cursor-pointer">
                <span class="material-symbols-outlined">arrow_back_ios</span>
            </div>
        </div>
        <div class="flex-1 flex flex-col items-center justify-center p-8 text-center">
            <div class="h-40 w-40 mb-8 bg-primary/10 rounded-full flex items-center justify-center">
                <span class="material-symbols-outlined text-primary" style="font-size: 80px;">card_giftcard</span>
            </div>
            <h1 class="text-2xl font-bold mb-3">Invite & Earn $10</h1>
            <p class="text-gray-500 mb-8">Share your code with friends. When they book their first service, you both get $10 credit!</p>

            <div class="w-full p-4 bg-gray-50 rounded-2xl border-2 border-dashed border-primary/20 flex items-center justify-between mb-8">
                <span class="font-bold text-lg text-primary tracking-widest uppercase">CLEAN10</span>
                <span class="text-xs font-bold text-gray-400 cursor-pointer">COPY CODE</span>
            </div>

            <button class="w-full py-4 bg-primary text-white font-bold rounded-2xl shadow-lg">Share with Friends</button>
        </div>
    </div>
</body>
</html>
