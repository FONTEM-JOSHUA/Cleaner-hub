<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Financial Reports</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#42b0f0",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101b22",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1a2630",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "1.5rem", "xl": "2rem", "2xl": "2.5rem", "full": "9999px" },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white antialiased overflow-x-hidden">
    <div class="sticky top-0 z-50 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-md border-b border-gray-200/50 dark:border-gray-800/50 px-4 py-3">
        <div class="flex items-center justify-between">
            <button class="flex size-10 items-center justify-center rounded-full hover:bg-gray-200 dark:hover:bg-gray-800 transition">
                <span class="material-symbols-outlined text-slate-900 dark:text-white">arrow_back</span>
            </button>
            <h2 class="text-lg font-bold leading-tight">Financial Reports</h2>
            <button class="flex size-10 items-center justify-center rounded-full">
                <span class="material-symbols-outlined">filter_list</span>
            </button>
        </div>
    </div>

    <div class="px-4 py-6 max-w-lg mx-auto">
        <!-- Revenue Chart Placeholder -->
        <div class="bg-surface-light dark:bg-surface-dark rounded-3xl p-6 shadow-sm mb-6">
            <h3 class="text-sm font-bold text-gray-500 uppercase mb-4">Revenue Overview</h3>
            <div class="h-48 w-full bg-blue-50 dark:bg-blue-900/10 rounded-xl flex items-end justify-between p-4 gap-2">
                <div class="w-full bg-primary/20 h-[30%] rounded-t-lg"></div>
                <div class="w-full bg-primary/40 h-[50%] rounded-t-lg"></div>
                <div class="w-full bg-primary/60 h-[80%] rounded-t-lg"></div>
                <div class="w-full bg-primary/40 h-[60%] rounded-t-lg"></div>
                <div class="w-full bg-primary/80 h-[90%] rounded-t-lg"></div>
                <div class="w-full bg-primary h-full rounded-t-lg"></div>
                <div class="w-full bg-primary/50 h-[40%] rounded-t-lg"></div>
            </div>
            <div class="flex justify-between mt-2 text-[10px] text-gray-400 font-bold">
                <span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span><span>SUN</span>
            </div>
        </div>

        <!-- Detailed Stats -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-surface-light dark:bg-surface-dark p-4 rounded-2xl shadow-sm border-l-4 border-green-500">
                <p class="text-gray-500 text-xs font-medium mb-1">Total Revenue</p>
                <p class="text-xl font-bold">$24,500</p>
            </div>
            <div class="bg-surface-light dark:bg-surface-dark p-4 rounded-2xl shadow-sm border-l-4 border-blue-500">
                <p class="text-gray-500 text-xs font-medium mb-1">Platform Fee (15%)</p>
                <p class="text-xl font-bold">$3,675</p>
            </div>
        </div>

        <!-- Monthly Comparison -->
        <div class="bg-surface-light dark:bg-surface-dark rounded-3xl p-6 shadow-sm">
            <h3 class="text-lg font-bold mb-4">Monthly Growth</h3>
            <div class="space-y-4">
                <div class="flex items-center justify-between">
                    <span class="text-sm font-medium">October</span>
                    <div class="flex items-center gap-2">
                        <span class="text-sm font-bold">$12,400</span>
                        <span class="text-green-500 text-xs font-bold">↑ 14%</span>
                    </div>
                </div>
                <div class="w-full bg-gray-100 dark:bg-gray-800 h-2 rounded-full">
                    <div class="bg-green-500 h-full w-[85%] rounded-full"></div>
                </div>

                <div class="flex items-center justify-between">
                    <span class="text-sm font-medium">September</span>
                    <div class="flex items-center gap-2">
                        <span class="text-sm font-bold">$10,800</span>
                        <span class="text-green-500 text-xs font-bold">↑ 8%</span>
                    </div>
                </div>
                <div class="w-full bg-gray-100 dark:bg-gray-800 h-2 rounded-full">
                    <div class="bg-blue-500 h-full w-[70%] rounded-full"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
