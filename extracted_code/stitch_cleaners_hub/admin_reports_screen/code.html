<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Reports - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F5F5F5; }
        .primary-color { color: #87CEEB; }
        .primary-bg { background-color: #87CEEB; }
    </style>
</head>
<body class="bg-[#F5F5F5]">
    <div class="flex flex-col min-h-screen max-w-md mx-auto bg-white shadow-xl">
        <!-- Header -->
        <header class="flex items-center p-4 border-b sticky top-0 bg-white z-10">
            <button class="material-symbols-outlined p-2 hover:bg-gray-100 rounded-full">arrow_back</button>
            <h1 class="text-lg font-bold flex-1 text-center">Financial Reports</h1>
            <button class="material-symbols-outlined p-2 hover:bg-gray-100 rounded-full">filter_list</button>
        </header>

        <div class="p-4 space-y-6">
            <!-- Period Selector -->
            <div class="flex bg-gray-100 p-1 rounded-xl">
                <button class="flex-1 py-2 text-xs font-bold rounded-lg bg-white shadow-sm">This Month</button>
                <button class="flex-1 py-2 text-xs font-bold text-gray-500 rounded-lg">Last Month</button>
                <button class="flex-1 py-2 text-xs font-bold text-gray-500 rounded-lg">Custom</button>
            </div>

            <!-- Stats Overview -->
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100">
                    <p class="text-[10px] font-bold text-blue-400 uppercase tracking-widest">Revenue</p>
                    <p class="text-2xl font-black primary-color mt-1">$45,280</p>
                    <p class="text-[10px] text-green-500 font-bold mt-1">↑ 12% vs last month</p>
                </div>
                <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100">
                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Bookings</p>
                    <p class="text-2xl font-black text-gray-800 mt-1">1,240</p>
                    <p class="text-[10px] text-green-500 font-bold mt-1">↑ 5% vs last month</p>
                </div>
            </div>

            <!-- Revenue Chart (Simplified) -->
            <div class="space-y-4">
                <h3 class="text-sm font-bold text-gray-800">Revenue Growth</h3>
                <div class="h-40 w-full flex items-end gap-2 px-2">
                    <div class="flex-1 primary-bg opacity-30 h-[40%] rounded-t-md"></div>
                    <div class="flex-1 primary-bg opacity-50 h-[60%] rounded-t-md"></div>
                    <div class="flex-1 primary-bg opacity-70 h-[50%] rounded-t-md"></div>
                    <div class="flex-1 primary-bg opacity-40 h-[70%] rounded-t-md"></div>
                    <div class="flex-1 primary-bg opacity-80 h-[90%] rounded-t-md"></div>
                    <div class="flex-1 primary-bg h-full rounded-t-md"></div>
                </div>
                <div class="flex justify-between text-[10px] text-gray-400 font-bold px-1">
                    <span>JUN</span><span>JUL</span><span>AUG</span><span>SEP</span><span>OCT</span><span>NOV</span>
                </div>
            </div>

            <!-- Category Breakdown -->
            <div class="space-y-4">
                <h3 class="text-sm font-bold text-gray-800">Top Service Categories</h3>
                <div class="space-y-3">
                    <div class="space-y-1">
                        <div class="flex justify-between text-xs font-medium">
                            <span>Cleaning</span>
                            <span>$28,400 (62%)</span>
                        </div>
                        <div class="w-full h-2 bg-gray-100 rounded-full overflow-hidden">
                            <div class="h-full primary-bg w-[62%]"></div>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <div class="flex justify-between text-xs font-medium">
                            <span>Child Care</span>
                            <span>$9,050 (20%)</span>
                        </div>
                        <div class="w-full h-2 bg-gray-100 rounded-full overflow-hidden">
                            <div class="h-full bg-blue-300 w-[20%]"></div>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <div class="flex justify-between text-xs font-medium">
                            <span>Repair & Maintenance</span>
                            <span>$7,830 (18%)</span>
                        </div>
                        <div class="w-full h-2 bg-gray-100 rounded-full overflow-hidden">
                            <div class="h-full bg-blue-200 w-[18%]"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Detailed Transactions Link -->
            <button class="w-full py-4 bg-gray-50 text-gray-600 font-bold text-sm rounded-xl border border-gray-100 flex items-center justify-center gap-2">
                <span class="material-symbols-outlined text-lg">receipt_long</span>
                Download CSV Report
            </button>
        </div>

        <div class="h-20"></div>
    </div>
</body>
</html>
