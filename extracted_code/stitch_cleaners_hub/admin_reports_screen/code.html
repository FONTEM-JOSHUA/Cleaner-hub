<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Reports - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#42b0f0",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101b22",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "1.5rem",
                        "xl": "2rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#111518] dark:text-white antialiased">
    <div class="relative mx-auto flex h-screen max-w-md flex-col bg-background-light dark:bg-background-dark overflow-hidden shadow-2xl">
        <!-- Top App Bar -->
        <div class="flex items-center justify-between bg-white dark:bg-[#101b22] p-4 pb-2 border-b border-gray-100 dark:border-gray-800 sticky top-0 z-10">
            <button class="flex size-10 items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 cursor-pointer text-gray-900 dark:text-white">
                <span class="material-symbols-outlined text-2xl">arrow_back</span>
            </button>
            <h2 class="flex-1 text-center text-lg font-bold leading-tight tracking-tight text-gray-900 dark:text-white">Financial Reports</h2>
            <div class="size-10"></div>
        </div>

        <!-- Content -->
        <div class="flex-1 overflow-y-auto p-4 space-y-6">
            <!-- Revenue Summary -->
            <div class="bg-primary p-6 rounded-3xl text-white shadow-lg shadow-blue-200 dark:shadow-none">
                <p class="text-sm opacity-80 mb-1">Total Revenue (Monthly)</p>
                <h3 class="text-3xl font-bold mb-4">$42,500.00</h3>
                <div class="flex justify-between items-end">
                    <div class="flex items-center gap-1 text-xs bg-white/20 px-2 py-1 rounded-full">
                        <span class="material-symbols-outlined text-sm">trending_up</span>
                        <span>+12.5% vs last month</span>
                    </div>
                    <button class="text-xs underline">View Breakdown</button>
                </div>
            </div>

            <!-- Stats Grid -->
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white dark:bg-[#15232d] p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800">
                    <p class="text-gray-500 text-xs font-medium mb-1">Total Bookings</p>
                    <p class="text-xl font-bold">1,284</p>
                </div>
                <div class="bg-white dark:bg-[#15232d] p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800">
                    <p class="text-gray-500 text-xs font-medium mb-1">New Providers</p>
                    <p class="text-xl font-bold">42</p>
                </div>
            </div>

            <!-- Charts Simulation -->
            <div class="bg-white dark:bg-[#15232d] p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-bold text-sm">Revenue Over Time</h3>
                    <select class="bg-gray-50 dark:bg-gray-800 border-none text-[10px] rounded-lg py-1">
                        <option>Last 7 Days</option>
                        <option>Last 30 Days</option>
                    </select>
                </div>
                <div class="flex items-end justify-between h-32 gap-2 px-2">
                    <div class="bg-primary/20 flex-1 h-[40%] rounded-t-sm"></div>
                    <div class="bg-primary/40 flex-1 h-[60%] rounded-t-sm"></div>
                    <div class="bg-primary/20 flex-1 h-[35%] rounded-t-sm"></div>
                    <div class="bg-primary/60 flex-1 h-[80%] rounded-t-sm"></div>
                    <div class="bg-primary/40 flex-1 h-[55%] rounded-t-sm"></div>
                    <div class="bg-primary/80 flex-1 h-[95%] rounded-t-sm"></div>
                    <div class="bg-primary flex-1 h-[70%] rounded-t-sm"></div>
                </div>
                <div class="flex justify-between mt-2 px-1">
                    <span class="text-[8px] text-gray-400">Mon</span>
                    <span class="text-[8px] text-gray-400">Tue</span>
                    <span class="text-[8px] text-gray-400">Wed</span>
                    <span class="text-[8px] text-gray-400">Thu</span>
                    <span class="text-[8px] text-gray-400">Fri</span>
                    <span class="text-[8px] text-gray-400">Sat</span>
                    <span class="text-[8px] text-gray-400">Sun</span>
                </div>
            </div>

            <!-- Recent Transactions -->
            <div>
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-sm">Recent Transactions</h3>
                    <button class="text-primary text-xs font-bold">See all</button>
                </div>
                <div class="space-y-3">
                    <div class="flex items-center justify-between p-3 bg-white dark:bg-[#15232d] rounded-xl shadow-sm border border-gray-100 dark:border-gray-800">
                        <div class="flex items-center gap-3">
                            <div class="h-10 w-10 rounded-full bg-green-100 text-green-600 flex items-center justify-center">
                                <span class="material-symbols-outlined">add_circle</span>
                            </div>
                            <div>
                                <p class="text-xs font-bold">Booking #8921</p>
                                <p class="text-[10px] text-gray-500">24 Oct, 2023</p>
                            </div>
                        </div>
                        <p class="font-bold text-sm text-green-600">+$120.00</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
