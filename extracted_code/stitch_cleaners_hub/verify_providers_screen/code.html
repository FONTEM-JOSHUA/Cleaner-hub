<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Verify Providers</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#87CEEB",
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#f5f5f5] dark:bg-[#101b22] font-inter">
    <div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white dark:bg-[#101b22] shadow-sm">
        <!-- Header -->
        <div class="flex items-center bg-white dark:bg-[#101b22] p-4 pb-2 justify-between sticky top-0 z-10 border-b border-gray-100 dark:border-gray-800">
            <div class="text-[#111518] dark:text-white flex size-12 shrink-0 items-center justify-start cursor-pointer transition-opacity hover:opacity-70">
                <span class="material-symbols-outlined" style="font-size: 24px;">arrow_back_ios</span>
            </div>
            <h2 class="text-[#111518] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Verify Providers</h2>
        </div>

        <!-- Content -->
        <div class="flex-1 overflow-y-auto p-4 space-y-4">
            <div class="bg-white dark:bg-[#1a2633] p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-800">
                <div class="flex items-center gap-4 mb-4">
                    <div class="h-12 w-12 rounded-full bg-blue-100 flex items-center justify-center text-blue-500 font-bold">JD</div>
                    <div class="flex-1">
                        <h3 class="font-bold text-[#111518] dark:text-white">John Doe</h3>
                        <p class="text-xs text-gray-500">Cleaner • Applied 2 hours ago</p>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2 mb-4">
                    <div class="bg-gray-50 dark:bg-gray-800 p-2 rounded text-center">
                        <p class="text-[10px] text-gray-400 uppercase">Experience</p>
                        <p class="text-sm font-bold">5 Years</p>
                    </div>
                    <div class="bg-gray-50 dark:bg-gray-800 p-2 rounded text-center">
                        <p class="text-[10px] text-gray-400 uppercase">Documents</p>
                        <p class="text-sm font-bold text-green-500">Uploaded</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button class="flex-1 py-2 bg-primary text-white font-bold rounded-lg hover:bg-sky-400 transition-colors">Approve</button>
                    <button class="flex-1 py-2 border border-red-500 text-red-500 font-bold rounded-lg hover:bg-red-50 transition-colors">Reject</button>
                </div>
            </div>

            <div class="bg-white dark:bg-[#1a2633] p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-800">
                <div class="flex items-center gap-4 mb-4">
                    <div class="h-12 w-12 rounded-full bg-purple-100 flex items-center justify-center text-purple-500 font-bold">AS</div>
                    <div class="flex-1">
                        <h3 class="font-bold text-[#111518] dark:text-white">Alice Smith</h3>
                        <p class="text-xs text-gray-500">Cook • Applied 1 day ago</p>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2 mb-4">
                    <div class="bg-gray-50 dark:bg-gray-800 p-2 rounded text-center">
                        <p class="text-[10px] text-gray-400 uppercase">Experience</p>
                        <p class="text-sm font-bold">3 Years</p>
                    </div>
                    <div class="bg-gray-50 dark:bg-gray-800 p-2 rounded text-center">
                        <p class="text-[10px] text-gray-400 uppercase">Documents</p>
                        <p class="text-sm font-bold text-orange-500">Pending</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button class="flex-1 py-2 bg-primary text-white font-bold rounded-lg opacity-50 cursor-not-allowed">Approve</button>
                    <button class="flex-1 py-2 border border-red-500 text-red-500 font-bold rounded-lg hover:bg-red-50 transition-colors">Reject</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
