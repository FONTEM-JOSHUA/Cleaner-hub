<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>My Earnings</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#87CEEB",
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#f5f5f5] dark:bg-[#101b22] font-inter">
    <div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white dark:bg-[#101b22] shadow-sm">
        <!-- Header -->
        <div class="flex items-center bg-white dark:bg-[#101b22] p-4 pb-2 justify-between sticky top-0 z-10 border-b border-gray-100 dark:border-gray-800">
            <div class="text-[#111518] dark:text-white flex size-12 shrink-0 items-center justify-start cursor-pointer transition-opacity hover:opacity-70">
                <span class="material-symbols-outlined" style="font-size: 24px;">arrow_back_ios</span>
            </div>
            <h2 class="text-[#111518] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">My Earnings</h2>
        </div>

        <!-- Content -->
        <div class="flex-1 overflow-y-auto p-4 space-y-6">
            <!-- Balance Card -->
            <div class="bg-primary p-6 rounded-2xl shadow-lg text-white relative overflow-hidden">
                <div class="absolute right-0 top-0 p-8 opacity-20">
                    <span class="material-symbols-outlined text-6xl">account_balance_wallet</span>
                </div>
                <p class="text-sm opacity-80 mb-1">Available for Payout</p>
                <p class="text-4xl font-bold mb-6">$1,240.50</p>
                <button class="w-full py-3 bg-white text-primary font-bold rounded-xl shadow-sm hover:bg-gray-50 transition-colors">Withdraw Funds</button>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white dark:bg-[#1a2633] p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-800">
                    <p class="text-xs text-gray-500 mb-1 uppercase tracking-wider">This Week</p>
                    <p class="text-xl font-bold text-[#111518] dark:text-white">$450.00</p>
                </div>
                <div class="bg-white dark:bg-[#1a2633] p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-800">
                    <p class="text-xs text-gray-500 mb-1 uppercase tracking-wider">Total Earned</p>
                    <p class="text-xl font-bold text-[#111518] dark:text-white">$12,840</p>
                </div>
            </div>

            <!-- Transaction History -->
            <div class="space-y-4">
                <h3 class="font-bold">Payout History</h3>
                <div class="space-y-2">
                    <div class="bg-white dark:bg-[#1a2633] p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-800 flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <div class="p-2 bg-green-100 rounded-full text-green-500">
                                <span class="material-symbols-outlined" style="font-size: 20px;">call_made</span>
                            </div>
                            <div>
                                <p class="text-sm font-bold">Bank Transfer</p>
                                <p class="text-[10px] text-gray-400">Oct 20, 2023 • Completed</p>
                            </div>
                        </div>
                        <p class="font-bold">-$850.00</p>
                    </div>
                    <div class="bg-white dark:bg-[#1a2633] p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-800 flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <div class="p-2 bg-blue-100 rounded-full text-blue-500">
                                <span class="material-symbols-outlined" style="font-size: 20px;">payments</span>
                            </div>
                            <div>
                                <p class="text-sm font-bold">Booking Income</p>
                                <p class="text-[10px] text-gray-400">Oct 19, 2023 • #4829</p>
                            </div>
                        </div>
                        <p class="font-bold text-green-500">+$65.00</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
