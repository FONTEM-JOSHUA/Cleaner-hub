<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner Hub - Home Service Professional Platform</title>
    <!-- Load React, ReactDOM, and Babel from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Material Icons and Symbols -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Montserrat', sans-serif;
            background-color: #f5f5f5;
        }
        #root {
            min-height: 100vh;
        }
        .app-shell {
            max-width: 450px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .screen-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
        }
        /* Custom scrollbar for a better look */
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 2px;
        }
        .screen-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .screen-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        /* Water Ripple Effect */
        .ripple {
            position: absolute;
            background: rgba(135, 206, 235, 0.4);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
            overflow: hidden;
        }
        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Sparkle Animation */
        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            animation: sparkle-float 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes sparkle-float {
            0% { transform: translate(0, 0) scale(0); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.5); opacity: 0; }
        }

        /* Floating Action Menu for Demo */
        .dev-menu-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #87CEEB;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .dev-menu-btn:hover {
            opacity: 1;
        }
        .dev-menu {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 10px;
            z-index: 1001;
            width: 200px;
            border: 1px solid #eee;
        }
        .dev-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            transition: background 0.2s;
        }
        .dev-menu button:hover {
            background: #f0f9ff;
            color: #87CEEB;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SCREEN_MAP = {
            'WELCOME': 'welcome_screen/code.html',
            'ADMIN_DASHBOARD': 'admin_dashboard_screen_1/code.html',
            'PROVIDER_DASHBOARD': 'provider_dashboard_screen_1/code.html',
            'PROVIDER_BOOKING_REQUESTS': 'booking_requests_screen_for_provider_app/code.html',
            'MY_BOOKINGS_COMPLETED': 'my_bookings_screen_for_client_app_2/code.html',
            'PROVIDER_SETUP': 'provider_setup_screen/code.html',
            'ADMIN_DASHBOARD_2': 'admin_dashboard_screen_2/code.html',
            'EASY_PAYMENTS': 'easy_payments_feature_screen/code.html',
            'ADMIN_LOGIN': 'admin_login_screen/code.html',
            'ADMIN_SETTINGS': 'app_settings_screen_for_admin_app/code.html',
            'ADMIN_MANAGE_BOOKINGS': 'manage_bookings_screen_for_admin_app/code.html',
            'REAL_TIME_TRACKING': 'real-time_tracking_screen/code.html',
            'MY_BOOKINGS_CANCELLED': 'my_bookings_screen_for_client_app_3/code.html',
            'ADMIN_PROFILE_EDIT': 'admin_profile_edit_screen/code.html',
            'PROVIDER_WELCOME': 'provider_welcome_screen/code.html',
            'PROVIDER_SCHEDULE': 'my_schedule_screen_for_provider_app/code.html',
            'PROVIDER_PUBLIC_PROFILE': 'provider_profile_(public_view)_screen/code.html',
            'PROVIDER_REPORT_CLIENT': 'report_client_screen_for_provider_app/code.html',
            'CLIENT_HOME': 'home_screen_(main_dashboard)_for_client_app/code.html',
            'OFFLINE_MODE': 'offline_mode_feature_screen/code.html',
            'FIND_SERVICES': 'find_services_screen_for_client_app/code.html',
            'CLIENT_REPORT_CONFIRMATION': 'client_report_confirmation_screen_(provider_app)_/code.html',
            'EMERGENCY_MODE': 'emergency_mode_feature_screen/code.html',
            'CHANNELS': 'channels_screen_(client_app_flow)_/code.html',
            'MESSAGES': 'messages_screen_for_client_app/code.html',
            'SMART_SEARCH': 'smart_search_screen/code.html',
            'CHANNEL_MEMBER_MANAGEMENT': 'channel_member_management_screen_(provider/admin_app)_/code.html',
            'SMART_NOTIFICATIONS': 'smart_notifications_feature_screen/code.html',
            'PROVIDER_PROFILE': 'service_provider_profile_screen_for_client_app/code.html',
            'FAMILY_SHARING': 'family_sharing_feature_screen/code.html',
            'PROFILE': 'profile_screen_for_client_app/code.html',
            'MULTI_LANGUAGE': 'multi-language_support_screen/code.html',
            'QUICK_REBOOKING': 'quick_rebooking_feature_screen/code.html',
            'PHOTO_VERIFICATION': 'photo_verification_feature_screen/code.html',
            'CHANNEL_MANAGEMENT': 'channel_management_screen_(provider/admin_app)_/code.html',
            'PROVIDER_DASHBOARD_2': 'provider_dashboard_screen_2/code.html',
            'CREATE_CHANNEL': 'create_new_channel_flow_(provider/admin_app)_/code.html',
            'ADMIN_DASHBOARD_3': 'admin_dashboard_screen_3/code.html',
            'SIGNUP': 'login/signup_screen/code.html',
            'LOGIN': 'login/signup_screen/code.html',
            'BOOKING': 'booking_screen_for_client_app/code.html',
            'ADMIN_DASHBOARD_4': 'admin_dashboard_screen_4/code.html',
            'MY_BOOKINGS': 'my_bookings_screen_for_client_app_1/code.html',
            'REPORT_CONFIRMATION': 'report_confirmation_screen/code.html',
            'ADMIN_MANAGE_USERS': 'manage_users_screen_for_admin_app/code.html',
            'REPORT_PROVIDER': 'report_provider_screen_for_client_app/code.html',
            'PROVIDER_CLIENTS': 'my_clients_screen_for_provider_app_(with_report_feature)/code.html'
        };

        const Screen = ({ screenKey, onNavigate }) => {
            const [html, setHtml] = useState('');
            const [styles, setStyles] = useState('');
            const [loading, setLoading] = useState(true);
            const containerRef = useRef(null);

            useEffect(() => {
                const fetchContent = async () => {
                    setLoading(true);
                    try {
                        const path = `extracted_code/stitch_cleaners_hub/${SCREEN_MAP[screenKey]}`;
                        const response = await fetch(path);
                        const text = await response.text();

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');

                        const styleContent = Array.from(doc.querySelectorAll('style'))
                            .map(s => s.innerHTML)
                            .join('\n');
                        setStyles(styleContent);

                        const bodyContent = doc.body.innerHTML;
                        setHtml(bodyContent);
                    } catch (error) {
                        console.error('Failed to load screen:', error);
                        setHtml('<div class="p-10 text-center">Failed to load screen.</div>');
                    }
                    setLoading(false);
                };
                fetchContent();
            }, [screenKey]);

            // Auth Mode Patching
            useEffect(() => {
                if (!loading && containerRef.current && (screenKey === 'LOGIN' || screenKey === 'SIGNUP')) {
                    const container = containerRef.current;
                    const inputs = container.querySelectorAll('input:not([type="radio"]):not([type="checkbox"])');
                    const labels = container.querySelectorAll('label');
                    const authModeRadios = container.querySelectorAll('input[name="auth-mode"]');
                    const actionButton = container.querySelector('.mt-8 button');
                    const footerLink = container.querySelector('.mt-auto.pt-6');
                    const headlineSubtext = container.querySelector('.text-text-subtle');

                    if (screenKey === 'LOGIN') {
                        // Patch for Login Mode
                        if (inputs.length > 2) {
                            inputs[0].closest('.relative').style.display = 'none'; // Hide Name
                            inputs[2].closest('.relative').style.display = 'none'; // Hide Phone
                        }
                        const checkboxLabel = container.querySelector('label.flex.items-start');
                        if (checkboxLabel) checkboxLabel.style.display = 'none'; // Hide Terms

                        if (actionButton) {
                            const btnText = actionButton.querySelector('span');
                            if (btnText) btnText.innerText = 'Log In';
                        }
                        if (footerLink) footerLink.style.display = 'none';
                        if (headlineSubtext) headlineSubtext.innerText = 'Welcome back! Log in to your account.';

                        // Update Segmented Control UI
                        authModeRadios.forEach(radio => {
                            const label = radio.closest('label');
                            if (radio.value === 'login') {
                                label.className = 'group flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-4 relative shadow-sm transition-all duration-200 bg-primary';
                                label.querySelector('span').className = 'z-10 text-sm font-semibold text-white';
                            } else {
                                label.className = 'group flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-4 relative transition-all duration-200';
                                label.querySelector('span').className = 'z-10 text-sm font-medium text-text-subtle group-hover:text-text-main dark:text-gray-400 dark:group-hover:text-white transition-colors';
                            }
                        });
                    }
                }
            }, [html, loading, screenKey]);

            const triggerSparkles = (x, y) => {
                const colors = ['#87CEEB', '#ffffff', '#FFD700', '#6FB3D9'];
                for (let i = 0; i < 12; i++) {
                    const sparkle = document.createElement('div');
                    sparkle.className = 'sparkle';
                    sparkle.style.left = x + 'px';
                    sparkle.style.top = y + 'px';
                    sparkle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

                    const tx = (Math.random() - 0.5) * 100;
                    const ty = (Math.random() - 0.5) * 100;
                    sparkle.style.setProperty('--tx', `${tx}px`);
                    sparkle.style.setProperty('--ty', `${ty}px`);

                    document.body.appendChild(sparkle);
                    setTimeout(() => sparkle.remove(), 1000);
                }
            };

            const createRipple = (e) => {
                const button = e.currentTarget;
                const circle = document.createElement('span');
                const diameter = Math.max(button.clientWidth, button.clientHeight);
                const radius = diameter / 2;

                const rect = button.getBoundingClientRect();
                circle.style.width = circle.style.height = `${diameter}px`;
                circle.style.left = `${e.clientX - rect.left - radius}px`;
                circle.style.top = `${e.clientY - rect.top - radius}px`;
                circle.className = 'ripple';

                if (getComputedStyle(button).position === 'static') {
                    button.style.position = 'relative';
                }
                button.style.overflow = 'hidden';

                const ripple = button.getElementsByClassName('ripple')[0];
                if (ripple) ripple.remove();

                button.appendChild(circle);
                setTimeout(() => circle.remove(), 600);
            };

            useEffect(() => {
                if (!loading && containerRef.current) {
                    const container = containerRef.current;
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });

                    const handleInteractions = (e) => {
                        const target = e.target.closest('button, a, [role="button"]');
                        if (!target) return;

                        createRipple(e);

                        const text = target.innerText.replace(/\s+/g, ' ').trim().toLowerCase();

                        if (text.includes('confirm') || text.includes('accept') || text.includes('save') || text.includes('finish') || text.includes('complete')) {
                            triggerSparkles(e.clientX, e.clientY);
                        }

                        // Navigation Heuristics
                        if (text.includes('sign up') || text.includes('create account')) {
                            if (text.includes('provider')) onNavigate('PROVIDER_WELCOME');
                            else if (screenKey === 'SIGNUP') onNavigate('CLIENT_HOME');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('log in') || text.includes('login') || text.includes('sign in')) {
                            if (text.includes('admin')) onNavigate('ADMIN_LOGIN');
                            else if (screenKey === 'ADMIN_LOGIN') onNavigate('ADMIN_DASHBOARD');
                            else if (screenKey === 'WELCOME') onNavigate('LOGIN');
                            else if (screenKey === 'SIGNUP') onNavigate('LOGIN');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('continue as guest')) {
                            onNavigate('CLIENT_HOME');
                        } else if (text.includes('book now')) {
                            onNavigate('BOOKING');
                        } else if (text.includes('find services') || text.includes('explore')) {
                            onNavigate('FIND_SERVICES');
                        } else if (text.includes('view profile')) {
                            onNavigate('PROVIDER_PROFILE');
                        } else if (text.includes('get started')) {
                            if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('complete setup') || text.includes('save & continue')) {
                            onNavigate('PROVIDER_DASHBOARD');
                        } else if (text === 'home' || target.querySelector('.material-symbols-outlined')?.innerText === 'home') {
                            onNavigate('CLIENT_HOME');
                        } else if (text.includes('bookings') || target.querySelector('.material-symbols-outlined')?.innerText === 'calendar_today') {
                            onNavigate('MY_BOOKINGS');
                        } else if (text.includes('messages') || target.querySelector('.material-symbols-outlined')?.innerText === 'mail') {
                            onNavigate('MESSAGES');
                        } else if (text === 'profile' || target.querySelector('.material-symbols-outlined')?.innerText === 'person') {
                            onNavigate('PROFILE');
                        } else if (text.includes('emergency')) {
                            onNavigate('EMERGENCY_MODE');
                        }
                    };

                    container.addEventListener('click', handleInteractions);
                    return () => container.removeEventListener('click', handleInteractions);
                }
            }, [html, loading, screenKey]);

            return (
                <div className="h-full flex flex-col screen-fade-in">
                    <style dangerouslySetInnerHTML={{ __html: styles }} />
                    {loading ? (
                        <div className="flex-1 flex items-center justify-center">
                            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-[#87CEEB]"></div>
                        </div>
                    ) : (
                        <div
                            ref={containerRef}
                            className="flex-1"
                            dangerouslySetInnerHTML={{ __html: html }}
                        />
                    )}
                </div>
            );
        };

        const App = () => {
            const [history, setHistory] = useState(['WELCOME']);
            const [devMenuOpen, setDevMenuOpen] = useState(false);

            const currentScreen = history[history.length - 1];

            const navigate = (screenKey) => {
                if (SCREEN_MAP[screenKey]) {
                    setHistory(prev => [...prev, screenKey]);
                }
            };

            const goBack = () => {
                if (history.length > 1) {
                    setHistory(prev => prev.slice(0, -1));
                }
            };

            useEffect(() => {
                const handleExternalNavigate = (e) => navigate(e.detail);
                const handleGoBack = () => goBack();
                window.addEventListener('navigate', handleExternalNavigate);
                window.addEventListener('goBack', handleGoBack);
                return () => {
                    window.removeEventListener('navigate', handleExternalNavigate);
                    window.removeEventListener('goBack', handleGoBack);
                };
            }, [history]);

            return (
                <div className="app-shell">
                    <div className="screen-container">
                        <Screen screenKey={currentScreen} onNavigate={navigate} />
                    </div>

                    {/* Quick Access Dev Menu */}
                    <div className="dev-menu-btn" onClick={() => setDevMenuOpen(!devMenuOpen)}>
                        <span className="material-symbols-outlined">menu</span>
                    </div>

                    {devMenuOpen && (
                        <div className="dev-menu">
                            <div className="text-[10px] font-bold text-gray-400 mb-2 px-3 uppercase tracking-wider">Switch Flow</div>
                            <button onClick={() => { navigate('WELCOME'); setDevMenuOpen(false); }}>Welcome Screen</button>
                            <button onClick={() => { navigate('CLIENT_HOME'); setDevMenuOpen(false); }}>Client App</button>
                            <button onClick={() => { navigate('PROVIDER_WELCOME'); setDevMenuOpen(false); }}>Provider App</button>
                            <button onClick={() => { navigate('ADMIN_LOGIN'); setDevMenuOpen(false); }}>Admin Panel</button>
                            <button onClick={() => { goBack(); setDevMenuOpen(false); }} className="text-red-500 font-bold">Go Back</button>
                            <div className="mt-2 pt-2 border-t border-gray-100 text-[9px] text-center text-gray-400">
                                Prototype Navigation Control
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
