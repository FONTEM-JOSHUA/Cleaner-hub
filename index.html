<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner Hub - Home Service Professional Platform</title>
    <!-- Load React, ReactDOM, and Babel from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Material Icons and Symbols -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Montserrat', sans-serif;
            background-color: #f5f5f5;
        }
        #root {
            min-height: 100vh;
        }
        .app-shell {
            max-width: 450px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .screen-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
        }
        /* Custom scrollbar */
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 2px;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .screen-fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        /* Water Ripple Effect */
        .ripple {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
        }
        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Sparkle Animation */
        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #FFD700;
            pointer-events: none;
            z-index: 1000;
            animation: sparkle-move 0.8s ease-out forwards;
        }
        @keyframes sparkle-move {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        /* Floating Action Menu for Demo */
        .dev-menu-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #87CEEB;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .dev-menu-btn:hover {
            opacity: 1;
        }
        .dev-menu {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 10px;
            z-index: 1001;
            width: 220px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #eee;
        }
        .dev-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            transition: background 0.2s;
        }
        .dev-menu button:hover {
            background: #f0f9ff;
            color: #87CEEB;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SCREEN_MAP = {
            'WELCOME': 'welcome_screen/code.html',
            'ADMIN_DASHBOARD': 'admin_dashboard_screen_1/code.html',
            'ADMIN_DASHBOARD_2': 'admin_dashboard_screen_2/code.html',
            'ADMIN_DASHBOARD_3': 'admin_dashboard_screen_3/code.html',
            'ADMIN_DASHBOARD_4': 'admin_dashboard_screen_4/code.html',
            'PROVIDER_DASHBOARD': 'provider_dashboard_screen_1/code.html',
            'PROVIDER_DASHBOARD_2': 'provider_dashboard_screen_2/code.html',
            'PROVIDER_BOOKING_REQUESTS': 'booking_requests_screen_for_provider_app/code.html',
            'MY_BOOKINGS_2': 'my_bookings_screen_for_client_app_2/code.html',
            'PROVIDER_SETUP': 'provider_setup_screen/code.html',
            'EASY_PAYMENTS': 'easy_payments_feature_screen/code.html',
            'ADMIN_LOGIN': 'admin_login_screen/code.html',
            'ADMIN_APP_SETTINGS': 'app_settings_screen_for_admin_app/code.html',
            'ADMIN_MANAGE_BOOKINGS': 'manage_bookings_screen_for_admin_app/code.html',
            'REAL_TIME_TRACKING': 'real-time_tracking_screen/code.html',
            'MY_BOOKINGS_3': 'my_bookings_screen_for_client_app_3/code.html',
            'ADMIN_PROFILE_EDIT': 'admin_profile_edit_screen/code.html',
            'PROVIDER_WELCOME': 'provider_welcome_screen/code.html',
            'PROVIDER_SCHEDULE': 'my_schedule_screen_for_provider_app/code.html',
            'PROVIDER_PROFILE_PUBLIC': 'provider_profile_(public_view)_screen/code.html',
            'PROVIDER_REPORT_CLIENT': 'report_client_screen_for_provider_app/code.html',
            'CLIENT_HOME': 'home_screen_(main_dashboard)_for_client_app/code.html',
            'OFFLINE_MODE': 'offline_mode_feature_screen/code.html',
            'FIND_SERVICES': 'find_services_screen_for_client_app/code.html',
            'PROVIDER_CLIENT_REPORT_CONFIRMATION': 'client_report_confirmation_screen_(provider_app)_/code.html',
            'EMERGENCY_MODE': 'emergency_mode_feature_screen/code.html',
            'CLIENT_CHANNELS': 'channels_screen_(client_app_flow)_/code.html',
            'MESSAGES': 'messages_screen_for_client_app/code.html',
            'SMART_SEARCH': 'smart_search_screen/code.html',
            'CHANNEL_MEMBER_MANAGEMENT': 'channel_member_management_screen_(provider/admin_app)_/code.html',
            'SMART_NOTIFICATIONS': 'smart_notifications_feature_screen/code.html',
            'PROVIDER_PROFILE': 'service_provider_profile_screen_for_client_app/code.html',
            'FAMILY_SHARING': 'family_sharing_feature_screen/code.html',
            'PROFILE': 'profile_screen_for_client_app/code.html',
            'MULTI_LANGUAGE': 'multi-language_support_screen/code.html',
            'QUICK_REBOOKING': 'quick_rebooking_feature_screen/code.html',
            'PHOTO_VERIFICATION': 'photo_verification_feature_screen/code.html',
            'CHANNEL_MANAGEMENT': 'channel_management_screen_(provider/admin_app)_/code.html',
            'CREATE_NEW_CHANNEL': 'create_new_channel_flow_(provider/admin_app)_/code.html',
            'SIGNUP': 'login/signup_screen/code.html',
            'LOGIN': 'login/signup_screen/code.html',
            'BOOKING': 'booking_screen_for_client_app/code.html',
            'MY_BOOKINGS': 'my_bookings_screen_for_client_app_1/code.html',
            'REPORT_CONFIRMATION': 'report_confirmation_screen/code.html',
            'ADMIN_MANAGE_USERS': 'manage_users_screen_for_admin_app/code.html',
            'CLIENT_REPORT_PROVIDER': 'report_provider_screen_for_client_app/code.html',
            'PROVIDER_MY_CLIENTS': 'my_clients_screen_for_provider_app_(with_report_feature)/code.html'
        };

        const Screen = ({ screenKey, onNavigate, onGoBack }) => {
            const [html, setHtml] = useState('');
            const [styles, setStyles] = useState('');
            const [loading, setLoading] = useState(true);
            const containerRef = useRef(null);

            useEffect(() => {
                const fetchContent = async () => {
                    setLoading(true);
                    try {
                        const path = `extracted_code/stitch_cleaners_hub/${SCREEN_MAP[screenKey]}`;
                        const response = await fetch(path);
                        const text = await response.text();

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');

                        // Extract Styles and tag them for cleanup
                        const styleContent = Array.from(doc.querySelectorAll('style'))
                            .map(s => s.innerHTML)
                            .join('\n');
                        setStyles(styleContent);

                        // Extract Body Content
                        const bodyContent = doc.body.innerHTML;
                        setHtml(bodyContent);

                    } catch (error) {
                        console.error('Failed to load screen:', error);
                        setHtml('<div class="p-10 text-center">Failed to load screen.</div>');
                    }
                    setLoading(false);
                };
                fetchContent();
            }, [screenKey]);

            useEffect(() => {
                if (!loading && containerRef.current) {
                    const container = containerRef.current;

                    // Auth Mode Patching
                    if (screenKey === 'LOGIN') {
                        const title = container.querySelector('h1');
                        if (title) title.innerText = 'Welcome Back';

                        const subtext = container.querySelector('p');
                        if (subtext) subtext.innerText = 'Log in to your account';

                        const actionBtn = container.querySelector('.mt-8 button');
                        if (actionBtn) {
                            const btnSpan = actionBtn.querySelector('span');
                            if (btnSpan) btnSpan.innerText = 'Log In';
                            else actionBtn.innerText = 'Log In';
                        }

                        // Remove extra signup fields if they exist
                        const inputs = container.querySelectorAll('input');
                        if (inputs.length > 2) {
                            // Assuming Name and Phone are the ones to remove for Login
                            // This is a heuristic
                            inputs.forEach(input => {
                                const placeholder = input.placeholder.toLowerCase();
                                if (placeholder.includes('name') || placeholder.includes('phone')) {
                                    input.closest('.space-y-4 > div')?.remove();
                                }
                            });
                        }

                        const footerToggle = container.querySelector('.mt-auto.pt-6');
                        if (footerToggle) footerToggle.remove();
                    }

                    // Execute scripts
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        newScript.setAttribute('data-screen-assets', 'true');
                        document.head.appendChild(newScript);
                    });

                    // Water Ripple and Sparkle Logic
                    const handleInteractions = (e) => {
                        const target = e.target.closest('button, a, [role="button"], .grid > div');
                        if (!target) return;

                        // Water Ripple
                        const ripple = document.createElement('span');
                        ripple.classList.add('ripple');
                        const rect = target.getBoundingClientRect();
                        const size = Math.max(rect.width, rect.height);
                        ripple.style.width = ripple.style.height = `${size}px`;
                        ripple.style.left = `${e.clientX - rect.left - size / 2}px`;
                        ripple.style.top = `${e.clientY - rect.top - size / 2}px`;
                        target.style.position = 'relative';
                        target.style.overflow = 'hidden';
                        target.appendChild(ripple);
                        setTimeout(() => ripple.remove(), 600);

                        // Sparkle for "Success" buttons
                        const text = target.innerText.trim().toLowerCase();
                        if (text.includes('confirm') || text.includes('book now') || text.includes('save') || text.includes('create account') || text.includes('log in') || text.includes('accept')) {
                            for (let i = 0; i < 8; i++) {
                                const sparkle = document.createElement('div');
                                sparkle.classList.add('sparkle');
                                sparkle.style.left = `${e.clientX}px`;
                                sparkle.style.top = `${e.clientY}px`;
                                sparkle.style.setProperty('--tx', `${(Math.random() - 0.5) * 100}px`);
                                sparkle.style.setProperty('--ty', `${(Math.random() - 0.5) * 100}px`);
                                document.body.appendChild(sparkle);
                                setTimeout(() => sparkle.remove(), 800);
                            }
                        }

                        // Navigation Heuristics
                        const normalizedText = text.replace(/\s+/g, ' ');

                        // Back Navigation
                        if (normalizedText.includes('arrow_back') || normalizedText === 'back' || target.querySelector('.material-icons-round')?.innerText === 'arrow_back') {
                            onGoBack();
                            return;
                        }

                        // Global Nav
                        if (normalizedText.includes('sign up') || normalizedText.includes('create account')) {
                            if (normalizedText.includes('provider')) onNavigate('PROVIDER_WELCOME');
                            else onNavigate('SIGNUP');
                        } else if (normalizedText.includes('log in') || normalizedText.includes('login') || normalizedText.includes('sign in')) {
                            if (normalizedText.includes('admin')) onNavigate('ADMIN_LOGIN');
                            else if (screenKey === 'ADMIN_LOGIN') onNavigate('ADMIN_DASHBOARD');
                            else if (screenKey === 'WELCOME') onNavigate('LOGIN');
                            else {
                                // If on Auth screen, redirect to appropriate home
                                if (normalizedText.includes('provider')) onNavigate('PROVIDER_DASHBOARD');
                                else onNavigate('CLIENT_HOME');
                            }
                        } else if (normalizedText.includes('continue as guest')) {
                            onNavigate('CLIENT_HOME');
                        } else if (normalizedText.includes('book now')) {
                            onNavigate('BOOKING');
                        } else if (normalizedText.includes('find services') || normalizedText.includes('explore')) {
                            onNavigate('FIND_SERVICES');
                        } else if (normalizedText.includes('view profile')) {
                            onNavigate('PROVIDER_PROFILE');
                        } else if (normalizedText.includes('get started')) {
                            if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP');
                            else onNavigate('SIGNUP');
                        } else if (normalizedText.includes('complete setup') || (screenKey === 'PROVIDER_SETUP' && normalizedText.includes('continue'))) {
                            onNavigate('PROVIDER_DASHBOARD');
                        } else if (normalizedText.includes('home') || target.querySelector('.material-symbols-outlined')?.innerText === 'home') {
                            onNavigate('CLIENT_HOME');
                        } else if (normalizedText.includes('manage bookings') || normalizedText.includes('bookings') || target.querySelector('.material-symbols-outlined')?.innerText === 'calendar_today' || target.querySelector('.material-icons-round')?.innerText === 'event_note') {
                            if (screenKey.startsWith('ADMIN')) onNavigate('ADMIN_MANAGE_BOOKINGS');
                            else onNavigate('MY_BOOKINGS');
                        } else if (normalizedText.includes('messages') || target.querySelector('.material-symbols-outlined')?.innerText === 'mail' || target.querySelector('.material-icons-round')?.innerText === 'chat_bubble_outline') {
                            onNavigate('MESSAGES');
                        } else if (normalizedText.includes('profile') || target.querySelector('.material-symbols-outlined')?.innerText === 'person' || target.querySelector('.material-icons-round')?.innerText === 'person_outline') {
                            if (screenKey.startsWith('ADMIN')) onNavigate('ADMIN_PROFILE_EDIT');
                            else onNavigate('PROFILE');
                        } else if (normalizedText.includes('emergency')) {
                            onNavigate('EMERGENCY_MODE');
                        } else if (normalizedText.includes('manage users')) {
                            onNavigate('ADMIN_MANAGE_USERS');
                        } else if (normalizedText.includes('verify providers')) {
                            onNavigate('ADMIN_MANAGE_USERS'); // Sharing the user management for prototype
                        } else if (normalizedText.includes('settings')) {
                            onNavigate('ADMIN_APP_SETTINGS');
                        } else if (normalizedText.includes('my schedule')) {
                            onNavigate('PROVIDER_SCHEDULE');
                        } else if (normalizedText.includes('new requests')) {
                            onNavigate('PROVIDER_BOOKING_REQUESTS');
                        } else if (normalizedText.includes('my clients')) {
                            onNavigate('PROVIDER_MY_CLIENTS');
                        } else if (normalizedText.includes('confirm booking')) {
                            onNavigate('REPORT_CONFIRMATION');
                        }
                    };

                    container.addEventListener('click', handleInteractions);

                    // Ensure all interactable elements have cursor-pointer
                    container.querySelectorAll('button, .grid > div, a').forEach(el => el.classList.add('cursor-pointer'));

                    return () => {
                        container.removeEventListener('click', handleInteractions);
                        document.querySelectorAll('[data-screen-assets]').forEach(el => el.remove());
                    };
                }
            }, [html, loading, screenKey]);

            return (
                <div className="h-full flex flex-col screen-fade-in">
                    <style data-screen-assets="true" dangerouslySetInnerHTML={{ __html: styles }} />
                    {loading ? (
                        <div className="flex-1 flex items-center justify-center bg-white">
                            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-[#87CEEB]"></div>
                        </div>
                    ) : (
                        <div
                            ref={containerRef}
                            className="flex-1"
                            dangerouslySetInnerHTML={{ __html: html }}
                        />
                    )}
                </div>
            );
        };

        const App = () => {
            const [history, setHistory] = useState(['WELCOME']);
            const [devMenuOpen, setDevMenuOpen] = useState(false);

            const currentScreen = history[history.length - 1];

            const navigate = (newScreen) => {
                if (newScreen === currentScreen) return;
                setHistory(prev => [...prev, newScreen]);
            };

            const goBack = () => {
                if (history.length > 1) {
                    setHistory(prev => prev.slice(0, -1));
                }
            };

            useEffect(() => {
                const handleExternalNavigate = (e) => {
                    if (SCREEN_MAP[e.detail]) navigate(e.detail);
                };
                const handleExternalGoBack = () => goBack();

                window.addEventListener('navigate', handleExternalNavigate);
                window.addEventListener('goBack', handleExternalGoBack);
                return () => {
                    window.removeEventListener('navigate', handleExternalNavigate);
                    window.removeEventListener('goBack', handleExternalGoBack);
                };
            }, [currentScreen]);

            return (
                <div className="app-shell">
                    <div className="screen-container">
                        <Screen screenKey={currentScreen} onNavigate={navigate} onGoBack={goBack} />
                    </div>

                    {/* Quick Access Dev Menu */}
                    <div className="dev-menu-btn" onClick={() => setDevMenuOpen(!devMenuOpen)}>
                        <span className="material-symbols-outlined">menu</span>
                    </div>

                    {devMenuOpen && (
                        <div className="dev-menu">
                            <div className="text-[10px] font-bold text-gray-400 mb-2 px-3 uppercase tracking-wider">Quick Switch</div>
                            <button onClick={() => { navigate('WELCOME'); setDevMenuOpen(false); }}>Welcome</button>
                            <button onClick={() => { navigate('CLIENT_HOME'); setDevMenuOpen(false); }}>Client Home</button>
                            <button onClick={() => { navigate('PROVIDER_DASHBOARD'); setDevMenuOpen(false); }}>Provider Dashboard</button>
                            <button onClick={() => { navigate('ADMIN_DASHBOARD'); setDevMenuOpen(false); }}>Admin Dashboard</button>
                            <button onClick={() => { navigate('EMERGENCY_MODE'); setDevMenuOpen(false); }}>Emergency Mode</button>
                            <button onClick={() => { navigate('FIND_SERVICES'); setDevMenuOpen(false); }}>Find Services</button>
                            <div className="mt-2 pt-2 border-t border-gray-100 text-[9px] text-center text-gray-400">
                                Prototype Navigation Control
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
