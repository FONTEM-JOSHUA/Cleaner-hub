<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner Hub - Home Service Professional Platform</title>
    <!-- Load React, ReactDOM, and Babel from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Material Icons and Symbols -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Montserrat', sans-serif;
            background-color: #f5f5f5;
        }
        #root {
            min-height: 100vh;
        }
        .app-shell {
            max-width: 450px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .screen-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }
        /* Custom scrollbar for a better look */
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 2px;
        }
        .screen-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Water Ripple Effect */
        .ripple {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: ripple-animation 0.6s linear;
            z-index: 999;
        }
        @keyframes ripple-animation {
            from {
                width: 0px;
                height: 0px;
                opacity: 0.5;
            }
            to {
                width: 500px;
                height: 500px;
                opacity: 0;
            }
        }

        /* Sparkle Animation */
        .sparkle-container {
            position: absolute;
            pointer-events: none;
            z-index: 1000;
        }
        .sparkle {
            position: absolute;
            animation: sparkle-fade 0.8s ease-out forwards;
        }
        @keyframes sparkle-fade {
            0% { transform: scale(0) rotate(0deg); opacity: 1; }
            100% { transform: scale(1.5) rotate(180deg); opacity: 0; }
        }

        /* Floating Action Menu for Demo */
        .dev-menu-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #87CEEB;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .dev-menu-btn:hover {
            opacity: 1;
        }
        .dev-menu {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 10px;
            z-index: 1001;
            width: 200px;
            border: 1px solid #eee;
        }
        .dev-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            transition: background 0.2s;
        }
        .dev-menu button:hover {
            background: #f0f9ff;
            color: #87CEEB;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SCREEN_MAP = {
            'WELCOME': 'welcome_screen/code.html',
            'SIGNUP': 'login/signup_screen/code.html',
            'LOGIN': 'login/signup_screen/code.html',
            'CLIENT_HOME': 'home_screen_(main_dashboard)_for_client_app/code.html',
            'CLIENT_FIND_SERVICES': 'find_services_screen_for_client_app/code.html',
            'CLIENT_PROVIDER_PROFILE': 'service_provider_profile_screen_for_client_app/code.html',
            'CLIENT_BOOKING': 'booking_screen_for_client_app/code.html',
            'CLIENT_MY_BOOKINGS_1': 'my_bookings_screen_for_client_app_1/code.html',
            'CLIENT_MY_BOOKINGS_2': 'my_bookings_screen_for_client_app_2/code.html',
            'CLIENT_MY_BOOKINGS_3': 'my_bookings_screen_for_client_app_3/code.html',
            'CLIENT_MESSAGES': 'messages_screen_for_client_app/code.html',
            'CLIENT_PROFILE': 'profile_screen_for_client_app/code.html',
            'CLIENT_CHANNELS': 'channels_screen_(client_app_flow)_/code.html',
            'CLIENT_REPORT_PROVIDER': 'report_provider_screen_for_client_app/code.html',
            'PROVIDER_WELCOME': 'provider_welcome_screen/code.html',
            'PROVIDER_SETUP': 'provider_setup_screen/code.html',
            'PROVIDER_DASHBOARD_1': 'provider_dashboard_screen_1/code.html',
            'PROVIDER_DASHBOARD_2': 'provider_dashboard_screen_2/code.html',
            'PROVIDER_SCHEDULE': 'my_schedule_screen_for_provider_app/code.html',
            'PROVIDER_BOOKING_REQUESTS': 'booking_requests_screen_for_provider_app/code.html',
            'PROVIDER_MY_CLIENTS': 'my_clients_screen_for_provider_app_(with_report_feature)/code.html',
            'PROVIDER_PROFILE_PUBLIC': 'provider_profile_(public_view)_screen/code.html',
            'PROVIDER_REPORT_CLIENT': 'report_client_screen_for_provider_app/code.html',
            'PROVIDER_REPORT_CONFIRMATION': 'client_report_confirmation_screen_(provider_app)_/code.html',
            'ADMIN_LOGIN': 'admin_login_screen/code.html',
            'ADMIN_DASHBOARD_1': 'admin_dashboard_screen_1/code.html',
            'ADMIN_DASHBOARD_2': 'admin_dashboard_screen_2/code.html',
            'ADMIN_DASHBOARD_3': 'admin_dashboard_screen_3/code.html',
            'ADMIN_DASHBOARD_4': 'admin_dashboard_screen_4/code.html',
            'ADMIN_MANAGE_USERS': 'manage_users_screen_for_admin_app/code.html',
            'ADMIN_MANAGE_BOOKINGS': 'manage_bookings_screen_for_admin_app/code.html',
            'ADMIN_SETTINGS': 'app_settings_screen_for_admin_app/code.html',
            'ADMIN_PROFILE_EDIT': 'admin_profile_edit_screen/code.html',
            'FEATURE_SMART_SEARCH': 'smart_search_screen/code.html',
            'FEATURE_REAL_TIME_TRACKING': 'real-time_tracking_screen/code.html',
            'FEATURE_PHOTO_VERIFICATION': 'photo_verification_feature_screen/code.html',
            'FEATURE_EASY_PAYMENTS': 'easy_payments_feature_screen/code.html',
            'FEATURE_SMART_NOTIFICATIONS': 'smart_notifications_feature_screen/code.html',
            'FEATURE_EMERGENCY': 'emergency_mode_feature_screen/code.html',
            'FEATURE_FAMILY_SHARING': 'family_sharing_feature_screen/code.html',
            'FEATURE_MULTI_LANGUAGE': 'multi-language_support_screen/code.html',
            'FEATURE_OFFLINE_MODE': 'offline_mode_feature_screen/code.html',
            'FEATURE_QUICK_REBOOKING': 'quick_rebooking_feature_screen/code.html',
            'CHANNEL_MANAGEMENT': 'channel_management_screen_(provider/admin_app)_/code.html',
            'CHANNEL_MEMBER_MANAGEMENT': 'channel_member_management_screen_(provider/admin_app)_/code.html',
            'CREATE_NEW_CHANNEL': 'create_new_channel_flow_(provider/admin_app)_/code.html',
            'REPORT_CONFIRMATION': 'report_confirmation_screen/code.html'
        };

        const Screen = ({ screenKey, onNavigate }) => {
            const [html, setHtml] = useState('');
            const [styles, setStyles] = useState('');
            const [loading, setLoading] = useState(true);
            const containerRef = useRef(null);

            useEffect(() => {
                const fetchContent = async () => {
                    setLoading(true);
                    try {
                        const path = `extracted_code/stitch_cleaners_hub/${SCREEN_MAP[screenKey]}`;
                        const response = await fetch(path);
                        const text = await response.text();

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');

                        // Extract Styles
                        const styleContent = Array.from(doc.querySelectorAll('style'))
                            .map(s => s.innerHTML)
                            .join('\n');
                        setStyles(styleContent);

                        // Extract Body Content (excluding scripts which we'll handle separately)
                        const bodyContent = doc.body.innerHTML;

                        // Auth Mode Patching
                        if (screenKey === 'LOGIN') {
                            const tempDiv = document.createElement('div');
                            tempDiv.innerHTML = bodyContent;

                            // Change header subtext
                            const subtext = tempDiv.querySelector('p.text-sm');
                            if (subtext) subtext.innerText = 'Log in to your account to continue';

                            // Change primary button text
                            const btn = tempDiv.querySelector('.mt-8 button span:first-child');
                            if (btn) btn.innerText = 'Log In';

                            // Remove some signup-only fields if they exist
                            const inputs = tempDiv.querySelectorAll('input[placeholder="Full Name"], input[placeholder="Phone Number"], label.flex.items-start');
                            inputs.forEach(el => el.closest('.relative')?.remove() || el.remove());

                            // Change footer link
                            const footerText = tempDiv.querySelector('.mt-auto p');
                            if (footerText) {
                                footerText.innerHTML = `Don't have an account? <a class="font-semibold text-primary hover:text-primary-dark transition-colors" href="#">Sign Up</a>`;
                            }

                            // Update Segmented Control
                            const loginLabel = Array.from(tempDiv.querySelectorAll('label')).find(l => l.innerText.includes('Login'));
                            const signupLabel = Array.from(tempDiv.querySelectorAll('label')).find(l => l.innerText.includes('Sign Up'));
                            if (loginLabel && signupLabel) {
                                loginLabel.className = 'group flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-4 relative shadow-sm transition-all duration-200 bg-primary';
                                loginLabel.querySelector('span').className = 'z-10 text-sm font-semibold text-white';
                                loginLabel.querySelector('input').checked = true;

                                signupLabel.className = 'group flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-4 relative transition-all duration-200';
                                signupLabel.querySelector('span').className = 'z-10 text-sm font-medium text-text-subtle group-hover:text-text-main dark:text-gray-400 dark:group-hover:text-white transition-colors';
                                signupLabel.querySelector('input').checked = false;
                            }

                            setHtml(tempDiv.innerHTML);
                        } else {
                            setHtml(bodyContent);
                        }

                        // We'll handle scripts in a separate useEffect
                    } catch (error) {
                        console.error('Failed to load screen:', error);
                        setHtml('<div class="p-10 text-center">Failed to load screen.</div>');
                    }
                    setLoading(false);
                };
                fetchContent();
            }, [screenKey]);

            // Execute scripts and attach listeners
            useEffect(() => {
                if (!loading && containerRef.current) {
                    const container = containerRef.current;

                    // 1. Manually execute any script tags found in the HTML
                    // Note: This is simplified for the demo/prototype
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });

                    // 2. Attach Click Listeners for Navigation
                    const handleGlobalClick = (e) => {
                        const target = e.target.closest('button, a, [role="button"]');
                        if (!target) return;

                        const text = target.innerText.replace(/\s+/g, ' ').trim().toLowerCase();
                        const icon = target.querySelector('.material-symbols-outlined, .material-icons-round')?.innerText.toLowerCase();

                        // Back Navigation
                        if (icon === 'arrow_back' || text === 'back') {
                            window.dispatchEvent(new CustomEvent('goBack'));
                            return;
                        }

                        // Navigation Logic Heuristics
                        if (text.includes('sign up') || text.includes('create account')) {
                            if (text.includes('provider')) onNavigate('PROVIDER_WELCOME');
                            else if (screenKey === 'LOGIN' || screenKey === 'SIGNUP') onNavigate('CLIENT_HOME');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('log in') || text.includes('login') || text.includes('sign in')) {
                            if (text.includes('admin')) onNavigate('ADMIN_LOGIN');
                            else if (screenKey === 'ADMIN_LOGIN') onNavigate('ADMIN_DASHBOARD_1');
                            else if (screenKey === 'WELCOME') onNavigate('LOGIN');
                            else if (screenKey === 'LOGIN' || screenKey === 'SIGNUP') onNavigate('CLIENT_HOME');
                            else onNavigate('LOGIN');
                        } else if (text.includes('continue as guest')) {
                            onNavigate('CLIENT_HOME');
                        } else if (text.includes('emergency clean') || text.includes('emergency')) {
                            onNavigate('FEATURE_EMERGENCY');
                        } else if (text.includes('book now')) {
                            onNavigate('CLIENT_BOOKING');
                        } else if (text.includes('find services') || text.includes('explore')) {
                            onNavigate('CLIENT_FIND_SERVICES');
                        } else if (text.includes('view profile')) {
                            onNavigate('CLIENT_PROVIDER_PROFILE');
                        } else if (text.includes('get started')) {
                            if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('complete setup') || text.includes('finish') || text.includes('save & continue')) {
                            if (screenKey === 'PROVIDER_SETUP') onNavigate('PROVIDER_DASHBOARD_1');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('home') || icon === 'home') {
                            if (screenKey.startsWith('ADMIN_')) onNavigate('ADMIN_DASHBOARD_1');
                            else if (screenKey.startsWith('PROVIDER_')) onNavigate('PROVIDER_DASHBOARD_1');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('manage bookings') || text.includes('all appointments')) {
                            onNavigate('ADMIN_MANAGE_BOOKINGS');
                        } else if (text.includes('bookings') || icon === 'calendar_today' || icon === 'event_note') {
                            if (screenKey.startsWith('ADMIN_')) onNavigate('ADMIN_MANAGE_BOOKINGS');
                            else if (screenKey.startsWith('PROVIDER_')) onNavigate('PROVIDER_SCHEDULE');
                            else onNavigate('CLIENT_MY_BOOKINGS_1');
                        } else if (text.includes('messages') || icon === 'mail' || icon === 'chat') {
                            if (screenKey.startsWith('PROVIDER_')) onNavigate('CLIENT_CHANNELS');
                            else onNavigate('CLIENT_MESSAGES');
                        } else if (text.includes('manage users') || text.includes('view all clients')) {
                            onNavigate('ADMIN_MANAGE_USERS');
                        } else if (text.includes('verify providers')) {
                            onNavigate('ADMIN_MANAGE_USERS');
                        } else if (text.includes('app settings') || text.includes('settings')) {
                            if (screenKey.startsWith('ADMIN_')) onNavigate('ADMIN_SETTINGS');
                            else onNavigate('CLIENT_PROFILE');
                        } else if (text.includes('profile') || icon === 'person' || icon === 'account_circle') {
                            if (screenKey.startsWith('ADMIN_')) onNavigate('ADMIN_PROFILE_EDIT');
                            else onNavigate('CLIENT_PROFILE');
                        } else if (text.includes('my schedule')) {
                            onNavigate('PROVIDER_SCHEDULE');
                        } else if (text.includes('new requests')) {
                            onNavigate('PROVIDER_BOOKING_REQUESTS');
                        } else if (text.includes('my clients')) {
                            onNavigate('PROVIDER_MY_CLIENTS');
                        } else if (text.includes('view details') || text.includes('reschedule')) {
                            onNavigate('CLIENT_MY_BOOKINGS_1');
                        } else if (text.includes('report client')) {
                            onNavigate('PROVIDER_REPORT_CLIENT');
                        } else if (text.includes('report provider')) {
                            onNavigate('CLIENT_REPORT_PROVIDER');
                        } else if (text.includes('smart search')) {
                            onNavigate('FEATURE_SMART_SEARCH');
                        } else if (text.includes('real-time tracking')) {
                            onNavigate('FEATURE_REAL_TIME_TRACKING');
                        }
                    };

                    const createSparkle = (e) => {
                        const container = document.createElement('div');
                        container.className = 'sparkle-container';
                        container.style.left = `${e.clientX}px`;
                        container.style.top = `${e.clientY}px`;
                        document.body.appendChild(container);

                        const colors = ['#87CEEB', '#FFD700', '#FF69B4', '#00FF7F', '#FFA500'];
                        for (let i = 0; i < 8; i++) {
                            const sparkle = document.createElement('div');
                            sparkle.className = 'sparkle';
                            const size = Math.random() * 10 + 5;
                            const color = colors[Math.floor(Math.random() * colors.length)];
                            const angle = (i / 8) * Math.PI * 2;
                            const distance = Math.random() * 40 + 20;

                            sparkle.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 20 20">
                                <path d="M10 0L13 7L20 10L13 13L10 20L7 13L0 10L7 7L10 0Z" fill="${color}" />
                            </svg>`;

                            sparkle.style.left = `${Math.cos(angle) * distance}px`;
                            sparkle.style.top = `${Math.sin(angle) * distance}px`;
                            container.appendChild(sparkle);
                        }
                        setTimeout(() => container.remove(), 800);
                    };

                    const createRipple = (e) => {
                        const target = e.target.closest('button, .grid > div');
                        if (!target) return;

                        const ripple = document.createElement('span');
                        ripple.classList.add('ripple');

                        const rect = target.getBoundingClientRect();
                        const x = e.clientX - rect.left;
                        const y = e.clientY - rect.top;

                        ripple.style.left = `${x}px`;
                        ripple.style.top = `${y}px`;

                        // Ensure target has relative positioning
                        if (getComputedStyle(target).position === 'static') {
                            target.style.position = 'relative';
                        }
                        target.style.overflow = 'hidden';

                        target.appendChild(ripple);
                        setTimeout(() => ripple.remove(), 600);
                    };

                    const handleInteractions = (e) => {
                        const target = e.target.closest('button, a, [role="button"]');
                        if (target) {
                            const text = target.innerText.trim().toLowerCase();
                            if (text.includes('book now') || text.includes('create account') || text.includes('confirm') || text.includes('complete')) {
                                createSparkle(e);
                            }
                        }
                        createRipple(e);
                        handleGlobalClick(e);
                    };

                    container.addEventListener('click', handleInteractions);
                    return () => container.removeEventListener('click', handleInteractions);
                }
            }, [html, loading, screenKey]);

            return (
                <div className="h-full flex flex-col">
                    <style dangerouslySetInnerHTML={{ __html: styles }} />
                    {loading ? (
                        <div className="flex-1 flex items-center justify-center">
                            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-[#87CEEB]"></div>
                        </div>
                    ) : (
                        <div
                            ref={containerRef}
                            className="flex-1"
                            dangerouslySetInnerHTML={{ __html: html }}
                        />
                    )}
                </div>
            );
        };

        const App = () => {
            const [history, setHistory] = useState(['WELCOME']);
            const [devMenuOpen, setDevMenuOpen] = useState(false);

            const screen = history[history.length - 1];

            const navigate = (newScreen) => {
                if (newScreen === screen) return;
                setHistory(prev => [...prev, newScreen]);
            };

            const goBack = () => {
                if (history.length > 1) {
                    setHistory(prev => prev.slice(0, -1));
                }
            };

            useEffect(() => {
                const handleExternalNavigate = (e) => {
                    if (SCREEN_MAP[e.detail]) navigate(e.detail);
                };
                const handleGoBack = () => goBack();

                window.addEventListener('navigate', handleExternalNavigate);
                window.addEventListener('goBack', handleGoBack);
                return () => {
                    window.removeEventListener('navigate', handleExternalNavigate);
                    window.removeEventListener('goBack', handleGoBack);
                };
            }, [history]);

            return (
                <div className="app-shell">
                    <div className="screen-container">
                        <Screen screenKey={screen} onNavigate={navigate} />
                    </div>

                    {/* Quick Access Dev Menu */}
                    <div className="dev-menu-btn" onClick={() => setDevMenuOpen(!devMenuOpen)}>
                        <span className="material-symbols-outlined">menu</span>
                    </div>

                    {devMenuOpen && (
                        <div className="dev-menu">
                            <div className="text-[10px] font-bold text-gray-400 mb-2 px-3 uppercase tracking-wider">Switch Flow</div>
                            <button onClick={() => { navigate('WELCOME'); setDevMenuOpen(false); }}>Welcome Screen</button>
                            <button onClick={() => { navigate('CLIENT_HOME'); setDevMenuOpen(false); }}>Client App</button>
                            <button onClick={() => { navigate('PROVIDER_WELCOME'); setDevMenuOpen(false); }}>Provider App</button>
                            <button onClick={() => { navigate('ADMIN_LOGIN'); setDevMenuOpen(false); }}>Admin Panel</button>
                            <div className="mt-2 pt-2 border-t border-gray-100 text-[9px] text-center text-gray-400">
                                Prototype Navigation Control
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
