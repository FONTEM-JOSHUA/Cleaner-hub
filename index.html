<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner Hub - Home Service Professional Platform</title>
    <!-- Load React, ReactDOM, and Babel from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Material Icons and Symbols -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Montserrat', sans-serif;
            background-color: #f5f5f5;
        }
        #root {
            min-height: 100vh;
        }
        .app-shell {
            max-width: 450px;
            margin: 0 auto;
            height: 100vh;
            background-color: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .screen-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
        }
        .screen-wrapper {
            height: 100%;
            animation: slideIn 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        @keyframes slideIn {
            from { transform: translateX(30px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Ripple Effect */
        .ripple {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
        }
        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Sparkle Animation */
        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 2000;
        }
        /* Custom scrollbar for a better look */
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 2px;
        }
        .screen-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Floating Action Menu for Demo */
        .dev-menu-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #87CEEB;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .dev-menu-btn:hover {
            opacity: 1;
        }
        .dev-menu {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 10px;
            z-index: 1001;
            width: 200px;
            border: 1px solid #eee;
        }
        .dev-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            transition: background 0.2s;
        }
        .dev-menu button:hover {
            background: #f0f9ff;
            color: #87CEEB;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SCREEN_MAP = {
            'WELCOME': 'welcome_screen/code.html',
            'ADMIN_DASHBOARD': 'admin_dashboard_screen_1/code.html',
            'ADMIN_DASHBOARD_1': 'admin_dashboard_screen_1/code.html',
            'ADMIN_DASHBOARD_2': 'admin_dashboard_screen_2/code.html',
            'ADMIN_DASHBOARD_3': 'admin_dashboard_screen_3/code.html',
            'ADMIN_DASHBOARD_4': 'admin_dashboard_screen_4/code.html',
            'ADMIN_LOGIN': 'admin_login_screen/code.html',
            'ADMIN_PROFILE_EDIT': 'admin_profile_edit_screen/code.html',
            'APP_SETTINGS': 'app_settings_screen_for_admin_app/code.html',
            'BOOKING': 'booking_screen_for_client_app/code.html',
            'BOOKING_REQUESTS': 'booking_requests_screen_for_provider_app/code.html',
            'CHANNELS_CLIENT': 'channels_screen_(client_app_flow)_/code.html',
            'CHANNEL_MANAGEMENT': 'channel_management_screen_(provider/admin_app)_/code.html',
            'CHANNEL_MEMBER_MANAGEMENT': 'channel_member_management_screen_(provider/admin_app)_/code.html',
            'CLIENT_HOME': 'home_screen_(main_dashboard)_for_client_app/code.html',
            'CLIENT_REPORT_CONFIRMATION': 'client_report_confirmation_screen_(provider_app)_/code.html',
            'CREATE_CHANNEL': 'create_new_channel_flow_(provider/admin_app)_/code.html',
            'EASY_PAYMENTS': 'easy_payments_feature_screen/code.html',
            'EMERGENCY_MODE': 'emergency_mode_feature_screen/code.html',
            'FAMILY_SHARING': 'family_sharing_feature_screen/code.html',
            'FIND_SERVICES': 'find_services_screen_for_client_app/code.html',
            'LOGIN': 'login/signup_screen/code.html',
            'MANAGE_BOOKINGS': 'manage_bookings_screen_for_admin_app/code.html',
            'MANAGE_USERS': 'manage_users_screen_for_admin_app/code.html',
            'MESSAGES': 'messages_screen_for_client_app/code.html',
            'MULTI_LANGUAGE': 'multi-language_support_screen/code.html',
            'MY_BOOKINGS': 'my_bookings_screen_for_client_app_1/code.html',
            'MY_BOOKINGS_1': 'my_bookings_screen_for_client_app_1/code.html',
            'MY_BOOKINGS_2': 'my_bookings_screen_for_client_app_2/code.html',
            'MY_BOOKINGS_3': 'my_bookings_screen_for_client_app_3/code.html',
            'MY_CLIENTS': 'my_clients_screen_for_provider_app_(with_report_feature)/code.html',
            'MY_SCHEDULE': 'my_schedule_screen_for_provider_app/code.html',
            'OFFLINE_MODE': 'offline_mode_feature_screen/code.html',
            'PHOTO_VERIFICATION': 'photo_verification_feature_screen/code.html',
            'PROFILE': 'profile_screen_for_client_app/code.html',
            'PROVIDER_DASHBOARD': 'provider_dashboard_screen_1/code.html',
            'PROVIDER_DASHBOARD_1': 'provider_dashboard_screen_1/code.html',
            'PROVIDER_DASHBOARD_2': 'provider_dashboard_screen_2/code.html',
            'PROVIDER_PROFILE': 'service_provider_profile_screen_for_client_app/code.html',
            'PROVIDER_PROFILE_PUBLIC': 'provider_profile_(public_view)_screen/code.html',
            'PROVIDER_SETUP': 'provider_setup_screen/code.html',
            'PROVIDER_WELCOME': 'provider_welcome_screen/code.html',
            'QUICK_REBOOKING': 'quick_rebooking_feature_screen/code.html',
            'REAL_TIME_TRACKING': 'real-time_tracking_screen/code.html',
            'REPORT_CLIENT': 'report_client_screen_for_provider_app/code.html',
            'REPORT_CONFIRMATION': 'report_confirmation_screen/code.html',
            'REPORT_PROVIDER': 'report_provider_screen_for_client_app/code.html',
            'SIGNUP': 'login/signup_screen/code.html',
            'SMART_NOTIFICATIONS': 'smart_notifications_feature_screen/code.html',
            'SMART_SEARCH': 'smart_search_screen/code.html'
        };

        const Screen = ({ screenKey, onNavigate }) => {
            const [html, setHtml] = useState('');
            const [styles, setStyles] = useState('');
            const [loading, setLoading] = useState(true);
            const [authMode, setAuthMode] = useState(screenKey === 'LOGIN' ? 'login' : 'signup');
            const containerRef = useRef(null);

            const createRipple = (e) => {
                const button = e.currentTarget;
                const ripple = document.createElement("span");
                const rect = button.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const x = e.clientX - rect.left - size / 2;
                const y = e.clientY - rect.top - size / 2;

                ripple.style.width = ripple.style.height = `${size}px`;
                ripple.style.left = `${x}px`;
                ripple.style.top = `${y}px`;
                ripple.classList.add("ripple");

                const prevRipple = button.getElementsByClassName("ripple")[0];
                if (prevRipple) prevRipple.remove();

                if (getComputedStyle(button).position === 'static') {
                    button.style.position = 'relative';
                }
                button.style.overflow = 'hidden';
                button.appendChild(ripple);

                setTimeout(() => ripple.remove(), 600);
            };

            const createSparkles = (e) => {
                const colors = ['#87CEEB', '#FFD700', '#FF69B4', '#00FF7F', '#FFFFFF'];
                for (let i = 0; i < 12; i++) {
                    const sparkle = document.createElement('div');
                    sparkle.className = 'sparkle';
                    sparkle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    sparkle.style.left = e.clientX + 'px';
                    sparkle.style.top = e.clientY + 'px';

                    const angle = Math.random() * Math.PI * 2;
                    const velocity = 2 + Math.random() * 4;
                    const tx = Math.cos(angle) * velocity * 20;
                    const ty = Math.sin(angle) * velocity * 20;

                    document.body.appendChild(sparkle);

                    const animation = sparkle.animate([
                        { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                        { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
                    ], {
                        duration: 600 + Math.random() * 400,
                        easing: 'cubic-bezier(0.25, 1, 0.5, 1)'
                    });

                    animation.onfinish = () => sparkle.remove();
                }
            };

            useEffect(() => {
                setAuthMode(screenKey === 'LOGIN' ? 'login' : 'signup');
            }, [screenKey]);

            useEffect(() => {
                const fetchContent = async () => {
                    setLoading(true);
                    try {
                        const path = `extracted_code/stitch_cleaners_hub/${SCREEN_MAP[screenKey]}`;
                        const response = await fetch(path);
                        const text = await response.text();

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');

                        // Extract Styles
                        const styleContent = Array.from(doc.querySelectorAll('style'))
                            .map(s => s.innerHTML)
                            .join('\n');
                        setStyles(styleContent);

                        // Extract Body Content (excluding scripts which we'll handle separately)
                        const bodyContent = doc.body.innerHTML;
                        setHtml(bodyContent);

                    } catch (error) {
                        console.error('Failed to load screen:', error);
                        setHtml('<div class="p-10 text-center">Failed to load screen.</div>');
                    }
                    setLoading(false);
                };
                fetchContent();
            }, [screenKey]);

            // Patching function for Auth Screen
            const applyAuthModePatch = (mode) => {
                if (!containerRef.current || (screenKey !== 'LOGIN' && screenKey !== 'SIGNUP')) return;

                const container = containerRef.current;
                const isLogin = mode === 'login';

                // Toggle radio buttons
                const loginRadio = container.querySelector('input[value="login"]');
                const signupRadio = container.querySelector('input[value="signup"]');
                if (loginRadio) loginRadio.checked = isLogin;
                if (signupRadio) signupRadio.checked = !isLogin;

                // Update tab styles
                const labels = Array.from(container.querySelectorAll('label'));
                const loginTab = labels.find(l => l.innerText.includes('Login'));
                const signupTab = labels.find(l => l.innerText.includes('Sign Up'));

                if (loginTab && signupTab) {
                    if (isLogin) {
                        loginTab.classList.add('bg-primary', 'shadow-sm');
                        loginTab.querySelector('span').classList.remove('text-text-subtle');
                        loginTab.querySelector('span').classList.add('text-white', 'font-semibold');

                        signupTab.classList.remove('bg-primary', 'shadow-sm');
                        signupTab.querySelector('span').classList.add('text-text-subtle');
                        signupTab.querySelector('span').classList.remove('text-white', 'font-semibold');
                    } else {
                        signupTab.classList.add('bg-primary', 'shadow-sm');
                        signupTab.querySelector('span').classList.remove('text-text-subtle');
                        signupTab.querySelector('span').classList.add('text-white', 'font-semibold');

                        loginTab.classList.remove('bg-primary', 'shadow-sm');
                        loginTab.querySelector('span').classList.add('text-text-subtle');
                        loginTab.querySelector('span').classList.remove('text-white', 'font-semibold');
                    }
                }

                // Hide/Show fields
                const fields = Array.from(container.querySelectorAll('.relative'));
                const nameField = fields.find(f => f.querySelector('input[placeholder*="Name"]'));
                const phoneField = fields.find(f => f.querySelector('input[placeholder*="Phone"]'));
                const termsCheckbox = container.querySelector('input[type="checkbox"]')?.closest('label');
                const actionButton = container.querySelector('button.bg-primary');
                const actionButtonSpan = actionButton?.querySelector('span');
                const footerText = container.querySelector('.mt-auto.pt-6 p');

                if (isLogin) {
                    if (nameField) nameField.style.display = 'none';
                    if (phoneField) phoneField.style.display = 'none';
                    if (termsCheckbox) termsCheckbox.style.display = 'none';
                    if (actionButtonSpan) actionButtonSpan.innerText = 'Login';
                    if (footerText) footerText.innerHTML = `Don't have an account? <a class="font-semibold text-primary hover:text-primary-dark transition-colors" href="#">Sign Up</a>`;
                } else {
                    if (nameField) nameField.style.display = 'block';
                    if (phoneField) phoneField.style.display = 'block';
                    if (termsCheckbox) termsCheckbox.style.display = 'flex';
                    if (actionButtonSpan) actionButtonSpan.innerText = 'Create Account';
                    if (footerText) footerText.innerHTML = `Already have an account? <a class="font-semibold text-primary hover:text-primary-dark transition-colors" href="#">Login</a>`;
                }
            };

            useEffect(() => {
                if (!loading && containerRef.current) {
                    applyAuthModePatch(authMode);
                }
            }, [html, loading, authMode]);

            // Execute scripts and attach listeners
            useEffect(() => {
                if (!loading && containerRef.current) {
                    const container = containerRef.current;

                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });

                    const handleGlobalClick = (e) => {
                        const target = e.target.closest('button, a, [role="button"], label');
                        if (!target) return;

                        const text = target.innerText.trim().toLowerCase();

                        // Visual Feedback
                        createRipple(e);
                        if (text.includes('confirm') || text.includes('create account') || text.includes('complete setup') || text.includes('pay now')) {
                            createSparkles(e);
                        }

                        // Auth Mode Toggle
                        if (target.tagName === 'LABEL' && target.querySelector('input[name="auth-mode"]')) {
                            const newMode = target.querySelector('input[name="auth-mode"]').value;
                            setAuthMode(newMode);
                            e.preventDefault();
                            return;
                        }

                        // Footer Auth Toggle
                        if (target.tagName === 'A' && (screenKey === 'LOGIN' || screenKey === 'SIGNUP')) {
                             if (text.includes('login')) {
                                 setAuthMode('login');
                                 e.preventDefault();
                                 return;
                             } else if (text.includes('sign up')) {
                                 setAuthMode('signup');
                                 e.preventDefault();
                                 return;
                             }
                        }

                        // Back navigation
                        if (target.querySelector('.material-symbols-outlined')?.innerText === 'arrow_back' ||
                            target.querySelector('.material-symbols-outlined')?.innerText === 'chevron_left' ||
                            text === 'cancel') {
                            window.dispatchEvent(new CustomEvent('goBack'));
                            return;
                        }

                        // Navigation Logic Heuristics
                        if (text.includes('sign up') || text.includes('create account')) {
                            if (text.includes('provider')) {
                                if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP');
                                else onNavigate('PROVIDER_WELCOME');
                            }
                            else if (screenKey === 'SIGNUP' || (screenKey === 'LOGIN' && authMode === 'signup')) onNavigate('CLIENT_HOME');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('log in') || text.includes('login') || text.includes('sign in')) {
                            if (text.includes('admin')) onNavigate('ADMIN_LOGIN');
                            else if (text.includes('provider')) onNavigate('PROVIDER_DASHBOARD');
                            else if (screenKey === 'ADMIN_LOGIN') onNavigate('ADMIN_DASHBOARD');
                            else if (screenKey === 'WELCOME') onNavigate('LOGIN');
                            else if (screenKey === 'LOGIN' || (screenKey === 'SIGNUP' && authMode === 'login')) onNavigate('CLIENT_HOME');
                            else onNavigate('LOGIN');
                        } else if (text.includes('continue as guest')) {
                            onNavigate('CLIENT_HOME');
                        } else if (text.includes('book now')) {
                            onNavigate('BOOKING');
                        } else if (text.includes('find services') || text.includes('explore')) {
                            onNavigate('FIND_SERVICES');
                        } else if (text.includes('view profile')) {
                            onNavigate('PROVIDER_PROFILE');
                        } else if (text.includes('get started')) {
                            if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('complete setup') || text.includes('finish') || text.includes('save & continue') || text.includes('save and continue')) {
                            if (screenKey === 'PROVIDER_SETUP') onNavigate('PROVIDER_DASHBOARD');
                            else onNavigate('PROVIDER_DASHBOARD'); // Default for provider flow
                        } else if (text.includes('manage bookings')) {
                            onNavigate('MANAGE_BOOKINGS');
                        } else if (text.includes('manage users')) {
                            onNavigate('MANAGE_USERS');
                        } else if (text.includes('verify providers')) {
                            onNavigate('MANAGE_USERS');
                        } else if (text.includes('app settings')) {
                            onNavigate('APP_SETTINGS');
                        } else if (text.includes('emergency clean') || text.includes('emergency mode')) {
                            onNavigate('EMERGENCY_MODE');
                        } else if (text.includes('subscribe')) {
                            onNavigate('EASY_PAYMENTS');
                        } else if (text.includes('my schedule')) {
                            onNavigate('MY_SCHEDULE');
                        } else if (text.includes('new requests')) {
                            onNavigate('BOOKING_REQUESTS');
                        } else if (text.includes('my clients')) {
                            onNavigate('MY_CLIENTS');
                        } else if (text.includes('my earnings')) {
                            onNavigate('PROVIDER_DASHBOARD_2');
                        } else if (text.includes('home') || target.querySelector('.material-symbols-outlined')?.innerText === 'home') {
                            onNavigate('CLIENT_HOME');
                        } else if (text.includes('bookings') || target.querySelector('.material-symbols-outlined')?.innerText === 'calendar_today') {
                            onNavigate('MY_BOOKINGS');
                        } else if (text.includes('messages') || target.querySelector('.material-symbols-outlined')?.innerText === 'mail') {
                            onNavigate('MESSAGES');
                        } else if (text.includes('profile') || target.querySelector('.material-symbols-outlined')?.innerText === 'person') {
                            onNavigate('PROFILE');
                        }
                    };

                    container.addEventListener('click', handleGlobalClick);
                    return () => container.removeEventListener('click', handleGlobalClick);
                }
            }, [html, loading, screenKey, authMode]);

            return (
                <div className="h-full flex flex-col">
                    <style dangerouslySetInnerHTML={{ __html: styles }} />
                    {loading ? (
                        <div className="flex-1 flex items-center justify-center">
                            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-[#87CEEB]"></div>
                        </div>
                    ) : (
                        <div
                            key={screenKey}
                            ref={containerRef}
                            className="flex-1 screen-wrapper"
                            dangerouslySetInnerHTML={{ __html: html }}
                        />
                    )}
                </div>
            );
        };

        const App = () => {
            const [history, setHistory] = useState(['WELCOME']);
            const [devMenuOpen, setDevMenuOpen] = useState(false);
            const screen = history[history.length - 1];

            const navigate = (newScreen) => {
                if (newScreen === screen) return;
                setHistory(prev => [...prev, newScreen]);
            };

            const goBack = () => {
                if (history.length > 1) {
                    setHistory(prev => prev.slice(0, -1));
                }
            };

            useEffect(() => {
                const handleExternalNavigate = (e) => {
                    if (SCREEN_MAP[e.detail]) navigate(e.detail);
                };
                const handleGoBack = () => goBack();

                window.addEventListener('navigate', handleExternalNavigate);
                window.addEventListener('goBack', handleGoBack);
                return () => {
                    window.removeEventListener('navigate', handleExternalNavigate);
                    window.removeEventListener('goBack', handleGoBack);
                };
            }, [history]);

            return (
                <div className="app-shell">
                    <div className="screen-container">
                        <Screen screenKey={screen} onNavigate={navigate} />
                    </div>

                    {/* Quick Access Dev Menu */}
                    <div className="dev-menu-btn" onClick={() => setDevMenuOpen(!devMenuOpen)}>
                        <span className="material-symbols-outlined">menu</span>
                    </div>

                    {devMenuOpen && (
                        <div className="dev-menu">
                            <div className="text-[10px] font-bold text-gray-400 mb-2 px-3 uppercase tracking-wider">Switch Flow</div>
                            <button onClick={() => { setHistory(['WELCOME']); setDevMenuOpen(false); }}>Welcome Screen</button>
                            <button onClick={() => { navigate('CLIENT_HOME'); setDevMenuOpen(false); }}>Client App</button>
                            <button onClick={() => { navigate('PROVIDER_WELCOME'); setDevMenuOpen(false); }}>Provider App</button>
                            <button onClick={() => { navigate('ADMIN_LOGIN'); setDevMenuOpen(false); }}>Admin Panel</button>
                            <div className="mt-2 pt-2 border-t border-gray-100 text-[9px] text-center text-gray-400">
                                Prototype Navigation Control
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
