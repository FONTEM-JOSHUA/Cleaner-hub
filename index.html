<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner Hub - Home Service Professional Platform</title>
    <!-- Load React, ReactDOM, and Babel from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Material Icons and Symbols -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Montserrat', sans-serif;
            background-color: #f5f5f5;
        }
        #root {
            min-height: 100vh;
        }
        .app-shell {
            max-width: 450px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .screen-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }
        /* Custom scrollbar for a better look */
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 2px;
        }
        .screen-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Screen Transitions */
        .screen-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: white;
        }
        .screen-enter {
            transform: translateX(100%);
        }
        .screen-enter-active {
            transform: translateX(0);
        }
        .screen-exit {
            transform: translateX(0);
        }
        .screen-exit-active {
            transform: translateX(-100%);
        }
        .screen-back-enter {
            transform: translateX(-100%);
        }
        .screen-back-enter-active {
            transform: translateX(0);
        }
        .screen-back-exit {
            transform: translateX(0);
        }
        .screen-back-exit-active {
            transform: translateX(100%);
        }

        /* Floating Action Menu for Demo */
        .dev-menu-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #87CEEB;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .dev-menu-btn:hover {
            opacity: 1;
        }
        .dev-menu {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 10px;
            z-index: 1001;
            width: 200px;
            border: 1px solid #eee;
        }
        .dev-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            transition: background 0.2s;
        }
        .dev-menu button:hover {
            background: #f0f9ff;
            color: #87CEEB;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SCREEN_MAP = {
            'WELCOME': 'welcome_screen/code.html',
            'SIGNUP': 'login/signup_screen/code.html',
            'LOGIN': 'login/signup_screen/code.html',
            'CLIENT_HOME': 'home_screen_(main_dashboard)_for_client_app/code.html',
            'FIND_SERVICES': 'find_services_screen_for_client_app/code.html',
            'PROVIDER_PROFILE': 'service_provider_profile_screen_for_client_app/code.html',
            'BOOKING': 'booking_screen_for_client_app/code.html',
            'MY_BOOKINGS': 'my_bookings_screen_for_client_app_1/code.html',
            'MESSAGES': 'messages_screen_for_client_app/code.html',
            'PROFILE': 'profile_screen_for_client_app/code.html',
            'PROVIDER_WELCOME': 'provider_welcome_screen/code.html',
            'PROVIDER_SETUP': 'provider_setup_screen/code.html',
            'PROVIDER_DASHBOARD': 'provider_dashboard_screen_1/code.html',
            'PROVIDER_SCHEDULE': 'my_schedule_screen_for_provider_app/code.html',
            'PROVIDER_REQUESTS': 'booking_requests_screen_for_provider_app/code.html',
            'PROVIDER_CLIENTS': 'my_clients_screen_for_provider_app_(with_report_feature)/code.html',
            'ADMIN_LOGIN': 'admin_login_screen/code.html',
            'ADMIN_DASHBOARD': 'admin_dashboard_screen_1/code.html',
            'ADMIN_USERS': 'manage_users_screen_for_admin_app/code.html',
            'ADMIN_BOOKINGS': 'manage_bookings_screen_for_admin_app/code.html',
            'ADMIN_SETTINGS': 'app_settings_screen_for_admin_app/code.html',
            'EMERGENCY': 'emergency_mode_feature_screen/code.html',
            'SMART_SEARCH': 'smart_search_screen/code.html',
            'TRACKING': 'real-time_tracking_screen/code.html'
        };

        const Screen = ({ screenKey, onNavigate }) => {
            const [html, setHtml] = useState('');
            const [loading, setLoading] = useState(true);
            const containerRef = useRef(null);

            useEffect(() => {
                const fetchContent = async () => {
                    setLoading(true);
                    try {
                        const path = `extracted_code/stitch_cleaners_hub/${SCREEN_MAP[screenKey]}`;
                        const response = await fetch(path);
                        const text = await response.text();

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');

                        // Clean up previous screen assets
                        document.querySelectorAll('[data-screen-assets]').forEach(el => el.remove());

                        // Extract and Inject Styles from Head
                        Array.from(doc.head.querySelectorAll('style, link[rel="stylesheet"]')).forEach(el => {
                            const newEl = el.cloneNode(true);
                            newEl.setAttribute('data-screen-assets', 'true');
                            document.head.appendChild(newEl);
                        });

                        // Extract and Inject Scripts from Head (like Tailwind config)
                        Array.from(doc.head.querySelectorAll('script')).forEach(el => {
                            if (el.src && (el.src.includes('tailwind') || el.src.includes('babel'))) return;
                            const newScript = document.createElement('script');
                            Array.from(el.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                            newScript.appendChild(document.createTextNode(el.innerHTML));
                            newScript.setAttribute('data-screen-assets', 'true');
                            document.head.appendChild(newScript);
                        });

                        // Extract Body Content
                        const bodyContent = doc.body.innerHTML;
                        setHtml(bodyContent);
                    } catch (error) {
                        console.error('Failed to load screen:', error);
                        setHtml('<div class="p-10 text-center">Failed to load screen.</div>');
                    }
                    setLoading(false);
                };
                fetchContent();
            }, [screenKey]);

            // Handle Auth Toggle (Login vs Sign Up)
            useEffect(() => {
                if (!loading && (screenKey === 'LOGIN' || screenKey === 'SIGNUP')) {
                    const container = containerRef.current;
                    if (!container) return;

                    const updateAuthUI = (mode) => {
                        const isLogin = mode === 'login';

                        // Toggle Fields
                        const fullNameField = container.querySelector('input[placeholder*="Full Name"]')?.closest('.relative');
                        const phoneField = container.querySelector('input[placeholder*="Phone"]')?.closest('.relative');
                        const termsCheckbox = container.querySelector('input[type="checkbox"]')?.closest('label');

                        if (fullNameField) fullNameField.style.display = isLogin ? 'none' : 'block';
                        if (phoneField) phoneField.style.display = isLogin ? 'none' : 'block';
                        if (termsCheckbox) termsCheckbox.style.display = isLogin ? 'none' : 'block';

                        // Toggle Button Text
                        const submitBtn = container.querySelector('button.bg-primary span:not(.material-symbols-outlined)');
                        if (submitBtn) submitBtn.innerText = isLogin ? 'Login' : 'Create Account';

                        // Toggle Footer Text
                        const footerText = container.querySelector('.mt-auto p');
                        if (footerText) {
                            footerText.innerHTML = isLogin
                                ? `Don't have an account? <a class="font-semibold text-primary hover:text-primary-dark transition-colors" href="#">Sign Up</a>`
                                : `Already have an account? <a class="font-semibold text-primary hover:text-primary-dark transition-colors" href="#">Login</a>`;
                        }

                        // Update Segmented Control Styles
                        const labels = container.querySelectorAll('label.group');
                        labels.forEach(label => {
                            const input = label.querySelector('input[name="auth-mode"]');
                            if (input) {
                                if (input.value === mode) {
                                    label.classList.add('bg-primary', 'shadow-sm');
                                    label.querySelector('span').classList.remove('text-text-subtle', 'dark:text-gray-400');
                                    label.querySelector('span').classList.add('text-white', 'font-semibold');
                                } else {
                                    label.classList.remove('bg-primary', 'shadow-sm');
                                    label.querySelector('span').classList.add('text-text-subtle', 'dark:text-gray-400');
                                    label.querySelector('span').classList.remove('text-white', 'font-semibold');
                                }
                            }
                        });
                    };

                    // Set initial state
                    updateAuthUI(screenKey.toLowerCase());

                    // Listen for changes
                    const handleAuthChange = (e) => {
                        if (e.target.name === 'auth-mode') {
                            updateAuthUI(e.target.value);
                        }
                    };
                    container.addEventListener('change', handleAuthChange);

                    // Handle Footer Link Click
                    const handleFooterClick = (e) => {
                        if (e.target.tagName === 'A' && e.target.closest('.mt-auto')) {
                            e.preventDefault();
                            const currentMode = container.querySelector('input[name="auth-mode"]:checked')?.value;
                            const newMode = currentMode === 'login' ? 'signup' : 'login';
                            const radio = container.querySelector(`input[name="auth-mode"][value="${newMode}"]`);
                            if (radio) {
                                radio.checked = true;
                                updateAuthUI(newMode);
                            }
                        }
                    };
                    container.addEventListener('click', handleFooterClick);

                    return () => {
                        container.removeEventListener('change', handleAuthChange);
                        container.removeEventListener('click', handleFooterClick);
                    };
                }
            }, [html, loading, screenKey]);

            // Execute scripts and attach listeners
            useEffect(() => {
                if (!loading && containerRef.current) {
                    const container = containerRef.current;

                    // 1. Manually execute any script tags found in the HTML
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        if (oldScript.getAttribute('data-screen-assets')) return;
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        newScript.setAttribute('data-screen-assets', 'true');
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });

                    // 2. Attach Click Listeners for Navigation
                    const handleGlobalClick = (e) => {
                        const target = e.target.closest('button, a, [role="button"]');
                        if (!target) return;

                        const text = target.innerText.replace(/\s+/g, ' ').trim().toLowerCase();
                        const iconText = target.querySelector('.material-symbols-outlined, .material-icons-round')?.innerText;

                        // Back Button Heuristics
                        if (text === 'arrow_back' || iconText === 'arrow_back' || text === 'chevron_left' || iconText === 'chevron_left' || text === 'back') {
                            onNavigate(null, true);
                            return;
                        }

                        // Navigation Logic Heuristics
                        if (text.includes('sign up') || text.includes('create account')) {
                            if (text.includes('provider')) onNavigate('PROVIDER_WELCOME');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('log in') || text.includes('login') || text.includes('sign in')) {
                            if (text.includes('admin')) onNavigate('ADMIN_LOGIN');
                            else if (screenKey === 'ADMIN_LOGIN') onNavigate('ADMIN_DASHBOARD');
                            else if (screenKey === 'WELCOME') onNavigate('LOGIN');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('continue as guest')) {
                            onNavigate('CLIENT_HOME');
                        } else if (text.includes('book now')) {
                            onNavigate('BOOKING');
                        } else if (text.includes('find services') || text.includes('explore')) {
                            onNavigate('FIND_SERVICES');
                        } else if (text.includes('view profile')) {
                            onNavigate('PROVIDER_PROFILE');
                        } else if (text.includes('manage users')) {
                            onNavigate('ADMIN_USERS');
                        } else if (text.includes('manage bookings') || (screenKey === 'ADMIN_DASHBOARD' && text.includes('bookings'))) {
                            onNavigate('ADMIN_BOOKINGS');
                        } else if (text.includes('settings')) {
                            onNavigate('ADMIN_SETTINGS');
                        } else if (text.includes('schedule') || iconText === 'calendar_month') {
                            onNavigate('PROVIDER_SCHEDULE');
                        } else if (text.includes('requests')) {
                            onNavigate('PROVIDER_REQUESTS');
                        } else if (text.includes('clients')) {
                            onNavigate('PROVIDER_CLIENTS');
                        } else if (text.includes('emergency')) {
                            onNavigate('EMERGENCY');
                        } else if (text.includes('search') || iconText === 'search') {
                            onNavigate('SMART_SEARCH');
                        } else if (text.includes('get started')) {
                            if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('complete setup') || text.includes('finish')) {
                            onNavigate('PROVIDER_DASHBOARD');
                        } else if (text.includes('home') || iconText === 'home' || iconText === 'dashboard') {
                            if (screenKey.startsWith('ADMIN_')) onNavigate('ADMIN_DASHBOARD');
                            else if (screenKey.startsWith('PROVIDER_')) onNavigate('PROVIDER_DASHBOARD');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('bookings') || iconText === 'calendar_today' || iconText === 'event_note') {
                            onNavigate('MY_BOOKINGS');
                        } else if (text.includes('messages') || iconText === 'mail' || iconText === 'chat') {
                            onNavigate('MESSAGES');
                        } else if (text.includes('profile') || iconText === 'person') {
                            onNavigate('PROFILE');
                        }
                    };

                    container.addEventListener('click', handleGlobalClick);
                    return () => container.removeEventListener('click', handleGlobalClick);
                }
            }, [html, loading, screenKey]);

            return (
                <div className="h-full flex flex-col">
                    {loading ? (
                        <div className="flex-1 flex items-center justify-center">
                            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-[#87CEEB]"></div>
                        </div>
                    ) : (
                        <div
                            ref={containerRef}
                            className="flex-1"
                            dangerouslySetInnerHTML={{ __html: html }}
                        />
                    )}
                </div>
            );
        };

        const App = () => {
            const [navigationStack, setNavigationStack] = useState(['WELCOME']);
            const [transition, setTransition] = useState(null); // { type: 'forward' | 'back', screen: string }
            const [devMenuOpen, setDevMenuOpen] = useState(false);

            const currentScreen = navigationStack[navigationStack.length - 1];

            const handleNavigate = (nextScreen, isBack = false) => {
                if (isBack) {
                    if (navigationStack.length > 1) {
                        const prevScreen = navigationStack[navigationStack.length - 2];
                        setTransition({ type: 'back', screen: prevScreen });
                        setTimeout(() => {
                            setNavigationStack(prev => prev.slice(0, -1));
                            setTransition(null);
                        }, 400);
                    }
                } else {
                    if (nextScreen === currentScreen) return;
                    if (!SCREEN_MAP[nextScreen]) return;
                    setTransition({ type: 'forward', screen: nextScreen });
                    setTimeout(() => {
                        setNavigationStack(prev => [...prev, nextScreen]);
                        setTransition(null);
                    }, 400);
                }
            };

            useEffect(() => {
                const handleExternalNavigate = (e) => {
                    if (SCREEN_MAP[e.detail]) handleNavigate(e.detail);
                };
                window.addEventListener('navigate', handleExternalNavigate);
                return () => window.removeEventListener('navigate', handleExternalNavigate);
            }, [navigationStack]);

            return (
                <div className="app-shell">
                    <div className="screen-container relative overflow-hidden">
                        {/* Outgoing Screen */}
                        <div className={`screen-wrapper ${transition?.type === 'forward' ? 'screen-exit-active' : transition?.type === 'back' ? 'screen-back-exit-active' : ''}`}>
                            <Screen screenKey={currentScreen} onNavigate={handleNavigate} />
                        </div>

                        {/* Incoming Screen */}
                        {transition && (
                            <div className={`screen-wrapper ${transition.type === 'forward' ? 'screen-enter-active' : 'screen-back-enter-active'}`}>
                                <Screen screenKey={transition.screen} onNavigate={() => {}} />
                            </div>
                        )}
                    </div>

                    {/* Quick Access Dev Menu */}
                    <div className="dev-menu-btn" onClick={() => setDevMenuOpen(!devMenuOpen)}>
                        <span className="material-symbols-outlined">menu</span>
                    </div>

                    {devMenuOpen && (
                        <div className="dev-menu">
                            <div className="text-[10px] font-bold text-gray-400 mb-2 px-3 uppercase tracking-wider">Switch Flow</div>
                            <button onClick={() => { handleNavigate('WELCOME'); setDevMenuOpen(false); }}>Welcome Screen</button>
                            <button onClick={() => { handleNavigate('CLIENT_HOME'); setDevMenuOpen(false); }}>Client App</button>
                            <button onClick={() => { handleNavigate('PROVIDER_WELCOME'); setDevMenuOpen(false); }}>Provider App</button>
                            <button onClick={() => { handleNavigate('ADMIN_LOGIN'); setDevMenuOpen(false); }}>Admin Panel</button>
                            <div className="text-[10px] font-bold text-gray-400 mt-2 mb-2 px-3 uppercase tracking-wider border-t pt-2">Features</div>
                            <button onClick={() => { handleNavigate('EMERGENCY'); setDevMenuOpen(false); }}>Emergency Mode</button>
                            <button onClick={() => { handleNavigate('TRACKING'); setDevMenuOpen(false); }}>Live Tracking</button>
                            <div className="mt-2 pt-2 border-t border-gray-100 text-[9px] text-center text-gray-400">
                                Prototype Navigation Control
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
