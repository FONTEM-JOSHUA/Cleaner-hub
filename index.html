<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner Hub - Home Service Professional Platform</title>
    <!-- Load React, ReactDOM, and Babel from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Material Icons and Symbols -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Montserrat', sans-serif;
            background-color: #f5f5f5;
        }
        #root {
            min-height: 100vh;
        }
        .app-shell {
            max-width: 450px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .screen-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
        }
        /* Custom scrollbar for a better look */
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 2px;
        }
        .screen-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Screen Transitions */
        @keyframes slideIn {
            from { transform: translateX(30px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .animate-slide-in {
            animation: slideIn 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Floating Action Menu for Demo */
        .dev-menu-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #87CEEB;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .dev-menu-btn:hover {
            opacity: 1;
        }
        .dev-menu {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 10px;
            z-index: 1001;
            width: 250px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #eee;
        }
        .dev-menu h3 {
            font-size: 10px;
            font-weight: bold;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 8px 12px 4px;
            border-bottom: 1px solid #f5f5f5;
            margin-bottom: 4px;
        }
        .dev-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #333;
            transition: background 0.2s;
        }
        .dev-menu button:hover {
            background: #f0f9ff;
            color: #87CEEB;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SCREEN_MAP = {
            'WELCOME': 'welcome_screen/code.html',
            'SIGNUP': 'login/signup_screen/code.html',
            'LOGIN': 'login/signup_screen/code.html',

            // Client Flow
            'CLIENT_HOME': 'home_screen_(main_dashboard)_for_client_app/code.html',
            'FIND_SERVICES': 'find_services_screen_for_client_app/code.html',
            'PROVIDER_PROFILE': 'service_provider_profile_screen_for_client_app/code.html',
            'BOOKING': 'booking_screen_for_client_app/code.html',
            'MY_BOOKINGS_1': 'my_bookings_screen_for_client_app_1/code.html',
            'MY_BOOKINGS_2': 'my_bookings_screen_for_client_app_2/code.html',
            'MY_BOOKINGS_3': 'my_bookings_screen_for_client_app_3/code.html',
            'MESSAGES': 'messages_screen_for_client_app/code.html',
            'PROFILE': 'profile_screen_for_client_app/code.html',
            'CHANNELS_CLIENT': 'channels_screen_(client_app_flow)_/code.html',
            'REPORT_PROVIDER': 'report_provider_screen_for_client_app/code.html',

            // Provider Flow
            'PROVIDER_WELCOME': 'provider_welcome_screen/code.html',
            'PROVIDER_SETUP': 'provider_setup_screen/code.html',
            'PROVIDER_DASHBOARD_1': 'provider_dashboard_screen_1/code.html',
            'PROVIDER_DASHBOARD_2': 'provider_dashboard_screen_2/code.html',
            'PROVIDER_SCHEDULE': 'my_schedule_screen_for_provider_app/code.html',
            'PROVIDER_REQUESTS': 'booking_requests_screen_for_provider_app/code.html',
            'MY_CLIENTS': 'my_clients_screen_for_provider_app_(with_report_feature)/code.html',
            'REPORT_CLIENT': 'report_client_screen_for_provider_app/code.html',
            'CLIENT_REPORT_CONFIRMATION': 'client_report_confirmation_screen_(provider_app)_/code.html',
            'PROVIDER_PUBLIC_PROFILE': 'provider_profile_(public_view)_screen/code.html',
            'CHANNEL_MGMT': 'channel_management_screen_(provider/admin_app)_/code.html',
            'CHANNEL_MEMBER_MGMT': 'channel_member_management_screen_(provider/admin_app)_/code.html',
            'CREATE_CHANNEL': 'create_new_channel_flow_(provider/admin_app)_/code.html',

            // Admin Flow
            'ADMIN_LOGIN': 'admin_login_screen/code.html',
            'ADMIN_DASHBOARD_1': 'admin_dashboard_screen_1/code.html',
            'ADMIN_DASHBOARD_2': 'admin_dashboard_screen_2/code.html',
            'ADMIN_DASHBOARD_3': 'admin_dashboard_screen_3/code.html',
            'ADMIN_DASHBOARD_4': 'admin_dashboard_screen_4/code.html',
            'ADMIN_PROFILE_EDIT': 'admin_profile_edit_screen/code.html',
            'MANAGE_BOOKINGS': 'manage_bookings_screen_for_admin_app/code.html',
            'MANAGE_USERS': 'manage_users_screen_for_admin_app/code.html',
            'APP_SETTINGS': 'app_settings_screen_for_admin_app/code.html',

            // Features & Shared
            'EASY_PAYMENTS': 'easy_payments_feature_screen/code.html',
            'EMERGENCY_MODE': 'emergency_mode_feature_screen/code.html',
            'FAMILY_SHARING': 'family_sharing_feature_screen/code.html',
            'OFFLINE_MODE': 'offline_mode_feature_screen/code.html',
            'PHOTO_VERIFICATION': 'photo_verification_feature_screen/code.html',
            'QUICK_REBOOKING': 'quick_rebooking_feature_screen/code.html',
            'REALTIME_TRACKING': 'real-time_tracking_screen/code.html',
            'SMART_NOTIFICATIONS': 'smart_notifications_feature_screen/code.html',
            'SMART_SEARCH': 'smart_search_screen/code.html',
            'MULTI_LANGUAGE': 'multi-language_support_screen/code.html',
            'REPORT_CONFIRMATION': 'report_confirmation_screen/code.html'
        };

        const Screen = ({ screenKey, onNavigate }) => {
            const [html, setHtml] = useState('');
            const [styles, setStyles] = useState('');
            const [loading, setLoading] = useState(true);
            const containerRef = useRef(null);

            useEffect(() => {
                const fetchContent = async () => {
                    setLoading(true);
                    try {
                        const path = `extracted_code/stitch_cleaners_hub/${SCREEN_MAP[screenKey]}`;
                        const response = await fetch(path);
                        const text = await response.text();

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');

                        // Extract Styles
                        const styleContent = Array.from(doc.querySelectorAll('style'))
                            .map(s => s.innerHTML)
                            .join('\n');
                        setStyles(styleContent);

                        // Extract Body Content
                        let bodyHTML = doc.body.innerHTML;

                        // Auth Mode Patching
                        if (screenKey === 'LOGIN') {
                            const tempDiv = document.createElement('div');
                            tempDiv.innerHTML = bodyHTML;

                            // Hide signup-only fields
                            const nameField = Array.from(tempDiv.querySelectorAll('input')).find(i => i.placeholder?.toLowerCase().includes('name'));
                            const phoneField = Array.from(tempDiv.querySelectorAll('input')).find(i => i.placeholder?.toLowerCase().includes('phone'));
                            if (nameField) nameField.closest('.relative')?.remove();
                            if (phoneField) phoneField.closest('.relative')?.remove();

                            // Remove terms checkbox
                            const terms = Array.from(tempDiv.querySelectorAll('label')).find(l => l.querySelector('input[type="checkbox"]'));
                            if (terms) terms.remove();

                            // Change button text
                            const btn = Array.from(tempDiv.querySelectorAll('button')).find(b => b.innerText.toLowerCase().includes('account') || b.innerText.toLowerCase().includes('sign up'));
                            if (btn) {
                                const span = btn.querySelector('span');
                                if (span) span.innerText = 'Log In';
                                else btn.innerText = 'Log In';
                            }

                            // Update Segmented Control
                            const tabs = tempDiv.querySelectorAll('label');
                            tabs.forEach(tab => {
                                const input = tab.querySelector('input');
                                if (input && input.value === 'login') {
                                    tab.classList.add('bg-primary');
                                    tab.querySelector('span').classList.replace('text-text-subtle', 'text-white');
                                    tab.querySelector('span').classList.add('font-semibold');
                                } else if (input && input.value === 'signup') {
                                    tab.classList.remove('bg-primary');
                                    tab.querySelector('span').classList.replace('text-white', 'text-text-subtle');
                                    tab.querySelector('span').classList.remove('font-semibold');
                                }
                            });

                            bodyHTML = tempDiv.innerHTML;
                        }

                        setHtml(bodyHTML);
                    } catch (error) {
                        console.error('Failed to load screen:', error);
                        setHtml('<div class="p-10 text-center">Failed to load screen.</div>');
                    }
                    setLoading(false);
                };
                fetchContent();
            }, [screenKey]);

            useEffect(() => {
                if (!loading && containerRef.current) {
                    const container = containerRef.current;

                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });

                    const handleGlobalClick = (e) => {
                        // Handle Material Symbols as Back Navigation
                        const icon = e.target.closest('.material-symbols-outlined, .material-icons-round');
                        if (icon && (icon.innerText === 'arrow_back' || icon.innerText === 'chevron_left')) {
                            window.dispatchEvent(new CustomEvent('goBack'));
                            return;
                        }

                        const target = e.target.closest('button, a, [role="button"], label');
                        if (!target) return;

                        const text = target.innerText.trim().toLowerCase().replace(/\s+/g, ' ');

                        // Auth mode switching within the same template
                        if (target.tagName === 'LABEL' && target.querySelector('input[name="auth-mode"]')) {
                            const val = target.querySelector('input').value;
                            if (val === 'login') onNavigate('LOGIN');
                            else onNavigate('SIGNUP');
                            return;
                        }

                        // Navigation Logic Heuristics
                        if (text.includes('sign up') || text.includes('create account')) {
                            if (text.includes('provider')) onNavigate('PROVIDER_WELCOME');
                            else if (screenKey === 'SIGNUP') onNavigate('CLIENT_HOME');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('log in') || text.includes('login') || text.includes('sign in')) {
                            if (text.includes('admin')) onNavigate('ADMIN_LOGIN');
                            else if (screenKey === 'ADMIN_LOGIN') onNavigate('ADMIN_DASHBOARD_1');
                            else if (screenKey === 'LOGIN') onNavigate('CLIENT_HOME');
                            else onNavigate('LOGIN');
                        } else if (text.includes('continue as guest')) {
                            onNavigate('CLIENT_HOME');
                        } else if (text.includes('book now')) {
                            onNavigate('BOOKING');
                        } else if (text.includes('find services') || text.includes('explore')) {
                            onNavigate('FIND_SERVICES');
                        } else if (text.includes('view profile')) {
                            onNavigate('PROVIDER_PROFILE');
                        } else if (text.includes('get started')) {
                            if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('save & continue') || text.includes('complete setup') || text.includes('finish')) {
                            onNavigate('PROVIDER_DASHBOARD_1');
                        } else if (text.includes('home') || target.querySelector('.material-symbols-outlined')?.innerText === 'home') {
                            onNavigate(screenKey.startsWith('ADMIN') ? 'ADMIN_DASHBOARD_1' : screenKey.startsWith('PROVIDER') ? 'PROVIDER_DASHBOARD_1' : 'CLIENT_HOME');
                        } else if (text.includes('bookings') || target.querySelector('.material-symbols-outlined')?.innerText === 'calendar_today' || target.querySelector('.material-symbols-outlined')?.innerText === 'confirmation_number') {
                            onNavigate('MY_BOOKINGS_1');
                        } else if (text.includes('messages') || target.querySelector('.material-symbols-outlined')?.innerText === 'mail' || target.querySelector('.material-symbols-outlined')?.innerText === 'chat_bubble') {
                            onNavigate('MESSAGES');
                        } else if (text.includes('profile') || target.querySelector('.material-symbols-outlined')?.innerText === 'person') {
                            onNavigate('PROFILE');
                        } else if (text.includes('emergency')) {
                            onNavigate('EMERGENCY_MODE');
                        }
                    };

                    container.addEventListener('click', handleGlobalClick);
                    return () => container.removeEventListener('click', handleGlobalClick);
                }
            }, [html, loading, screenKey]);

            return (
                <div className={`h-full flex flex-col ${!loading ? 'animate-slide-in' : ''}`} key={screenKey}>
                    <style dangerouslySetInnerHTML={{ __html: styles }} />
                    {loading ? (
                        <div className="flex-1 flex items-center justify-center">
                            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-[#87CEEB]"></div>
                        </div>
                    ) : (
                        <div
                            ref={containerRef}
                            className="flex-1"
                            dangerouslySetInnerHTML={{ __html: html }}
                        />
                    )}
                </div>
            );
        };

        const App = () => {
            const [history, setHistory] = useState(['WELCOME']);
            const [devMenuOpen, setDevMenuOpen] = useState(false);

            const screen = history[history.length - 1];

            const navigate = (next) => {
                if (next === screen) return;
                setHistory(prev => [...prev, next]);
            };

            const goBack = () => {
                if (history.length > 1) {
                    setHistory(prev => prev.slice(0, -1));
                }
            };

            useEffect(() => {
                const handleExternalNavigate = (e) => {
                    if (SCREEN_MAP[e.detail]) navigate(e.detail);
                };
                window.addEventListener('navigate', handleExternalNavigate);
                window.addEventListener('goBack', goBack);
                return () => {
                    window.removeEventListener('navigate', handleExternalNavigate);
                    window.removeEventListener('goBack', goBack);
                };
            }, [history]);

            return (
                <div className="app-shell">
                    <div className="screen-container">
                        <Screen screenKey={screen} onNavigate={navigate} />
                    </div>

                    <div className="dev-menu-btn" onClick={() => setDevMenuOpen(!devMenuOpen)}>
                        <span className="material-symbols-outlined">menu</span>
                    </div>

                    {devMenuOpen && (
                        <div className="dev-menu">
                            <h3>Main Screens</h3>
                            <button onClick={() => { navigate('WELCOME'); setDevMenuOpen(false); }}>Welcome</button>
                            <button onClick={() => { navigate('SIGNUP'); setDevMenuOpen(false); }}>Signup</button>
                            <button onClick={() => { navigate('LOGIN'); setDevMenuOpen(false); }}>Login</button>

                            <h3>Client Flow</h3>
                            <button onClick={() => { navigate('CLIENT_HOME'); setDevMenuOpen(false); }}>Home</button>
                            <button onClick={() => { navigate('FIND_SERVICES'); setDevMenuOpen(false); }}>Find Services</button>
                            <button onClick={() => { navigate('BOOKING'); setDevMenuOpen(false); }}>Booking</button>
                            <button onClick={() => { navigate('MY_BOOKINGS_1'); setDevMenuOpen(false); }}>My Bookings</button>

                            <h3>Provider Flow</h3>
                            <button onClick={() => { navigate('PROVIDER_WELCOME'); setDevMenuOpen(false); }}>Welcome</button>
                            <button onClick={() => { navigate('PROVIDER_DASHBOARD_1'); setDevMenuOpen(false); }}>Dashboard</button>
                            <button onClick={() => { navigate('PROVIDER_SCHEDULE'); setDevMenuOpen(false); }}>Schedule</button>

                            <h3>Admin Panel</h3>
                            <button onClick={() => { navigate('ADMIN_LOGIN'); setDevMenuOpen(false); }}>Login</button>
                            <button onClick={() => { navigate('ADMIN_DASHBOARD_1'); setDevMenuOpen(false); }}>Dashboard</button>

                            <h3>Features</h3>
                            <button onClick={() => { navigate('EMERGENCY_MODE'); setDevMenuOpen(false); }}>Emergency</button>
                            <button onClick={() => { navigate('REALTIME_TRACKING'); setDevMenuOpen(false); }}>Tracking</button>
                            <button onClick={() => { navigate('EASY_PAYMENTS'); setDevMenuOpen(false); }}>Payments</button>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
