<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner Hub - The Harmony Network</title>
    <!-- Load React, ReactDOM, and Babel from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Material Icons and Symbols -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Montserrat', sans-serif;
            background-color: #f5f5f5;
        }
        #root {
            min-height: 100vh;
        }
        .app-shell {
            max-width: 450px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .screen-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        /* Water Ripple Effect */
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            background-color: rgba(135, 206, 235, 0.4);
            pointer-events: none;
        }
        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Sparkle Animation */
        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            animation: sparkle-fade 0.8s ease-out forwards;
        }
        @keyframes sparkle-fade {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        /* Custom scrollbar */
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: #87CEEB;
            border-radius: 2px;
        }

        /* Floating Action Menu for Demo */
        .dev-menu-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            border-radius: 24px;
            background: #87CEEB;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
            opacity: 0.8;
            transition: all 0.3s;
        }
        .dev-menu-btn:hover {
            opacity: 1;
            transform: scale(1.05);
        }
        .dev-menu {
            position: absolute;
            bottom: 80px;
            right: 20px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            padding: 12px;
            z-index: 1001;
            width: 240px;
            border: 1px solid #e0f2fe;
            max-height: 70vh;
            overflow-y: auto;
        }
        .dev-menu h3 {
            font-size: 10px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 8px 12px 4px;
        }
        .dev-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #334155;
            transition: all 0.2s;
            margin-bottom: 2px;
        }
        .dev-menu button:hover {
            background: #f0f9ff;
            color: #0ea5e9;
            padding-left: 16px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const SCREEN_MAP = {
            'WELCOME': 'welcome_screen/code.html',
            'SIGNUP': 'login/signup_screen/code.html',
            'LOGIN': 'login/signup_screen/code.html',
            'CLIENT_HOME': 'home_screen_(main_dashboard)_for_client_app/code.html',
            'FIND_SERVICES': 'find_services_screen_for_client_app/code.html',
            'PROVIDER_PROFILE': 'service_provider_profile_screen_for_client_app/code.html',
            'BOOKING': 'booking_screen_for_client_app/code.html',
            'MY_BOOKINGS': 'my_bookings_screen_for_client_app_1/code.html',
            'MY_BOOKINGS_2': 'my_bookings_screen_for_client_app_2/code.html',
            'MY_BOOKINGS_3': 'my_bookings_screen_for_client_app_3/code.html',
            'MESSAGES': 'messages_screen_for_client_app/code.html',
            'PROFILE': 'profile_screen_for_client_app/code.html',
            'PROVIDER_WELCOME': 'provider_welcome_screen/code.html',
            'PROVIDER_SETUP': 'provider_setup_screen/code.html',
            'PROVIDER_DASHBOARD': 'provider_dashboard_screen_1/code.html',
            'PROVIDER_DASHBOARD_2': 'provider_dashboard_screen_2/code.html',
            'PROVIDER_SCHEDULE': 'my_schedule_screen_for_provider_app/code.html',
            'PROVIDER_REQUESTS': 'booking_requests_screen_for_provider_app/code.html',
            'PROVIDER_CLIENTS': 'my_clients_screen_for_provider_app_(with_report_feature)/code.html',
            'ADMIN_LOGIN': 'admin_login_screen/code.html',
            'ADMIN_DASHBOARD': 'admin_dashboard_screen_1/code.html',
            'ADMIN_DASHBOARD_2': 'admin_dashboard_screen_2/code.html',
            'ADMIN_DASHBOARD_3': 'admin_dashboard_screen_3/code.html',
            'ADMIN_DASHBOARD_4': 'admin_dashboard_screen_4/code.html',
            'ADMIN_USERS': 'manage_users_screen_for_admin_app/code.html',
            'ADMIN_BOOKINGS': 'manage_bookings_screen_for_admin_app/code.html',
            'ADMIN_SETTINGS': 'app_settings_screen_for_admin_app/code.html',
            'ADMIN_PROFILE_EDIT': 'admin_profile_edit_screen/code.html',
            'EMERGENCY_MODE': 'emergency_mode_feature_screen/code.html',
            'SMART_SEARCH': 'smart_search_screen/code.html',
            'REAL_TIME_TRACKING': 'real-time_tracking_screen/code.html',
            'PHOTO_VERIFICATION': 'photo_verification_feature_screen/code.html',
            'EASY_PAYMENTS': 'easy_payments_feature_screen/code.html',
            'SMART_NOTIFICATIONS': 'smart_notifications_feature_screen/code.html',
            'FAMILY_SHARING': 'family_sharing_feature_screen/code.html',
            'MULTI_LANGUAGE': 'multi-language_support_screen/code.html',
            'OFFLINE_MODE': 'offline_mode_feature_screen/code.html',
            'QUICK_REBOOKING': 'quick_rebooking_feature_screen/code.html',
            'REPORT_PROVIDER': 'report_provider_screen_for_client_app/code.html',
            'REPORT_CLIENT': 'report_client_screen_for_provider_app/code.html',
            'REPORT_CONFIRMATION': 'report_confirmation_screen/code.html',
            'CLIENT_REPORT_CONFIRMATION': 'client_report_confirmation_screen_(provider_app)_/code.html',
            'CHANNELS': 'channels_screen_(client_app_flow)_/code.html',
            'CHANNEL_MANAGEMENT': 'channel_management_screen_(provider/admin_app)_/code.html',
            'CHANNEL_MEMBER_MANAGEMENT': 'channel_member_management_screen_(provider/admin_app)_/code.html',
            'CREATE_CHANNEL': 'create_new_channel_flow_(provider/admin_app)_/code.html',
            'PROVIDER_PUBLIC_PROFILE': 'provider_profile_(public_view)_screen/code.html'
        };

        const Screen = ({ screenKey, onNavigate, onGoBack }) => {
            const [content, setContent] = useState({ html: '', styles: '' });
            const [loading, setLoading] = useState(true);
            const containerRef = useRef(null);

            useEffect(() => {
                const fetchContent = async () => {
                    setLoading(true);
                    try {
                        const path = `extracted_code/stitch_cleaners_hub/${SCREEN_MAP[screenKey]}`;
                        const response = await fetch(path);
                        const text = await response.text();

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');

                        // Extract and clean styles
                        const styleContent = Array.from(doc.querySelectorAll('style'))
                            .map(s => s.innerHTML)
                            .join('\n');

                        // Extract body and handle scripts
                        const bodyContent = doc.body.innerHTML;

                        setContent({ html: bodyContent, styles: styleContent });
                    } catch (error) {
                        console.error('Failed to load screen:', error);
                        setContent({ html: '<div class="p-10 text-center">Failed to load screen.</div>', styles: '' });
                    }
                    setLoading(false);
                };
                fetchContent();
            }, [screenKey]);

            // Effects for ripples, sparkles, and navigation
            useEffect(() => {
                if (!loading && containerRef.current) {
                    const container = containerRef.current;

                    // Re-inject scripts
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        newScript.setAttribute('data-screen-script', 'true');
                        document.head.appendChild(newScript);
                    });

                    // Add cursor pointer to interactive elements
                    const interactiveEls = container.querySelectorAll('button, a, [role="button"], .grid > div');
                    interactiveEls.forEach(el => el.classList.add('cursor-pointer'));

                    // Auth Mode Patching
                    if (screenKey === 'LOGIN' || screenKey === 'SIGNUP') {
                        const loginTab = container.querySelector('label:has(input[value="login"])');
                        const signupTab = container.querySelector('label:has(input[value="signup"])');
                        const actionBtn = container.querySelector('.mt-8 button span');
                        const headline = container.querySelector('h1');
                        const subtext = container.querySelector('p');
                        const footerLink = container.querySelector('.mt-auto a');
                        const inputs = container.querySelectorAll('input[type="text"], input[type="email"], input[type="tel"]');

                        if (screenKey === 'LOGIN') {
                            if (loginTab) {
                                loginTab.classList.add('bg-primary', 'shadow-sm');
                                loginTab.querySelector('span').classList.replace('text-text-subtle', 'text-white');
                            }
                            if (signupTab) {
                                signupTab.classList.remove('bg-primary', 'shadow-sm');
                                signupTab.querySelector('span').classList.replace('text-white', 'text-text-subtle');
                            }
                            if (actionBtn) actionBtn.innerText = 'Log In';
                            if (headline) headline.innerText = 'Welcome Back';
                            if (subtext) subtext.innerText = 'Log in to continue managing your home';
                            if (footerLink) {
                                footerLink.innerText = 'Sign Up';
                                footerLink.parentElement.firstChild.textContent = "Don't have an account? ";
                            }
                            // Hide extra fields for login
                            if (inputs.length > 2) {
                                inputs[0].closest('.relative').style.display = 'none'; // Name
                                inputs[2].closest('.relative').style.display = 'none'; // Phone
                            }
                        }
                    }

                    const createRipple = (e, target) => {
                        const ripple = document.createElement('span');
                        ripple.classList.add('ripple');
                        const rect = target.getBoundingClientRect();
                        const size = Math.max(rect.width, rect.height);
                        ripple.style.width = ripple.style.height = `${size}px`;
                        ripple.style.left = `${e.clientX - rect.left - size / 2}px`;
                        ripple.style.top = `${e.clientY - rect.top - size / 2}px`;
                        target.appendChild(ripple);
                        setTimeout(() => ripple.remove(), 600);
                    };

                    const createSparkles = (e) => {
                        const colors = ['#87CEEB', '#FFD700', '#FF69B4', '#00FA9A'];
                        for (let i = 0; i < 8; i++) {
                            const sparkle = document.createElement('div');
                            sparkle.classList.add('sparkle');
                            sparkle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                            sparkle.style.left = `${e.clientX}px`;
                            sparkle.style.top = `${e.clientY}px`;
                            sparkle.style.setProperty('--tx', `${(Math.random() - 0.5) * 100}px`);
                            sparkle.style.setProperty('--ty', `${(Math.random() - 0.5) * 100}px`);
                            document.body.appendChild(sparkle);
                            setTimeout(() => sparkle.remove(), 800);
                        }
                    };

                    const handleInteractions = (e) => {
                        const target = e.target.closest('button, a, [role="button"], .grid > div');
                        if (!target) return;

                        // Visual effects
                        if (target.tagName === 'BUTTON' || target.classList.contains('grid')) {
                            createRipple(e, target);
                        }

                        // Normalize text: collapse whitespace and remove newlines
                        const text = target.innerText.replace(/\s+/g, ' ').trim().toLowerCase();
                        const icon = target.querySelector('.material-icons-round, .material-symbols-outlined')?.innerText;

                        // Back navigation - heuristic for arrow_back icon or "back" text
                        if (icon === 'arrow_back' || text === 'back' || (target.tagName === 'BUTTON' && text === 'cancel')) {
                            onGoBack();
                            return;
                        }

                        // Success sparkles on specific actions
                        if (text.includes('confirm') || text.includes('book') || text.includes('save') || text.includes('complete')) {
                            createSparkles(e);
                        }

                        // Navigation Heuristics
                        if (text.includes('sign up') || text.includes('create account')) {
                            if (text.includes('provider')) {
                                if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP');
                                else onNavigate('PROVIDER_WELCOME');
                            }
                            else if (screenKey === 'SIGNUP') onNavigate('CLIENT_HOME');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('log in') || text.includes('login') || text.includes('sign in')) {
                            if (text.includes('admin')) onNavigate('ADMIN_LOGIN');
                            else if (screenKey === 'ADMIN_LOGIN') onNavigate('ADMIN_DASHBOARD');
                            else if (screenKey === 'LOGIN') onNavigate('CLIENT_HOME');
                            else onNavigate('LOGIN');
                        } else if (text.includes('continue as guest')) {
                            onNavigate('CLIENT_HOME');
                        } else if (text.includes('book now')) {
                            onNavigate('BOOKING');
                        } else if (text.includes('find services') || text.includes('explore')) {
                            onNavigate('FIND_SERVICES');
                        } else if (text.includes('view profile')) {
                            onNavigate('PROVIDER_PROFILE');
                        } else if (text.includes('emergency')) {
                            onNavigate('EMERGENCY_MODE');
                        } else if (text.includes('get started')) {
                            if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('save & continue') || text.includes('complete setup')) {
                            onNavigate('PROVIDER_DASHBOARD');
                        } else if (text.includes('home') || icon === 'home') {
                            onNavigate('CLIENT_HOME');
                        } else if (text.includes('bookings') || icon === 'calendar_today' || icon === 'event_note') {
                            onNavigate('MY_BOOKINGS');
                        } else if (text.includes('messages') || icon === 'mail' || icon === 'chat') {
                            onNavigate('MESSAGES');
                        } else if (text.includes('profile') || icon === 'person') {
                            if (screenKey.startsWith('ADMIN')) onNavigate('ADMIN_PROFILE_EDIT');
                            else onNavigate('PROFILE');
                        } else if (text.includes('manage users')) {
                            onNavigate('ADMIN_USERS');
                        } else if (text.includes('manage bookings')) {
                            onNavigate('ADMIN_BOOKINGS');
                        } else if (text.includes('settings') || icon === 'settings') {
                            onNavigate('ADMIN_SETTINGS');
                        }
                    };

                    container.addEventListener('click', handleInteractions);
                    return () => {
                        container.removeEventListener('click', handleInteractions);
                        document.querySelectorAll('[data-screen-script]').forEach(s => s.remove());
                    };
                }
            }, [content, loading, screenKey]);

            return (
                <div className="h-full flex flex-col animate-fade-in">
                    <style dangerouslySetInnerHTML={{ __html: content.styles }} />
                    {loading ? (
                        <div className="flex-1 flex items-center justify-center">
                            <div className="relative">
                                <div className="animate-spin rounded-full h-12 w-12 border-4 border-sky-100 border-t-sky-400"></div>
                                <div className="absolute inset-0 flex items-center justify-center">
                                    <span className="material-symbols-outlined text-sky-400 text-xs animate-pulse">sparkles</span>
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div
                            ref={containerRef}
                            className="flex-1"
                            dangerouslySetInnerHTML={{ __html: content.html }}
                        />
                    )}
                </div>
            );
        };

        const App = () => {
            const [history, setHistory] = useState(['WELCOME']);
            const [devMenuOpen, setDevMenuOpen] = useState(false);

            const currentScreen = useMemo(() => history[history.length - 1], [history]);

            const navigate = (screenKey) => {
                if (SCREEN_MAP[screenKey] && screenKey !== currentScreen) {
                    setHistory(prev => [...prev, screenKey]);
                }
            };

            const goBack = () => {
                if (history.length > 1) {
                    setHistory(prev => prev.slice(0, -1));
                }
            };

            useEffect(() => {
                const handleGlobalBack = (e) => goBack();
                window.addEventListener('goBack', handleGlobalBack);
                return () => window.removeEventListener('goBack', handleGlobalBack);
            }, [history]);

            return (
                <div className="app-shell">
                    <div className="screen-container">
                        <Screen
                            screenKey={currentScreen}
                            onNavigate={navigate}
                            onGoBack={goBack}
                        />
                    </div>

                    {/* Developer Quick Access Menu */}
                    <div className="dev-menu-btn" onClick={() => setDevMenuOpen(!devMenuOpen)}>
                        <span className="material-symbols-outlined">{devMenuOpen ? 'close' : 'terminal'}</span>
                    </div>

                    {devMenuOpen && (
                        <div className="dev-menu">
                            <h3>Client Flow</h3>
                            <button onClick={() => { navigate('WELCOME'); setDevMenuOpen(false); }}>Welcome Screen</button>
                            <button onClick={() => { navigate('CLIENT_HOME'); setDevMenuOpen(false); }}>Client Dashboard</button>
                            <button onClick={() => { navigate('FIND_SERVICES'); setDevMenuOpen(false); }}>Find Services</button>
                            <button onClick={() => { navigate('EMERGENCY_MODE'); setDevMenuOpen(false); }}>Emergency Mode</button>

                            <h3>Provider Flow</h3>
                            <button onClick={() => { navigate('PROVIDER_WELCOME'); setDevMenuOpen(false); }}>Provider Welcome</button>
                            <button onClick={() => { navigate('PROVIDER_DASHBOARD'); setDevMenuOpen(false); }}>Provider Dashboard</button>
                            <button onClick={() => { navigate('PROVIDER_SCHEDULE'); setDevMenuOpen(false); }}>My Schedule</button>

                            <h3>Admin Flow</h3>
                            <button onClick={() => { navigate('ADMIN_LOGIN'); setDevMenuOpen(false); }}>Admin Login</button>
                            <button onClick={() => { navigate('ADMIN_DASHBOARD'); setDevMenuOpen(false); }}>Admin Dashboard</button>
                            <button onClick={() => { navigate('ADMIN_USERS'); setDevMenuOpen(false); }}>Manage Users</button>

                            <div className="mt-4 pt-2 border-t border-gray-100 text-[10px] text-center text-gray-400">
                                History Stack: {history.length} screens
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
