<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner Hub - Home Service Professional Platform</title>
    <!-- Load React, ReactDOM, and Babel from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Material Icons and Symbols -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Montserrat', sans-serif;
            background-color: #f5f5f5;
        }
        #root {
            min-height: 100vh;
        }
        .app-shell {
            max-width: 450px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .screen-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }
        /* Custom scrollbar for a better look */
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 2px;
        }
        .screen-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Floating Action Menu for Demo */
        .dev-menu-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #87CEEB;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .dev-menu-btn:hover {
            opacity: 1;
        }
        .dev-menu {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 10px;
            z-index: 1001;
            width: 200px;
            border: 1px solid #eee;
        }
        .dev-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            transition: background 0.2s;
        }
        .dev-menu button:hover {
            background: #f0f9ff;
            color: #87CEEB;
        }

        /* Slide In Animation */
        @keyframes slideIn {
            from { transform: translateX(20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .animate-slide-in {
            animation: slideIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SCREEN_MAP = {
            'WELCOME': 'welcome_screen/code.html',
            'LOGIN': 'login/signup_screen/code.html',
            'SIGNUP': 'login/signup_screen/code.html',
            'CLIENT_HOME': 'home_screen_(main_dashboard)_for_client_app/code.html',
            'FIND_SERVICES': 'find_services_screen_for_client_app/code.html',
            'PROVIDER_PROFILE': 'service_provider_profile_screen_for_client_app/code.html',
            'BOOKING': 'booking_screen_for_client_app/code.html',
            'MY_BOOKINGS': 'my_bookings_screen_for_client_app_1/code.html',
            'MESSAGES': 'messages_screen_for_client_app/code.html',
            'PROFILE': 'profile_screen_for_client_app/code.html',
            'PROVIDER_WELCOME': 'provider_welcome_screen/code.html',
            'PROVIDER_SETUP': 'provider_setup_screen/code.html',
            'PROVIDER_DASHBOARD': 'provider_dashboard_screen_1/code.html',
            'ADMIN_LOGIN': 'admin_login_screen/code.html',
            'ADMIN_DASHBOARD': 'admin_dashboard_screen_1/code.html',
            'MANAGE_USERS': 'manage_users_screen_for_admin_app/code.html',
            'MANAGE_BOOKINGS': 'manage_bookings_screen_for_admin_app/code.html',
            'ADMIN_SETTINGS': 'app_settings_screen_for_admin_app/code.html',
            'SMART_SEARCH': 'smart_search_screen/code.html',
            'TRACKING': 'real-time_tracking_screen/code.html',
            'PHOTO_VERIFICATION': 'photo_verification_feature_screen/code.html',
            'PAYMENTS': 'easy_payments_feature_screen/code.html',
            'NOTIFICATIONS': 'smart_notifications_feature_screen/code.html',
            'EMERGENCY': 'emergency_mode_feature_screen/code.html',
            'FAMILY_SHARING': 'family_sharing_feature_screen/code.html',
            'LANGUAGES': 'multi-language_support_screen/code.html',
            'OFFLINE': 'offline_mode_feature_screen/code.html',
            'REBOOKING': 'quick_rebooking_feature_screen/code.html',
            'PROVIDER_PUBLIC_PROFILE': 'provider_profile_(public_view)_screen/code.html',
            'PROVIDER_REQUESTS': 'booking_requests_screen_for_provider_app/code.html',
            'PROVIDER_SCHEDULE': 'my_schedule_screen_for_provider_app/code.html',
            'MY_CLIENTS': 'my_clients_screen_for_provider_app_(with_report_feature)/code.html',
            'REPORT_PROVIDER': 'report_provider_screen_for_client_app/code.html',
            'REPORT_CLIENT': 'report_client_screen_for_provider_app/code.html',
            'REPORT_CONFIRMATION': 'report_confirmation_screen/code.html',
            'CHANNELS': 'channels_screen_(client_app_flow)_/code.html'
        };

        const Screen = ({ screenKey, onNavigate }) => {
            const [html, setHtml] = useState('');
            const [loading, setLoading] = useState(true);
            const containerRef = useRef(null);

            useEffect(() => {
                const fetchContent = async () => {
                    setLoading(true);
                    try {
                        const path = `extracted_code/stitch_cleaners_hub/${SCREEN_MAP[screenKey]}`;
                        const response = await fetch(path);
                        const text = await response.text();

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');

                        // Clean up old assets
                        document.querySelectorAll('[data-screen-assets]').forEach(el => el.remove());

                        // Extract and Inject Styles
                        doc.querySelectorAll('style').forEach(style => {
                            const newStyle = document.createElement('style');
                            newStyle.innerHTML = style.innerHTML;
                            newStyle.setAttribute('data-screen-assets', 'true');
                            document.head.appendChild(newStyle);
                        });

                        // Extract and Inject Scripts from Head (like tailwind config)
                        doc.querySelectorAll('head script').forEach(script => {
                            const newScript = document.createElement('script');
                            Array.from(script.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                            newScript.innerHTML = script.innerHTML;
                            newScript.setAttribute('data-screen-assets', 'true');
                            document.head.appendChild(newScript);
                        });

                        // Extract Body Content
                        const bodyContent = doc.body.innerHTML;
                        setHtml(bodyContent);
                    } catch (error) {
                        console.error('Failed to load screen:', error);
                        setHtml('<div class="p-10 text-center">Failed to load screen.</div>');
                    }
                    setLoading(false);
                };
                fetchContent();
            }, [screenKey]);

            // Execute scripts and attach listeners
            useEffect(() => {
                if (!loading && containerRef.current) {
                    const container = containerRef.current;

                    // 1. Manually execute any script tags found in the HTML body
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });

                    // 2. Attach Click Listeners for Navigation
                    const handleGlobalClick = (e) => {
                        const target = e.target.closest('button, a, [role="button"], .cursor-pointer');
                        if (!target) return;

                        const text = target.innerText.replace(/\s+/g, ' ').trim().toLowerCase();
                        const icon = target.querySelector('.material-symbols-outlined, .material-icons-round')?.innerText;

                        // Navigation Logic Heuristics
                        if (text.includes('sign up') || text.includes('create account')) {
                            if (text.includes('provider')) onNavigate('PROVIDER_WELCOME');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('log in') || text.includes('login') || text.includes('sign in')) {
                            if (text.includes('admin')) onNavigate('ADMIN_LOGIN');
                            else if (screenKey === 'ADMIN_LOGIN') onNavigate('ADMIN_DASHBOARD');
                            else if (screenKey === 'WELCOME') onNavigate('LOGIN');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('continue as guest')) {
                            onNavigate('CLIENT_HOME');
                        } else if (text.includes('book now')) {
                            onNavigate('BOOKING');
                        } else if (text.includes('find services') || text.includes('explore') || icon === 'search' || icon === 'grid_view') {
                            onNavigate('FIND_SERVICES');
                        } else if (text.includes('view profile')) {
                            onNavigate('PROVIDER_PROFILE');
                        } else if (text.includes('get started')) {
                            if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('complete setup') || text.includes('finish')) {
                            onNavigate('PROVIDER_DASHBOARD');
                        } else if (text.includes('home') || icon === 'home') {
                            onNavigate('CLIENT_HOME');
                        } else if (text.includes('bookings') || icon === 'calendar_today' || icon === 'confirmation_number') {
                            if (screenKey.includes('PROVIDER')) onNavigate('PROVIDER_REQUESTS');
                            else onNavigate('MY_BOOKINGS');
                        } else if (text.includes('messages') || icon === 'mail' || icon === 'chat_bubble') {
                            onNavigate('MESSAGES');
                        } else if (text.includes('profile') || icon === 'person') {
                            onNavigate('PROFILE');
                        } else if (text.includes('emergency')) {
                            onNavigate('EMERGENCY');
                        } else if (text.includes('tracking')) {
                            onNavigate('TRACKING');
                        } else if (text.includes('payment')) {
                            onNavigate('PAYMENTS');
                        } else if (text.includes('notification')) {
                            onNavigate('NOTIFICATIONS');
                        } else if (text.includes('language')) {
                            onNavigate('LANGUAGES');
                        } else if (text.includes('manage users')) {
                            onNavigate('MANAGE_USERS');
                        } else if (text.includes('manage bookings')) {
                            onNavigate('MANAGE_BOOKINGS');
                        } else if (text.includes('schedule') || icon === 'calendar_month') {
                            onNavigate('PROVIDER_SCHEDULE');
                        }
                    };

                    // 3. Ensure interactive elements have cursor-pointer
                    container.querySelectorAll('button, a, [role="button"]').forEach(el => el.classList.add('cursor-pointer'));

                    container.addEventListener('click', handleGlobalClick);
                    return () => container.removeEventListener('click', handleGlobalClick);
                }
            }, [html, loading, screenKey]);

            // Auth Mode Patching
            useEffect(() => {
                if ((screenKey === 'LOGIN' || screenKey === 'SIGNUP') && !loading && containerRef.current) {
                    const container = containerRef.current;
                    const isLogin = screenKey === 'LOGIN';

                    const fullNameField = container.querySelector('input[placeholder*="Full Name"]')?.closest('.relative');
                    const phoneField = container.querySelector('input[placeholder*="Phone Number"]')?.closest('.relative');
                    const termsLabel = Array.from(container.querySelectorAll('label')).find(l => l.innerText.includes('Terms'));
                    const submitBtn = container.querySelector('button.bg-primary span');

                    if (fullNameField) fullNameField.style.display = isLogin ? 'none' : 'flex';
                    if (phoneField) phoneField.style.display = isLogin ? 'none' : 'flex';
                    if (termsLabel) termsLabel.style.display = isLogin ? 'none' : 'flex';

                    if (submitBtn) submitBtn.innerText = isLogin ? 'Log In' : 'Create Account';

                    // Update Segmented Control UI
                    const loginTab = container.querySelector('input[value="login"]')?.parentElement;
                    const signupTab = container.querySelector('input[value="signup"]')?.parentElement;

                    if (loginTab && signupTab) {
                        const activeClass = 'bg-primary';
                        const inactiveClass = 'bg-background-light'; // or just remove bg-primary

                        if (isLogin) {
                            loginTab.classList.add('bg-primary', 'shadow-sm');
                            loginTab.querySelector('span').className = 'z-10 text-sm font-semibold text-white';

                            signupTab.classList.remove('bg-primary', 'shadow-sm');
                            signupTab.querySelector('span').className = 'z-10 text-sm font-medium text-text-subtle transition-colors';
                        } else {
                            signupTab.classList.add('bg-primary', 'shadow-sm');
                            signupTab.querySelector('span').className = 'z-10 text-sm font-semibold text-white';

                            loginTab.classList.remove('bg-primary', 'shadow-sm');
                            loginTab.querySelector('span').className = 'z-10 text-sm font-medium text-text-subtle transition-colors';
                        }
                    }
                }
            }, [screenKey, html, loading]);

            return (
                <div className={`h-full flex flex-col ${!loading ? 'animate-slide-in' : ''}`}>
                    {loading ? (
                        <div className="flex-1 flex items-center justify-center">
                            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-[#87CEEB]"></div>
                        </div>
                    ) : (
                        <div
                            ref={containerRef}
                            className="flex-1"
                            dangerouslySetInnerHTML={{ __html: html }}
                        />
                    )}
                </div>
            );
        };

        const App = () => {
            const [history, setHistory] = useState(['WELCOME']);
            const [devMenuOpen, setDevMenuOpen] = useState(false);

            const screen = history[history.length - 1];

            const navigate = (newScreen) => {
                if (newScreen === screen) return;
                setHistory(prev => [...prev, newScreen]);
            };

            const goBack = () => {
                if (history.length > 1) {
                    setHistory(prev => prev.slice(0, -1));
                }
            };

            useEffect(() => {
                const handleExternalNavigate = (e) => {
                    if (SCREEN_MAP[e.detail]) navigate(e.detail);
                };
                window.addEventListener('navigate', handleExternalNavigate);
                return () => window.removeEventListener('navigate', handleExternalNavigate);
            }, [screen]);

            return (
                <div className="app-shell">
                    {/* Floating Back Button */}
                    {history.length > 1 && (
                        <div
                            className="absolute top-12 left-6 z-[60] bg-white/80 backdrop-blur rounded-full p-2 shadow-lg cursor-pointer hover:bg-white transition-all active:scale-90 flex items-center justify-center border border-gray-100"
                            onClick={goBack}
                        >
                            <span className="material-symbols-outlined block text-slate-800 text-[20px]">arrow_back</span>
                        </div>
                    )}

                    <div className="screen-container">
                        <Screen screenKey={screen} onNavigate={navigate} />
                    </div>

                    {/* Quick Access Dev Menu */}
                    <div className="dev-menu-btn" onClick={() => setDevMenuOpen(!devMenuOpen)}>
                        <span className="material-symbols-outlined">menu</span>
                    </div>

                    {devMenuOpen && (
                        <div className="dev-menu">
                            <div className="text-[10px] font-bold text-gray-400 mb-2 px-3 uppercase tracking-wider">Switch Flow</div>
                            <button onClick={() => { navigate('WELCOME'); setDevMenuOpen(false); }}>Welcome Screen</button>
                            <button onClick={() => { navigate('CLIENT_HOME'); setDevMenuOpen(false); }}>Client App</button>
                            <button onClick={() => { navigate('PROVIDER_WELCOME'); setDevMenuOpen(false); }}>Provider App</button>
                            <button onClick={() => { navigate('ADMIN_LOGIN'); setDevMenuOpen(false); }}>Admin Panel</button>
                            <div className="mt-2 pt-2 border-t border-gray-100 text-[9px] text-center text-gray-400">
                                Prototype Navigation Control
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
