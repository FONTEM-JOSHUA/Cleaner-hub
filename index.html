<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner Hub - Home Service Professional Platform</title>
    <!-- Load React, ReactDOM (Production) and Babel (v7) from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#87CEEB',
                        'primary-dark': '#6FB3D9',
                    }
                }
            }
        }
    </script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Material Icons and Symbols -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Montserrat', sans-serif;
            background-color: #f5f5f5;
            height: 100vh;
            overflow: hidden;
        }
        #root {
            height: 100%;
        }
        .app-shell {
            max-width: 450px;
            margin: 0 auto;
            height: 100vh;
            background-color: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .screen-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes slideIn {
            from { transform: translateX(20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .slide-in {
            animation: slideIn 0.3s ease-out forwards;
        }

        /* Custom scrollbar */
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 2px;
        }

        /* Floating Action Menu for Demo */
        .dev-menu-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #87CEEB;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .dev-menu-btn:hover {
            opacity: 1;
        }
        .dev-menu {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 10px;
            z-index: 1001;
            width: 260px;
            max-height: 500px;
            overflow-y: auto;
            border: 1px solid #eee;
        }
        .dev-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #333;
            transition: background 0.2s;
        }
        .dev-menu button:hover {
            background: #f0f9ff;
            color: #87CEEB;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const SCREEN_MAP = {
            'WELCOME': 'welcome_screen/code.html',
            'SIGNUP': 'login/signup_screen/code.html',
            'LOGIN': 'login/signup_screen/code.html',
            'CLIENT_HOME': 'home_screen_(main_dashboard)_for_client_app/code.html',
            'HOME': 'home_screen_(main_dashboard)_for_client_app/code.html',
            'FIND_SERVICES': 'find_services_screen_for_client_app/code.html',
            'PROVIDER_PROFILE': 'service_provider_profile_screen_for_client_app/code.html',
            'BOOKING': 'booking_screen_for_client_app/code.html',
            'MY_BOOKINGS': 'my_bookings_screen_for_client_app_1/code.html',
            'MESSAGES': 'messages_screen_for_client_app/code.html',
            'PROFILE': 'profile_screen_for_client_app/code.html',
            'CHANNELS': 'channels_screen_(client_app_flow)_/code.html',
            'SMART_SEARCH': 'smart_search_screen/code.html',
            'REPORT_PROVIDER': 'report_provider_screen_for_client_app/code.html',
            'REPORT_CONFIRMATION': 'report_confirmation_screen/code.html',

            'PROVIDER_WELCOME': 'provider_welcome_screen/code.html',
            'PROVIDER_SETUP': 'provider_setup_screen/code.html',
            'PROVIDER_DASHBOARD': 'provider_dashboard_screen_1/code.html',
            'PROVIDER_SCHEDULE': 'my_schedule_screen_for_provider_app/code.html',
            'PROVIDER_REQUESTS': 'booking_requests_screen_for_provider_app/code.html',
            'PROVIDER_CLIENTS': 'my_clients_screen_for_provider_app_(with_report_feature)/code.html',
            'PROVIDER_REPORT_CLIENT': 'report_client_screen_for_provider_app/code.html',
            'PROVIDER_REPORT_CONFIRM': 'client_report_confirmation_screen_(provider_app)_/code.html',
            'PROVIDER_PUBLIC_PROFILE': 'provider_profile_(public_view)_screen/code.html',

            'ADMIN_LOGIN': 'admin_login_screen/code.html',
            'ADMIN_DASHBOARD': 'admin_dashboard_screen_1/code.html',
            'ADMIN_MANAGE_USERS': 'manage_users_screen_for_admin_app/code.html',
            'ADMIN_MANAGE_BOOKINGS': 'manage_bookings_screen_for_admin_app/code.html',
            'ADMIN_SETTINGS': 'app_settings_screen_for_admin_app/code.html',
            'ADMIN_PROFILE_EDIT': 'admin_profile_edit_screen/code.html',

            'FEATURE_EASY_PAYMENTS': 'easy_payments_feature_screen/code.html',
            'FEATURE_EMERGENCY_MODE': 'emergency_mode_feature_screen/code.html',
            'FEATURE_FAMILY_SHARING': 'family_sharing_feature_screen/code.html',
            'FEATURE_OFFLINE_MODE': 'offline_mode_feature_screen/code.html',
            'FEATURE_PHOTO_VERIFICATION': 'photo_verification_feature_screen/code.html',
            'FEATURE_QUICK_REBOOKING': 'quick_rebooking_feature_screen/code.html',
            'FEATURE_REAL_TIME_TRACKING': 'real-time_tracking_screen/code.html',
            'FEATURE_SMART_NOTIFICATIONS': 'smart_notifications_feature_screen/code.html',
            'FEATURE_MULTI_LANGUAGE': 'multi-language_support_screen/code.html',

            'CHANNEL_MGMT': 'channel_management_screen_(provider/admin_app)_/code.html',
            'CHANNEL_MEMBER_MGMT': 'channel_member_management_screen_(provider/admin_app)_/code.html',
            'CREATE_CHANNEL': 'create_new_channel_flow_(provider/admin_app)_/code.html',
        };

        const resolveNavigation = (text, icon, currentScreen, target) => {
            const label = text.toLowerCase().replace(/\s+/g, ' ');

            // Special handling for Auth Mode tabs
            if (target && target.tagName === 'LABEL' && target.querySelector('input[name="auth-mode"]')) {
                const val = target.querySelector('input').value;
                return val === 'login' ? 'LOGIN' : 'SIGNUP';
            }

            // Special handling for Auth Mode footer links
            if (target && target.tagName === 'A' && (currentScreen === 'LOGIN' || currentScreen === 'SIGNUP')) {
                if (label.includes('login') || label.includes('sign in')) return 'LOGIN';
                if (label.includes('sign up') || label.includes('create account')) return 'SIGNUP';
            }

            // Icon-based navigation
            if (icon) {
                if (['arrow_back', 'chevron_left', 'arrow_back_ios'].includes(icon)) return 'BACK';
                if (icon === 'home') {
                    if (currentScreen.startsWith('ADMIN')) return 'ADMIN_DASHBOARD';
                    if (currentScreen.startsWith('PROVIDER')) return 'PROVIDER_DASHBOARD';
                    return 'CLIENT_HOME';
                }
                if (icon === 'calendar_today' || icon === 'calendar_month' || icon === 'event_note') {
                    if (currentScreen.startsWith('ADMIN')) return 'ADMIN_MANAGE_BOOKINGS';
                    return 'MY_BOOKINGS';
                }
                if (icon === 'mail' || icon === 'chat_bubble') return 'MESSAGES';
                if (icon === 'person') {
                    if (currentScreen.startsWith('ADMIN')) return 'ADMIN_PROFILE_EDIT';
                    if (currentScreen.startsWith('PROVIDER')) return 'PROVIDER_PUBLIC_PROFILE';
                    return 'PROFILE';
                }
                if (icon === 'search') return 'FIND_SERVICES';
                if (icon === 'settings') return currentScreen.startsWith('ADMIN') ? 'ADMIN_SETTINGS' : 'PROFILE';
                if (icon === 'groups') return 'CHANNEL_MGMT';
            }

            // Text-based navigation
            if (label.includes('find services') || label.includes('explore') || label.includes('browse categories')) return 'FIND_SERVICES';
            if (label.includes('sign up') || label.includes('create account')) {
                if (label.includes('as provider')) return currentScreen === 'PROVIDER_WELCOME' ? 'PROVIDER_SETUP' : 'PROVIDER_WELCOME';
                // If it's a primary button on LOGIN/SIGNUP, it's a "submit" which means go home
                if (target && target.tagName === 'BUTTON' && (currentScreen === 'LOGIN' || currentScreen === 'SIGNUP')) return 'CLIENT_HOME';
                return 'SIGNUP';
            }
            if (label.includes('log in') || label.includes('login') || label.includes('sign in')) {
                if (label.includes('admin')) return 'ADMIN_LOGIN';
                if (currentScreen === 'ADMIN_LOGIN') return 'ADMIN_DASHBOARD';
                if (currentScreen === 'WELCOME') return 'LOGIN';
                // If it's a primary button on LOGIN/SIGNUP, it's a "submit"
                if (target && target.tagName === 'BUTTON' && (currentScreen === 'LOGIN' || currentScreen === 'SIGNUP')) return 'CLIENT_HOME';
                return 'LOGIN';
            }
            if (label.includes('continue as guest')) return 'CLIENT_HOME';
            if (label.includes('book now')) return 'BOOKING';
            if (label.includes('view profile')) return 'PROVIDER_PROFILE';
            if (label.includes('get started')) return currentScreen === 'PROVIDER_WELCOME' ? 'PROVIDER_SETUP' : 'SIGNUP';
            if (label.includes('complete setup') || label.includes('finish') || label.includes('save & continue')) return 'PROVIDER_DASHBOARD';

            if (label === 'home') {
                if (currentScreen.startsWith('ADMIN')) return 'ADMIN_DASHBOARD';
                if (currentScreen.startsWith('PROVIDER')) return 'PROVIDER_DASHBOARD';
                return 'CLIENT_HOME';
            }
            if (label.includes('bookings')) return currentScreen.startsWith('ADMIN') ? 'ADMIN_MANAGE_BOOKINGS' : 'MY_BOOKINGS';
            if (label.includes('messages')) return 'MESSAGES';
            if (label.includes('profile')) return currentScreen.startsWith('ADMIN') ? 'ADMIN_PROFILE_EDIT' : 'PROFILE';

            // Feature-specific
            if (label.includes('emergency clean')) return 'FEATURE_EMERGENCY_MODE';
            if (label.includes('event help')) return 'FIND_SERVICES';
            if (label.includes('subscribe')) return 'FEATURE_SMART_NOTIFICATIONS';
            if (label.includes('channels')) return (currentScreen.startsWith('PROVIDER') || currentScreen.startsWith('ADMIN')) ? 'CHANNEL_MGMT' : 'CHANNELS';

            // Provider dashboard items
            if (label.includes('schedule')) return 'PROVIDER_SCHEDULE';
            if (label.includes('requests')) return 'PROVIDER_REQUESTS';
            if (label.includes('clients')) return 'PROVIDER_CLIENTS';

            // Admin items
            if (label.includes('manage users')) return 'ADMIN_MANAGE_USERS';
            if (label.includes('manage bookings')) return 'ADMIN_MANAGE_BOOKINGS';
            if (label.includes('settings')) return 'ADMIN_SETTINGS';

            return null;
        };

        const Screen = ({ screenKey, onNavigate }) => {
            const [content, setContent] = useState({ html: '', styles: [], links: [], bodyClass: '' });
            const [loading, setLoading] = useState(true);
            const containerRef = useRef(null);
            const currentKeyRef = useRef(screenKey);
            const injectedScriptsRef = useRef([]);

            useEffect(() => {
                currentKeyRef.current = screenKey;
            }, [screenKey]);

            const cleanupScripts = useCallback(() => {
                injectedScriptsRef.current.forEach(script => {
                    if (script.parentNode) script.parentNode.removeChild(script);
                });
                injectedScriptsRef.current = [];
            }, []);

            useEffect(() => {
                const fetchContent = async () => {
                    setLoading(true);
                    try {
                        const path = `extracted_code/stitch_cleaners_hub/${SCREEN_MAP[screenKey]}`;
                        const response = await fetch(path);
                        const text = await response.text();

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');

                        // Extract Styles
                        const styles = Array.from(doc.querySelectorAll('style')).map(s => s.innerHTML);
                        const links = Array.from(doc.querySelectorAll('link[rel="stylesheet"]')).map(l => l.href);

                        // Auth Mode Patching
                        if (screenKey === 'LOGIN' || screenKey === 'SIGNUP') {
                            const isLogin = screenKey === 'LOGIN';

                            // Toggle tabs - looking for input[name="auth-mode"]
                            const tabs = doc.querySelectorAll('label');
                            tabs.forEach(tab => {
                                const input = tab.querySelector('input[name="auth-mode"]');
                                if (input) {
                                    const mode = input.value;
                                    const isActive = (isLogin && mode === 'login') || (!isLogin && mode === 'signup');
                                    if (isActive) {
                                        tab.classList.add('bg-primary');
                                        // Remove any other bg- classes that might interfere
                                        tab.className = tab.className.replace(/bg-\S+/g, '').trim() + ' bg-primary';
                                        const span = tab.querySelector('span');
                                        if (span) {
                                            span.classList.remove('text-text-subtle', 'dark:text-gray-400');
                                            span.classList.add('text-white', 'font-semibold');
                                        }
                                        input.checked = true;
                                    } else {
                                        tab.classList.remove('bg-primary');
                                        const span = tab.querySelector('span');
                                        if (span) {
                                            span.classList.add('text-text-subtle', 'dark:text-gray-400');
                                            span.classList.remove('text-white', 'font-semibold');
                                        }
                                        input.checked = false;
                                    }
                                }
                            });

                            // Toggle visibility of fields
                            const fields = doc.querySelectorAll('.relative');
                            fields.forEach(field => {
                                const input = field.querySelector('input');
                                if (input) {
                                    const placeholder = input.placeholder.toLowerCase();
                                    if (isLogin && (placeholder.includes('name') || placeholder.includes('phone'))) {
                                        field.style.display = 'none';
                                    } else {
                                        field.style.display = 'block';
                                    }
                                }
                            });

                            // Toggle TOS
                            const tos = doc.querySelector('label.flex.items-start');
                            if (tos) tos.style.display = isLogin ? 'none' : 'flex';

                            // Update button text
                            const btn = doc.querySelector('button.bg-primary span');
                            if (btn) btn.innerText = isLogin ? 'Log In' : 'Create Account';

                            // Update footer
                            const footer = doc.querySelector('.mt-auto.pt-6 p');
                            if (footer) {
                                footer.innerHTML = isLogin ?
                                    'Don\'t have an account? <a class="font-semibold text-primary hover:text-primary-dark transition-colors" href="#">Sign Up</a>' :
                                    'Already have an account? <a class="font-semibold text-primary hover:text-primary-dark transition-colors" href="#">Login</a>';
                            }
                        }

                        setContent({
                            html: doc.body.innerHTML,
                            styles,
                            links,
                            bodyClass: doc.body.className
                        });
                    } catch (error) {
                        console.error('Failed to load screen:', error);
                        setContent(prev => ({ ...prev, html: '<div class="p-10 text-center">Failed to load screen.</div>' }));
                    }
                    setLoading(false);
                };
                fetchContent();
            }, [screenKey]);

            useEffect(() => {
                if (!loading && containerRef.current) {
                    const container = containerRef.current;
                    cleanupScripts();

                    // Execute scripts
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.text = oldScript.text;
                        document.head.appendChild(newScript);
                        injectedScriptsRef.current.push(newScript);
                    });

                    const handleGlobalClick = (e) => {
                        // Check for Back icon first
                        const iconEl = e.target.closest('.material-symbols-outlined, .material-icons-round');
                        const iconText = iconEl ? iconEl.innerText.trim() : null;

                        // Check for Button/Link
                        const target = e.target.closest('button, a, [role="button"], label, .cursor-pointer');
                        if (!target) return;

                        const text = target.innerText.trim();
                        const nextScreen = resolveNavigation(text, iconText, currentKeyRef.current, target);

                        if (nextScreen === 'BACK') {
                            window.dispatchEvent(new CustomEvent('goBack'));
                        } else if (nextScreen) {
                            onNavigate(nextScreen);
                        }
                    };

                    container.addEventListener('click', handleGlobalClick);
                    return () => {
                        container.removeEventListener('click', handleGlobalClick);
                        cleanupScripts();
                    };
                }
            }, [content.html, loading, onNavigate, cleanupScripts]);

            return (
                <div className={`h-full flex flex-col slide-in ${content.bodyClass}`}>
                    {content.links.map((href, i) => <link key={i} rel="stylesheet" href={href} />)}
                    {content.styles.map((css, i) => <style key={i} dangerouslySetInnerHTML={{ __html: css }} />)}
                    {loading ? (
                        <div className="flex-1 flex items-center justify-center">
                            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-[#87CEEB]"></div>
                        </div>
                    ) : (
                        <div
                            ref={containerRef}
                            className="flex-1"
                            dangerouslySetInnerHTML={{ __html: content.html }}
                        />
                    )}
                </div>
            );
        };

        const App = () => {
            const [history, setHistory] = useState(['WELCOME']);
            const [devMenuOpen, setDevMenuOpen] = useState(false);

            const currentScreen = history[history.length - 1];

            const navigate = useCallback((newScreen) => {
                if (SCREEN_MAP[newScreen]) {
                    setHistory(prev => {
                        if (prev[prev.length - 1] === newScreen) return prev;
                        return [...prev, newScreen];
                    });
                }
            }, []);

            const goBack = useCallback(() => {
                setHistory(prev => (prev.length > 1 ? prev.slice(0, -1) : prev));
            }, []);

            useEffect(() => {
                const handleExternalNavigate = (e) => navigate(e.detail);
                const handleGoBack = () => goBack();
                window.addEventListener('navigate', handleExternalNavigate);
                window.addEventListener('goBack', handleGoBack);
                return () => {
                    window.removeEventListener('navigate', handleExternalNavigate);
                    window.removeEventListener('goBack', handleGoBack);
                };
            }, [navigate, goBack]);

            return (
                <div className="app-shell">
                    <div className="screen-container" key={history.length}>
                        <Screen screenKey={currentScreen} onNavigate={navigate} />
                    </div>

                    <div className="dev-menu-btn" role="button" onClick={() => setDevMenuOpen(!devMenuOpen)}>
                        <span className="material-symbols-outlined">menu</span>
                    </div>

                    {devMenuOpen && (
                        <div className="dev-menu">
                            <div className="text-[10px] font-bold text-gray-400 mb-2 px-3 uppercase tracking-wider">Main Flows</div>
                            <button onClick={() => { navigate('WELCOME'); setDevMenuOpen(false); }}>Welcome Screen</button>
                            <button onClick={() => { navigate('LOGIN'); setDevMenuOpen(false); }}>Login Mode</button>
                            <button onClick={() => { navigate('SIGNUP'); setDevMenuOpen(false); }}>Signup Mode</button>

                            <div className="text-[10px] font-bold text-gray-400 mt-3 mb-2 px-3 uppercase tracking-wider">Client Journey</div>
                            <button onClick={() => { navigate('CLIENT_HOME'); setDevMenuOpen(false); }}>Client Dashboard</button>
                            <button onClick={() => { navigate('FIND_SERVICES'); setDevMenuOpen(false); }}>Find Services</button>
                            <button onClick={() => { navigate('PROVIDER_PROFILE'); setDevMenuOpen(false); }}>Provider Detail View</button>
                            <button onClick={() => { navigate('BOOKING'); setDevMenuOpen(false); }}>Booking Form</button>
                            <button onClick={() => { navigate('MY_BOOKINGS'); setDevMenuOpen(false); }}>Client Bookings</button>
                            <button onClick={() => { navigate('PROFILE'); setDevMenuOpen(false); }}>Client Profile</button>
                            <button onClick={() => { navigate('CHANNELS'); setDevMenuOpen(false); }}>Social Channels</button>

                            <div className="text-[10px] font-bold text-gray-400 mt-3 mb-2 px-3 uppercase tracking-wider">Provider Journey</div>
                            <button onClick={() => { navigate('PROVIDER_WELCOME'); setDevMenuOpen(false); }}>Provider Onboarding</button>
                            <button onClick={() => { navigate('PROVIDER_SETUP'); setDevMenuOpen(false); }}>Business Setup</button>
                            <button onClick={() => { navigate('PROVIDER_DASHBOARD'); setDevMenuOpen(false); }}>Provider Dashboard</button>
                            <button onClick={() => { navigate('PROVIDER_SCHEDULE'); setDevMenuOpen(false); }}>My Calendar</button>
                            <button onClick={() => { navigate('PROVIDER_REQUESTS'); setDevMenuOpen(false); }}>Booking Requests</button>
                            <button onClick={() => { navigate('PROVIDER_CLIENTS'); setDevMenuOpen(false); }}>Client List</button>

                            <div className="text-[10px] font-bold text-gray-400 mt-3 mb-2 px-3 uppercase tracking-wider">Admin Panel</div>
                            <button onClick={() => { navigate('ADMIN_LOGIN'); setDevMenuOpen(false); }}>Admin Auth</button>
                            <button onClick={() => { navigate('ADMIN_DASHBOARD'); setDevMenuOpen(false); }}>Platform Metrics</button>
                            <button onClick={() => { navigate('ADMIN_MANAGE_USERS'); setDevMenuOpen(false); }}>User Management</button>
                            <button onClick={() => { navigate('ADMIN_MANAGE_BOOKINGS'); setDevMenuOpen(false); }}>Booking Overviews</button>
                            <button onClick={() => { navigate('ADMIN_SETTINGS'); setDevMenuOpen(false); }}>System Config</button>

                            <div className="text-[10px] font-bold text-gray-400 mt-3 mb-2 px-3 uppercase tracking-wider">Feature Showcase</div>
                            <button onClick={() => { navigate('FEATURE_EMERGENCY_MODE'); setDevMenuOpen(false); }}>Emergency Mode</button>
                            <button onClick={() => { navigate('FEATURE_REAL_TIME_TRACKING'); setDevMenuOpen(false); }}>Live Tracking</button>
                            <button onClick={() => { navigate('FEATURE_PHOTO_VERIFICATION'); setDevMenuOpen(false); }}>Photo Verification</button>
                            <button onClick={() => { navigate('FEATURE_SMART_NOTIFICATIONS'); setDevMenuOpen(false); }}>Smart Alerts</button>

                            <div className="mt-2 pt-2 border-t border-gray-100 text-[9px] text-center text-gray-400 italic">
                                Cleaner Hub Prototype v1.1
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
