<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner Hub - Home Service Professional Platform</title>
    <!-- Load React, ReactDOM, and Babel from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Material Icons and Symbols -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Montserrat', sans-serif;
            background-color: #f5f5f5;
        }
        #root {
            min-height: 100vh;
        }
        .app-shell {
            max-width: 450px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .screen-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }
        /* Custom scrollbar for a better look */
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 2px;
        }
        .screen-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Ripple Effect */
        .ripple {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: ripple-animation 0.6s linear;
        }
        @keyframes ripple-animation {
            from { width: 0; height: 0; opacity: 0.5; }
            to { width: 400px; height: 400px; opacity: 0; }
        }

        /* Sparkle Animation */
        .sparkle {
            position: absolute;
            pointer-events: none;
            z-index: 9999;
            animation: sparkle-fade 0.8s ease-out forwards;
        }
        @keyframes sparkle-fade {
            0% { transform: scale(0) rotate(0deg); opacity: 1; }
            100% { transform: scale(1.5) rotate(180deg); opacity: 0; }
        }

        /* Fade Transition */
        .screen-fade-enter {
            opacity: 0;
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Floating Action Menu for Demo */
        .dev-menu-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #87CEEB;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .dev-menu-btn:hover {
            opacity: 1;
        }
        .dev-menu {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 10px;
            z-index: 1001;
            width: 200px;
            border: 1px solid #eee;
        }
        .dev-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            transition: background 0.2s;
        }
        .dev-menu button:hover {
            background: #f0f9ff;
            color: #87CEEB;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SCREEN_MAP = {
            'WELCOME': 'extracted_code/stitch_cleaners_hub/welcome_screen/code.html',
            'SIGNUP': 'extracted_code/stitch_cleaners_hub/login/signup_screen/code.html',
            'LOGIN': 'extracted_code/stitch_cleaners_hub/login/signup_screen/code.html',
            'CLIENT_HOME': 'extracted_code/stitch_cleaners_hub/home_screen_(main_dashboard)_for_client_app/code.html',
            'FIND_SERVICES': 'extracted_code/stitch_cleaners_hub/find_services_screen_for_client_app/code.html',
            'PROVIDER_PROFILE': 'extracted_code/stitch_cleaners_hub/service_provider_profile_screen_for_client_app/code.html',
            'BOOKING': 'extracted_code/stitch_cleaners_hub/booking_screen_for_client_app/code.html',
            'MY_BOOKINGS': 'extracted_code/stitch_cleaners_hub/my_bookings_screen_for_client_app_1/code.html',
            'MY_BOOKINGS_2': 'extracted_code/stitch_cleaners_hub/my_bookings_screen_for_client_app_2/code.html',
            'MY_BOOKINGS_3': 'extracted_code/stitch_cleaners_hub/my_bookings_screen_for_client_app_3/code.html',
            'MESSAGES': 'extracted_code/stitch_cleaners_hub/messages_screen_for_client_app/code.html',
            'PROFILE': 'extracted_code/stitch_cleaners_hub/profile_screen_for_client_app/code.html',
            'CLIENT_CHANNELS': 'extracted_code/stitch_cleaners_hub/channels_screen_(client_app_flow)_/code.html',
            'CLIENT_REPORT_PROVIDER': 'extracted_code/stitch_cleaners_hub/report_provider_screen_for_client_app/code.html',

            'PROVIDER_WELCOME': 'extracted_code/stitch_cleaners_hub/provider_welcome_screen/code.html',
            'PROVIDER_SETUP': 'extracted_code/stitch_cleaners_hub/provider_setup_screen/code.html',
            'PROVIDER_DASHBOARD': 'extracted_code/stitch_cleaners_hub/provider_dashboard_screen_1/code.html',
            'PROVIDER_DASHBOARD_2': 'extracted_code/stitch_cleaners_hub/provider_dashboard_screen_2/code.html',
            'PROVIDER_BOOKING_REQUESTS': 'extracted_code/stitch_cleaners_hub/booking_requests_screen_for_provider_app/code.html',
            'PROVIDER_MY_SCHEDULE': 'extracted_code/stitch_cleaners_hub/my_schedule_screen_for_provider_app/code.html',
            'PROVIDER_MY_CLIENTS': 'extracted_code/stitch_cleaners_hub/my_clients_screen_for_provider_app_(with_report_feature)/code.html',
            'PROVIDER_PROFILE_PUBLIC': 'extracted_code/stitch_cleaners_hub/provider_profile_(public_view)_screen/code.html',
            'PROVIDER_REPORT_CLIENT': 'extracted_code/stitch_cleaners_hub/report_client_screen_for_provider_app/code.html',
            'PROVIDER_CLIENT_REPORT_CONFIRM': 'extracted_code/stitch_cleaners_hub/client_report_confirmation_screen_(provider_app)_/code.html',
            'PROVIDER_CHANNEL_MGMT': 'extracted_code/stitch_cleaners_hub/channel_management_screen_(provider/admin_app)_/code.html',
            'PROVIDER_CHANNEL_MEMBER_MGMT': 'extracted_code/stitch_cleaners_hub/channel_member_management_screen_(provider/admin_app)_/code.html',
            'PROVIDER_CREATE_CHANNEL': 'extracted_code/stitch_cleaners_hub/create_new_channel_flow_(provider/admin_app)_/code.html',

            'ADMIN_LOGIN': 'extracted_code/stitch_cleaners_hub/admin_login_screen/code.html',
            'ADMIN_DASHBOARD': 'extracted_code/stitch_cleaners_hub/admin_dashboard_screen_1/code.html',
            'ADMIN_DASHBOARD_2': 'extracted_code/stitch_cleaners_hub/admin_dashboard_screen_2/code.html',
            'ADMIN_DASHBOARD_3': 'extracted_code/stitch_cleaners_hub/admin_dashboard_screen_3/code.html',
            'ADMIN_DASHBOARD_4': 'extracted_code/stitch_cleaners_hub/admin_dashboard_screen_4/code.html',
            'ADMIN_PROFILE_EDIT': 'extracted_code/stitch_cleaners_hub/admin_profile_edit_screen/code.html',
            'ADMIN_APP_SETTINGS': 'extracted_code/stitch_cleaners_hub/app_settings_screen_for_admin_app/code.html',
            'ADMIN_MANAGE_BOOKINGS': 'extracted_code/stitch_cleaners_hub/manage_bookings_screen_for_admin_app/code.html',
            'ADMIN_MANAGE_USERS': 'extracted_code/stitch_cleaners_hub/manage_users_screen_for_admin_app/code.html',

            'FEATURE_EASY_PAYMENTS': 'extracted_code/stitch_cleaners_hub/easy_payments_feature_screen/code.html',
            'FEATURE_EMERGENCY_MODE': 'extracted_code/stitch_cleaners_hub/emergency_mode_feature_screen/code.html',
            'FEATURE_FAMILY_SHARING': 'extracted_code/stitch_cleaners_hub/family_sharing_feature_screen/code.html',
            'FEATURE_MULTI_LANGUAGE': 'extracted_code/stitch_cleaners_hub/multi-language_support_screen/code.html',
            'FEATURE_OFFLINE_MODE': 'extracted_code/stitch_cleaners_hub/offline_mode_feature_screen/code.html',
            'FEATURE_PHOTO_VERIFICATION': 'extracted_code/stitch_cleaners_hub/photo_verification_feature_screen/code.html',
            'FEATURE_QUICK_REBOOKING': 'extracted_code/stitch_cleaners_hub/quick_rebooking_feature_screen/code.html',
            'FEATURE_REALTIME_TRACKING': 'extracted_code/stitch_cleaners_hub/real-time_tracking_screen/code.html',
            'FEATURE_SMART_NOTIFICATIONS': 'extracted_code/stitch_cleaners_hub/smart_notifications_feature_screen/code.html',
            'FEATURE_SMART_SEARCH': 'extracted_code/stitch_cleaners_hub/smart_search_screen/code.html',
            'REPORT_CONFIRMATION': 'extracted_code/stitch_cleaners_hub/report_confirmation_screen/code.html'
        };

        const Screen = ({ screenKey, onNavigate }) => {
            const [html, setHtml] = useState('');
            const [styles, setStyles] = useState('');
            const [loading, setLoading] = useState(true);
            const containerRef = useRef(null);

            useEffect(() => {
                const fetchContent = async () => {
                    setLoading(true);
                    try {
                        const path = SCREEN_MAP[screenKey];
                        const response = await fetch(path);
                        const text = await response.text();

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');

                        // Cleanup previous screen assets
                        document.querySelectorAll('[data-screen-assets]').forEach(el => el.remove());

                        // Extract and Inject Styles
                        Array.from(doc.querySelectorAll('style')).forEach(style => {
                            const newStyle = document.createElement('style');
                            newStyle.innerHTML = style.innerHTML;
                            newStyle.setAttribute('data-screen-assets', 'true');
                            document.head.appendChild(newStyle);
                        });

                        // Extract and Inject Head Scripts (like Tailwind config)
                        Array.from(doc.querySelectorAll('head script')).forEach(script => {
                            const newScript = document.createElement('script');
                            Array.from(script.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                            newScript.innerHTML = script.innerHTML;
                            newScript.setAttribute('data-screen-assets', 'true');
                            document.head.appendChild(newScript);
                        });

                        // Extract Body Content
                        let bodyContent = doc.body.innerHTML;

                        // Auth Mode Patching
                        if (screenKey === 'LOGIN') {
                            const tempDiv = document.createElement('div');
                            tempDiv.innerHTML = bodyContent;

                            // Change "Sign Up" to "Log In" in the segment control
                            const signupTab = tempDiv.querySelector('label.bg-primary');
                            if (signupTab) {
                                signupTab.classList.remove('bg-primary');
                                signupTab.querySelector('span').innerText = 'Sign Up';
                                signupTab.querySelector('span').classList.remove('text-white', 'font-semibold');
                                signupTab.querySelector('span').classList.add('text-text-subtle', 'font-medium');
                            }

                            const loginTab = tempDiv.querySelector('label:not(.bg-primary)');
                            if (loginTab) {
                                loginTab.classList.add('bg-primary');
                                loginTab.querySelector('span').innerText = 'Login';
                                loginTab.querySelector('span').classList.remove('text-text-subtle', 'font-medium');
                                loginTab.querySelector('span').classList.add('text-white', 'font-semibold');
                            }

                            // Update primary button
                            const mainBtn = tempDiv.querySelector('.mt-8 button');
                            if (mainBtn) {
                                mainBtn.querySelector('span').innerText = 'Log In';
                            }

                            // Update footer
                            const footerText = tempDiv.querySelector('.mt-auto.pt-6 p');
                            if (footerText) {
                                footerText.innerHTML = `Don't have an account? <a class="font-semibold text-primary hover:text-primary-dark transition-colors" href="#">Sign Up</a>`;
                            }

                            // Remove extra signup fields (Name, Phone, etc)
                            const inputs = tempDiv.querySelectorAll('input[placeholder]');
                            inputs.forEach(input => {
                                const placeholder = input.getAttribute('placeholder').toLowerCase();
                                if (placeholder.includes('name') || placeholder.includes('phone')) {
                                    input.closest('.relative')?.remove();
                                }
                            });

                            bodyContent = tempDiv.innerHTML;
                        }

                        setHtml(bodyContent);
                    } catch (error) {
                        console.error('Failed to load screen:', error);
                        setHtml('<div class="p-10 text-center">Failed to load screen.</div>');
                    }
                    setLoading(false);
                };
                fetchContent();
            }, [screenKey]);

            // Execute scripts and attach listeners
            useEffect(() => {
                if (!loading && containerRef.current) {
                    const container = containerRef.current;

                    // 1. Manually execute any script tags found in the HTML
                    // Note: This is simplified for the demo/prototype
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });

                    // 2. Ensure interactive elements have cursor-pointer
                    container.querySelectorAll('button, .grid > div').forEach(el => {
                        el.classList.add('cursor-pointer');
                    });

                    // 3. Attach Click Listeners for All Interactions
                    const handleInteractions = (e) => {
                        const target = e.target.closest('button, a, [role="button"], .cursor-pointer, [onclick]');
                        if (!target) return;

                        // Water Ripple Effect
                        const rect = target.getBoundingClientRect();
                        const ripple = document.createElement('span');
                        ripple.className = 'ripple';
                        ripple.style.left = `${e.clientX - rect.left}px`;
                        ripple.style.top = `${e.clientY - rect.top}px`;
                        target.style.position = 'relative';
                        target.style.overflow = 'hidden';
                        target.appendChild(ripple);
                        setTimeout(() => ripple.remove(), 600);

                        // Sparkle Animation on Success Actions
                        const text = target.innerText.trim().toLowerCase().replace(/\s+/g, ' ');
                        if (text.includes('book now') || text.includes('create account') || text.includes('confirm') || text.includes('accept')) {
                            for (let i = 0; i < 8; i++) {
                                const sparkle = document.createElement('div');
                                sparkle.className = 'sparkle';
                                sparkle.innerHTML = `<svg width="15" height="15" viewBox="0 0 20 20"><path d="M10 0L13 7L20 10L13 13L10 20L7 13L0 10L7 7L10 0Z" fill="${['#87CEEB', '#FFD700', '#FF69B4'][i % 3]}"/></svg>`;
                                sparkle.style.left = `${e.clientX + (Math.random() - 0.5) * 40}px`;
                                sparkle.style.top = `${e.clientY + (Math.random() - 0.5) * 40}px`;
                                document.body.appendChild(sparkle);
                                setTimeout(() => sparkle.remove(), 800);
                            }
                        }

                        // Navigation Logic Heuristics
                        const iconText = target.querySelector('.material-symbols-outlined, .material-icons-round')?.innerText;

                        if (iconText === 'arrow_back' || text === 'back') {
                            window.dispatchEvent(new CustomEvent('goBack'));
                            return;
                        }

                        if (text === 'sign up' && screenKey === 'LOGIN') {
                            onNavigate('SIGNUP');
                            return;
                        }
                        if (text === 'login' && screenKey === 'SIGNUP') {
                            onNavigate('LOGIN');
                            return;
                        }

                        if (text.includes('sign up') || text.includes('create account')) {
                            if (text.includes('provider')) {
                                if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP');
                                else onNavigate('PROVIDER_WELCOME');
                            }
                            else onNavigate('SIGNUP');
                        } else if (text.includes('log in') || text.includes('login') || text.includes('sign in')) {
                            if (text.includes('admin')) onNavigate('ADMIN_LOGIN');
                            else if (screenKey === 'ADMIN_LOGIN') onNavigate('ADMIN_DASHBOARD');
                            else if (screenKey === 'WELCOME' || screenKey === 'SIGNUP') onNavigate('LOGIN');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('continue as guest')) {
                            onNavigate('CLIENT_HOME');
                        } else if (text.includes('book now')) {
                            onNavigate('BOOKING');
                        } else if (text.includes('find services') || text.includes('explore')) {
                            onNavigate('FIND_SERVICES');
                        } else if (text.includes('view profile')) {
                            onNavigate('PROVIDER_PROFILE');
                        } else if (text.includes('get started')) {
                            if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('complete setup') || text.includes('finish') || (screenKey === 'PROVIDER_SETUP' && text.includes('save & continue'))) {
                            onNavigate('PROVIDER_DASHBOARD');
                        } else if (text.includes('manage bookings')) {
                            onNavigate('ADMIN_MANAGE_BOOKINGS');
                        } else if (text.includes('manage users')) {
                            onNavigate('ADMIN_MANAGE_USERS');
                        } else if (text === 'home' || iconText === 'home') {
                            onNavigate('CLIENT_HOME');
                        } else if (text.includes('bookings') || iconText === 'calendar_today') {
                            onNavigate('MY_BOOKINGS');
                        } else if (text.includes('messages') || iconText === 'mail' || iconText === 'chat') {
                            if (screenKey.startsWith('PROVIDER')) onNavigate('MESSAGES'); // Simplified
                            else onNavigate('MESSAGES');
                        } else if (text.includes('profile') || iconText === 'person') {
                            if (screenKey.startsWith('ADMIN')) onNavigate('ADMIN_PROFILE_EDIT');
                            else onNavigate('PROFILE');
                        } else if (text.includes('emergency')) {
                            onNavigate('FEATURE_EMERGENCY_MODE');
                        }
                    };

                    container.addEventListener('click', handleInteractions);
                    return () => container.removeEventListener('click', handleInteractions);
                }
            }, [html, loading, screenKey]);

            return (
                <div className="h-full flex flex-col">
                    <style dangerouslySetInnerHTML={{ __html: styles }} />
                    {loading ? (
                        <div className="flex-1 flex items-center justify-center">
                            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-[#87CEEB]"></div>
                        </div>
                    ) : (
                        <div
                            ref={containerRef}
                            className="flex-1"
                            dangerouslySetInnerHTML={{ __html: html }}
                        />
                    )}
                </div>
            );
        };

        const App = () => {
            const [history, setHistory] = useState(['WELCOME']);
            const [devMenuOpen, setDevMenuOpen] = useState(false);
            const screen = history[history.length - 1];

            const navigate = (newScreen) => {
                setHistory(prev => [...prev, newScreen]);
            };

            const goBack = () => {
                if (history.length > 1) {
                    setHistory(prev => prev.slice(0, -1));
                }
            };

            useEffect(() => {
                const handleExternalNavigate = (e) => {
                    if (SCREEN_MAP[e.detail]) navigate(e.detail);
                };
                const handleGoBack = () => goBack();

                window.addEventListener('navigate', handleExternalNavigate);
                window.addEventListener('goBack', handleGoBack);
                return () => {
                    window.removeEventListener('navigate', handleExternalNavigate);
                    window.removeEventListener('goBack', handleGoBack);
                };
            }, [history]);

            return (
                <div className="app-shell">
                    <div className="screen-container screen-fade-enter" key={screen}>
                        <Screen screenKey={screen} onNavigate={navigate} />
                    </div>

                    {/* Quick Access Dev Menu */}
                    <div className="dev-menu-btn" onClick={() => setDevMenuOpen(!devMenuOpen)}>
                        <span className="material-symbols-outlined">menu</span>
                    </div>

                    {devMenuOpen && (
                        <div className="dev-menu">
                            <div className="text-[10px] font-bold text-gray-400 mb-2 px-3 uppercase tracking-wider">Switch Flow</div>
                            <button onClick={() => { navigate('WELCOME'); setDevMenuOpen(false); }}>Welcome Screen</button>
                            <button onClick={() => { navigate('CLIENT_HOME'); setDevMenuOpen(false); }}>Client App</button>
                            <button onClick={() => { navigate('PROVIDER_WELCOME'); setDevMenuOpen(false); }}>Provider App</button>
                            <button onClick={() => { navigate('ADMIN_LOGIN'); setDevMenuOpen(false); }}>Admin Panel</button>
                            <button onClick={() => { navigate('FEATURE_EMERGENCY_MODE'); setDevMenuOpen(false); }}>Emergency Mode</button>
                            <div className="mt-2 pt-2 border-t border-gray-100 text-[9px] text-center text-gray-400">
                                Prototype Navigation Control
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
