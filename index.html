<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner Hub - Home Service Professional Platform</title>
    <!-- Load React, ReactDOM, and Babel from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Material Icons and Symbols -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Montserrat', sans-serif;
            background-color: #f5f5f5;
            overflow: hidden;
        }

        /* Water Ripple Effect */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(135, 206, 235, 0.4);
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
            z-index: 9999;
        }
        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Sparkle Animation */
        .sparkle {
            position: absolute;
            pointer-events: none;
            z-index: 10000;
            animation: sparkle-fade 0.8s ease-out forwards;
        }
        @keyframes sparkle-fade {
            0% { transform: scale(0) rotate(0deg); opacity: 1; }
            100% { transform: scale(1.5) rotate(180deg); opacity: 0; }
        }
        #root {
            min-height: 100vh;
        }
        .app-shell {
            max-width: 450px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .screen-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }
        /* Custom scrollbar for a better look */
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 2px;
        }
        .screen-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Floating Action Menu for Demo */
        .dev-menu-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #87CEEB;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .dev-menu-btn:hover {
            opacity: 1;
        }
        .dev-menu {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 10px;
            z-index: 1001;
            width: 200px;
            border: 1px solid #eee;
        }
        .dev-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            transition: background 0.2s;
        }
        .dev-menu button:hover {
            background: #f0f9ff;
            color: #87CEEB;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SCREEN_MAP = {
            'WELCOME': 'extracted_code/stitch_cleaners_hub/welcome_screen/code.html',
            'AUTH': 'extracted_code/stitch_cleaners_hub/login/signup_screen/code.html',
            'SIGNUP': 'extracted_code/stitch_cleaners_hub/login/signup_screen/code.html',
            'LOGIN': 'extracted_code/stitch_cleaners_hub/login/signup_screen/code.html',
            'CLIENT_HOME': 'extracted_code/stitch_cleaners_hub/home_screen_(main_dashboard)_for_client_app/code.html',
            'FIND_SERVICES': 'extracted_code/stitch_cleaners_hub/find_services_screen_for_client_app/code.html',
            'PROVIDER_PROFILE': 'extracted_code/stitch_cleaners_hub/service_provider_profile_screen_for_client_app/code.html',
            'BOOKING': 'extracted_code/stitch_cleaners_hub/booking_screen_for_client_app/code.html',
            'MY_BOOKINGS': 'extracted_code/stitch_cleaners_hub/my_bookings_screen_for_client_app_1/code.html',
            'MY_BOOKINGS_1': 'extracted_code/stitch_cleaners_hub/my_bookings_screen_for_client_app_1/code.html',
            'MY_BOOKINGS_2': 'extracted_code/stitch_cleaners_hub/my_bookings_screen_for_client_app_2/code.html',
            'MY_BOOKINGS_3': 'extracted_code/stitch_cleaners_hub/my_bookings_screen_for_client_app_3/code.html',
            'PROVIDER_WELCOME': 'extracted_code/stitch_cleaners_hub/provider_welcome_screen/code.html',
            'PROVIDER_SETUP': 'extracted_code/stitch_cleaners_hub/provider_setup_screen/code.html',
            'PROVIDER_DASHBOARD': 'extracted_code/stitch_cleaners_hub/provider_dashboard_screen_1/code.html',
            'PROVIDER_DASHBOARD_1': 'extracted_code/stitch_cleaners_hub/provider_dashboard_screen_1/code.html',
            'PROVIDER_DASHBOARD_2': 'extracted_code/stitch_cleaners_hub/provider_dashboard_screen_2/code.html',
            'PROVIDER_BOOKING_REQUESTS': 'extracted_code/stitch_cleaners_hub/booking_requests_screen_for_provider_app/code.html',
            'PROVIDER_SCHEDULE': 'extracted_code/stitch_cleaners_hub/my_schedule_screen_for_provider_app/code.html',
            'PROVIDER_PUBLIC_PROFILE': 'extracted_code/stitch_cleaners_hub/provider_profile_(public_view)_screen/code.html',
            'PROVIDER_REPORT_CLIENT': 'extracted_code/stitch_cleaners_hub/report_client_screen_for_provider_app/code.html',
            'PROVIDER_CLIENT_REPORT_CONFIRMATION': 'extracted_code/stitch_cleaners_hub/client_report_confirmation_screen_(provider_app)_/code.html',
            'PROVIDER_MY_CLIENTS': 'extracted_code/stitch_cleaners_hub/my_clients_screen_for_provider_app_(with_report_feature)/code.html',
            'ADMIN_LOGIN': 'extracted_code/stitch_cleaners_hub/admin_login_screen/code.html',
            'ADMIN_DASHBOARD': 'extracted_code/stitch_cleaners_hub/admin_dashboard_screen_1/code.html',
            'ADMIN_DASHBOARD_1': 'extracted_code/stitch_cleaners_hub/admin_dashboard_screen_1/code.html',
            'ADMIN_DASHBOARD_2': 'extracted_code/stitch_cleaners_hub/admin_dashboard_screen_2/code.html',
            'ADMIN_DASHBOARD_3': 'extracted_code/stitch_cleaners_hub/admin_dashboard_screen_3/code.html',
            'ADMIN_DASHBOARD_4': 'extracted_code/stitch_cleaners_hub/admin_dashboard_screen_4/code.html',
            'ADMIN_APP_SETTINGS': 'extracted_code/stitch_cleaners_hub/app_settings_screen_for_admin_app/code.html',
            'ADMIN_MANAGE_BOOKINGS': 'extracted_code/stitch_cleaners_hub/manage_bookings_screen_for_admin_app/code.html',
            'ADMIN_PROFILE_EDIT': 'extracted_code/stitch_cleaners_hub/admin_profile_edit_screen/code.html',
            'ADMIN_MANAGE_USERS': 'extracted_code/stitch_cleaners_hub/manage_users_screen_for_admin_app/code.html',
            'MESSAGES': 'extracted_code/stitch_cleaners_hub/messages_screen_for_client_app/code.html',
            'PROFILE': 'extracted_code/stitch_cleaners_hub/profile_screen_for_client_app/code.html',
            'CLIENT_CHANNELS': 'extracted_code/stitch_cleaners_hub/channels_screen_(client_app_flow)_/code.html',
            'CLIENT_REPORT_PROVIDER': 'extracted_code/stitch_cleaners_hub/report_provider_screen_for_client_app/code.html',
            'CHANNEL_MANAGEMENT': 'extracted_code/stitch_cleaners_hub/channel_management_screen_(provider/admin_app)_/code.html',
            'CHANNEL_MEMBER_MANAGEMENT': 'extracted_code/stitch_cleaners_hub/channel_member_management_screen_(provider/admin_app)_/code.html',
            'CREATE_NEW_CHANNEL': 'extracted_code/stitch_cleaners_hub/create_new_channel_flow_(provider/admin_app)_/code.html',
            'EASY_PAYMENTS': 'extracted_code/stitch_cleaners_hub/easy_payments_feature_screen/code.html',
            'EMERGENCY_MODE': 'extracted_code/stitch_cleaners_hub/emergency_mode_feature_screen/code.html',
            'FAMILY_SHARING': 'extracted_code/stitch_cleaners_hub/family_sharing_feature_screen/code.html',
            'MULTI_LANGUAGE_SUPPORT': 'extracted_code/stitch_cleaners_hub/multi-language_support_screen/code.html',
            'OFFLINE_MODE': 'extracted_code/stitch_cleaners_hub/offline_mode_feature_screen/code.html',
            'PHOTO_VERIFICATION': 'extracted_code/stitch_cleaners_hub/photo_verification_feature_screen/code.html',
            'QUICK_REBOOKING': 'extracted_code/stitch_cleaners_hub/quick_rebooking_feature_screen/code.html',
            'REAL_TIME_TRACKING': 'extracted_code/stitch_cleaners_hub/real-time_tracking_screen/code.html',
            'REPORT_CONFIRMATION': 'extracted_code/stitch_cleaners_hub/report_confirmation_screen/code.html',
            'SMART_NOTIFICATIONS': 'extracted_code/stitch_cleaners_hub/smart_notifications_feature_screen/code.html',
            'SMART_SEARCH': 'extracted_code/stitch_cleaners_hub/smart_search_screen/code.html'
        };

        const Screen = ({ screenKey, onNavigate }) => {
            const [html, setHtml] = useState('');
            const [styles, setStyles] = useState('');
            const [loading, setLoading] = useState(true);
            const containerRef = useRef(null);

            useEffect(() => {
                const fetchContent = async () => {
                    setLoading(true);
                    try {
                        const path = SCREEN_MAP[screenKey];
                        const response = await fetch(path);
                        const text = await response.text();

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');

                        // Cleanup previous screen assets
                        document.querySelectorAll('[data-screen-assets]').forEach(el => el.remove());

                        // Extract and Inject Tailwind Config and other Head Scripts
                        doc.querySelectorAll('head script').forEach(script => {
                            const newScript = document.createElement('script');
                            Array.from(script.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                            newScript.innerHTML = script.innerHTML;
                            newScript.setAttribute('data-screen-assets', 'true');
                            document.head.appendChild(newScript);
                        });

                        // Extract and Inject Styles
                        const styleContent = Array.from(doc.querySelectorAll('style'))
                            .map(s => s.innerHTML)
                            .join('\n');

                        const styleEl = document.createElement('style');
                        styleEl.innerHTML = styleContent;
                        styleEl.setAttribute('data-screen-assets', 'true');
                        document.head.appendChild(styleEl);
                        setStyles(styleContent);

                        // Extract Body Content
                        const bodyContent = doc.body.innerHTML;
                        setHtml(bodyContent);

                    } catch (error) {
                        console.error('Failed to load screen:', error);
                        setHtml('<div class="p-10 text-center">Failed to load screen.</div>');
                    }
                    setLoading(false);
                };
                fetchContent();

                return () => {
                    document.querySelectorAll('[data-screen-assets]').forEach(el => el.remove());
                };
            }, [screenKey]);

            // Execute scripts and attach listeners
            useEffect(() => {
                if (!loading && containerRef.current) {
                    const container = containerRef.current;

                    // 1. Manually execute any script tags found in the HTML body
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });

                    // 2. Ensure all buttons and grid items have cursor-pointer for our heuristics
                    container.querySelectorAll('button, .grid > div').forEach(el => {
                        el.classList.add('cursor-pointer');
                    });

                    // 3. Attach Click Listeners for Navigation
                    const handleGlobalClick = (e) => {
                        const target = e.target.closest('button, a, [role="button"], .cursor-pointer, [onclick]');
                        if (!target) return;

                        // Enhanced normalization for robust matching
                        const text = target.innerText.replace(/\r?\n|\r/g, ' ').replace(/\s+/g, ' ').trim().toLowerCase();
                        const icon = target.querySelector('.material-symbols-outlined, .material-icons-round')?.innerText.toLowerCase();

                        // Visual Effects: Water Ripple
                        const ripple = document.createElement('span');
                        const rect = target.getBoundingClientRect();
                        const size = Math.max(rect.width, rect.height);
                        const x = e.clientX - rect.left - size / 2;
                        const y = e.clientY - rect.top - size / 2;

                        ripple.style.width = ripple.style.height = `${size}px`;
                        ripple.style.left = `${x}px`;
                        ripple.style.top = `${y}px`;
                        ripple.classList.add('ripple');

                        target.style.position = 'relative';
                        target.style.overflow = 'hidden';
                        target.appendChild(ripple);
                        setTimeout(() => ripple.remove(), 600);

                        // Visual Effects: Sparkles for success actions
                        if (text.includes('book') || text.includes('create account') || text.includes('save') || text.includes('confirm')) {
                            for (let i = 0; i < 8; i++) {
                                const sparkle = document.createElement('div');
                                sparkle.className = 'sparkle';
                                sparkle.innerHTML = `<svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                    <path d="M10 0L12 8L20 10L12 12L10 20L8 12L0 10L8 8L10 0Z" fill="${['#87CEEB', '#FFD700', '#FF69B4'][i % 3]}"/>
                                </svg>`;
                                sparkle.style.left = `${e.clientX + (Math.random() - 0.5) * 100}px`;
                                sparkle.style.top = `${e.clientY + (Math.random() - 0.5) * 100}px`;
                                document.body.appendChild(sparkle);
                                setTimeout(() => sparkle.remove(), 800);
                            }
                        }

                        // Auth Mode Patching
                        if (screenKey === 'SIGNUP' || screenKey === 'LOGIN' || screenKey === 'AUTH') {
                            const container = containerRef.current;
                            if (target.tagName === 'LABEL' || target.tagName === 'A' || target.closest('.mt-auto.pt-6')) {
                                const isLogin = text === 'login';
                                const title = container.querySelector('h1');
                                const subtext = container.querySelector('p.text-text-subtle');
                                const btn = container.querySelector('button.bg-primary span');
                                const footer = container.querySelector('.mt-auto.pt-6 p');

                                if (title) title.innerText = isLogin ? 'Welcome Back' : 'Find your perfect helper';
                                if (subtext) subtext.innerText = isLogin ? 'Sign in to continue your journey' : 'Join our community of trusted professionals';
                                if (btn) btn.innerText = isLogin ? 'Login' : 'Create Account';
                                if (footer) footer.innerHTML = isLogin ? `Don't have an account? <a class="font-semibold text-primary hover:text-primary-dark transition-colors" href="#">Sign Up</a>` : `Already have an account? <a class="font-semibold text-primary hover:text-primary-dark transition-colors" href="#">Login</a>`;

                                // Toggle visibility of signup-only fields
                                container.querySelectorAll('input[placeholder="Full Name"], input[placeholder="Phone Number"], label.flex.items-start.gap-3').forEach(el => {
                                    el.closest('.relative')?.style.setProperty('display', isLogin ? 'none' : 'block');
                                    if (el.tagName === 'LABEL') el.style.display = isLogin ? 'none' : 'flex';
                                });
                                return;
                            }
                        }

                        // Role/Context Detection
                        const isAdmin = screenKey.startsWith('ADMIN');
                        const isProvider = screenKey.startsWith('PROVIDER');

                        // Back Navigation
                        if (text === 'arrow_back' || text.includes('back') || icon === 'arrow_back') {
                            window.dispatchEvent(new CustomEvent('goBack'));
                            return;
                        }

                        // Auth Flow
                        if (text.includes('sign up') || text.includes('create account')) {
                            if (text.includes('provider')) onNavigate('PROVIDER_WELCOME');
                            else if (screenKey === 'SIGNUP' || screenKey === 'AUTH' || screenKey === 'LOGIN') onNavigate('CLIENT_HOME');
                            else onNavigate('SIGNUP');
                            return;
                        }
                        if (text.includes('log in') || text.includes('login') || text.includes('sign in')) {
                            if (text.includes('admin')) onNavigate('ADMIN_LOGIN');
                            else if (screenKey === 'ADMIN_LOGIN') onNavigate('ADMIN_DASHBOARD');
                            else if (screenKey === 'WELCOME') onNavigate('LOGIN');
                            else onNavigate('CLIENT_HOME');
                            return;
                        }
                        if (text.includes('continue as guest')) {
                            onNavigate('CLIENT_HOME');
                            return;
                        }

                        // Client Flow
                        if (text.includes('find services') || text.includes('explore') || icon === 'search') {
                            onNavigate('FIND_SERVICES');
                            return;
                        }
                        if (text.includes('book now') || text.includes('book this service')) {
                            onNavigate('BOOKING');
                            return;
                        }
                        if (text.includes('emergency')) {
                            onNavigate('EMERGENCY_MODE');
                            return;
                        }
                        if (text.includes('real-time tracking') || text.includes('tracking')) {
                            onNavigate('REAL_TIME_TRACKING');
                            return;
                        }
                        if (text.includes('photo verification') || text.includes('verification')) {
                            onNavigate('PHOTO_VERIFICATION');
                            return;
                        }
                        if (text.includes('view profile')) {
                            onNavigate('PROVIDER_PROFILE');
                            return;
                        }
                        if (text.includes('manage bookings') || text === 'bookings' || icon === 'calendar_today') {
                            if (isAdmin) onNavigate('ADMIN_MANAGE_BOOKINGS');
                            else onNavigate('MY_BOOKINGS');
                            return;
                        }
                        if (text === 'messages' || icon === 'mail' || icon === 'chat') {
                            if (isProvider) onNavigate('CLIENT_CHANNELS'); // For provider/admin channel view
                            else onNavigate('MESSAGES');
                            return;
                        }
                        if (text === 'profile' || icon === 'person') {
                            if (isAdmin) onNavigate('ADMIN_PROFILE_EDIT');
                            else onNavigate('PROFILE');
                            return;
                        }
                        if (text === 'home' || icon === 'home') {
                            if (isAdmin) onNavigate('ADMIN_DASHBOARD');
                            else if (isProvider) onNavigate('PROVIDER_DASHBOARD');
                            else onNavigate('CLIENT_HOME');
                            return;
                        }

                        // Provider Flow
                        if (text.includes('get started')) {
                            if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP');
                            else onNavigate('SIGNUP');
                            return;
                        }
                        if (text.includes('save & continue') || text.includes('complete setup') || text.includes('finish')) {
                            onNavigate('PROVIDER_DASHBOARD');
                            return;
                        }
                        if (text.includes('new requests') || icon === 'notification_important') {
                            onNavigate('PROVIDER_BOOKING_REQUESTS');
                            return;
                        }
                        if (text.includes('my schedule') || icon === 'event_note') {
                            onNavigate('PROVIDER_SCHEDULE');
                            return;
                        }
                        if (text.includes('my clients') || icon === 'group') {
                            onNavigate('PROVIDER_MY_CLIENTS');
                            return;
                        }

                        // Admin Flow
                        if (text.includes('manage users') || icon === 'person_search') {
                            onNavigate('ADMIN_MANAGE_USERS');
                            return;
                        }
                        if (text.includes('app settings') || icon === 'settings') {
                            onNavigate('ADMIN_APP_SETTINGS');
                            return;
                        }
                    };

                    container.addEventListener('click', handleGlobalClick);
                    return () => container.removeEventListener('click', handleGlobalClick);
                }
            }, [html, loading, screenKey]);

            return (
                <div className="h-full flex flex-col">
                    <style dangerouslySetInnerHTML={{ __html: styles }} />
                    {loading ? (
                        <div className="flex-1 flex items-center justify-center">
                            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-[#87CEEB]"></div>
                        </div>
                    ) : (
                        <div
                            ref={containerRef}
                            className="flex-1"
                            dangerouslySetInnerHTML={{ __html: html }}
                        />
                    )}
                </div>
            );
        };

        const App = () => {
            const [history, setHistory] = useState(['WELCOME']);
            const [devMenuOpen, setDevMenuOpen] = useState(false);

            const screen = history[history.length - 1];

            const navigate = (nextScreen) => {
                if (SCREEN_MAP[nextScreen]) {
                    setHistory(prev => [...prev, nextScreen]);
                }
            };

            const goBack = () => {
                if (history.length > 1) {
                    setHistory(prev => prev.slice(0, -1));
                }
            };

            useEffect(() => {
                const handleExternalNavigate = (e) => {
                    if (SCREEN_MAP[e.detail]) navigate(e.detail);
                };
                const handleGoBack = () => goBack();

                window.addEventListener('navigate', handleExternalNavigate);
                window.addEventListener('goBack', handleGoBack);

                return () => {
                    window.removeEventListener('navigate', handleExternalNavigate);
                    window.removeEventListener('goBack', handleGoBack);
                };
            }, [history]);

            return (
                <div className="app-shell">
                    <div className="screen-container">
                        <Screen screenKey={screen} onNavigate={navigate} />
                    </div>

                    {/* Quick Access Dev Menu */}
                    <div className="dev-menu-btn" onClick={() => setDevMenuOpen(!devMenuOpen)}>
                        <span className="material-symbols-outlined">menu</span>
                    </div>

                    {devMenuOpen && (
                        <div className="dev-menu">
                            <div className="text-[10px] font-bold text-gray-400 mb-2 px-3 uppercase tracking-wider">Switch Flow</div>
                            <button onClick={() => { navigate('WELCOME'); setDevMenuOpen(false); }}>Welcome Screen</button>
                            <button onClick={() => { navigate('CLIENT_HOME'); setDevMenuOpen(false); }}>Client App</button>
                            <button onClick={() => { navigate('PROVIDER_WELCOME'); setDevMenuOpen(false); }}>Provider App</button>
                            <button onClick={() => { navigate('ADMIN_LOGIN'); setDevMenuOpen(false); }}>Admin Panel</button>
                            <div className="mt-2 pt-2 border-t border-gray-100 text-[9px] text-center text-gray-400">
                                Prototype Navigation Control
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
