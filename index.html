<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner Hub - Home Service Professional Platform</title>
    <!-- Load React, ReactDOM, and Babel from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Material Icons and Symbols -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Montserrat', sans-serif;
            background-color: #f5f5f5;
        }
        #root {
            min-height: 100vh;
        }
        .app-shell {
            max-width: 450px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .screen-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }
        /* Custom scrollbar for a better look */
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 2px;
        }
        .screen-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Animations */
        @keyframes slideIn {
            from { transform: translateX(30px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .screen-container {
            animation: slideIn 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
            overflow: hidden;
        }
        @keyframes ripple-animation {
            to { transform: scale(4); opacity: 0; }
        }

        .sparkle {
            position: fixed;
            pointer-events: none;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            z-index: 9999;
        }
        @keyframes sparkle-animation {
            0% { transform: translate(0,0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        /* Floating Action Menu for Demo */
        .dev-menu-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #87CEEB;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .dev-menu-btn:hover {
            opacity: 1;
        }
        .dev-menu {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 10px;
            z-index: 1001;
            width: 200px;
            border: 1px solid #eee;
        }
        .dev-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            transition: background 0.2s;
        }
        .dev-menu button:hover {
            background: #f0f9ff;
            color: #87CEEB;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SCREEN_MAP = {
            'WELCOME': 'welcome_screen/code.html',
            'SIGNUP': 'login/signup_screen/code.html',
            'LOGIN': 'login/signup_screen/code.html',
            // Client App
            'CLIENT_HOME': 'home_screen_(main_dashboard)_for_client_app/code.html',
            'FIND_SERVICES': 'find_services_screen_for_client_app/code.html',
            'SERVICE_PROVIDER_PROFILE': 'service_provider_profile_screen_for_client_app/code.html',
            'BOOKING': 'booking_screen_for_client_app/code.html',
            'MY_BOOKINGS_1': 'my_bookings_screen_for_client_app_1/code.html',
            'MY_BOOKINGS_2': 'my_bookings_screen_for_client_app_2/code.html',
            'MY_BOOKINGS_3': 'my_bookings_screen_for_client_app_3/code.html',
            'MESSAGES': 'messages_screen_for_client_app/code.html',
            'PROFILE': 'profile_screen_for_client_app/code.html',
            'CHANNELS_CLIENT': 'channels_screen_(client_app_flow)_/code.html',
            'REPORT_PROVIDER': 'report_provider_screen_for_client_app/code.html',

            // Provider App
            'PROVIDER_WELCOME': 'provider_welcome_screen/code.html',
            'PROVIDER_SETUP': 'provider_setup_screen/code.html',
            'PROVIDER_DASHBOARD_1': 'provider_dashboard_screen_1/code.html',
            'PROVIDER_DASHBOARD_2': 'provider_dashboard_screen_2/code.html',
            'MY_SCHEDULE': 'my_schedule_screen_for_provider_app/code.html',
            'BOOKING_REQUESTS': 'booking_requests_screen_for_provider_app/code.html',
            'MY_CLIENTS': 'my_clients_screen_for_provider_app_(with_report_feature)/code.html',
            'REPORT_CLIENT': 'report_client_screen_for_provider_app/code.html',
            'CLIENT_REPORT_CONFIRMATION': 'client_report_confirmation_screen_(provider_app)_/code.html',
            'PROVIDER_PROFILE_PUBLIC': 'provider_profile_(public_view)_screen/code.html',

            // Admin App
            'ADMIN_LOGIN': 'admin_login_screen/code.html',
            'ADMIN_DASHBOARD_1': 'admin_dashboard_screen_1/code.html',
            'ADMIN_DASHBOARD_2': 'admin_dashboard_screen_2/code.html',
            'ADMIN_DASHBOARD_3': 'admin_dashboard_screen_3/code.html',
            'ADMIN_DASHBOARD_4': 'admin_dashboard_screen_4/code.html',
            'MANAGE_USERS': 'manage_users_screen_for_admin_app/code.html',
            'MANAGE_BOOKINGS': 'manage_bookings_screen_for_admin_app/code.html',
            'ADMIN_PROFILE_EDIT': 'admin_profile_edit_screen/code.html',
            'APP_SETTINGS': 'app_settings_screen_for_admin_app/code.html',

            // Shared/Features
            'REPORT_CONFIRMATION': 'report_confirmation_screen/code.html',
            'EASY_PAYMENTS': 'easy_payments_feature_screen/code.html',
            'EMERGENCY_MODE': 'emergency_mode_feature_screen/code.html',
            'FAMILY_SHARING': 'family_sharing_feature_screen/code.html',
            'OFFLINE_MODE': 'offline_mode_feature_screen/code.html',
            'PHOTO_VERIFICATION': 'photo_verification_feature_screen/code.html',
            'QUICK_REBOOKING': 'quick_rebooking_feature_screen/code.html',
            'REAL_TIME_TRACKING': 'real-time_tracking_screen/code.html',
            'SMART_NOTIFICATIONS': 'smart_notifications_feature_screen/code.html',
            'SMART_SEARCH': 'smart_search_screen/code.html',
            'MULTI_LANGUAGE': 'multi-language_support_screen/code.html',
            'CHANNEL_MANAGEMENT': 'channel_management_screen_(provider/admin_app)_/code.html',
            'CHANNEL_MEMBER_MANAGEMENT': 'channel_member_management_screen_(provider/admin_app)_/code.html',
            'CREATE_NEW_CHANNEL': 'create_new_channel_flow_(provider/admin_app)_/code.html'
        };

        const Screen = ({ screenKey, onNavigate, onGoBack }) => {
            const [html, setHtml] = useState('');
            const [styles, setStyles] = useState('');
            const [bodyClass, setBodyClass] = useState('');
            const [loading, setLoading] = useState(true);
            const containerRef = useRef(null);

            useEffect(() => {
                const fetchContent = async () => {
                    setLoading(true);
                    try {
                        const path = `extracted_code/stitch_cleaners_hub/${SCREEN_MAP[screenKey]}`;
                        const response = await fetch(path);
                        const text = await response.text();

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');

                        // Extract Styles
                        const styleContent = Array.from(doc.querySelectorAll('style'))
                            .map(s => s.innerHTML)
                            .join('\n');
                        setStyles(styleContent);

                        // Extract Body Class and Content
                        setBodyClass(doc.body.className);
                        const bodyContent = doc.body.innerHTML;
                        setHtml(bodyContent);

                        // We'll handle scripts in a separate useEffect
                    } catch (error) {
                        console.error('Failed to load screen:', error);
                        setHtml('<div class="p-10 text-center">Failed to load screen.</div>');
                    }
                    setLoading(false);
                };
                fetchContent();
            }, [screenKey]);

            // Execute scripts and attach listeners
            useEffect(() => {
                if (!loading && containerRef.current) {
                    const container = containerRef.current;

                    // 1. Manually execute any script tags found in the HTML
                    // Note: This is simplified for the demo/prototype
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });

                    // 2. Attach Consolidated Interactions
                    const handleInteractions = (e) => {
                        const target = e.target.closest('button, a, [role="button"], label, .mt-auto.pt-6');
                        if (!target) return;

                        // 2a. Water Ripple Effect
                        if (target.tagName === 'BUTTON' || target.getAttribute('role') === 'button') {
                            const rect = target.getBoundingClientRect();
                            const size = Math.max(rect.width, rect.height);
                            const x = e.clientX - rect.left - size / 2;
                            const y = e.clientY - rect.top - size / 2;

                            const ripple = document.createElement('span');
                            ripple.style.width = ripple.style.height = `${size}px`;
                            ripple.style.left = `${x}px`;
                            ripple.style.top = `${y}px`;
                            ripple.classList.add('ripple');

                            // Ensure target has relative positioning
                            const computedStyle = window.getComputedStyle(target);
                            if (computedStyle.position === 'static') target.style.position = 'relative';
                            target.style.overflow = 'hidden';

                            target.appendChild(ripple);
                            setTimeout(() => ripple.remove(), 600);
                        }

                        // 2b. Sparkle Animation for Success Actions
                        const textContent = target.innerText.trim().toLowerCase();
                        const successLabels = ['confirm', 'save', 'book', 'complete', 'create account', 'finish', 'submit', 'accept'];
                        if (successLabels.some(label => textContent.includes(label))) {
                            for (let i = 0; i < 12; i++) {
                                const sparkle = document.createElement('div');
                                sparkle.className = 'sparkle';
                                const colors = ['#87CEEB', '#FFD700', '#FF69B4', '#7CFC00', '#00FFFF'];
                                sparkle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                                sparkle.style.left = `${e.clientX}px`;
                                sparkle.style.top = `${e.clientY}px`;

                                const tx = (Math.random() - 0.5) * 200;
                                const ty = (Math.random() - 0.5) * 200;
                                sparkle.style.setProperty('--tx', `${tx}px`);
                                sparkle.style.setProperty('--ty', `${ty}px`);
                                sparkle.style.animation = `sparkle-animation 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards`;

                                document.body.appendChild(sparkle);
                                setTimeout(() => sparkle.remove(), 800);
                            }
                        }

                        // 2c. Navigation Heuristics
                        const text = textContent.replace(/\s+/g, ' '); // Normalize text
                        const icon = target.querySelector('.material-symbols-outlined, .material-icons-round')?.innerText;

                        // Auth Mode Toggle (Special Case)
                        if (target.tagName === 'LABEL' && target.querySelector('input[name="auth-mode"]')) {
                            const val = target.querySelector('input').value;
                            onNavigate(val.toUpperCase());
                            return;
                        }
                        if (target.classList.contains('mt-auto') && e.target.tagName === 'A') {
                            const linkText = e.target.innerText.toLowerCase();
                            if (linkText.includes('login')) onNavigate('LOGIN');
                            if (linkText.includes('sign up')) onNavigate('SIGNUP');
                            return;
                        }

                        // Role Detection (Heuristic)
                        const isAdmin = screenKey.startsWith('ADMIN');
                        const isProvider = screenKey.startsWith('PROVIDER') || screenKey.includes('SCHEDULE') || screenKey.includes('EARNINGS') || screenKey.includes('CLIENTS');

                        // Navigation Logic
                        if (text.includes('sign up') || text.includes('create account')) {
                            if (text.includes('provider')) {
                                if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP');
                                else onNavigate('PROVIDER_WELCOME');
                            }
                            else if (screenKey === 'SIGNUP') onNavigate('CLIENT_HOME');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('log in') || text.includes('login') || text.includes('sign in')) {
                            if (text.includes('admin')) onNavigate('ADMIN_LOGIN');
                            else if (screenKey === 'ADMIN_LOGIN') onNavigate('ADMIN_DASHBOARD_1');
                            else if (screenKey === 'WELCOME') onNavigate('LOGIN');
                            else if (screenKey === 'LOGIN') onNavigate('CLIENT_HOME');
                            else onNavigate('LOGIN');
                        } else if (text.includes('continue as guest')) {
                            onNavigate('CLIENT_HOME');
                        } else if (text.includes('book now') || text.includes('book this service')) {
                            onNavigate('BOOKING');
                        } else if (text.includes('find services') || text.includes('explore')) {
                            onNavigate('FIND_SERVICES');
                        } else if (text.includes('view profile')) {
                            if (isAdmin) onNavigate('MANAGE_USERS');
                            else onNavigate('SERVICE_PROVIDER_PROFILE');
                        } else if (text.includes('get started')) {
                            if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('complete setup') || text.includes('finish') || text.includes('save & continue')) {
                            if (isProvider) onNavigate('PROVIDER_DASHBOARD_1');
                        } else if (text.includes('home') || icon === 'home') {
                            if (isAdmin) onNavigate('ADMIN_DASHBOARD_1');
                            else if (isProvider) onNavigate('PROVIDER_DASHBOARD_1');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('manage bookings') || icon === 'assignment') {
                            onNavigate('MANAGE_BOOKINGS');
                        } else if (text.includes('bookings') || icon === 'calendar_today' || icon === 'event_note') {
                            if (isAdmin) onNavigate('MANAGE_BOOKINGS');
                            else onNavigate('MY_BOOKINGS_1');
                        } else if (text.includes('messages') || text.includes('chat') || icon === 'mail' || icon === 'chat' || icon === 'forum') {
                            onNavigate('MESSAGES');
                        } else if (text.includes('profile') || icon === 'person' || icon === 'account_circle') {
                            if (isAdmin) onNavigate('ADMIN_PROFILE_EDIT');
                            else onNavigate('PROFILE');
                        } else if (text.includes('manage users') || icon === 'group') {
                            onNavigate('MANAGE_USERS');
                        } else if (text.includes('my schedule') || icon === 'calendar_month') {
                            onNavigate('MY_SCHEDULE');
                        } else if (text.includes('my clients') || icon === 'groups') {
                            onNavigate('MY_CLIENTS');
                        } else if (text.includes('new requests') || icon === 'notification_important') {
                            onNavigate('BOOKING_REQUESTS');
                        } else if (text === 'back' || icon === 'arrow_back' || target.classList.contains('back-btn')) {
                            onGoBack();
                        }
                    };

                    // 3. Auth Mode Patching
                    if (screenKey === 'LOGIN' || screenKey === 'SIGNUP') {
                        const isLogin = screenKey === 'LOGIN';
                        const modeTabs = container.querySelectorAll('label:has(input[name="auth-mode"])');
                        modeTabs.forEach(tab => {
                            const radio = tab.querySelector('input');
                            const isTabLogin = radio.value === 'login';
                            if (isTabLogin === isLogin) {
                                tab.classList.add('bg-primary');
                                tab.classList.remove('bg-background-light', 'dark:bg-background-dark');
                                tab.querySelector('span').className = 'z-10 text-sm font-semibold text-white';
                                radio.checked = true;
                            } else {
                                tab.classList.remove('bg-primary');
                                tab.classList.add('bg-background-light', 'dark:bg-background-dark');
                                tab.querySelector('span').className = 'z-10 text-sm font-medium text-text-subtle group-hover:text-text-main dark:text-gray-400 dark:group-hover:text-white transition-colors';
                                radio.checked = false;
                            }
                        });

                        // Patch Headline & Button
                        const headline = container.querySelector('h1');
                        if (headline) headline.innerText = isLogin ? 'Welcome Back' : 'Find your perfect helper';

                        const subheadline = container.querySelector('p.text-text-subtle');
                        if (subheadline) subheadline.innerText = isLogin ? 'Login to continue your journey' : 'Join our community of trusted professionals';

                        const actionBtn = container.querySelector('.mt-8 button span');
                        if (actionBtn) actionBtn.innerText = isLogin ? 'Login' : 'Create Account';

                        // Hide Signup-only fields
                        const inputs = container.querySelectorAll('input[placeholder]');
                        inputs.forEach(input => {
                            const placeholder = input.placeholder.toLowerCase();
                            const isSignupField = placeholder.includes('name') || placeholder.includes('phone');
                            if (isSignupField) {
                                input.parentElement.style.display = isLogin ? 'none' : 'block';
                            }
                        });

                        const tos = container.querySelector('label:has(input[type="checkbox"])');
                        if (tos) tos.style.display = isLogin ? 'none' : 'flex';

                        const footer = container.querySelector('.mt-auto.pt-6 p');
                        if (footer) {
                            footer.innerHTML = isLogin ?
                                `Don't have an account? <a class="font-semibold text-primary hover:text-primary-dark transition-colors" href="#">Sign Up</a>` :
                                `Already have an account? <a class="font-semibold text-primary hover:text-primary-dark transition-colors" href="#">Login</a>`;
                        }
                    }

                    container.addEventListener('click', handleInteractions);
                    return () => container.removeEventListener('click', handleInteractions);
                }
            }, [html, loading, screenKey]);

            return (
                <div className={`h-full flex flex-col ${bodyClass}`}>
                    <style dangerouslySetInnerHTML={{ __html: styles }} />
                    {loading ? (
                        <div className="flex-1 flex items-center justify-center">
                            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-[#87CEEB]"></div>
                        </div>
                    ) : (
                        <div
                            ref={containerRef}
                            className="flex-1"
                            dangerouslySetInnerHTML={{ __html: html }}
                        />
                    )}
                </div>
            );
        };

        const App = () => {
            const [history, setHistory] = useState(['WELCOME']);
            const [devMenuOpen, setDevMenuOpen] = useState(false);
            const screen = history[history.length - 1];

            const navigate = (nextScreen) => {
                if (nextScreen === screen) return;
                setHistory(prev => [...prev, nextScreen]);
            };

            const goBack = () => {
                if (history.length > 1) {
                    setHistory(prev => prev.slice(0, -1));
                }
            };

            useEffect(() => {
                const handleExternalNavigate = (e) => {
                    if (SCREEN_MAP[e.detail]) navigate(e.detail);
                };
                const handleGoBack = () => goBack();

                window.addEventListener('navigate', handleExternalNavigate);
                window.addEventListener('goBack', handleGoBack);
                return () => {
                    window.removeEventListener('navigate', handleExternalNavigate);
                    window.removeEventListener('goBack', handleGoBack);
                };
            }, [screen, history]);

            return (
                <div className="app-shell">
                    <div className="screen-container" key={history.length}>
                        <Screen screenKey={screen} onNavigate={navigate} onGoBack={goBack} />
                    </div>

                    {/* Quick Access Dev Menu */}
                    <div className="dev-menu-btn" role="button" aria-label="menu" onClick={() => setDevMenuOpen(!devMenuOpen)}>
                        <span className="material-symbols-outlined">menu</span>
                    </div>

                    {devMenuOpen && (
                        <div className="dev-menu">
                            <div className="text-[10px] font-bold text-gray-400 mb-2 px-3 uppercase tracking-wider">Switch Flow</div>
                            <button onClick={() => { navigate('WELCOME'); setDevMenuOpen(false); }}>Welcome Screen</button>
                            <button onClick={() => { navigate('CLIENT_HOME'); setDevMenuOpen(false); }}>Client App</button>
                            <button onClick={() => { navigate('PROVIDER_WELCOME'); setDevMenuOpen(false); }}>Provider App</button>
                            <button onClick={() => { navigate('ADMIN_LOGIN'); setDevMenuOpen(false); }}>Admin Panel</button>
                            <div className="mt-2 pt-2 border-t border-gray-100 text-[9px] text-center text-gray-400">
                                Prototype Navigation Control
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
