<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner Hub - Home Service Professional Platform</title>
    <!-- Load React, ReactDOM, and Babel from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Material Icons and Symbols -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Montserrat', sans-serif;
            background-color: #f5f5f5;
        }
        #root {
            min-height: 100vh;
        }
        .app-shell {
            max-width: 450px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .screen-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }
        /* Custom scrollbar for a better look */
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 2px;
        }
        .screen-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Screen Transitions */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        /* Ripple Effect */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
            z-index: 9999;
        }
        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Sparkle Animation */
        .sparkle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            animation: sparkle-animation 0.8s ease-out forwards;
        }
        @keyframes sparkle-animation {
            0% { transform: scale(0) rotate(0deg); opacity: 1; }
            100% { transform: scale(1.5) rotate(180deg) translate(var(--tw-x, 20px), var(--tw-y, 20px)); opacity: 0; }
        }

        /* Floating Action Menu for Demo */
        .dev-menu-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #87CEEB;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .dev-menu-btn:hover {
            opacity: 1;
        }
        .dev-menu {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 10px;
            z-index: 1001;
            width: 200px;
            border: 1px solid #eee;
        }
        .dev-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            transition: background 0.2s;
        }
        .dev-menu button:hover {
            background: #f0f9ff;
            color: #87CEEB;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SCREEN_MAP = {
            'WELCOME': 'welcome_screen/code.html',
            'ADMIN_DASHBOARD': 'admin_dashboard_screen_1/code.html',
            'ADMIN_DASHBOARD_2': 'admin_dashboard_screen_2/code.html',
            'ADMIN_DASHBOARD_3': 'admin_dashboard_screen_3/code.html',
            'ADMIN_DASHBOARD_4': 'admin_dashboard_screen_4/code.html',
            'ADMIN_LOGIN': 'admin_login_screen/code.html',
            'ADMIN_PROFILE_EDIT': 'admin_profile_edit_screen/code.html',
            'ADMIN_SETTINGS': 'app_settings_screen_for_admin_app/code.html',
            'PROVIDER_REQUESTS': 'booking_requests_screen_for_provider_app/code.html',
            'BOOKING': 'booking_screen_for_client_app/code.html',
            'CHANNEL_MANAGEMENT': 'channel_management_screen_(provider/admin_app)_/code.html',
            'CHANNEL_MEMBERS': 'channel_member_management_screen_(provider/admin_app)_/code.html',
            'CLIENT_CHANNELS': 'channels_screen_(client_app_flow)_/code.html',
            'PROVIDER_REPORT_CONFIRM': 'client_report_confirmation_screen_(provider_app)_/code.html',
            'CREATE_CHANNEL': 'create_new_channel_flow_(provider/admin_app)_/code.html',
            'EASY_PAYMENTS': 'easy_payments_feature_screen/code.html',
            'EMERGENCY_MODE': 'emergency_mode_feature_screen/code.html',
            'FAMILY_SHARING': 'family_sharing_feature_screen/code.html',
            'FIND_SERVICES': 'find_services_screen_for_client_app/code.html',
            'CLIENT_HOME': 'home_screen_(main_dashboard)_for_client_app/code.html',
            'SIGNUP': 'login/signup_screen/code.html',
            'LOGIN': 'login/signup_screen/code.html',
            'ADMIN_MANAGE_BOOKINGS': 'manage_bookings_screen_for_admin_app/code.html',
            'ADMIN_MANAGE_USERS': 'manage_users_screen_for_admin_app/code.html',
            'MESSAGES': 'messages_screen_for_client_app/code.html',
            'LANGUAGE_SUPPORT': 'multi-language_support_screen/code.html',
            'MY_BOOKINGS': 'my_bookings_screen_for_client_app_1/code.html',
            'MY_BOOKINGS_2': 'my_bookings_screen_for_client_app_2/code.html',
            'MY_BOOKINGS_3': 'my_bookings_screen_for_client_app_3/code.html',
            'PROVIDER_CLIENTS': 'my_clients_screen_for_provider_app_(with_report_feature)/code.html',
            'PROVIDER_SCHEDULE': 'my_schedule_screen_for_provider_app/code.html',
            'OFFLINE_MODE': 'offline_mode_feature_screen/code.html',
            'PHOTO_VERIFICATION': 'photo_verification_feature_screen/code.html',
            'PROFILE': 'profile_screen_for_client_app/code.html',
            'PROVIDER_DASHBOARD': 'provider_dashboard_screen_1/code.html',
            'PROVIDER_DASHBOARD_2': 'provider_dashboard_screen_2/code.html',
            'PROVIDER_PUBLIC_PROFILE': 'provider_profile_(public_view)_screen/code.html',
            'PROVIDER_SETUP': 'provider_setup_screen/code.html',
            'PROVIDER_WELCOME': 'provider_welcome_screen/code.html',
            'QUICK_REBOOKING': 'quick_rebooking_feature_screen/code.html',
            'REALTIME_TRACKING': 'real-time_tracking_screen/code.html',
            'PROVIDER_REPORT_CLIENT': 'report_client_screen_for_provider_app/code.html',
            'REPORT_CONFIRMATION': 'report_confirmation_screen/code.html',
            'CLIENT_REPORT_PROVIDER': 'report_provider_screen_for_client_app/code.html',
            'PROVIDER_PROFILE': 'service_provider_profile_screen_for_client_app/code.html',
            'SMART_NOTIFICATIONS': 'smart_notifications_feature_screen/code.html',
            'SMART_SEARCH': 'smart_search_screen/code.html'
        };

        const Screen = ({ screenKey, onNavigate }) => {
            const [html, setHtml] = useState('');
            const [loading, setLoading] = useState(true);
            const containerRef = useRef(null);

            useEffect(() => {
                const fetchContent = async () => {
                    setLoading(true);
                    try {
                        // Cleanup previous screen assets
                        document.querySelectorAll('[data-screen-assets]').forEach(el => el.remove());

                        const path = `extracted_code/stitch_cleaners_hub/${SCREEN_MAP[screenKey]}`;
                        const response = await fetch(path);
                        const text = await response.text();

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');

                        // Inject Styles and Tailwind Configs into Head
                        doc.querySelectorAll('style, script#tailwind-config').forEach(el => {
                            const newEl = el.cloneNode(true);
                            newEl.setAttribute('data-screen-assets', 'true');
                            document.head.appendChild(newEl);
                        });

                        // Auth Mode Patching for Login Screen
                        if (screenKey === 'LOGIN') {
                            const authInputs = doc.querySelectorAll('input:not([type="checkbox"]):not([type="radio"])');
                            if (authInputs.length >= 3) {
                                // We want to keep only two fields: Email and Password.
                                // The template has: Name, Email, Phone, Password.
                                // We'll remove Name and Phone.
                                authInputs.forEach((input) => {
                                    const placeholder = input.getAttribute('placeholder') || '';
                                    if (placeholder.toLowerCase().includes('name') || placeholder.toLowerCase().includes('phone')) {
                                        input.closest('.relative')?.remove();
                                    }
                                });
                                // Remove checkbox/terms
                                doc.querySelectorAll('label').forEach(l => {
                                    if (l.innerText.includes('Terms') || l.querySelector('input[type="checkbox"]')) {
                                        l.remove();
                                    }
                                });
                                // Update Button Text
                                const submitBtn = doc.querySelector('.mt-8 button');
                                if (submitBtn) {
                                    const span = submitBtn.querySelector('span');
                                    if (span) span.innerText = 'Log In';
                                }
                                // Update Header
                                const subtext = doc.querySelector('.text-text-subtle');
                                if (subtext) subtext.innerText = 'Welcome back! Please login to your account.';
                                // Remove login/signup toggle
                                doc.querySelector('.mb-6')?.remove();
                            }
                        }

                        // Extract Body Content
                        const bodyContent = doc.body.innerHTML;
                        setHtml(bodyContent);

                    } catch (error) {
                        console.error('Failed to load screen:', error);
                        setHtml('<div class="p-10 text-center">Failed to load screen.</div>');
                    }
                    setLoading(false);
                };
                fetchContent();

                return () => {
                    document.querySelectorAll('[data-screen-assets]').forEach(el => el.remove());
                };
            }, [screenKey]);

            // Execute scripts and attach listeners
            useEffect(() => {
                if (!loading && containerRef.current) {
                    const container = containerRef.current;

                    // Ensure all buttons and interactive elements have cursor-pointer
                    container.querySelectorAll('button, .grid > div, a, [role="button"]').forEach(el => {
                        el.classList.add('cursor-pointer');
                    });

                    // 1. Manually execute any script tags found in the HTML by injecting to head
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.setAttribute('data-screen-assets', 'true');
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        document.head.appendChild(newScript);
                        oldScript.remove();
                    });

                    // 2. Attach Click Listeners for Navigation
                    const handleInteractions = (e) => {
                        // 1. Water Ripple Effect
                        const rect = container.getBoundingClientRect();
                        const ripple = document.createElement('span');
                        ripple.classList.add('ripple');
                        const size = Math.max(container.clientWidth, container.clientHeight);
                        ripple.style.width = ripple.style.height = `${size}px`;
                        ripple.style.left = `${e.clientX - rect.left - size/2}px`;
                        ripple.style.top = `${e.clientY - rect.top - size/2}px`;
                        container.appendChild(ripple);
                        setTimeout(() => ripple.remove(), 600);

                        // 2. Navigation Logic
                        const target = e.target.closest('button, a, [role="button"], .cursor-pointer, [onclick]');
                        if (!target) return;

                        const text = target.innerText.replace(/\s+/g, ' ').trim().toLowerCase();

                        // 3. Sparkle Animation for success actions
                        if (text.includes('book') || text.includes('account') || text.includes('save') || text.includes('confirm')) {
                            for (let i = 0; i < 8; i++) {
                                const sparkle = document.createElement('div');
                                sparkle.classList.add('sparkle');
                                sparkle.style.backgroundColor = ['#87CEEB', '#FFD700', '#FF69B4', '#7FFFD4'][Math.floor(Math.random() * 4)];
                                sparkle.style.left = `${e.clientX - rect.left}px`;
                                sparkle.style.top = `${e.clientY - rect.top}px`;
                                sparkle.style.setProperty('--tw-x', `${(Math.random() - 0.5) * 100}px`);
                                sparkle.style.setProperty('--tw-y', `${(Math.random() - 0.5) * 100}px`);
                                container.appendChild(sparkle);
                                setTimeout(() => sparkle.remove(), 800);
                            }
                        }
                        const isIconMatch = (iconName) => {
                            const icon = target.querySelector('.material-symbols-outlined, .material-icons-round, .material-icons');
                            return icon && icon.innerText.trim().toLowerCase() === iconName;
                        };

                        // Back Navigation
                        if (text === 'arrow_back' || text.includes('back') || isIconMatch('arrow_back')) {
                            window.dispatchEvent(new CustomEvent('goBack'));
                            return;
                        }

                        // Navigation Logic Heuristics
                        if (text.includes('sign up') || text.includes('create account')) {
                            if (text.includes('provider')) onNavigate('PROVIDER_WELCOME');
                            else if (screenKey === 'SIGNUP') onNavigate('CLIENT_HOME');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('log in') || text.includes('login') || text.includes('sign in')) {
                            if (text.includes('admin')) onNavigate('ADMIN_LOGIN');
                            else if (screenKey === 'ADMIN_LOGIN' || text.includes('admin login')) onNavigate('ADMIN_DASHBOARD');
                            else if (screenKey === 'WELCOME') onNavigate('LOGIN');
                            else if (screenKey === 'LOGIN') onNavigate('CLIENT_HOME');
                            else onNavigate('LOGIN');
                        } else if (text.includes('continue as guest')) {
                            onNavigate('CLIENT_HOME');
                        } else if (text.includes('book now') || text.includes('book this service')) {
                            onNavigate('BOOKING');
                        } else if (text.includes('find services') || text.includes('explore')) {
                            onNavigate('FIND_SERVICES');
                        } else if (text.includes('view profile')) {
                            onNavigate('PROVIDER_PROFILE');
                        } else if (text.includes('get started') || text.includes('sign up as provider')) {
                            if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('save & continue') || text.includes('complete setup') || text.includes('finish')) {
                            if (screenKey === 'PROVIDER_SETUP') onNavigate('PROVIDER_DASHBOARD');
                        } else if (text === 'home' || isIconMatch('home')) {
                            onNavigate('CLIENT_HOME');
                        } else if (text.includes('manage bookings') || (screenKey.startsWith('ADMIN') && text.includes('bookings'))) {
                            onNavigate('ADMIN_MANAGE_BOOKINGS');
                        } else if (text.includes('manage users') || (screenKey.startsWith('ADMIN') && text.includes('users'))) {
                            onNavigate('ADMIN_MANAGE_USERS');
                        } else if (text.includes('bookings') || isIconMatch('calendar_today') || isIconMatch('calendar_month')) {
                            onNavigate('MY_BOOKINGS');
                        } else if (text.includes('messages') || isIconMatch('mail') || isIconMatch('chat_bubble')) {
                            if (screenKey.startsWith('PROVIDER')) onNavigate('CLIENT_CHANNELS'); // Using shared channel view
                            else onNavigate('MESSAGES');
                        } else if (text.includes('profile') || isIconMatch('person')) {
                            if (screenKey.startsWith('ADMIN')) onNavigate('ADMIN_PROFILE_EDIT');
                            else onNavigate('PROFILE');
                        } else if (text.includes('emergency')) {
                            onNavigate('EMERGENCY_MODE');
                        }
                    };

                    container.addEventListener('click', handleInteractions);
                    return () => container.removeEventListener('click', handleInteractions);
                }
            }, [html, loading, screenKey]);

            return (
                <div className="h-full flex flex-col animate-fade-in">
                    {loading ? (
                        <div className="flex-1 flex items-center justify-center">
                            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-[#87CEEB]"></div>
                        </div>
                    ) : (
                        <div
                            ref={containerRef}
                            className="flex-1"
                            dangerouslySetInnerHTML={{ __html: html }}
                        />
                    )}
                </div>
            );
        };

        const App = () => {
            const [history, setHistory] = useState(['WELCOME']);
            const [devMenuOpen, setDevMenuOpen] = useState(false);
            const screen = history[history.length - 1];

            const navigate = (newScreen) => {
                if (SCREEN_MAP[newScreen]) {
                    setHistory(prev => [...prev, newScreen]);
                }
            };

            const goBack = () => {
                if (history.length > 1) {
                    setHistory(prev => prev.slice(0, -1));
                }
            };

            useEffect(() => {
                const handleExternalNavigate = (e) => navigate(e.detail);
                const handleGoBack = () => goBack();

                window.addEventListener('navigate', handleExternalNavigate);
                window.addEventListener('goBack', handleGoBack);
                return () => {
                    window.removeEventListener('navigate', handleExternalNavigate);
                    window.removeEventListener('goBack', handleGoBack);
                };
            }, [history]);

            return (
                <div className="app-shell">
                    <div className="screen-container">
                        <Screen screenKey={screen} onNavigate={navigate} />
                    </div>

                    {/* Quick Access Dev Menu */}
                    <div className="dev-menu-btn" onClick={() => setDevMenuOpen(!devMenuOpen)}>
                        <span className="material-symbols-outlined">menu</span>
                    </div>

                    {devMenuOpen && (
                        <div className="dev-menu">
                            <div className="text-[10px] font-bold text-gray-400 mb-2 px-3 uppercase tracking-wider">Switch Flow</div>
                            <button onClick={() => { navigate('WELCOME'); setDevMenuOpen(false); }}>Welcome Screen</button>
                            <button onClick={() => { navigate('CLIENT_HOME'); setDevMenuOpen(false); }}>Client App</button>
                            <button onClick={() => { navigate('PROVIDER_WELCOME'); setDevMenuOpen(false); }}>Provider App</button>
                            <button onClick={() => { navigate('ADMIN_LOGIN'); setDevMenuOpen(false); }}>Admin Panel</button>
                            <div className="mt-2 pt-2 border-t border-gray-100 text-[9px] text-center text-gray-400">
                                Prototype Navigation Control
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
