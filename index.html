<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner Hub - Home Service Professional Platform</title>
    <!-- Load React, ReactDOM, and Babel from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Material Icons and Symbols -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Montserrat', sans-serif;
            background-color: #f5f5f5;
        }
        #root {
            min-height: 100vh;
        }
        .app-shell {
            max-width: 450px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .screen-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }
        /* Custom scrollbar for a better look */
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 2px;
        }
        .screen-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Floating Action Menu for Demo */
        .dev-menu-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #87CEEB;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .dev-menu-btn:hover {
            opacity: 1;
        }
        .dev-menu {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 10px;
            z-index: 1001;
            width: 200px;
            border: 1px solid #eee;
        }
        .dev-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            transition: background 0.2s;
        }
        .dev-menu button:hover {
            background: #f0f9ff;
            color: #87CEEB;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SCREEN_MAP = {
            'WELCOME': 'welcome_screen/code.html',
            'SIGNUP': 'login/signup_screen/code.html',
            'LOGIN': 'login/signup_screen/code.html',
            'CLIENT_HOME': 'home_screen_(main_dashboard)_for_client_app/code.html',
            'FIND_SERVICES': 'find_services_screen_for_client_app/code.html',
            'PROVIDER_PROFILE': 'service_provider_profile_screen_for_client_app/code.html',
            'BOOKING': 'booking_screen_for_client_app/code.html',
            'MY_BOOKINGS_1': 'my_bookings_screen_for_client_app_1/code.html',
            'MY_BOOKINGS_2': 'my_bookings_screen_for_client_app_2/code.html',
            'MY_BOOKINGS_3': 'my_bookings_screen_for_client_app_3/code.html',
            'PROVIDER_WELCOME': 'provider_welcome_screen/code.html',
            'PROVIDER_SETUP': 'provider_setup_screen/code.html',
            'PROVIDER_DASHBOARD_1': 'provider_dashboard_screen_1/code.html',
            'PROVIDER_DASHBOARD_2': 'provider_dashboard_screen_2/code.html',
            'ADMIN_LOGIN': 'admin_login_screen/code.html',
            'ADMIN_DASHBOARD_1': 'admin_dashboard_screen_1/code.html',
            'ADMIN_DASHBOARD_2': 'admin_dashboard_screen_2/code.html',
            'ADMIN_DASHBOARD_3': 'admin_dashboard_screen_3/code.html',
            'ADMIN_DASHBOARD_4': 'admin_dashboard_screen_4/code.html',
            'ADMIN_PROFILE_EDIT': 'admin_profile_edit_screen/code.html',
            'ADMIN_SETTINGS': 'app_settings_screen_for_admin_app/code.html',
            'ADMIN_MANAGE_BOOKINGS': 'manage_bookings_screen_for_admin_app/code.html',
            'ADMIN_MANAGE_USERS': 'manage_users_screen_for_admin_app/code.html',
            'MESSAGES': 'messages_screen_for_client_app/code.html',
            'PROFILE': 'profile_screen_for_client_app/code.html',
            'PROVIDER_BOOKING_REQUESTS': 'booking_requests_screen_for_provider_app/code.html',
            'CHANNEL_MANAGEMENT': 'channel_management_screen_(provider/admin_app)_/code.html',
            'CHANNEL_MEMBER_MANAGEMENT': 'channel_member_management_screen_(provider/admin_app)_/code.html',
            'CHANNELS_CLIENT': 'channels_screen_(client_app_flow)_/code.html',
            'CLIENT_REPORT_CONFIRMATION': 'client_report_confirmation_screen_(provider_app)_/code.html',
            'CREATE_CHANNEL': 'create_new_channel_flow_(provider/admin_app)_/code.html',
            'EASY_PAYMENTS': 'easy_payments_feature_screen/code.html',
            'EMERGENCY_MODE': 'emergency_mode_feature_screen/code.html',
            'FAMILY_SHARING': 'family_sharing_feature_screen/code.html',
            'MULTI_LANGUAGE': 'multi-language_support_screen/code.html',
            'MY_CLIENTS': 'my_clients_screen_for_provider_app_(with_report_feature)/code.html',
            'MY_SCHEDULE': 'my_schedule_screen_for_provider_app/code.html',
            'OFFLINE_MODE': 'offline_mode_feature_screen/code.html',
            'PHOTO_VERIFICATION': 'photo_verification_feature_screen/code.html',
            'PROVIDER_PROFILE_PUBLIC': 'provider_profile_(public_view)_screen/code.html',
            'QUICK_REBOOKING': 'quick_rebooking_feature_screen/code.html',
            'REAL_TIME_TRACKING': 'real-time_tracking_screen/code.html',
            'REPORT_CLIENT': 'report_client_screen_for_provider_app/code.html',
            'REPORT_CONFIRMATION': 'report_confirmation_screen/code.html',
            'REPORT_PROVIDER': 'report_provider_screen_for_client_app/code.html',
            'SMART_NOTIFICATIONS': 'smart_notifications_feature_screen/code.html',
            'SMART_SEARCH': 'smart_search_screen/code.html'
        };

        const Screen = ({ screenKey, onNavigate }) => {
            const [html, setHtml] = useState('');
            const [styles, setStyles] = useState('');
            const [loading, setLoading] = useState(true);
            const [bodyClass, setBodyClass] = useState('');
            const containerRef = useRef(null);

            useEffect(() => {
                const fetchContent = async () => {
                    setLoading(true);
                    try {
                        const path = `extracted_code/stitch_cleaners_hub/${SCREEN_MAP[screenKey]}`;
                        const response = await fetch(path);
                        const text = await response.text();

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');

                        // Extract Styles
                        const styleContent = Array.from(doc.querySelectorAll('style'))
                            .map(s => s.innerHTML)
                            .join('\n');
                        setStyles(styleContent);

                        // Extract Body Classes
                        setBodyClass(doc.body.className);

                        // Extract Body Content (excluding scripts which we'll handle separately)
                        const bodyContent = doc.body.innerHTML;
                        setHtml(bodyContent);
                    } catch (error) {
                        console.error('Failed to load screen:', error);
                        setHtml('<div class="p-10 text-center">Failed to load screen.</div>');
                    }
                    setLoading(false);
                };
                fetchContent();
            }, [screenKey]);

            // Execute scripts and attach listeners
            useEffect(() => {
                if (!loading && containerRef.current) {
                    const container = containerRef.current;

                    // Auth Mode Patching
                    if (screenKey === 'SIGNUP' || screenKey === 'LOGIN') {
                        const updateAuthMode = (mode) => {
                            const nameField = container.querySelector('input[placeholder="Full Name"]')?.closest('.relative');
                            const phoneField = container.querySelector('input[placeholder="Phone Number"]')?.closest('.relative');
                            const termsLabel = container.querySelector('input[type="checkbox"]')?.closest('label');
                            const submitBtn = container.querySelector('button.bg-primary span');
                            const submitIcon = container.querySelector('button.bg-primary .material-symbols-outlined');
                            const footerText = container.querySelector('.mt-auto p');

                            if (mode === 'login') {
                                if (nameField) nameField.style.display = 'none';
                                if (phoneField) phoneField.style.display = 'none';
                                if (termsLabel) termsLabel.style.display = 'none';
                                if (submitBtn) submitBtn.innerText = 'Log In';
                                if (submitIcon) submitIcon.innerText = 'login';
                                if (footerText) footerText.innerHTML = `Don't have an account? <a class="font-semibold text-primary hover:text-primary-dark transition-colors" href="#">Sign Up</a>`;
                            } else {
                                if (nameField) nameField.style.display = 'block';
                                if (phoneField) phoneField.style.display = 'block';
                                if (termsLabel) termsLabel.style.display = 'flex';
                                if (submitBtn) submitBtn.innerText = 'Create Account';
                                if (submitIcon) submitIcon.innerText = 'arrow_forward';
                                if (footerText) footerText.innerHTML = `Already have an account? <a class="font-semibold text-primary hover:text-primary-dark transition-colors" href="#">Login</a>`;
                            }
                        };

                        const tabs = container.querySelectorAll('input[name="auth-mode"]');
                        tabs.forEach(tab => {
                            tab.addEventListener('change', (e) => {
                                updateAuthMode(e.target.value);
                                // Update tab styles
                                tabs.forEach(t => {
                                    const label = t.closest('label');
                                    if (t.checked) {
                                        label.classList.add('bg-primary', 'shadow-sm');
                                        label.querySelector('span').classList.remove('text-text-subtle');
                                        label.querySelector('span').classList.add('text-white', 'font-semibold');
                                    } else {
                                        label.classList.remove('bg-primary', 'shadow-sm');
                                        label.querySelector('span').classList.add('text-text-subtle');
                                        label.querySelector('span').classList.remove('text-white', 'font-semibold');
                                    }
                                });
                            });
                        });

                        // Initial state
                        const activeMode = screenKey === 'LOGIN' ? 'login' : 'signup';
                        const activeInput = container.querySelector(`input[value="${activeMode}"]`);
                        if (activeInput) {
                            activeInput.checked = true;
                            activeInput.dispatchEvent(new Event('change'));
                        }
                    }

                    // 1. Manually execute any script tags found in the HTML
                    // Note: This is simplified for the demo/prototype
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });

                    // 2. Attach Click Listeners for Navigation
                    const handleGlobalClick = (e) => {
                        const target = e.target.closest('button, a, [role="button"]');
                        if (!target) return;

                        const text = target.innerText.trim().toLowerCase();
                        const materialIcon = target.querySelector('.material-symbols-outlined, .material-icons-round')?.innerText;

                        // Back Navigation
                        if (materialIcon === 'arrow_back' || materialIcon === 'chevron_left' || text === 'back') {
                            window.dispatchEvent(new CustomEvent('goBack'));
                            return;
                        }

                        // Navigation Logic Heuristics
                        if (text.includes('sign up') || text.includes('create account')) {
                            if (text.includes('provider')) onNavigate('PROVIDER_WELCOME');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('log in') || text.includes('login') || text.includes('sign in')) {
                            if (text.includes('admin')) onNavigate('ADMIN_LOGIN');
                            else if (screenKey === 'ADMIN_LOGIN') onNavigate('ADMIN_DASHBOARD_1');
                            else if (screenKey === 'WELCOME') onNavigate('LOGIN');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('continue as guest')) {
                            onNavigate('CLIENT_HOME');
                        } else if (text.includes('book now')) {
                            onNavigate('BOOKING');
                        } else if (text.includes('find services') || text.includes('explore')) {
                            onNavigate('FIND_SERVICES');
                        } else if (text.includes('view profile')) {
                            onNavigate('PROVIDER_PROFILE');
                        } else if (text.includes('get started')) {
                            if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('complete setup') || text.includes('save & continue') || text.includes('finish')) {
                            if (screenKey === 'PROVIDER_SETUP') onNavigate('PROVIDER_DASHBOARD_1');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('home') || materialIcon === 'home') {
                            if (screenKey.startsWith('ADMIN')) onNavigate('ADMIN_DASHBOARD_1');
                            else if (screenKey.startsWith('PROVIDER')) onNavigate('PROVIDER_DASHBOARD_1');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('dashboard')) {
                            if (screenKey.startsWith('ADMIN')) onNavigate('ADMIN_DASHBOARD_1');
                            else onNavigate('PROVIDER_DASHBOARD_1');
                        } else if (text.includes('bookings') || materialIcon === 'calendar_today' || materialIcon === 'event_note') {
                            onNavigate('MY_BOOKINGS_1');
                        } else if (text.includes('messages') || materialIcon === 'mail' || materialIcon === 'chat') {
                            onNavigate('MESSAGES');
                        } else if (text.includes('profile') || materialIcon === 'person' || materialIcon === 'account_circle') {
                            onNavigate('PROFILE');
                        }
                    };

                    container.addEventListener('click', handleGlobalClick);
                    return () => container.removeEventListener('click', handleGlobalClick);
                }
            }, [html, loading, screenKey]);

            return (
                <div className={`h-full flex flex-col ${bodyClass}`}>
                    <style dangerouslySetInnerHTML={{ __html: styles }} />
                    {loading ? (
                        <div className="flex-1 flex items-center justify-center">
                            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-[#87CEEB]"></div>
                        </div>
                    ) : (
                        <div
                            ref={containerRef}
                            className="flex-1"
                            dangerouslySetInnerHTML={{ __html: html }}
                        />
                    )}
                </div>
            );
        };

        const App = () => {
            const [screen, setScreen] = useState('WELCOME');
            const [history, setHistory] = useState(['WELCOME']);
            const [devMenuOpen, setDevMenuOpen] = useState(false);

            const navigate = (nextScreen, replace = false) => {
                if (replace) {
                    setHistory(prev => [...prev.slice(0, -1), nextScreen]);
                } else {
                    setHistory(prev => [...prev, nextScreen]);
                }
                setScreen(nextScreen);
            };

            const goBack = () => {
                if (history.length > 1) {
                    const newHistory = [...history];
                    newHistory.pop();
                    const prevScreen = newHistory[newHistory.length - 1];
                    setHistory(newHistory);
                    setScreen(prevScreen);
                }
            };

            useEffect(() => {
                const handleExternalNavigate = (e) => {
                    if (SCREEN_MAP[e.detail]) navigate(e.detail);
                };
                const handleGoBack = () => goBack();

                window.addEventListener('navigate', handleExternalNavigate);
                window.addEventListener('goBack', handleGoBack);
                return () => {
                    window.removeEventListener('navigate', handleExternalNavigate);
                    window.removeEventListener('goBack', handleGoBack);
                };
            }, [history]);

            return (
                <div className="app-shell">
                    <div className="screen-container">
                        <Screen screenKey={screen} onNavigate={navigate} />
                    </div>

                    {/* Quick Access Dev Menu */}
                    <div className="dev-menu-btn" role="button" aria-label="menu" onClick={() => setDevMenuOpen(!devMenuOpen)}>
                        <span className="material-symbols-outlined">menu</span>
                    </div>

                    {devMenuOpen && (
                        <div className="dev-menu" style={{ width: '250px', maxHeight: '400px', overflowY: 'auto' }}>
                            <div className="text-[10px] font-bold text-gray-400 mb-2 px-3 uppercase tracking-wider">Main Screens</div>
                            <button onClick={() => { navigate('WELCOME'); setDevMenuOpen(false); }}>Welcome</button>
                            <button onClick={() => { navigate('SIGNUP'); setDevMenuOpen(false); }}>Sign Up / Login</button>

                            <div className="text-[10px] font-bold text-gray-400 mt-3 mb-2 px-3 uppercase tracking-wider">Client Flow</div>
                            <button onClick={() => { navigate('CLIENT_HOME'); setDevMenuOpen(false); }}>Dashboard</button>
                            <button onClick={() => { navigate('FIND_SERVICES'); setDevMenuOpen(false); }}>Find Services</button>
                            <button onClick={() => { navigate('MY_BOOKINGS_1'); setDevMenuOpen(false); }}>My Bookings</button>

                            <div className="text-[10px] font-bold text-gray-400 mt-3 mb-2 px-3 uppercase tracking-wider">Provider Flow</div>
                            <button onClick={() => { navigate('PROVIDER_WELCOME'); setDevMenuOpen(false); }}>Welcome</button>
                            <button onClick={() => { navigate('PROVIDER_SETUP'); setDevMenuOpen(false); }}>Setup</button>
                            <button onClick={() => { navigate('PROVIDER_DASHBOARD_1'); setDevMenuOpen(false); }}>Dashboard</button>

                            <div className="text-[10px] font-bold text-gray-400 mt-3 mb-2 px-3 uppercase tracking-wider">Admin Panel</div>
                            <button onClick={() => { navigate('ADMIN_LOGIN'); setDevMenuOpen(false); }}>Login</button>
                            <button onClick={() => { navigate('ADMIN_DASHBOARD_1'); setDevMenuOpen(false); }}>Dashboard</button>

                            <div className="text-[10px] font-bold text-gray-400 mt-3 mb-2 px-3 uppercase tracking-wider">Features</div>
                            <button onClick={() => { navigate('EMERGENCY_MODE'); setDevMenuOpen(false); }}>Emergency Mode</button>
                            <button onClick={() => { navigate('EASY_PAYMENTS'); setDevMenuOpen(false); }}>Easy Payments</button>
                            <button onClick={() => { navigate('OFFLINE_MODE'); setDevMenuOpen(false); }}>Offline Mode</button>
                            <button onClick={() => { navigate('SMART_SEARCH'); setDevMenuOpen(false); }}>Smart Search</button>

                            <div className="mt-2 pt-2 border-t border-gray-100 text-[9px] text-center text-gray-400">
                                Prototype Navigation Control
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
