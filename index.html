<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner Hub - Home Service Professional Platform</title>
    <!-- Load React, ReactDOM, and Babel from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Material Icons and Symbols -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Montserrat', sans-serif;
            background-color: #f5f5f5;
        }
        #root {
            min-height: 100vh;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .app-shell {
            max-width: 450px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .screen-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            animation: fadeIn 0.4s ease-out;
        }
        /* Custom scrollbar for a better look */
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        /* Ripple Effect */
        .ripple {
            position: absolute;
            background: rgba(135, 206, 235, 0.4);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple 0.6s linear;
            pointer-events: none;
            overflow: hidden;
        }
        @keyframes ripple {
            to { transform: scale(4); opacity: 0; }
        }
        /* Sparkle Animation */
        .sparkle {
            position: absolute;
            pointer-events: none;
            width: 6px;
            height: 6px;
            background: #87CEEB;
            border-radius: 50%;
            z-index: 9999;
            animation: sparkle-move 0.8s ease-out forwards;
        }
        @keyframes sparkle-move {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }
        .screen-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 2px;
        }
        .screen-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Floating Action Menu for Demo */
        .dev-menu-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #87CEEB;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .dev-menu-btn:hover {
            opacity: 1;
        }
        .dev-menu {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 10px;
            z-index: 1001;
            width: 200px;
            border: 1px solid #eee;
        }
        .dev-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            transition: background 0.2s;
        }
        .dev-menu button:hover {
            background: #f0f9ff;
            color: #87CEEB;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SCREEN_MAP = {
            'WELCOME': 'welcome_screen/code.html',
            'SIGNUP': 'login/signup_screen/code.html',
            'LOGIN': 'login/signup_screen/code.html',
            'CLIENT_HOME': 'home_screen_(main_dashboard)_for_client_app/code.html',
            'FIND_SERVICES': 'find_services_screen_for_client_app/code.html',
            'PROVIDER_PROFILE': 'service_provider_profile_screen_for_client_app/code.html',
            'BOOKING': 'booking_screen_for_client_app/code.html',
            'MY_BOOKINGS': 'my_bookings_screen_for_client_app_1/code.html',
            'PROVIDER_WELCOME': 'provider_welcome_screen/code.html',
            'PROVIDER_SETUP': 'provider_setup_screen/code.html',
            'PROVIDER_DASHBOARD': 'provider_dashboard_screen_1/code.html',
            'ADMIN_LOGIN': 'admin_login_screen/code.html',
            'ADMIN_DASHBOARD': 'admin_dashboard_screen_1/code.html',
            'MESSAGES': 'messages_screen_for_client_app/code.html',
            'PROFILE': 'profile_screen_for_client_app/code.html',
            'EMERGENCY_MODE': 'emergency_mode_feature_screen/code.html',
            'ADMIN_PROFILE_EDIT': 'admin_profile_edit_screen/code.html',
            'MANAGE_USERS': 'manage_users_screen_for_admin_app/code.html',
            'MANAGE_BOOKINGS': 'manage_bookings_screen_for_admin_app/code.html',
            'VERIFY_PROVIDERS': 'photo_verification_feature_screen/code.html',
            'REPORTS': 'client_report_confirmation_screen_(provider_app)_/code.html',
            'APP_SETTINGS': 'app_settings_screen_for_admin_app/code.html'
        };

        const Screen = ({ screenKey, onNavigate }) => {
            const [html, setHtml] = useState('');
            const [loading, setLoading] = useState(true);
            const containerRef = useRef(null);

            useEffect(() => {
                const fetchContent = async () => {
                    setLoading(true);
                    try {
                        const path = `extracted_code/stitch_cleaners_hub/${SCREEN_MAP[screenKey]}`;
                        const response = await fetch(path);
                        const text = await response.text();

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');

                        // Cleanup previous screen assets
                        document.querySelectorAll('[data-screen-assets]').forEach(el => el.remove());

                        // Extract and Inject Styles
                        const styles = Array.from(doc.querySelectorAll('style'));
                        styles.forEach(style => {
                            const newStyle = document.createElement('style');
                            newStyle.innerHTML = style.innerHTML;
                            newStyle.setAttribute('data-screen-assets', 'true');
                            document.head.appendChild(newStyle);
                        });

                        // Extract and Inject Tailwind Configs/Scripts from Head
                        const headScripts = Array.from(doc.head.querySelectorAll('script'));
                        headScripts.forEach(script => {
                            const newScript = document.createElement('script');
                            Array.from(script.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                            newScript.innerHTML = script.innerHTML;
                            newScript.setAttribute('data-screen-assets', 'true');
                            document.head.appendChild(newScript);
                        });

                        setHtml(doc.body.innerHTML);
                    } catch (error) {
                        console.error('Failed to load screen:', error);
                        setHtml('<div class="p-10 text-center">Failed to load screen.</div>');
                    }
                    setLoading(false);
                };
                fetchContent();
            }, [screenKey]);

            // Execute scripts and attach listeners
            useEffect(() => {
                if (!loading && containerRef.current) {
                    const container = containerRef.current;

                    // Add cursor-pointer to all interactive elements for better UX
                    container.querySelectorAll('button, .grid > div, a').forEach(el => el.classList.add('cursor-pointer'));

                    // 1. Manually execute any script tags found in the body HTML
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });

                    // 2. Auth Mode Patching Logic
                    if (screenKey === 'LOGIN' || screenKey === 'SIGNUP') {
                        const isLogin = screenKey === 'LOGIN';
                        const headline = container.querySelector('h1');
                        const subtext = container.querySelector('p.text-text-subtle');
                        const tabs = container.querySelectorAll('label.group');
                        const fields = container.querySelectorAll('.flex.flex-col.gap-4 > div');
                        const actionBtn = container.querySelector('.mt-8 button span');
                        const footerText = container.querySelector('.mt-auto.pt-6');

                        if (headline) headline.innerText = isLogin ? 'Welcome Back' : 'Find your perfect helper';
                        if (subtext) subtext.innerText = isLogin ? 'Login to your account' : 'Join our community of trusted professionals';

                        if (tabs.length >= 2) {
                            tabs.forEach((tab, i) => {
                                const radio = tab.querySelector('input');
                                if ((isLogin && i === 0) || (!isLogin && i === 1)) {
                                    tab.classList.add('bg-primary', 'shadow-sm');
                                    tab.querySelector('span').className = 'z-10 text-sm font-semibold text-white';
                                    if (radio) radio.checked = true;
                                } else {
                                    tab.classList.remove('bg-primary', 'shadow-sm');
                                    tab.querySelector('span').className = 'z-10 text-sm font-medium text-text-subtle group-hover:text-text-main dark:text-gray-400 dark:group-hover:text-white transition-colors';
                                    if (radio) radio.checked = false;
                                }
                            });
                        }

                        if (isLogin && fields.length > 2) {
                            fields.forEach((field, i) => {
                                if (i === 0 || i === 2 || field.querySelector('input[type="checkbox"]')?.parentElement?.parentElement) {
                                    field.style.display = 'none';
                                }
                            });
                        }
                        if (actionBtn) actionBtn.innerText = isLogin ? 'Log In' : 'Create Account';
                        if (footerText) footerText.style.display = isLogin ? 'none' : 'block';
                    }

                    // 3. Attach Click Listeners for Navigation
                    const handleInteractions = (e) => {
                        const target = e.target.closest('button, a, [role="button"], .grid > div');
                        if (!target) return;

                        // Water Ripple Effect
                        const rect = target.getBoundingClientRect();
                        const size = Math.max(rect.width, rect.height);
                        const x = e.clientX - rect.left - size / 2;
                        const y = e.clientY - rect.top - size / 2;
                        const ripple = document.createElement('span');
                        ripple.style.width = ripple.style.height = `${size}px`;
                        ripple.style.left = `${x}px`;
                        ripple.style.top = `${y}px`;
                        ripple.classList.add('ripple');

                        if (getComputedStyle(target).position === 'static') target.style.position = 'relative';
                        target.appendChild(ripple);
                        setTimeout(() => ripple.remove(), 600);

                        // Sparkle Effect for specific actions
                        const text = target.innerText.trim().toLowerCase().replace(/\s+/g, ' ');
                        if (text.includes('confirm') || text.includes('finish') || text.includes('save') || text.includes('accept')) {
                            for (let i = 0; i < 12; i++) {
                                const sparkle = document.createElement('div');
                                sparkle.className = 'sparkle';
                                sparkle.style.left = `${e.clientX}px`;
                                sparkle.style.top = `${e.clientY}px`;
                                sparkle.style.setProperty('--tx', `${(Math.random() - 0.5) * 100}px`);
                                sparkle.style.setProperty('--ty', `${(Math.random() - 0.5) * 100}px`);
                                sparkle.style.backgroundColor = ['#87CEEB', '#FFD700', '#FFFFFF'][Math.floor(Math.random() * 3)];
                                document.body.appendChild(sparkle);
                                setTimeout(() => sparkle.remove(), 800);
                            }
                        }

                        const icon = target.querySelector('.material-symbols-outlined, .material-icons-round')?.innerText;

                        // Back Navigation
                        if (icon === 'arrow_back' || text === 'back') {
                            window.dispatchEvent(new CustomEvent('goBack'));
                            return;
                        }

                        // Role Detection (Context)
                        const isAdmin = screenKey.startsWith('ADMIN');
                        const isProvider = screenKey.startsWith('PROVIDER');

                        // Navigation Logic Heuristics
                        if (text.includes('sign up') || text.includes('create account')) {
                            if (text.includes('provider')) onNavigate('PROVIDER_WELCOME');
                            else if (screenKey === 'SIGNUP') onNavigate('CLIENT_HOME');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('log in') || text.includes('login') || text.includes('sign in')) {
                            if (text.includes('admin')) onNavigate('ADMIN_LOGIN');
                            else if (screenKey === 'ADMIN_LOGIN') onNavigate('ADMIN_DASHBOARD');
                            else if (screenKey === 'LOGIN') onNavigate('CLIENT_HOME');
                            else if (screenKey === 'WELCOME') onNavigate('LOGIN');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('continue as guest')) {
                            onNavigate('CLIENT_HOME');
                        } else if (text.includes('book now') || text.includes('book this service')) {
                            onNavigate('BOOKING');
                        } else if (text.includes('find services') || text.includes('explore')) {
                            onNavigate('FIND_SERVICES');
                        } else if (text.includes('view profile')) {
                            onNavigate(isAdmin ? 'ADMIN_PROFILE_EDIT' : 'PROVIDER_PROFILE');
                        } else if (text.includes('get started')) {
                            if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('complete setup') || text.includes('finish') || text.includes('save & continue')) {
                            onNavigate('PROVIDER_DASHBOARD');
                        } else if (text.includes('home') || icon === 'home') {
                            onNavigate(isAdmin ? 'ADMIN_DASHBOARD' : (isProvider ? 'PROVIDER_DASHBOARD' : 'CLIENT_HOME'));
                        } else if (text.includes('manage bookings') || text === 'bookings' || icon === 'calendar_today' || icon === 'event_note') {
                            onNavigate(isAdmin ? 'MANAGE_BOOKINGS' : 'MY_BOOKINGS');
                        } else if (text.includes('manage users') || icon === 'group') {
                            onNavigate('MANAGE_USERS');
                        } else if (text.includes('messages') || icon === 'mail' || icon === 'chat') {
                            onNavigate('MESSAGES');
                        } else if (text.includes('profile') || icon === 'person') {
                            onNavigate(isAdmin ? 'ADMIN_PROFILE_EDIT' : 'PROFILE');
                        } else if (text.includes('emergency')) {
                            onNavigate('EMERGENCY_MODE');
                        } else if (text.includes('verify providers') || icon === 'verified_user') {
                            onNavigate('VERIFY_PROVIDERS');
                        } else if (text.includes('view reports') || icon === 'assessment') {
                            onNavigate('REPORTS');
                        } else if (text.includes('settings') || icon === 'settings') {
                            onNavigate('APP_SETTINGS');
                        } else if (target.querySelector('input[name="auth-mode"]')) {
                            const val = target.querySelector('input').value;
                            onNavigate(val.toUpperCase());
                        }
                    };

                    container.addEventListener('click', handleInteractions);
                    return () => container.removeEventListener('click', handleInteractions);
                }
            }, [html, loading, screenKey]);

            return (
                <div className="h-full flex flex-col">
                    {loading ? (
                        <div className="flex-1 flex items-center justify-center">
                            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-[#87CEEB]"></div>
                        </div>
                    ) : (
                        <div
                            ref={containerRef}
                            className="flex-1"
                            dangerouslySetInnerHTML={{ __html: html }}
                        />
                    )}
                </div>
            );
        };

        const App = () => {
            const [history, setHistory] = useState(['WELCOME']);
            const [devMenuOpen, setDevMenuOpen] = useState(false);
            const currentScreen = history[history.length - 1];

            const navigate = (screenKey) => {
                if (SCREEN_MAP[screenKey]) {
                    setHistory(prev => [...prev, screenKey]);
                }
            };

            const goBack = () => {
                if (history.length > 1) {
                    setHistory(prev => prev.slice(0, -1));
                }
            };

            useEffect(() => {
                const handleExternalNavigate = (e) => navigate(e.detail);
                const handleGoBack = () => goBack();
                window.addEventListener('navigate', handleExternalNavigate);
                window.addEventListener('goBack', handleGoBack);
                return () => {
                    window.removeEventListener('navigate', handleExternalNavigate);
                    window.removeEventListener('goBack', handleGoBack);
                };
            }, [history]);

            return (
                <div className="app-shell">
                    <div className="screen-container">
                        <Screen screenKey={currentScreen} onNavigate={navigate} />
                    </div>

                    {/* Quick Access Dev Menu */}
                    <div className="dev-menu-btn" onClick={() => setDevMenuOpen(!devMenuOpen)}>
                        <span className="material-symbols-outlined">menu</span>
                    </div>

                    {devMenuOpen && (
                        <div className="dev-menu">
                            <div className="text-[10px] font-bold text-gray-400 mb-2 px-3 uppercase tracking-wider">Switch Flow</div>
                            <button onClick={() => { setHistory(['WELCOME']); setDevMenuOpen(false); }}>Welcome Screen</button>
                            <button onClick={() => { setHistory(['CLIENT_HOME']); setDevMenuOpen(false); }}>Client App</button>
                            <button onClick={() => { setHistory(['PROVIDER_WELCOME']); setDevMenuOpen(false); }}>Provider App</button>
                            <button onClick={() => { setHistory(['ADMIN_LOGIN']); setDevMenuOpen(false); }}>Admin Panel</button>
                            <button onClick={() => { setHistory([...history, 'EMERGENCY_MODE']); setDevMenuOpen(false); }}>Emergency Mode</button>
                            <div className="mt-2 pt-2 border-t border-gray-100 text-[9px] text-center text-gray-400">
                                Prototype Navigation Control
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
