<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner Hub - Home Service Professional Platform</title>
    <!-- Load React, ReactDOM, and Babel from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#87CEEB',
                        'primary-dark': '#6FB3D9',
                    }
                }
            }
        }
    </script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Material Icons and Symbols -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Montserrat', sans-serif;
            background-color: #f5f5f5;
        }
        #root {
            min-height: 100vh;
        }
        .app-shell {
            max-width: 450px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .screen-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }
        .slide-in {
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { transform: translateX(30px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        /* Custom scrollbar for a better look */
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 2px;
        }
        .screen-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Floating Action Menu for Demo */
        .dev-menu-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #87CEEB;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .dev-menu-btn:hover {
            opacity: 1;
        }
        .dev-menu {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 10px;
            z-index: 1001;
            width: 240px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #eee;
        }
        .dev-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            transition: background 0.2s;
        }
        .dev-menu button:hover {
            background: #f0f9ff;
            color: #87CEEB;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SCREEN_MAP = {
            'WELCOME': 'welcome_screen/code.html',
            'SIGNUP': 'login/signup_screen/code.html',
            'LOGIN': 'login/signup_screen/code.html',
            'CLIENT_HOME': 'home_screen_(main_dashboard)_for_client_app/code.html',
            'HOME': 'home_screen_(main_dashboard)_for_client_app/code.html',
            'FIND_SERVICES': 'find_services_screen_for_client_app/code.html',
            'PROVIDER_PROFILE': 'service_provider_profile_screen_for_client_app/code.html',
            'BOOKING': 'booking_screen_for_client_app/code.html',
            'MY_BOOKINGS': 'my_bookings_screen_for_client_app_1/code.html',
            'MY_BOOKINGS_1': 'my_bookings_screen_for_client_app_1/code.html',
            'MY_BOOKINGS_2': 'my_bookings_screen_for_client_app_2/code.html',
            'MY_BOOKINGS_3': 'my_bookings_screen_for_client_app_3/code.html',
            'MESSAGES': 'messages_screen_for_client_app/code.html',
            'PROFILE': 'profile_screen_for_client_app/code.html',
            'CHANNELS': 'channels_screen_(client_app_flow)_/code.html',
            'SMART_SEARCH': 'smart_search_screen/code.html',
            'REPORT_PROVIDER': 'report_provider_screen_for_client_app/code.html',
            'REPORT_CONFIRMATION': 'report_confirmation_screen/code.html',

            'PROVIDER_WELCOME': 'provider_welcome_screen/code.html',
            'PROVIDER_SETUP': 'provider_setup_screen/code.html',
            'PROVIDER_DASHBOARD': 'provider_dashboard_screen_1/code.html',
            'PROVIDER_DASHBOARD_1': 'provider_dashboard_screen_1/code.html',
            'PROVIDER_DASHBOARD_2': 'provider_dashboard_screen_2/code.html',
            'PROVIDER_SCHEDULE': 'my_schedule_screen_for_provider_app/code.html',
            'PROVIDER_REQUESTS': 'booking_requests_screen_for_provider_app/code.html',
            'PROVIDER_CLIENTS': 'my_clients_screen_for_provider_app_(with_report_feature)/code.html',
            'PROVIDER_REPORT_CLIENT': 'report_client_screen_for_provider_app/code.html',
            'PROVIDER_REPORT_CONFIRM': 'client_report_confirmation_screen_(provider_app)_/code.html',
            'PROVIDER_PUBLIC_PROFILE': 'provider_profile_(public_view)_screen/code.html',

            'ADMIN_LOGIN': 'admin_login_screen/code.html',
            'ADMIN_DASHBOARD': 'admin_dashboard_screen_1/code.html',
            'ADMIN_DASHBOARD_1': 'admin_dashboard_screen_1/code.html',
            'ADMIN_DASHBOARD_2': 'admin_dashboard_screen_2/code.html',
            'ADMIN_DASHBOARD_3': 'admin_dashboard_screen_3/code.html',
            'ADMIN_DASHBOARD_4': 'admin_dashboard_screen_4/code.html',
            'ADMIN_MANAGE_USERS': 'manage_users_screen_for_admin_app/code.html',
            'ADMIN_MANAGE_BOOKINGS': 'manage_bookings_screen_for_admin_app/code.html',
            'ADMIN_SETTINGS': 'app_settings_screen_for_admin_app/code.html',
            'ADMIN_PROFILE_EDIT': 'admin_profile_edit_screen/code.html',

            'FEATURE_EASY_PAYMENTS': 'easy_payments_feature_screen/code.html',
            'FEATURE_EMERGENCY_MODE': 'emergency_mode_feature_screen/code.html',
            'FEATURE_FAMILY_SHARING': 'family_sharing_feature_screen/code.html',
            'FEATURE_OFFLINE_MODE': 'offline_mode_feature_screen/code.html',
            'FEATURE_PHOTO_VERIFICATION': 'photo_verification_feature_screen/code.html',
            'FEATURE_QUICK_REBOOKING': 'quick_rebooking_feature_screen/code.html',
            'FEATURE_REAL_TIME_TRACKING': 'real-time_tracking_screen/code.html',
            'FEATURE_SMART_NOTIFICATIONS': 'smart_notifications_feature_screen/code.html',
            'FEATURE_MULTI_LANGUAGE': 'multi-language_support_screen/code.html',

            'CHANNEL_MGMT': 'channel_management_screen_(provider/admin_app)_/code.html',
            'CHANNEL_MEMBER_MGMT': 'channel_member_management_screen_(provider/admin_app)_/code.html',
            'CREATE_CHANNEL': 'create_new_channel_flow_(provider/admin_app)_/code.html',
        };

        const Screen = ({ screenKey, onNavigate }) => {
            const [html, setHtml] = useState('');
            const [styles, setStyles] = useState('');
            const [bodyClass, setBodyClass] = useState('');
            const [loading, setLoading] = useState(true);
            const containerRef = useRef(null);

            // Centralized navigation logic to reduce brittleness
            const resolveNavigation = (text, target, currentScreen) => {
                const label = text.toLowerCase().trim().replace(/\s+/g, ' ');
                const iconText = target.querySelector('.material-symbols-outlined, .material-icons-round')?.innerText || '';

                // Role-based routing helpers
                const isAdmin = currentScreen.startsWith('ADMIN');
                const isProvider = currentScreen.startsWith('PROVIDER');

                // 1. Icon-based navigation (most reliable)
                if (iconText === 'home') return isAdmin ? 'ADMIN_DASHBOARD' : (isProvider ? 'PROVIDER_DASHBOARD' : 'CLIENT_HOME');
                if (iconText === 'calendar_today' || iconText === 'event') return isAdmin ? 'ADMIN_MANAGE_BOOKINGS' : 'MY_BOOKINGS';
                if (iconText === 'mail' || iconText === 'chat') return 'MESSAGES';
                if (iconText === 'person' || iconText === 'account_circle') return isAdmin ? 'ADMIN_PROFILE_EDIT' : 'PROFILE';
                if (iconText === 'settings') return 'ADMIN_SETTINGS';

                // 2. Explicit label-based navigation
                const mappings = [
                    { keywords: ['find services', 'explore'], screen: 'FIND_SERVICES' },
                    { keywords: ['sign up as provider'], screen: currentScreen === 'PROVIDER_WELCOME' ? 'PROVIDER_SETUP' : 'PROVIDER_WELCOME' },
                    { keywords: ['sign up', 'create account'], screen: 'SIGNUP' },
                    { keywords: ['admin login'], screen: 'ADMIN_LOGIN' },
                    { keywords: ['provider login'], screen: 'PROVIDER_DASHBOARD' },
                    { keywords: ['log in', 'login', 'sign in'], screen: currentScreen === 'ADMIN_LOGIN' ? 'ADMIN_DASHBOARD' : (currentScreen === 'PROVIDER_WELCOME' ? 'PROVIDER_DASHBOARD' : (currentScreen === 'WELCOME' ? 'LOGIN' : 'CLIENT_HOME')) },
                    { keywords: ['continue as guest'], screen: 'CLIENT_HOME' },
                    { keywords: ['book now'], screen: 'BOOKING' },
                    { keywords: ['view profile'], screen: 'PROVIDER_PROFILE' },
                    { keywords: ['get started'], screen: currentScreen === 'PROVIDER_WELCOME' ? 'PROVIDER_SETUP' : 'SIGNUP' },
                    { keywords: ['complete setup', 'finish', 'save & continue'], screen: 'PROVIDER_DASHBOARD' },
                    { keywords: ['emergency clean'], screen: 'FEATURE_EMERGENCY_MODE' },
                    { keywords: ['event help'], screen: 'FIND_SERVICES' },
                    { keywords: ['subscribe'], screen: 'FEATURE_SMART_NOTIFICATIONS' },
                    { keywords: ['requests'], screen: 'PROVIDER_REQUESTS' },
                    { keywords: ['schedule'], screen: 'PROVIDER_SCHEDULE' },
                    { keywords: ['earnings'], screen: 'PROVIDER_DASHBOARD_2' },
                    { keywords: ['clients'], screen: 'PROVIDER_CLIENTS' },
                    { keywords: ['manage users'], screen: 'ADMIN_MANAGE_USERS' },
                    { keywords: ['manage bookings'], screen: 'ADMIN_MANAGE_BOOKINGS' },
                    { keywords: ['verify providers'], screen: 'ADMIN_DASHBOARD_3' },
                    { keywords: ['reports'], screen: 'ADMIN_DASHBOARD_2' },
                    { keywords: ['settings'], screen: 'ADMIN_SETTINGS' },
                    { keywords: ['channels'], screen: 'CHANNELS' },
                ];

                for (const mapping of mappings) {
                    if (mapping.keywords.some(kw => label.includes(kw))) {
                        return mapping.screen;
                    }
                }

                return null;
            };

            useEffect(() => {
                const fetchContent = async () => {
                    setLoading(true);
                    try {
                        const path = `extracted_code/stitch_cleaners_hub/${SCREEN_MAP[screenKey]}`;
                        const response = await fetch(path);
                        const text = await response.text();

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');

                        // Extract Styles
                        const styleContent = Array.from(doc.querySelectorAll('style'))
                            .map(s => s.innerHTML)
                            .join('\n');
                        setStyles(styleContent);

                        // Extract Body Classes
                        setBodyClass(doc.body.className);

                        // Auth Mode Patching
                        if (screenKey === 'LOGIN' || screenKey === 'SIGNUP') {
                            const isLogin = screenKey === 'LOGIN';

                            // Toggle tabs
                            const tabs = doc.querySelectorAll('label');
                            tabs.forEach(tab => {
                                const input = tab.querySelector('input[name="auth-mode"]');
                                if (input) {
                                    const mode = input.value;
                                    if ((isLogin && mode === 'login') || (!isLogin && mode === 'signup')) {
                                        tab.classList.add('bg-primary');
                                        tab.querySelector('span').classList.remove('text-text-subtle');
                                        tab.querySelector('span').classList.add('text-white', 'font-semibold');
                                        input.checked = true;
                                    } else {
                                        tab.classList.remove('bg-primary');
                                        tab.querySelector('span').classList.remove('text-white', 'font-semibold');
                                        tab.querySelector('span').classList.add('text-text-subtle');
                                        input.checked = false;
                                    }
                                }
                            });

                            // Hide/Show fields
                            const fields = doc.querySelectorAll('.relative');
                            fields.forEach(field => {
                                const input = field.querySelector('input');
                                if (input) {
                                    const placeholder = input.placeholder.toLowerCase();
                                    if (isLogin && (placeholder.includes('name') || placeholder.includes('phone'))) {
                                        field.style.display = 'none';
                                    } else {
                                        field.style.display = 'block';
                                    }
                                }
                            });

                            // Hide ToS for login
                            const tos = doc.querySelector('label.flex.items-start');
                            if (tos && isLogin) tos.style.display = 'none';

                            // Update button text
                            const btn = doc.querySelector('button.bg-primary span');
                            if (btn) btn.innerText = isLogin ? 'Log In' : 'Create Account';

                            // Update footer link
                            const footer = doc.querySelector('.mt-auto.pt-6 p');
                            if (footer) {
                                footer.innerHTML = isLogin ?
                                    'Don\'t have an account? <a class="font-semibold text-primary hover:text-primary-dark transition-colors" href="#">Sign Up</a>' :
                                    'Already have an account? <a class="font-semibold text-primary hover:text-primary-dark transition-colors" href="#">Login</a>';
                            }
                        }

                        // Extract Body Content
                        const bodyContent = doc.body.innerHTML;
                        setHtml(bodyContent);
                    } catch (error) {
                        console.error('Failed to load screen:', error);
                        setHtml('<div class="p-10 text-center">Failed to load screen.</div>');
                    }
                    setLoading(false);
                };
                fetchContent();
            }, [screenKey]);

            // Execute scripts and attach listeners
            useEffect(() => {
                if (!loading && containerRef.current) {
                    const container = containerRef.current;

                    // 1. Manually execute any script tags found in the HTML
                    // Note: This is simplified for the demo/prototype
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });

                    // 2. Attach Click Listeners for Navigation
                    const handleGlobalClick = (e) => {
                        // Special handling for auth mode tabs
                        const tabLabel = e.target.closest('label');
                        if (tabLabel && tabLabel.querySelector('input[name="auth-mode"]')) {
                            const input = tabLabel.querySelector('input');
                            onNavigate(input.value === 'login' ? 'LOGIN' : 'SIGNUP');
                            e.preventDefault();
                            return;
                        }

                        // Handle Back Navigation
                        const backIcon = e.target.closest('.material-symbols-outlined, .material-icons-round');
                        if (backIcon && ['arrow_back', 'chevron_left', 'arrow_back_ios'].includes(backIcon.innerText.trim())) {
                            window.dispatchEvent(new CustomEvent('goBack'));
                            return;
                        }

                        const target = e.target.closest('button, a, [role="button"]');
                        if (!target) return;

                        const nextScreen = resolveNavigation(target.innerText, target, screenKey);
                        if (nextScreen) {
                            onNavigate(nextScreen);
                        }
                    };

                    container.addEventListener('click', handleGlobalClick);
                    return () => container.removeEventListener('click', handleGlobalClick);
                }
            }, [html, loading, screenKey, onNavigate]);

            return (
                <div className={`h-full flex flex-col ${bodyClass}`}>
                    <style dangerouslySetInnerHTML={{ __html: styles }} />
                    {loading ? (
                        <div className="flex-1 flex items-center justify-center">
                            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-[#87CEEB]"></div>
                        </div>
                    ) : (
                        <div
                            ref={containerRef}
                            className="flex-1"
                            dangerouslySetInnerHTML={{ __html: html }}
                        />
                    )}
                </div>
            );
        };

        const App = () => {
            const [history, setHistory] = useState(['WELCOME']);
            const [devMenuOpen, setDevMenuOpen] = useState(false);

            const screen = history[history.length - 1];

            const navigate = (newScreen) => {
                if (SCREEN_MAP[newScreen]) {
                    setHistory(prev => [...prev, newScreen]);
                }
            };

            const goBack = () => {
                if (history.length > 1) {
                    setHistory(prev => prev.slice(0, -1));
                }
            };

            useEffect(() => {
                const handleExternalNavigate = (e) => navigate(e.detail);
                const handleGoBack = () => goBack();
                window.addEventListener('navigate', handleExternalNavigate);
                window.addEventListener('goBack', handleGoBack);
                return () => {
                    window.removeEventListener('navigate', handleExternalNavigate);
                    window.removeEventListener('goBack', handleGoBack);
                };
            }, [history]);

            return (
                <div className="app-shell">
                    <div className="screen-container slide-in" key={screen}>
                        <Screen screenKey={screen} onNavigate={navigate} />
                    </div>

                    {/* Quick Access Dev Menu */}
                    <div className="dev-menu-btn" role="button" aria-label="menu" onClick={() => setDevMenuOpen(!devMenuOpen)}>
                        <span className="material-symbols-outlined">menu</span>
                    </div>

                    {devMenuOpen && (
                        <div className="dev-menu">
                            <div className="text-[10px] font-bold text-gray-400 mb-2 px-3 uppercase tracking-wider">Main Screens</div>
                            <button onClick={() => { navigate('WELCOME'); setDevMenuOpen(false); }}>Welcome</button>
                            <button onClick={() => { navigate('LOGIN'); setDevMenuOpen(false); }}>Login</button>
                            <button onClick={() => { navigate('SIGNUP'); setDevMenuOpen(false); }}>Signup</button>

                            <div className="text-[10px] font-bold text-gray-400 mt-4 mb-2 px-3 uppercase tracking-wider">Client Flow</div>
                            <button onClick={() => { navigate('CLIENT_HOME'); setDevMenuOpen(false); }}>Home Dashboard</button>
                            <button onClick={() => { navigate('FIND_SERVICES'); setDevMenuOpen(false); }}>Find Services</button>
                            <button onClick={() => { navigate('BOOKING'); setDevMenuOpen(false); }}>Booking Screen</button>
                            <button onClick={() => { navigate('MY_BOOKINGS'); setDevMenuOpen(false); }}>My Bookings</button>
                            <button onClick={() => { navigate('MESSAGES'); setDevMenuOpen(false); }}>Messages</button>
                            <button onClick={() => { navigate('PROFILE'); setDevMenuOpen(false); }}>Profile</button>

                            <div className="text-[10px] font-bold text-gray-400 mt-4 mb-2 px-3 uppercase tracking-wider">Provider Flow</div>
                            <button onClick={() => { navigate('PROVIDER_WELCOME'); setDevMenuOpen(false); }}>Provider Welcome</button>
                            <button onClick={() => { navigate('PROVIDER_SETUP'); setDevMenuOpen(false); }}>Provider Setup</button>
                            <button onClick={() => { navigate('PROVIDER_DASHBOARD'); setDevMenuOpen(false); }}>Provider Dashboard</button>
                            <button onClick={() => { navigate('PROVIDER_SCHEDULE'); setDevMenuOpen(false); }}>My Schedule</button>
                            <button onClick={() => { navigate('PROVIDER_REQUESTS'); setDevMenuOpen(false); }}>Booking Requests</button>

                            <div className="text-[10px] font-bold text-gray-400 mt-4 mb-2 px-3 uppercase tracking-wider">Admin Panel</div>
                            <button onClick={() => { navigate('ADMIN_LOGIN'); setDevMenuOpen(false); }}>Admin Login</button>
                            <button onClick={() => { navigate('ADMIN_DASHBOARD'); setDevMenuOpen(false); }}>Admin Dashboard</button>
                            <button onClick={() => { navigate('ADMIN_MANAGE_USERS'); setDevMenuOpen(false); }}>Manage Users</button>
                            <button onClick={() => { navigate('ADMIN_MANAGE_BOOKINGS'); setDevMenuOpen(false); }}>Manage Bookings</button>

                            <div className="text-[10px] font-bold text-gray-400 mt-4 mb-2 px-3 uppercase tracking-wider">Features</div>
                            <button onClick={() => { navigate('FEATURE_EMERGENCY_MODE'); setDevMenuOpen(false); }}>Emergency Mode</button>
                            <button onClick={() => { navigate('FEATURE_EASY_PAYMENTS'); setDevMenuOpen(false); }}>Easy Payments</button>
                            <button onClick={() => { navigate('FEATURE_REAL_TIME_TRACKING'); setDevMenuOpen(false); }}>Real-time Tracking</button>

                            <div className="mt-2 pt-2 border-t border-gray-100 text-[9px] text-center text-gray-400">
                                Prototype Navigation Control
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
