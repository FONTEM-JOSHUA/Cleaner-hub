<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner Hub - Home Service Professional Platform</title>
    <!-- Load React, ReactDOM, and Babel from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Material Icons and Symbols -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Montserrat', sans-serif;
            background-color: #f5f5f5;
        }
        #root {
            min-height: 100vh;
        }
        .app-shell {
            max-width: 450px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .screen-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }
        /* Custom scrollbar for a better look */
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 2px;
        }
        .screen-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Water Ripple Effect */
        .ripple {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-effect 0.6s linear;
            pointer-events: none;
        }
        @keyframes ripple-effect {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Sparkle Effect */
        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            animation: sparkle-animation 0.8s ease-out forwards;
        }
        @keyframes sparkle-animation {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        /* Screen Transitions */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .screen-fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        /* Floating Action Menu for Demo */
        .dev-menu-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #87CEEB;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .dev-menu-btn:hover {
            opacity: 1;
        }
        .dev-menu {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 10px;
            z-index: 1001;
            width: 200px;
            border: 1px solid #eee;
        }
        .dev-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            transition: background 0.2s;
        }
        .dev-menu button:hover {
            background: #f0f9ff;
            color: #87CEEB;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SCREEN_MAP = {
            'WELCOME': 'welcome_screen/code.html',
            'SIGNUP': 'login/signup_screen/code.html',
            'LOGIN': 'login/signup_screen/code.html',
            'CLIENT_HOME': 'home_screen_(main_dashboard)_for_client_app/code.html',
            'FIND_SERVICES': 'find_services_screen_for_client_app/code.html',
            'PROVIDER_PROFILE': 'service_provider_profile_screen_for_client_app/code.html',
            'PROVIDER_PROFILE_PUBLIC': 'provider_profile_(public_view)_screen/code.html',
            'BOOKING': 'booking_screen_for_client_app/code.html',
            'MY_BOOKINGS': 'my_bookings_screen_for_client_app_1/code.html',
            'MY_BOOKINGS_2': 'my_bookings_screen_for_client_app_2/code.html',
            'MY_BOOKINGS_3': 'my_bookings_screen_for_client_app_3/code.html',
            'MESSAGES': 'messages_screen_for_client_app/code.html',
            'CHANNELS_CLIENT': 'channels_screen_(client_app_flow)_/code.html',
            'PROFILE': 'profile_screen_for_client_app/code.html',
            'REPORT_PROVIDER': 'report_provider_screen_for_client_app/code.html',
            'REPORT_CONFIRMATION': 'report_confirmation_screen/code.html',

            'PROVIDER_WELCOME': 'provider_welcome_screen/code.html',
            'PROVIDER_SETUP': 'provider_setup_screen/code.html',
            'PROVIDER_DASHBOARD': 'provider_dashboard_screen_1/code.html',
            'PROVIDER_DASHBOARD_2': 'provider_dashboard_screen_2/code.html',
            'PROVIDER_SCHEDULE': 'my_schedule_screen_for_provider_app/code.html',
            'PROVIDER_REQUESTS': 'booking_requests_screen_for_provider_app/code.html',
            'PROVIDER_CLIENTS': 'my_clients_screen_for_provider_app_(with_report_feature)/code.html',
            'REPORT_CLIENT': 'report_client_screen_for_provider_app/code.html',
            'CLIENT_REPORT_CONFIRMATION': 'client_report_confirmation_screen_(provider_app)_/code.html',

            'ADMIN_LOGIN': 'admin_login_screen/code.html',
            'ADMIN_DASHBOARD': 'admin_dashboard_screen_1/code.html',
            'ADMIN_DASHBOARD_2': 'admin_dashboard_screen_2/code.html',
            'ADMIN_DASHBOARD_3': 'admin_dashboard_screen_3/code.html',
            'ADMIN_DASHBOARD_4': 'admin_dashboard_screen_4/code.html',
            'ADMIN_MANAGE_USERS': 'manage_users_screen_for_admin_app/code.html',
            'ADMIN_MANAGE_BOOKINGS': 'manage_bookings_screen_for_admin_app/code.html',
            'ADMIN_PROFILE_EDIT': 'admin_profile_edit_screen/code.html',
            'ADMIN_SETTINGS': 'app_settings_screen_for_admin_app/code.html',

            'CHANNEL_MANAGEMENT': 'channel_management_screen_(provider/admin_app)_/code.html',
            'CHANNEL_MEMBER_MANAGEMENT': 'channel_member_management_screen_(provider/admin_app)_/code.html',
            'CREATE_CHANNEL': 'create_new_channel_flow_(provider/admin_app)_/code.html',

            'FEATURE_EASY_PAYMENTS': 'easy_payments_feature_screen/code.html',
            'FEATURE_EMERGENCY_MODE': 'emergency_mode_feature_screen/code.html',
            'FEATURE_FAMILY_SHARING': 'family_sharing_feature_screen/code.html',
            'FEATURE_MULTI_LANGUAGE': 'multi-language_support_screen/code.html',
            'FEATURE_OFFLINE_MODE': 'offline_mode_feature_screen/code.html',
            'FEATURE_PHOTO_VERIFICATION': 'photo_verification_feature_screen/code.html',
            'FEATURE_QUICK_REBOOKING': 'quick_rebooking_feature_screen/code.html',
            'FEATURE_REAL_TIME_TRACKING': 'real-time_tracking_screen/code.html',
            'FEATURE_SMART_NOTIFICATIONS': 'smart_notifications_feature_screen/code.html',
            'FEATURE_SMART_SEARCH': 'smart_search_screen/code.html'
        };

        const Screen = ({ screenKey, onNavigate }) => {
            const [html, setHtml] = useState('');
            const [styles, setStyles] = useState('');
            const [loading, setLoading] = useState(true);
            const containerRef = useRef(null);

            useEffect(() => {
                const fetchContent = async () => {
                    setLoading(true);
                    try {
                        const path = `extracted_code/stitch_cleaners_hub/${SCREEN_MAP[screenKey]}`;
                        const response = await fetch(path);
                        const text = await response.text();

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');

                        // 1. Auth Mode Patching (if LOGIN mode)
                        if (screenKey === 'LOGIN') {
                            const tabs = doc.querySelectorAll('label.group');
                            if (tabs.length >= 2) {
                                // Deactivate Sign Up
                                tabs[1].classList.remove('bg-primary', 'shadow-sm');
                                const signupText = tabs[1].querySelector('span');
                                if (signupText) {
                                    signupText.classList.remove('text-white', 'font-semibold');
                                    signupText.classList.add('text-text-subtle', 'dark:text-gray-400');
                                }

                                // Activate Login
                                tabs[0].classList.add('bg-primary', 'shadow-sm');
                                const loginText = tabs[0].querySelector('span');
                                if (loginText) {
                                    loginText.classList.add('text-white', 'font-semibold');
                                    loginText.classList.remove('text-text-subtle', 'dark:text-gray-400');
                                }
                            }

                            const inputs = doc.querySelectorAll('input[placeholder]');
                            if (inputs.length > 2) {
                                // Remove Name and Phone for Login (index 0 and 2)
                                if (inputs[0]) inputs[0].closest('.relative')?.remove();
                                if (inputs[2]) inputs[2].closest('.relative')?.remove();
                            }

                            const checkbox = doc.querySelector('input[type="checkbox"]')?.closest('label');
                            if (checkbox) checkbox.remove();

                            const submitBtn = doc.querySelector('.mt-8 button span:not(.material-symbols-outlined)');
                            if (submitBtn) submitBtn.innerText = 'Log In';

                            const footer = doc.querySelector('.mt-auto.pt-6');
                            if (footer) {
                                footer.innerHTML = `
                                    <p class="text-sm text-text-subtle dark:text-gray-400">
                                        Don't have an account?
                                        <a class="font-semibold text-primary hover:text-primary-dark transition-colors" href="#">Sign Up</a>
                                    </p>
                                `;
                            }

                            const subtext = doc.querySelector('p.text-text-subtle');
                            if (subtext) subtext.innerText = 'Welcome back! Please login to your account.';
                        }

                        // Extract Styles
                        const styleContent = Array.from(doc.querySelectorAll('style'))
                            .map(s => s.innerHTML)
                            .join('\n');
                        setStyles(styleContent);

                        // Extract Body Content
                        const bodyContent = doc.body.innerHTML;
                        setHtml(bodyContent);
                    } catch (error) {
                        console.error('Failed to load screen:', error);
                        setHtml('<div class="p-10 text-center">Failed to load screen.</div>');
                    }
                    setLoading(false);
                };
                fetchContent();
            }, [screenKey]);

            // Execute scripts and attach listeners
            useEffect(() => {
                if (!loading && containerRef.current) {
                    const container = containerRef.current;

                    // Ensure all clickable elements have cursor-pointer
                    container.querySelectorAll('button, .grid > div, [role="button"]').forEach(el => {
                        el.classList.add('cursor-pointer');
                    });

                    // 1. Manually execute any script tags found in the HTML
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        document.head.appendChild(newScript);
                        newScript.setAttribute('data-screen-assets', 'true');
                    });

                    // Cleanup screen-specific assets
                    return () => {
                        document.querySelectorAll('[data-screen-assets]').forEach(el => el.remove());
                    };
                }
            }, [html, loading, screenKey]);

            useEffect(() => {
                if (!loading && containerRef.current) {
                    const container = containerRef.current;

                    // 2. Attach Global Interactions Handler
                    const handleInteractions = (e) => {
                        // A. Ripple Effect
                        const rect = e.target.getBoundingClientRect();
                        const ripple = document.createElement('span');
                        const size = Math.max(rect.width, rect.height);
                        ripple.style.width = ripple.style.height = `${size}px`;
                        ripple.style.left = `${e.clientX - rect.left - size / 2}px`;
                        ripple.style.top = `${e.clientY - rect.top - size / 2}px`;
                        ripple.classList.add('ripple');

                        const rippleContainer = e.target.closest('button, .grid > div, [role="button"]') || e.target;
                        if (rippleContainer.tagName === 'BUTTON' || rippleContainer.classList.contains('cursor-pointer')) {
                            rippleContainer.style.position = 'relative';
                            rippleContainer.style.overflow = 'hidden';
                            rippleContainer.appendChild(ripple);
                            setTimeout(() => ripple.remove(), 600);
                        }

                        // B. Navigation Logic Heuristics
                        const target = e.target.closest('button, a, [role="button"], .grid > div, label.group');
                        if (!target) return;

                        const text = target.innerText.trim().toLowerCase().replace(/\s+/g, ' ');
                        const symbols = target.querySelector('.material-symbols-outlined, .material-icons-round')?.innerText || '';

                        // Sparkle effect for "success" actions
                        if (text.includes('confirm') || text.includes('complete') || text.includes('save') || text.includes('accept') || text.includes('book this')) {
                            for (let i = 0; i < 8; i++) {
                                const sparkle = document.createElement('div');
                                sparkle.classList.add('sparkle');
                                sparkle.style.backgroundColor = ['#87CEEB', '#FFD700', '#FF69B4'][Math.floor(Math.random() * 3)];
                                sparkle.style.left = `${e.clientX}px`;
                                sparkle.style.top = `${e.clientY}px`;
                                sparkle.style.setProperty('--tx', `${(Math.random() - 0.5) * 100}px`);
                                sparkle.style.setProperty('--ty', `${(Math.random() - 0.5) * 100}px`);
                                document.body.appendChild(sparkle);
                                setTimeout(() => sparkle.remove(), 800);
                            }
                        }

                        // Global Back Navigation
                        if (symbols === 'arrow_back' || text === 'back' || symbols === 'chevron_left') {
                            window.dispatchEvent(new CustomEvent('goBack'));
                            return;
                        }

                        // Role-specific Navigation
                        if (text.includes('sign up') || text.includes('create account')) {
                            if (text.includes('provider')) onNavigate('PROVIDER_WELCOME');
                            else if (screenKey === 'SIGNUP') onNavigate('CLIENT_HOME');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('log in') || text.includes('login') || text.includes('sign in')) {
                            if (text.includes('admin')) onNavigate('ADMIN_LOGIN');
                            else if (screenKey === 'ADMIN_LOGIN') onNavigate('ADMIN_DASHBOARD');
                            else if (screenKey === 'WELCOME' || screenKey === 'SIGNUP') onNavigate('LOGIN');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('continue as guest')) {
                            onNavigate('CLIENT_HOME');
                        } else if (text.includes('book now')) {
                            onNavigate('BOOKING');
                        } else if (text.includes('find services') || text.includes('explore')) {
                            onNavigate('FIND_SERVICES');
                        } else if (text.includes('view profile')) {
                            onNavigate('PROVIDER_PROFILE');
                        } else if (text.includes('get started')) {
                            if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('save & continue') || text.includes('complete setup') || text.includes('finish')) {
                            onNavigate('PROVIDER_DASHBOARD');
                        } else if (text.includes('emergency clean') || text.includes('emergency') || symbols === 'emergency') {
                            onNavigate('FEATURE_EMERGENCY_MODE');
                        } else if (text.includes('my schedule') || symbols === 'calendar_month') {
                            onNavigate('PROVIDER_SCHEDULE');
                        } else if (text.includes('new requests') || symbols === 'pending_actions') {
                            onNavigate('PROVIDER_REQUESTS');
                        } else if (text.includes('my clients') || symbols === 'group') {
                            onNavigate('PROVIDER_CLIENTS');
                        } else if (text.includes('manage users') || symbols === 'manage_accounts') {
                            onNavigate('ADMIN_MANAGE_USERS');
                        } else if (text.includes('manage bookings') || symbols === 'list_alt') {
                            onNavigate('ADMIN_MANAGE_BOOKINGS');
                        } else if (text.includes('verify providers') || symbols === 'verified_user') {
                            onNavigate('ADMIN_DASHBOARD_3'); // Mocked approval screen
                        } else if (text.includes('view reports') || symbols === 'bar_chart') {
                            onNavigate('ADMIN_DASHBOARD_4');
                        } else if (text.includes('support tickets') || symbols === 'confirmation_number') {
                            onNavigate('ADMIN_DASHBOARD_2');
                        } else if (text.includes('home') || symbols === 'home') {
                            if (screenKey.startsWith('ADMIN_')) onNavigate('ADMIN_DASHBOARD');
                            else if (screenKey.startsWith('PROVIDER_')) onNavigate('PROVIDER_DASHBOARD');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('bookings') || symbols === 'calendar_today' || symbols === 'event_note') {
                            onNavigate('MY_BOOKINGS');
                        } else if (text.includes('messages') || symbols === 'mail' || symbols === 'chat') {
                            if (screenKey.startsWith('PROVIDER_')) onNavigate('PROVIDER_DASHBOARD'); // Mocked
                            else onNavigate('MESSAGES');
                        } else if (text.includes('profile') || symbols === 'person' || symbols === 'account_circle') {
                            if (screenKey.startsWith('ADMIN_')) onNavigate('ADMIN_PROFILE_EDIT');
                            else onNavigate('PROFILE');
                        } else if (text.includes('log out')) {
                            onNavigate('WELCOME');
                        }
                    };

                    container.addEventListener('click', handleInteractions);
                    return () => container.removeEventListener('click', handleInteractions);
                }
            }, [html, loading, screenKey]);

            return (
                <div className="h-full flex flex-col">
                    <style dangerouslySetInnerHTML={{ __html: styles }} />
                    {loading ? (
                        <div className="flex-1 flex items-center justify-center">
                            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-[#87CEEB]"></div>
                        </div>
                    ) : (
                        <div
                            ref={containerRef}
                            className="flex-1"
                            dangerouslySetInnerHTML={{ __html: html }}
                        />
                    )}
                </div>
            );
        };

        const App = () => {
            const [history, setHistory] = useState(['WELCOME']);
            const [devMenuOpen, setDevMenuOpen] = useState(false);

            const screen = history[history.length - 1];

            const navigate = (newScreen) => {
                if (SCREEN_MAP[newScreen]) {
                    setHistory(prev => [...prev, newScreen]);
                }
            };

            const goBack = () => {
                if (history.length > 1) {
                    setHistory(prev => prev.slice(0, -1));
                }
            };

            useEffect(() => {
                const handleExternalNavigate = (e) => navigate(e.detail);
                const handleExternalGoBack = () => goBack();

                window.addEventListener('navigate', handleExternalNavigate);
                window.addEventListener('goBack', handleExternalGoBack);

                return () => {
                    window.removeEventListener('navigate', handleExternalNavigate);
                    window.removeEventListener('goBack', handleExternalGoBack);
                };
            }, [history]);

            return (
                <div className="app-shell">
                    <div className="screen-container" key={screen}>
                        <div className="h-full screen-fade-in">
                            <Screen screenKey={screen} onNavigate={navigate} />
                        </div>
                    </div>

                    {/* Quick Access Dev Menu */}
                    <div className="dev-menu-btn" onClick={() => setDevMenuOpen(!devMenuOpen)}>
                        <span className="material-symbols-outlined">menu</span>
                    </div>

                    {devMenuOpen && (
                        <div className="dev-menu">
                            <div className="text-[10px] font-bold text-gray-400 mb-2 px-3 uppercase tracking-wider">Switch Flow</div>
                            <button onClick={() => { navigate('WELCOME'); setDevMenuOpen(false); }}>Welcome Screen</button>
                            <button onClick={() => { navigate('CLIENT_HOME'); setDevMenuOpen(false); }}>Client App</button>
                            <button onClick={() => { navigate('PROVIDER_WELCOME'); setDevMenuOpen(false); }}>Provider App</button>
                            <button onClick={() => { navigate('ADMIN_LOGIN'); setDevMenuOpen(false); }}>Admin Panel</button>
                            <button onClick={() => { navigate('FEATURE_EMERGENCY_MODE'); setDevMenuOpen(false); }}>Emergency Mode</button>
                            <div className="mt-2 pt-2 border-t border-gray-100 text-[9px] text-center text-gray-400">
                                Prototype Navigation Control
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
