<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner Hub - Home Service Professional Platform</title>
    <!-- Load React, ReactDOM, and Babel from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Material Icons and Symbols -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Montserrat', sans-serif;
            background-color: #f5f5f5;
        }
        #root {
            min-height: 100vh;
        }
        .app-shell {
            max-width: 450px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .screen-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
        }
        .screen-transition {
            animation: slideIn 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Ripple Effect */
        .ripple {
            position: absolute;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
        }
        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Sparkle Animation */
        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 2000;
            animation: sparkle-fade 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes sparkle-fade {
            0% { transform: translate(0, 0) scale(0); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1); opacity: 0; }
        }
        /* Custom scrollbar for a better look */
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 2px;
        }
        .screen-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Floating Action Menu for Demo */
        .dev-menu-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #87CEEB;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .dev-menu-btn:hover {
            opacity: 1;
        }
        .dev-menu {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 10px;
            z-index: 1001;
            width: 200px;
            border: 1px solid #eee;
        }
        .dev-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            transition: background 0.2s;
        }
        .dev-menu button:hover {
            background: #f0f9ff;
            color: #87CEEB;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SCREEN_MAP = {
            'WELCOME': 'welcome_screen/code.html',
            'SIGNUP': 'login/signup_screen/code.html',
            'LOGIN': 'login/signup_screen/code.html',
            'CLIENT_HOME': 'home_screen_(main_dashboard)_for_client_app/code.html',
            'CLIENT_FIND_SERVICES': 'find_services_screen_for_client_app/code.html',
            'CLIENT_PROVIDER_PROFILE': 'service_provider_profile_screen_for_client_app/code.html',
            'CLIENT_BOOKING': 'booking_screen_for_client_app/code.html',
            'CLIENT_BOOKINGS_1': 'my_bookings_screen_for_client_app_1/code.html',
            'CLIENT_BOOKINGS_2': 'my_bookings_screen_for_client_app_2/code.html',
            'CLIENT_BOOKINGS_3': 'my_bookings_screen_for_client_app_3/code.html',
            'CLIENT_MESSAGES': 'messages_screen_for_client_app/code.html',
            'CLIENT_PROFILE': 'profile_screen_for_client_app/code.html',
            'CLIENT_CHANNELS': 'channels_screen_(client_app_flow)_/code.html',
            'CLIENT_REPORT_PROVIDER': 'report_provider_screen_for_client_app/code.html',

            'PROVIDER_WELCOME': 'provider_welcome_screen/code.html',
            'PROVIDER_SETUP': 'provider_setup_screen/code.html',
            'PROVIDER_DASHBOARD_1': 'provider_dashboard_screen_1/code.html',
            'PROVIDER_DASHBOARD_2': 'provider_dashboard_screen_2/code.html',
            'PROVIDER_SCHEDULE': 'my_schedule_screen_for_provider_app/code.html',
            'PROVIDER_BOOKING_REQUESTS': 'booking_requests_screen_for_provider_app/code.html',
            'PROVIDER_CLIENTS': 'my_clients_screen_for_provider_app_(with_report_feature)/code.html',
            'PROVIDER_REPORT_CLIENT': 'report_client_screen_for_provider_app/code.html',
            'PROVIDER_REPORT_CONFIRMATION': 'client_report_confirmation_screen_(provider_app)_/code.html',
            'PROVIDER_PROFILE_PUBLIC': 'provider_profile_(public_view)_screen/code.html',

            'ADMIN_LOGIN': 'admin_login_screen/code.html',
            'ADMIN_DASHBOARD_1': 'admin_dashboard_screen_1/code.html',
            'ADMIN_DASHBOARD_2': 'admin_dashboard_screen_2/code.html',
            'ADMIN_DASHBOARD_3': 'admin_dashboard_screen_3/code.html',
            'ADMIN_DASHBOARD_4': 'admin_dashboard_screen_4/code.html',
            'ADMIN_MANAGE_USERS': 'manage_users_screen_for_admin_app/code.html',
            'ADMIN_MANAGE_BOOKINGS': 'manage_bookings_screen_for_admin_app/code.html',
            'ADMIN_PROFILE_EDIT': 'admin_profile_edit_screen/code.html',
            'ADMIN_SETTINGS': 'app_settings_screen_for_admin_app/code.html',

            'CHANNEL_MANAGEMENT': 'channel_management_screen_(provider/admin_app)_/code.html',
            'CHANNEL_MEMBER_MANAGEMENT': 'channel_member_management_screen_(provider/admin_app)_/code.html',
            'CREATE_CHANNEL': 'create_new_channel_flow_(provider/admin_app)_/code.html',

            'EASY_PAYMENTS': 'easy_payments_feature_screen/code.html',
            'EMERGENCY_MODE': 'emergency_mode_feature_screen/code.html',
            'FAMILY_SHARING': 'family_sharing_feature_screen/code.html',
            'OFFLINE_MODE': 'offline_mode_feature_screen/code.html',
            'PHOTO_VERIFICATION': 'photo_verification_feature_screen/code.html',
            'QUICK_REBOOKING': 'quick_rebooking_feature_screen/code.html',
            'REAL_TIME_TRACKING': 'real-time_tracking_screen/code.html',
            'SMART_NOTIFICATIONS': 'smart_notifications_feature_screen/code.html',
            'SMART_SEARCH': 'smart_search_screen/code.html',
            'MULTI_LANGUAGE': 'multi-language_support_screen/code.html',
            'REPORT_CONFIRMATION': 'report_confirmation_screen/code.html'
        };

        const Screen = ({ screenKey, onNavigate }) => {
            const [html, setHtml] = useState('');
            const [styles, setStyles] = useState('');
            const [bodyClass, setBodyClass] = useState('');
            const [loading, setLoading] = useState(true);
            const containerRef = useRef(null);

            useEffect(() => {
                const fetchContent = async () => {
                    setLoading(true);
                    try {
                        const path = `extracted_code/stitch_cleaners_hub/${SCREEN_MAP[screenKey]}`;
                        const response = await fetch(path);
                        const text = await response.text();

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');

                        // Extract Styles and Links
                        const styleContent = Array.from(doc.querySelectorAll('style'))
                            .map(s => s.outerHTML)
                            .join('\n');
                        const linkContent = Array.from(doc.querySelectorAll('link[rel="stylesheet"]'))
                            .map(l => l.outerHTML)
                            .join('\n');

                        setStyles(linkContent + '\n' + styleContent);
                        setBodyClass(doc.body.className);

                        // Extract Body Content (excluding scripts which we'll handle separately)
                        let bodyContent = doc.body.innerHTML;

                        // Auth Mode Patching
                        if (screenKey === 'LOGIN' || screenKey === 'SIGNUP') {
                            const isLogin = screenKey === 'LOGIN';
                            const tempDiv = document.createElement('div');
                            tempDiv.innerHTML = bodyContent;

                            // Toggle segmented control
                            const tabs = Array.from(tempDiv.querySelectorAll('label'));
                            const loginTab = tabs.find(t => t.innerText.toLowerCase().includes('login'));
                            const signupTab = tabs.find(t => t.innerText.toLowerCase().includes('sign up'));

                            if (loginTab && signupTab) {
                                if (isLogin) {
                                    loginTab.classList.add('bg-primary');
                                    loginTab.querySelector('span').classList.replace('text-text-subtle', 'text-white');
                                    loginTab.querySelector('span').classList.add('font-semibold');

                                    signupTab.classList.remove('bg-primary');
                                    signupTab.querySelector('span').classList.replace('text-white', 'text-text-subtle');
                                    signupTab.querySelector('span').classList.remove('font-semibold');
                                } else {
                                    signupTab.classList.add('bg-primary');
                                    signupTab.querySelector('span').classList.replace('text-text-subtle', 'text-white');
                                    signupTab.querySelector('span').classList.add('font-semibold');

                                    loginTab.classList.remove('bg-primary');
                                    loginTab.querySelector('span').classList.replace('text-white', 'text-text-subtle');
                                    loginTab.querySelector('span').classList.remove('font-semibold');
                                }
                            }

                            // Hide fields for Login
                            if (isLogin) {
                                const fields = tempDiv.querySelectorAll('.relative:has(input)');
                                fields.forEach(field => {
                                    const placeholder = field.querySelector('input')?.placeholder?.toLowerCase() || '';
                                    if (placeholder.includes('name') || placeholder.includes('phone')) {
                                        field.style.display = 'none';
                                    }
                                });
                                // Hide terms
                                const terms = tempDiv.querySelector('label.flex.items-start');
                                if (terms) terms.style.display = 'none';

                                // Change button text
                                const btnSpan = tempDiv.querySelector('button.bg-primary span');
                                if (btnSpan) btnSpan.innerText = 'Log In';

                                // Change footer
                                const footer = tempDiv.querySelector('.mt-auto p');
                                if (footer) {
                                    footer.innerHTML = `Don't have an account? <a class="font-semibold text-primary hover:text-primary-dark transition-colors" href="#">Sign Up</a>`;
                                }
                            }

                            bodyContent = tempDiv.innerHTML;
                        }

                        setHtml(bodyContent);
                    } catch (error) {
                        console.error('Failed to load screen:', error);
                        setHtml('<div class="p-10 text-center">Failed to load screen.</div>');
                    }
                    setLoading(false);
                };
                fetchContent();
            }, [screenKey]);

            // Execute scripts and attach listeners
            useEffect(() => {
                if (!loading && containerRef.current) {
                    const container = containerRef.current;

                    // 1. Manually execute any script tags found in the HTML content
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.innerHTML = oldScript.innerHTML;
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });

                    // 2. Attach Click Listeners for Navigation
                    const handleGlobalClick = (e) => {
                        const target = e.target.closest('button, a, [role="button"], span.material-symbols-outlined, span.material-icons-round, label');
                        if (!target) return;

                        // Water Ripple Effect
                        const rect = target.getBoundingClientRect();
                        const ripple = document.createElement('span');
                        const size = Math.max(rect.width, rect.height);
                        const x = e.clientX - rect.left - size / 2;
                        const y = e.clientY - rect.top - size / 2;

                        ripple.style.width = ripple.style.height = `${size}px`;
                        ripple.style.left = `${x}px`;
                        ripple.style.top = `${y}px`;
                        ripple.classList.add('ripple');

                        // Ensure target has relative position
                        if (getComputedStyle(target).position === 'static') {
                            target.style.position = 'relative';
                        }
                        target.style.overflow = 'hidden';
                        target.appendChild(ripple);
                        setTimeout(() => ripple.remove(), 600);

                        const text = target.innerText.trim().toLowerCase().replace(/\s+/g, ' ');
                        const role = screenKey.startsWith('ADMIN') ? 'ADMIN' : (screenKey.startsWith('PROVIDER') ? 'PROVIDER' : 'CLIENT');

                        // Sparkle Effect for specific actions
                        if (text.includes('confirm') || text.includes('save') || text.includes('complete') || text.includes('log in') || text.includes('sign up') || text.includes('create account')) {
                            for (let i = 0; i < 8; i++) {
                                const sparkle = document.createElement('div');
                                sparkle.className = 'sparkle';
                                sparkle.style.left = `${e.clientX}px`;
                                sparkle.style.top = `${e.clientY}px`;
                                sparkle.style.backgroundColor = ['#87CEEB', '#FFD700', '#FF69B4', '#00FF7F'][Math.floor(Math.random() * 4)];
                                sparkle.style.setProperty('--tx', `${(Math.random() - 0.5) * 100}px`);
                                sparkle.style.setProperty('--ty', `${(Math.random() - 0.5) * 100}px`);
                                document.body.appendChild(sparkle);
                                setTimeout(() => sparkle.remove(), 800);
                            }
                        }

                        // Back Navigation
                        if (text === 'arrow_back' || text === 'chevron_left' || target.classList.contains('back-btn')) {
                            window.dispatchEvent(new CustomEvent('goBack'));
                            return;
                        }

                        // Navigation Logic Heuristics
                        if (text.includes('sign up') || text.includes('create account')) {
                            if (text.includes('provider')) onNavigate('PROVIDER_WELCOME');
                            else if (screenKey === 'SIGNUP') onNavigate('CLIENT_HOME');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('log in') || text.includes('login') || text.includes('sign in')) {
                            if (text.includes('admin')) onNavigate('ADMIN_LOGIN');
                            else if (screenKey === 'ADMIN_LOGIN') onNavigate('ADMIN_DASHBOARD_1');
                            else if (screenKey === 'WELCOME') onNavigate('LOGIN');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('continue as guest')) {
                            onNavigate('CLIENT_HOME');
                        } else if (text.includes('book now')) {
                            onNavigate('CLIENT_BOOKING');
                        } else if (text.includes('find services') || text.includes('explore')) {
                            onNavigate('CLIENT_FIND_SERVICES');
                        } else if (text.includes('view profile')) {
                            onNavigate('CLIENT_PROVIDER_PROFILE');
                        } else if (text.includes('get started')) {
                            if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('save & continue') || text.includes('complete setup') || text.includes('finish')) {
                            if (role === 'PROVIDER') onNavigate('PROVIDER_DASHBOARD_1');
                        } else if (text === 'home' || text.includes('dashboard') || target.querySelector('.material-symbols-outlined')?.innerText === 'home') {
                            if (role === 'ADMIN') onNavigate('ADMIN_DASHBOARD_1');
                            else if (role === 'PROVIDER') onNavigate('PROVIDER_DASHBOARD_1');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('bookings') || text.includes('schedule') || target.querySelector('.material-symbols-outlined')?.innerText === 'calendar_today') {
                            if (role === 'PROVIDER') onNavigate('PROVIDER_SCHEDULE');
                            else if (role === 'ADMIN') onNavigate('ADMIN_MANAGE_BOOKINGS');
                            else onNavigate('CLIENT_BOOKINGS_1');
                        } else if (text.includes('messages') || target.querySelector('.material-symbols-outlined')?.innerText === 'mail' || target.querySelector('.material-symbols-outlined')?.innerText === 'chat') {
                            if (role === 'PROVIDER') onNavigate('PROVIDER_DASHBOARD_1'); // Or provider messages if existed
                            else onNavigate('CLIENT_MESSAGES');
                        } else if (text.includes('profile') || target.querySelector('.material-symbols-outlined')?.innerText === 'person') {
                            if (role === 'ADMIN') onNavigate('ADMIN_PROFILE_EDIT');
                            else onNavigate('CLIENT_PROFILE');
                        } else if (text.includes('emergency')) {
                            onNavigate('EMERGENCY_MODE');
                        } else if (text.includes('family')) {
                            onNavigate('FAMILY_SHARING');
                        } else if (text.includes('payment')) {
                            onNavigate('EASY_PAYMENTS');
                        } else if (text.includes('notification')) {
                            onNavigate('SMART_NOTIFICATIONS');
                        } else if (text.includes('search')) {
                            onNavigate('SMART_SEARCH');
                        } else if (text.includes('language')) {
                            onNavigate('MULTI_LANGUAGE');
                        } else if (text.includes('manage users')) {
                            onNavigate('ADMIN_MANAGE_USERS');
                        } else if (text.includes('manage bookings')) {
                            onNavigate('ADMIN_MANAGE_BOOKINGS');
                        } else if (text.includes('settings')) {
                            if (role === 'ADMIN') onNavigate('ADMIN_SETTINGS');
                        }
                    };

                    container.addEventListener('click', handleGlobalClick);
                    return () => container.removeEventListener('click', handleGlobalClick);
                }
            }, [html, loading, screenKey]);

            return (
                <div className={`h-full flex flex-col ${bodyClass}`}>
                    <div dangerouslySetInnerHTML={{ __html: styles }} />
                    {loading ? (
                        <div className="flex-1 flex items-center justify-center">
                            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-[#87CEEB]"></div>
                        </div>
                    ) : (
                        <div
                            ref={containerRef}
                            key={screenKey}
                            className="flex-1 screen-transition"
                            dangerouslySetInnerHTML={{ __html: html }}
                        />
                    )}
                </div>
            );
        };

        const App = () => {
            const [screen, setScreen] = useState('WELCOME');
            const [history, setHistory] = useState(['WELCOME']);
            const [devMenuOpen, setDevMenuOpen] = useState(false);

            const navigate = (newScreen, pushHistory = true) => {
                if (SCREEN_MAP[newScreen]) {
                    setScreen(newScreen);
                    if (pushHistory) {
                        setHistory(prev => [...prev, newScreen]);
                    }
                }
            };

            const goBack = () => {
                if (history.length > 1) {
                    const newHistory = [...history];
                    newHistory.pop();
                    const prevScreen = newHistory[newHistory.length - 1];
                    setHistory(newHistory);
                    setScreen(prevScreen);
                }
            };

            useEffect(() => {
                const handleExternalNavigate = (e) => navigate(e.detail);
                const handleGoBack = () => goBack();

                window.addEventListener('navigate', handleExternalNavigate);
                window.addEventListener('goBack', handleGoBack);

                return () => {
                    window.removeEventListener('navigate', handleExternalNavigate);
                    window.removeEventListener('goBack', handleGoBack);
                };
            }, [history]);

            return (
                <div className="app-shell">
                    <div className="screen-container">
                        <Screen screenKey={screen} onNavigate={(s) => navigate(s)} />
                    </div>

                    {/* Quick Access Dev Menu */}
                    <div className="dev-menu-btn" onClick={() => setDevMenuOpen(!devMenuOpen)} role="button" aria-label="menu">
                        <span className="material-symbols-outlined">menu</span>
                    </div>

                    {devMenuOpen && (
                        <div className="dev-menu max-h-[400px] overflow-y-auto">
                            <div className="text-[10px] font-bold text-gray-400 mb-2 px-3 uppercase tracking-wider">Switch Flow</div>
                            <button onClick={() => { navigate('WELCOME'); setDevMenuOpen(false); }}>Welcome Screen</button>
                            <button onClick={() => { navigate('CLIENT_HOME'); setDevMenuOpen(false); }}>Client App</button>
                            <button onClick={() => { navigate('PROVIDER_WELCOME'); setDevMenuOpen(false); }}>Provider App</button>
                            <button onClick={() => { navigate('ADMIN_LOGIN'); setDevMenuOpen(false); }}>Admin Panel</button>

                            <div className="text-[10px] font-bold text-gray-400 mt-4 mb-2 px-3 uppercase tracking-wider">Features</div>
                            <button onClick={() => { navigate('EMERGENCY_MODE'); setDevMenuOpen(false); }}>Emergency Mode</button>
                            <button onClick={() => { navigate('FAMILY_SHARING'); setDevMenuOpen(false); }}>Family Sharing</button>
                            <button onClick={() => { navigate('SMART_NOTIFICATIONS'); setDevMenuOpen(false); }}>Notifications</button>
                            <button onClick={() => { navigate('EASY_PAYMENTS'); setDevMenuOpen(false); }}>Payments</button>
                            <button onClick={() => { navigate('OFFLINE_MODE'); setDevMenuOpen(false); }}>Offline Mode</button>

                            <div className="mt-2 pt-2 border-t border-gray-100 text-[9px] text-center text-gray-400">
                                Prototype Navigation Control
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
