<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner Hub - Home Service Professional Platform</title>
    <!-- Load React, ReactDOM, and Babel from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Material Icons and Symbols -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#87CEEB",
                        "primary-dark": "#6FB3D9",
                    }
                }
            }
        }
    </script>

    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Montserrat', sans-serif;
            background-color: #f5f5f5;
        }
        #root {
            min-height: 100vh;
        }
        .app-shell {
            max-width: 450px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .screen-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }
        /* Custom scrollbar for a better look */
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 2px;
        }
        .screen-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Transitions */
        @keyframes slideIn {
            from { transform: translateX(30px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .screen-fade-in {
            animation: slideIn 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Water Ripple Effect */
        .ripple {
            position: absolute;
            background: rgba(135, 206, 235, 0.3);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
        }
        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Sparkle Animation */
        .sparkle {
            position: fixed;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            animation: sparkle-fly 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes sparkle-fly {
            0% { transform: translate(0, 0) scale(0); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1); opacity: 0; }
        }

        /* Floating Action Menu for Demo */
        .dev-menu-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #87CEEB;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .dev-menu-btn:hover {
            opacity: 1;
        }
        .dev-menu {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 10px;
            z-index: 1001;
            width: 200px;
            border: 1px solid #eee;
        }
        .dev-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            transition: background 0.2s;
        }
        .dev-menu button:hover {
            background: #f0f9ff;
            color: #87CEEB;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Utility: Sparkle Effect
        const triggerSparkles = (x, y) => {
            const colors = ['#87CEEB', '#FFD700', '#FF69B4', '#00FF7F', '#FFFFFF'];
            for (let i = 0; i < 15; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = `${x}px`;
                sparkle.style.top = `${y}px`;
                sparkle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

                const tx = (Math.random() - 0.5) * 200;
                const ty = (Math.random() - 0.5) * 200;
                sparkle.style.setProperty('--tx', `${tx}px`);
                sparkle.style.setProperty('--ty', `${ty}px`);

                document.body.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 800);
            }
        };

        // Utility: Ripple Effect
        const triggerRipple = (e, target) => {
            const ripple = document.createElement('span');
            ripple.className = 'ripple';

            const rect = target.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = e.clientX - rect.left - size / 2;
            const y = e.clientY - rect.top - size / 2;

            ripple.style.width = ripple.style.height = `${size}px`;
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;

            if (getComputedStyle(target).position === 'static') {
                target.style.position = 'relative';
            }
            target.style.overflow = 'hidden';

            target.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        };

        const SCREEN_MAP = {
            'WELCOME': 'welcome_screen/code.html',
            'SIGNUP': 'login/signup_screen/code.html',
            'LOGIN': 'login/signup_screen/code.html',
            'CLIENT_HOME': 'home_screen_(main_dashboard)_for_client_app/code.html',
            'FIND_SERVICES': 'find_services_screen_for_client_app/code.html',
            'PROVIDER_PROFILE': 'service_provider_profile_screen_for_client_app/code.html',
            'BOOKING': 'booking_screen_for_client_app/code.html',
            'MY_BOOKINGS': 'my_bookings_screen_for_client_app_1/code.html',
            'MY_BOOKINGS_2': 'my_bookings_screen_for_client_app_2/code.html',
            'MY_BOOKINGS_3': 'my_bookings_screen_for_client_app_3/code.html',
            'PROVIDER_WELCOME': 'provider_welcome_screen/code.html',
            'PROVIDER_SETUP': 'provider_setup_screen/code.html',
            'PROVIDER_DASHBOARD': 'provider_dashboard_screen_1/code.html',
            'PROVIDER_DASHBOARD_2': 'provider_dashboard_screen_2/code.html',
            'ADMIN_LOGIN': 'admin_login_screen/code.html',
            'ADMIN_DASHBOARD': 'admin_dashboard_screen_1/code.html',
            'ADMIN_DASHBOARD_2': 'admin_dashboard_screen_2/code.html',
            'ADMIN_DASHBOARD_3': 'admin_dashboard_screen_3/code.html',
            'ADMIN_DASHBOARD_4': 'admin_dashboard_screen_4/code.html',
            'MESSAGES': 'messages_screen_for_client_app/code.html',
            'PROFILE': 'profile_screen_for_client_app/code.html',
            'BOOKING_REQUESTS': 'booking_requests_screen_for_provider_app/code.html',
            'EASY_PAYMENTS': 'easy_payments_feature_screen/code.html',
            'APP_SETTINGS_ADMIN': 'app_settings_screen_for_admin_app/code.html',
            'MANAGE_BOOKINGS_ADMIN': 'manage_bookings_screen_for_admin_app/code.html',
            'REAL_TIME_TRACKING': 'real-time_tracking_screen/code.html',
            'ADMIN_PROFILE_EDIT': 'admin_profile_edit_screen/code.html',
            'MY_SCHEDULE_PROVIDER': 'my_schedule_screen_for_provider_app/code.html',
            'PROVIDER_PROFILE_PUBLIC': 'provider_profile_(public_view)_screen/code.html',
            'REPORT_CLIENT': 'report_client_screen_for_provider_app/code.html',
            'OFFLINE_MODE': 'offline_mode_feature_screen/code.html',
            'CLIENT_REPORT_CONFIRMATION': 'client_report_confirmation_screen_(provider_app)_/code.html',
            'EMERGENCY_MODE': 'emergency_mode_feature_screen/code.html',
            'CHANNELS_CLIENT': 'channels_screen_(client_app_flow)_/code.html',
            'SMART_SEARCH': 'smart_search_screen/code.html',
            'CHANNEL_MEMBER_MGMT': 'channel_member_management_screen_(provider/admin_app)_/code.html',
            'SMART_NOTIFICATIONS': 'smart_notifications_feature_screen/code.html',
            'FAMILY_SHARING': 'family_sharing_feature_screen/code.html',
            'MULTI_LANGUAGE': 'multi-language_support_screen/code.html',
            'QUICK_REBOOKING': 'quick_rebooking_feature_screen/code.html',
            'PHOTO_VERIFICATION': 'photo_verification_feature_screen/code.html',
            'CHANNEL_MGMT': 'channel_management_screen_(provider/admin_app)_/code.html',
            'CREATE_CHANNEL_FLOW': 'create_new_channel_flow_(provider/admin_app)_/code.html',
            'REPORT_CONFIRMATION': 'report_confirmation_screen/code.html',
            'MANAGE_USERS_ADMIN': 'manage_users_screen_for_admin_app/code.html',
            'REPORT_PROVIDER': 'report_provider_screen_for_client_app/code.html',
            'MY_CLIENTS_PROVIDER': 'my_clients_screen_for_provider_app_(with_report_feature)/code.html'
        };

        const Screen = ({ screenKey, onNavigate }) => {
            const [html, setHtml] = useState('');
            const [styles, setStyles] = useState('');
            const [loading, setLoading] = useState(true);
            const containerRef = useRef(null);

            useEffect(() => {
                const fetchContent = async () => {
                    setLoading(true);
                    try {
                        const path = `extracted_code/stitch_cleaners_hub/${SCREEN_MAP[screenKey]}`;
                        const response = await fetch(path);
                        const text = await response.text();

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');

                        // Extract Styles
                        const styleContent = Array.from(doc.querySelectorAll('style'))
                            .map(s => s.innerHTML)
                            .join('\n');
                        setStyles(styleContent);

                        // Extract Body Content (excluding scripts which we'll handle separately)
                        // Also extract any classes from body to apply them to our container
                        const bodyClasses = doc.body.className;
                        const bodyContent = doc.body.innerHTML;
                        setHtml(`<div class="${bodyClasses}">${bodyContent}</div>`);

                        // We'll handle scripts in a separate useEffect
                    } catch (error) {
                        console.error('Failed to load screen:', error);
                        setHtml('<div class="p-10 text-center">Failed to load screen.</div>');
                    }
                    setLoading(false);
                };
                fetchContent();
            }, [screenKey]);

            // Execute scripts and attach listeners
            useEffect(() => {
                if (!loading && containerRef.current) {
                    const container = containerRef.current;

                    // 1. Manually execute any script tags found in the HTML
                    // Note: This is simplified for the demo/prototype
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });

                    // 2. Attach Click Listeners for Navigation
                    const handleGlobalClick = (e) => {
                        const target = e.target.closest('button, a, [role="button"], label');
                        if (!target) return;

                        // Sparkle on primary actions
                        if (target.tagName === 'BUTTON' && (target.classList.contains('bg-primary') || target.innerText.toLowerCase().includes('confirm') || target.innerText.toLowerCase().includes('book'))) {
                            triggerSparkles(e.clientX, e.clientY);
                        }

                        // Ripple on all buttons
                        if (target.tagName === 'BUTTON' || target.getAttribute('role') === 'button') {
                            triggerRipple(e, target);
                        }

                        const text = target.innerText.trim().toLowerCase().replace(/\s+/g, ' ');

                        // Back navigation
                        const icon = target.querySelector('.material-symbols-outlined, .material-icons-round')?.innerText;
                        if (icon === 'arrow_back' || icon === 'chevron_left' || text === 'cancel') {
                            window.dispatchEvent(new CustomEvent('goBack'));
                            return;
                        }

                        // Auth Mode Toggle (Login/Signup screen)
                        if (screenKey === 'LOGIN' || screenKey === 'SIGNUP') {
                            if (target.tagName === 'LABEL' && (text === 'login' || text === 'sign up')) {
                                const mode = text === 'login' ? 'login' : 'signup';
                                patchAuthMode(container, mode);
                                return;
                            }
                            if (target.tagName === 'A' && (text === 'login' || text === 'sign up')) {
                                patchAuthMode(container, text === 'login' ? 'login' : 'signup');
                                return;
                            }
                            if (target.closest('.mt-auto.pt-6')) {
                                if (text.includes('login')) patchAuthMode(container, 'login');
                                else if (text.includes('sign up')) patchAuthMode(container, 'signup');
                                return;
                            }
                        }

                        // Navigation Logic Heuristics
                        if (text.includes('sign up') || text.includes('create account')) {
                            if (text.includes('provider')) {
                                if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP');
                                else onNavigate('PROVIDER_WELCOME');
                            }
                            else if (screenKey === 'SIGNUP' || screenKey === 'LOGIN') {
                                if (text.includes('create account') || text.includes('sign up')) onNavigate('CLIENT_HOME');
                            }
                            else onNavigate('SIGNUP');
                        } else if (text.includes('log in') || text.includes('login') || text.includes('sign in')) {
                            if (text.includes('admin')) onNavigate('ADMIN_LOGIN');
                            else if (screenKey === 'ADMIN_LOGIN') onNavigate('ADMIN_DASHBOARD');
                            else if (screenKey === 'WELCOME') onNavigate('LOGIN');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('continue as guest')) {
                            onNavigate('CLIENT_HOME');
                        } else if (text.includes('book now')) {
                            onNavigate('BOOKING');
                        } else if (text.includes('find services') || text.includes('explore')) {
                            onNavigate('FIND_SERVICES');
                        } else if (text.includes('manage bookings')) {
                            onNavigate('MANAGE_BOOKINGS_ADMIN');
                        } else if (text.includes('view profile')) {
                            onNavigate('PROVIDER_PROFILE');
                        } else if (text.includes('get started')) {
                            if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('complete setup') || text.includes('finish') || text === 'save & continue') {
                            onNavigate('PROVIDER_DASHBOARD');
                        } else if (text === 'home' || icon === 'home') {
                            onNavigate('CLIENT_HOME');
                        } else if (text.includes('my bookings') || text === 'bookings' || icon === 'calendar_today' || icon === 'event_note') {
                            onNavigate('MY_BOOKINGS');
                        } else if (text.includes('messages') || text === 'message' || icon === 'mail' || icon === 'chat') {
                            onNavigate('MESSAGES');
                        } else if (text === 'profile' || icon === 'person') {
                            onNavigate('PROFILE');
                        } else if (text.includes('emergency')) {
                            onNavigate('EMERGENCY_MODE');
                        }
                    };

                    const patchAuthMode = (container, mode) => {
                        const isLogin = mode === 'login';

                        // Update tabs
                        const labels = Array.from(container.querySelectorAll('label'));
                        const loginTab = labels.find(l => l.innerText.toLowerCase().trim() === 'login');
                        const signupTab = labels.find(l => l.innerText.toLowerCase().trim() === 'sign up');

                        if (loginTab && signupTab) {
                            if (isLogin) {
                                loginTab.classList.add('bg-primary', 'shadow-sm');
                                loginTab.querySelector('span').classList.remove('text-text-subtle', 'dark:text-gray-400');
                                loginTab.querySelector('span').classList.add('text-white', 'font-semibold');

                                signupTab.classList.remove('bg-primary', 'shadow-sm');
                                signupTab.querySelector('span').classList.remove('text-white', 'font-semibold');
                                signupTab.querySelector('span').classList.add('text-text-subtle', 'dark:text-gray-400', 'font-medium');
                            } else {
                                signupTab.classList.add('bg-primary', 'shadow-sm');
                                signupTab.querySelector('span').classList.remove('text-text-subtle', 'dark:text-gray-400');
                                signupTab.querySelector('span').classList.add('text-white', 'font-semibold');

                                loginTab.classList.remove('bg-primary', 'shadow-sm');
                                loginTab.querySelector('span').classList.remove('text-white', 'font-semibold');
                                loginTab.querySelector('span').classList.add('text-text-subtle', 'dark:text-gray-400', 'font-medium');
                            }
                        }

                        // Hide/Show fields
                        const inputs = container.querySelectorAll('input[placeholder]');
                        inputs.forEach(input => {
                            const placeholder = input.placeholder.toLowerCase();
                            if (placeholder.includes('name') || placeholder.includes('phone')) {
                                input.parentElement.style.display = isLogin ? 'none' : 'block';
                            }
                        });

                        // Terms
                        const terms = container.querySelector('label.group.cursor-pointer');
                        if (terms && terms.innerText.toLowerCase().includes('agree')) {
                            terms.style.display = isLogin ? 'none' : 'flex';
                        }

                        // Button
                        const btn = container.querySelector('button.bg-primary span');
                        if (btn) btn.innerText = isLogin ? 'Log In' : 'Create Account';

                        // Footer
                        const footer = container.querySelector('.mt-auto.pt-6');
                        if (footer) {
                            footer.innerHTML = isLogin
                                ? `<p class="text-sm text-text-subtle dark:text-gray-400">Don't have an account? <a class="font-semibold text-primary hover:text-primary-dark transition-colors" href="#">Sign Up</a></p>`
                                : `<p class="text-sm text-text-subtle dark:text-gray-400">Already have an account? <a class="font-semibold text-primary hover:text-primary-dark transition-colors" href="#">Login</a></p>`;
                        }
                    };

                    container.addEventListener('click', handleGlobalClick);
                    return () => container.removeEventListener('click', handleGlobalClick);
                }
            }, [html, loading, screenKey]);

            return (
                <div className="h-full flex flex-col">
                    <style dangerouslySetInnerHTML={{ __html: styles }} />
                    {loading ? (
                        <div className="flex-1 flex items-center justify-center">
                            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-[#87CEEB]"></div>
                        </div>
                    ) : (
                        <div
                            ref={containerRef}
                            className="flex-1"
                            dangerouslySetInnerHTML={{ __html: html }}
                        />
                    )}
                </div>
            );
        };

        const App = () => {
            const [history, setHistory] = useState(['WELCOME']);
            const [devMenuOpen, setDevMenuOpen] = useState(false);
            const screen = history[history.length - 1];

            const navigate = (newScreen) => {
                if (newScreen === screen) return;
                setHistory(prev => [...prev, newScreen]);
            };

            const goBack = () => {
                if (history.length > 1) {
                    setHistory(prev => prev.slice(0, -1));
                }
            };

            useEffect(() => {
                const handleExternalNavigate = (e) => {
                    if (SCREEN_MAP[e.detail]) navigate(e.detail);
                };
                const handleGoBack = () => goBack();

                window.addEventListener('navigate', handleExternalNavigate);
                window.addEventListener('goBack', handleGoBack);
                return () => {
                    window.removeEventListener('navigate', handleExternalNavigate);
                    window.removeEventListener('goBack', handleGoBack);
                };
            }, [history]);

            return (
                <div className="app-shell">
                    <div className="screen-container" key={screen}>
                        <Screen screenKey={screen} onNavigate={navigate} />
                    </div>

                    {/* Quick Access Dev Menu */}
                    <div className="dev-menu-btn" role="button" aria-label="menu" onClick={() => setDevMenuOpen(!devMenuOpen)}>
                        <span className="material-symbols-outlined">menu</span>
                    </div>

                    {devMenuOpen && (
                        <div className="dev-menu">
                            <div className="text-[10px] font-bold text-gray-400 mb-2 px-3 uppercase tracking-wider">Switch Flow</div>
                            <button onClick={() => { navigate('WELCOME'); setDevMenuOpen(false); }}>Welcome Screen</button>
                            <button onClick={() => { navigate('CLIENT_HOME'); setDevMenuOpen(false); }}>Client App</button>
                            <button onClick={() => { navigate('PROVIDER_WELCOME'); setDevMenuOpen(false); }}>Provider App</button>
                            <button onClick={() => { navigate('ADMIN_LOGIN'); setDevMenuOpen(false); }}>Admin Panel</button>
                            <div className="mt-2 pt-2 border-t border-gray-100 text-[9px] text-center text-gray-400">
                                Prototype Navigation Control
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
