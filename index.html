<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner Hub - Home Service Professional Platform</title>
    <!-- Load React, ReactDOM, and Babel from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Material Icons and Symbols -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Montserrat', sans-serif;
            background-color: #f5f5f5;
            overflow: hidden;
        }
        #root {
            min-height: 100vh;
        }
        .app-shell {
            max-width: 450px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .screen-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
        }
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: #87CEEB;
            border-radius: 2px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        .ripple {
            position: absolute;
            background: rgba(135, 206, 235, 0.3);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
            z-index: 9999;
        }
        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        .dev-menu-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #87CEEB;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .dev-menu-btn:hover {
            opacity: 1;
        }
        .dev-menu {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 10px;
            z-index: 1001;
            width: 220px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #eee;
        }
        .dev-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #333;
            transition: background 0.2s;
        }
        .dev-menu button:hover {
            background: #f0f9ff;
            color: #87CEEB;
        }
        .dev-menu-section {
            font-size: 10px;
            font-weight: bold;
            color: #9ca3af;
            margin-top: 12px;
            margin-bottom: 4px;
            padding-left: 12px;
            padding-right: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SCREEN_MAP = {
            'WELCOME': 'welcome_screen/code.html',
            'SIGNUP': 'login/signup_screen/code.html',
            'LOGIN': 'login/signup_screen/code.html',
            'CLIENT_HOME': 'home_screen_(main_dashboard)_for_client_app/code.html',
            'FIND_SERVICES': 'find_services_screen_for_client_app/code.html',
            'SMART_SEARCH': 'smart_search_screen/code.html',
            'SERVICE_PROVIDER_PROFILE': 'service_provider_profile_screen_for_client_app/code.html',
            'BOOKING': 'booking_screen_for_client_app/code.html',
            'MY_BOOKINGS_1': 'my_bookings_screen_for_client_app_1/code.html',
            'MY_BOOKINGS_2': 'my_bookings_screen_for_client_app_2/code.html',
            'MY_BOOKINGS_3': 'my_bookings_screen_for_client_app_3/code.html',
            'MESSAGES': 'messages_screen_for_client_app/code.html',
            'CHANNELS_CLIENT': 'channels_screen_(client_app_flow)_/code.html',
            'PROFILE_CLIENT': 'profile_screen_for_client_app/code.html',
            'REPORT_PROVIDER': 'report_provider_screen_for_client_app/code.html',
            'REPORT_CONFIRMATION': 'report_confirmation_screen/code.html',
            'PROVIDER_WELCOME': 'provider_welcome_screen/code.html',
            'PROVIDER_SETUP': 'provider_setup_screen/code.html',
            'PROVIDER_DASHBOARD_1': 'provider_dashboard_screen_1/code.html',
            'PROVIDER_DASHBOARD_2': 'provider_dashboard_screen_2/code.html',
            'MY_SCHEDULE': 'my_schedule_screen_for_provider_app/code.html',
            'BOOKING_REQUESTS': 'booking_requests_screen_for_provider_app/code.html',
            'MY_CLIENTS': 'my_clients_screen_for_provider_app_(with_report_feature)/code.html',
            'REPORT_CLIENT': 'report_client_screen_for_provider_app/code.html',
            'CLIENT_REPORT_CONFIRMATION': 'client_report_confirmation_screen_(provider_app)_/code.html',
            'PROVIDER_PROFILE_PUBLIC': 'provider_profile_(public_view)_screen/code.html',
            'ADMIN_LOGIN': 'admin_login_screen/code.html',
            'ADMIN_DASHBOARD_1': 'admin_dashboard_screen_1/code.html',
            'ADMIN_DASHBOARD_2': 'admin_dashboard_screen_2/code.html',
            'ADMIN_DASHBOARD_3': 'admin_dashboard_screen_3/code.html',
            'ADMIN_DASHBOARD_4': 'admin_dashboard_screen_4/code.html',
            'MANAGE_USERS': 'manage_users_screen_for_admin_app/code.html',
            'MANAGE_BOOKINGS': 'manage_bookings_screen_for_admin_app/code.html',
            'APP_SETTINGS': 'app_settings_screen_for_admin_app/code.html',
            'ADMIN_PROFILE_EDIT': 'admin_profile_edit_screen/code.html',
            'CHANNEL_MANAGEMENT': 'channel_management_screen_(provider/admin_app)_/code.html',
            'CHANNEL_MEMBER_MANAGEMENT': 'channel_member_management_screen_(provider/admin_app)_/code.html',
            'CREATE_CHANNEL': 'create_new_channel_flow_(provider/admin_app)_/code.html',
            'QUICK_REBOOKING': 'quick_rebooking_feature_screen/code.html',
            'REAL_TIME_TRACKING': 'real-time_tracking_screen/code.html',
            'PHOTO_VERIFICATION': 'photo_verification_feature_screen/code.html',
            'EASY_PAYMENTS': 'easy_payments_feature_screen/code.html',
            'SMART_NOTIFICATIONS': 'smart_notifications_feature_screen/code.html',
            'EMERGENCY_MODE': 'emergency_mode_feature_screen/code.html',
            'FAMILY_SHARING': 'family_sharing_feature_screen/code.html',
            'MULTI_LANGUAGE': 'multi-language_support_screen/code.html',
            'OFFLINE_MODE': 'offline_mode_feature_screen/code.html'
        };

        const Screen = ({ screenKey, onNavigate, onBack }) => {
            const [html, setHtml] = useState('');
            const [loading, setLoading] = useState(true);
            const containerRef = useRef(null);

            const cleanupAssets = () => {
                document.querySelectorAll('[data-screen-assets]').forEach(el => el.remove());
            };

            useEffect(() => {
                const fetchContent = async () => {
                    setLoading(true);
                    cleanupAssets();
                    try {
                        const path = `extracted_code/stitch_cleaners_hub/${SCREEN_MAP[screenKey]}`;
                        const response = await fetch(path);
                        const text = await response.text();

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');

                        doc.querySelectorAll('style').forEach(style => {
                            const newStyle = document.createElement('style');
                            newStyle.innerHTML = style.innerHTML;
                            newStyle.setAttribute('data-screen-assets', 'true');
                            document.head.appendChild(newStyle);
                        });

                        doc.querySelectorAll('link[href]').forEach(link => {
                            if (!document.querySelector(`link[href="${link.getAttribute('href')}"]`)) {
                                const newLink = document.createElement('link');
                                Array.from(link.attributes).forEach(attr => newLink.setAttribute(attr.name, attr.value));
                                newLink.setAttribute('data-screen-assets', 'true');
                                document.head.appendChild(newLink);
                            }
                        });

                        const bodyContent = doc.body.innerHTML;
                        setHtml(bodyContent);

                        const tailwindScript = Array.from(doc.querySelectorAll('script')).find(s => s.innerHTML.includes('tailwind.config'));
                        if (tailwindScript && window.tailwind) {
                            try {
                                const configMatch = tailwindScript.innerHTML.match(/tailwind\.config\s*=\s*({[\s\S]*?});/);
                                if (configMatch) {
                                    const config = eval(`(${configMatch[1]})`);
                                    window.tailwind.config = config;
                                }
                            } catch (e) {
                                console.error('Error applying tailwind config:', e);
                            }
                        }
                    } catch (error) {
                        console.error('Failed to load screen:', error);
                        setHtml('<div class="p-10 text-center">Failed to load screen.</div>');
                    }
                    setLoading(false);
                };
                fetchContent();
                return cleanupAssets;
            }, [screenKey]);

            useEffect(() => {
                if (!loading && containerRef.current) {
                    const container = containerRef.current;

                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });

                    const handleGlobalClick = (e) => {
                        const target = e.target.closest('button, a, [role="button"], .cursor-pointer, [onclick]');
                        if (!target) return;

                        const iconText = target.querySelector('.material-symbols-outlined, .material-icons-round')?.innerText;
                        if (iconText === 'arrow_back' || iconText === 'chevron_left') {
                            onBack();
                            return;
                        }

                        const text = target.innerText.trim().toLowerCase().replace(/\s+/g, ' ');

                        if (text.includes('sign up') || text.includes('create account')) {
                            if (text.includes('provider')) onNavigate('PROVIDER_WELCOME');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('log in') || text.includes('login') || text.includes('sign in')) {
                            if (text.includes('admin')) onNavigate('ADMIN_LOGIN');
                            else if (screenKey === 'ADMIN_LOGIN') onNavigate('ADMIN_DASHBOARD_1');
                            else if (screenKey === 'WELCOME') onNavigate('LOGIN');
                            else if (screenKey.startsWith('PROVIDER')) onNavigate('PROVIDER_DASHBOARD_1');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('continue as guest')) {
                            onNavigate('CLIENT_HOME');
                        } else if (text.includes('book now') || text.includes('book this service')) {
                            onNavigate('BOOKING');
                        } else if (text.includes('find services') || text.includes('explore')) {
                            onNavigate('FIND_SERVICES');
                        } else if (text.includes('view profile')) {
                            onNavigate('SERVICE_PROVIDER_PROFILE');
                        } else if (text.includes('get started')) {
                            if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('save & continue') || text.includes('complete setup') || text.includes('finish')) {
                            if (screenKey === 'PROVIDER_SETUP') onNavigate('PROVIDER_DASHBOARD_1');
                        } else if (text === 'home' || iconText === 'home') {
                            if (screenKey.startsWith('ADMIN')) onNavigate('ADMIN_DASHBOARD_1');
                            else if (screenKey.startsWith('PROVIDER')) onNavigate('PROVIDER_DASHBOARD_1');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('bookings') || iconText === 'calendar_today' || iconText === 'event_note') {
                            onNavigate('MY_BOOKINGS_1');
                        } else if (text.includes('messages') || iconText === 'mail' || iconText === 'chat') {
                            onNavigate('MESSAGES');
                        } else if (text.includes('profile') || iconText === 'person' || iconText === 'account_circle') {
                            if (screenKey.startsWith('ADMIN')) onNavigate('ADMIN_PROFILE_EDIT');
                            else onNavigate('PROFILE_CLIENT');
                        } else if (text.includes('search') || iconText === 'search') {
                            onNavigate('SMART_SEARCH');
                        } else if (text.includes('manage users')) {
                            onNavigate('MANAGE_USERS');
                        } else if (text.includes('manage bookings')) {
                            onNavigate('MANAGE_BOOKINGS');
                        } else if (text.includes('app settings')) {
                            onNavigate('APP_SETTINGS');
                        } else if (text.includes('my schedule')) {
                            onNavigate('MY_SCHEDULE');
                        } else if (text.includes('booking requests')) {
                            onNavigate('BOOKING_REQUESTS');
                        } else if (text.includes('my clients')) {
                            onNavigate('MY_CLIENTS');
                        } else if (text.includes('emergency')) {
                            onNavigate('EMERGENCY_MODE');
                        } else if (text.includes('logout') || text.includes('log out')) {
                            onNavigate('WELCOME');
                        }
                    };

                    container.addEventListener('click', handleGlobalClick);

                    if (screenKey === 'LOGIN' || screenKey === 'SIGNUP') {
                        const labels = container.querySelectorAll('label');
                        labels.forEach(label => {
                            const input = label.querySelector('input[name="auth-mode"]');
                            if (input) {
                                label.onclick = () => {
                                    onNavigate(input.value.toUpperCase());
                                };
                            }
                        });

                        const loginInput = container.querySelector('input[value="login"]');
                        const signupInput = container.querySelector('input[value="signup"]');
                        const headerP = container.querySelector('.text-center.mb-6 p.text-sm') || container.querySelector('.text-center p.text-text-subtle');
                        const submitBtn = container.querySelector('button span:not(.material-symbols-outlined)');

                        if (screenKey === 'LOGIN') {
                           if (loginInput) loginInput.checked = true;
                           if (headerP) headerP.innerText = 'Welcome back! Please login to your account.';
                           if (submitBtn) submitBtn.innerText = 'Login';
                        } else {
                           if (signupInput) signupInput.checked = true;
                           if (headerP) headerP.innerText = 'Join our community of trusted professionals';
                           if (submitBtn) submitBtn.innerText = 'Create Account';
                        }
                    }

                    return () => container.removeEventListener('click', handleGlobalClick);
                }
            }, [html, loading, screenKey]);

            return (
                <div className="h-full flex flex-col animate-fade-in">
                    {loading ? (
                        <div className="flex-1 flex items-center justify-center">
                            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-[#87CEEB]"></div>
                        </div>
                    ) : (
                        <div
                            ref={containerRef}
                            className="flex-1"
                            dangerouslySetInnerHTML={{ __html: html }}
                        />
                    )}
                </div>
            );
        };

        const App = () => {
            const [history, setHistory] = useState(['WELCOME']);
            const currentScreen = history[history.length - 1];
            const [devMenuOpen, setDevMenuOpen] = useState(false);

            const navigate = (newScreen) => {
                if (newScreen === currentScreen) return;
                setHistory(prev => [...prev, newScreen]);
            };

            const goBack = () => {
                if (history.length > 1) {
                    setHistory(prev => prev.slice(0, -1));
                }
            };

            useEffect(() => {
                const handleExternalNavigate = (e) => {
                    if (SCREEN_MAP[e.detail]) navigate(e.detail);
                };
                window.addEventListener('navigate', handleExternalNavigate);
                return () => window.removeEventListener('navigate', handleExternalNavigate);
            }, [currentScreen]);

            useEffect(() => {
                const handleRipple = (e) => {
                    const target = e.target.closest('button, a, [role="button"], .cursor-pointer');
                    if (!target) return;

                    const rect = target.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;

                    const ripple = document.createElement('span');
                    ripple.className = 'ripple';
                    ripple.style.left = `${x}px`;
                    ripple.style.top = `${y}px`;
                    ripple.style.width = ripple.style.height = `${Math.max(rect.width, rect.height)}px`;
                    ripple.style.marginLeft = ripple.style.marginTop = `-${Math.max(rect.width, rect.height) / 2}px`;

                    const originalPosition = target.style.position;
                    const originalOverflow = target.style.overflow;

                    if (!originalPosition || originalPosition === 'static') target.style.position = 'relative';
                    target.style.overflow = 'hidden';

                    target.appendChild(ripple);
                    setTimeout(() => ripple.remove(), 600);
                };

                document.addEventListener('mousedown', handleRipple);
                return () => document.removeEventListener('mousedown', handleRipple);
            }, []);

            return (
                <div className="app-shell">
                    <div className="screen-container">
                        <Screen
                            screenKey={currentScreen}
                            onNavigate={navigate}
                            onBack={goBack}
                        />
                    </div>

                    <div className="dev-menu-btn" onClick={() => setDevMenuOpen(!devMenuOpen)}>
                        <span className="material-symbols-outlined">menu</span>
                    </div>

                    {devMenuOpen && (
                        <div className="dev-menu">
                            <div className="dev-menu-section">Demo Navigation</div>
                            <button onClick={() => { navigate('WELCOME'); setDevMenuOpen(false); }}>Welcome Screen</button>

                            <div className="dev-menu-section">Client Flow</div>
                            <button onClick={() => { navigate('CLIENT_HOME'); setDevMenuOpen(false); }}>Client Home</button>
                            <button onClick={() => { navigate('FIND_SERVICES'); setDevMenuOpen(false); }}>Find Services</button>
                            <button onClick={() => { navigate('MY_BOOKINGS_1'); setDevMenuOpen(false); }}>My Bookings</button>
                            <button onClick={() => { navigate('MESSAGES'); setDevMenuOpen(false); }}>Messages</button>

                            <div className="dev-menu-section">Provider Flow</div>
                            <button onClick={() => { navigate('PROVIDER_WELCOME'); setDevMenuOpen(false); }}>Provider Welcome</button>
                            <button onClick={() => { navigate('PROVIDER_DASHBOARD_1'); setDevMenuOpen(false); }}>Provider Dashboard</button>
                            <button onClick={() => { navigate('MY_SCHEDULE'); setDevMenuOpen(false); }}>My Schedule</button>

                            <div className="dev-menu-section">Admin Flow</div>
                            <button onClick={() => { navigate('ADMIN_LOGIN'); setDevMenuOpen(false); }}>Admin Login</button>
                            <button onClick={() => { navigate('ADMIN_DASHBOARD_1'); setDevMenuOpen(false); }}>Admin Dashboard</button>
                            <button onClick={() => { navigate('MANAGE_USERS'); setDevMenuOpen(false); }}>Manage Users</button>

                            <div className="mt-4 pt-2 border-t border-gray-100 text-[9px] text-center text-gray-400">
                                Prototype v1.0 - Navigation Controls
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
