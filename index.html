<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner Hub - Home Service Professional Platform</title>
    <!-- Load React, ReactDOM, and Babel from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#87CEEB',
                        'primary-dark': '#6FB3D9',
                    }
                }
            }
        }
    </script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Material Icons and Symbols -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Montserrat', sans-serif;
            background-color: #f5f5f5;
        }
        #root {
            min-height: 100vh;
        }
        .app-shell {
            max-width: 450px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .screen-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }
        /* Custom scrollbar for a better look */
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 2px;
        }
        .screen-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Transitions */
        .screen-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .slide-in {
            animation: slideIn 0.3s ease-out forwards;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Floating Action Menu for Demo */
        .dev-menu-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #87CEEB;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .dev-menu-btn:hover {
            opacity: 1;
        }
        .dev-menu {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 10px;
            z-index: 1001;
            width: 200px;
            border: 1px solid #eee;
        }
        .dev-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            transition: background 0.2s;
        }
        .dev-menu button:hover {
            background: #f0f9ff;
            color: #87CEEB;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SCREEN_MAP = {
            'WELCOME': 'welcome_screen/code.html',
            'SIGNUP': 'login/signup_screen/code.html',
            'LOGIN': 'login/signup_screen/code.html',
            'CLIENT_HOME': 'home_screen_(main_dashboard)_for_client_app/code.html',
            'FIND_SERVICES': 'find_services_screen_for_client_app/code.html',
            'PROVIDER_PROFILE': 'service_provider_profile_screen_for_client_app/code.html',
            'BOOKING': 'booking_screen_for_client_app/code.html',
            'MY_BOOKINGS': 'my_bookings_screen_for_client_app_1/code.html',
            'PROVIDER_WELCOME': 'provider_welcome_screen/code.html',
            'PROVIDER_SETUP': 'provider_setup_screen/code.html',
            'PROVIDER_DASHBOARD': 'provider_dashboard_screen_1/code.html',
            'ADMIN_LOGIN': 'admin_login_screen/code.html',
            'ADMIN_DASHBOARD': 'admin_dashboard_screen_1/code.html',
            'MESSAGES': 'messages_screen_for_client_app/code.html',
            'PROFILE': 'profile_screen_for_client_app/code.html',
            'MANAGE_USERS': 'manage_users_screen_for_admin_app/code.html',
            'MANAGE_BOOKINGS': 'manage_bookings_screen_for_admin_app/code.html',
            'ADMIN_SETTINGS': 'app_settings_screen_for_admin_app/code.html'
        };

        const Screen = ({ screenKey, onNavigate, onBack }) => {
            const [html, setHtml] = useState('');
            const [loading, setLoading] = useState(true);
            const containerRef = useRef(null);

            useEffect(() => {
                const fetchContent = async () => {
                    setLoading(true);
                    try {
                        const path = `extracted_code/stitch_cleaners_hub/${SCREEN_MAP[screenKey]}`;
                        const response = await fetch(path);
                        const text = await response.text();

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');

                        // Clean up previous screen assets
                        document.querySelectorAll('[data-screen-assets]').forEach(el => el.remove());

                        // Extract and Inject Styles
                        doc.querySelectorAll('style').forEach(s => {
                            const newStyle = document.createElement('style');
                            newStyle.innerHTML = s.innerHTML;
                            newStyle.setAttribute('data-screen-assets', 'true');
                            document.head.appendChild(newStyle);
                        });

                        // Handle Tailwind config if present
                        const twConfig = doc.querySelector('#tailwind-config');
                        if (twConfig) {
                            const newScript = document.createElement('script');
                            newScript.innerHTML = twConfig.innerHTML;
                            newScript.setAttribute('data-screen-assets', 'true');
                            document.head.appendChild(newScript);
                        }

                        // Extract Body Content
                        setHtml(doc.body.innerHTML);
                    } catch (error) {
                        console.error('Failed to load screen:', error);
                        setHtml('<div class="p-10 text-center">Failed to load screen.</div>');
                    }
                    setLoading(false);
                };
                fetchContent();
            }, [screenKey]);

            // Execute scripts and attach listeners
            useEffect(() => {
                if (!loading && containerRef.current) {
                    const container = containerRef.current;

                    // 1. Auth Mode Patching
                    if (screenKey === 'LOGIN' || screenKey === 'SIGNUP') {
                        const isLogin = screenKey === 'LOGIN';
                        const labels = container.querySelectorAll('label');
                        labels.forEach(label => {
                            const input = label.querySelector('input[name="auth-mode"]');
                            if (input) {
                                const mode = input.value;
                                if ((isLogin && mode === 'login') || (!isLogin && mode === 'signup')) {
                                    label.classList.add('bg-primary', 'shadow-sm');
                                    label.querySelector('span')?.classList.remove('text-text-subtle');
                                    label.querySelector('span')?.classList.add('text-white', 'font-semibold');
                                    input.checked = true;
                                } else {
                                    label.classList.remove('bg-primary', 'shadow-sm');
                                    label.querySelector('span')?.classList.remove('text-white', 'font-semibold');
                                    label.querySelector('span')?.classList.add('text-text-subtle');
                                    input.checked = false;
                                }
                            }
                        });

                        const fields = container.querySelectorAll('.relative');
                        fields.forEach(field => {
                            const input = field.querySelector('input');
                            if (input && (input.placeholder === 'Full Name' || input.placeholder === 'Phone Number')) {
                                field.style.display = isLogin ? 'none' : 'block';
                            }
                        });

                        const submitBtn = container.querySelector('button.bg-primary span');
                        if (submitBtn) {
                            submitBtn.innerText = isLogin ? 'Log In' : 'Create Account';
                        }

                        const footerLink = container.querySelector('.mt-auto a, .pt-6 a');
                        if (footerLink) {
                            footerLink.innerText = isLogin ? 'Sign Up' : 'Login';
                        }
                    }

                    // 2. Manually execute any script tags found in the HTML
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        if (oldScript.id === 'tailwind-config') return;
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });

                    // 3. Attach Click Listeners for Navigation
                    const handleGlobalClick = (e) => {
                        const target = e.target.closest('button, a, [role="button"]');
                        if (!target) return;

                        // Normalize text: collapse multiple spaces and newlines
                        const text = target.innerText.replace(/\s+/g, ' ').trim().toLowerCase();
                        const icon = target.querySelector('.material-symbols-outlined, .material-icons-round')?.innerText.trim();

                        // Navigation Logic Heuristics
                        if (text.includes('arrow_back') || text === 'back' || icon === 'arrow_back') {
                            onBack();
                        } else if (text.includes('sign up') || text.includes('create account')) {
                            if (text.includes('provider')) onNavigate('PROVIDER_WELCOME');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('log in') || text.includes('login') || text.includes('sign in')) {
                            if (text.includes('admin')) onNavigate('ADMIN_LOGIN');
                            else if (screenKey === 'ADMIN_LOGIN') onNavigate('ADMIN_DASHBOARD');
                            else if (screenKey === 'WELCOME') onNavigate('LOGIN');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('continue as guest')) {
                            onNavigate('CLIENT_HOME');
                        } else if (text.includes('book now')) {
                            onNavigate('BOOKING');
                        } else if (text.includes('find services') || text.includes('explore') || icon === 'search') {
                            onNavigate('FIND_SERVICES');
                        } else if (text.includes('view profile')) {
                            onNavigate('PROVIDER_PROFILE');
                        } else if (text.includes('get started')) {
                            if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('complete setup') || text.includes('finish')) {
                            onNavigate('PROVIDER_DASHBOARD');
                        } else if (text.includes('home') || icon === 'home' || icon === 'dashboard') {
                            if (screenKey.startsWith('ADMIN')) onNavigate('ADMIN_DASHBOARD');
                            else if (screenKey.startsWith('PROVIDER')) onNavigate('PROVIDER_DASHBOARD');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('bookings') || icon === 'calendar_today' || icon === 'event_note' || icon === 'confirmation_number') {
                            if (screenKey.startsWith('ADMIN')) onNavigate('MANAGE_BOOKINGS');
                            else onNavigate('MY_BOOKINGS');
                        } else if (text.includes('messages') || icon === 'mail' || icon === 'chat_bubble') {
                            onNavigate('MESSAGES');
                        } else if (text.includes('profile') || icon === 'person') {
                            onNavigate('PROFILE');
                        } else if (text.includes('manage users') || icon === 'manage_accounts') {
                            onNavigate('MANAGE_USERS');
                        } else if (text.includes('settings') || icon === 'settings') {
                            onNavigate('ADMIN_SETTINGS');
                        }
                    };

                    container.addEventListener('click', handleGlobalClick);
                    return () => container.removeEventListener('click', handleGlobalClick);
                }
            }, [html, loading, screenKey]);

            return (
                <div className="h-full flex flex-col">
                    {loading ? (
                        <div className="flex-1 flex items-center justify-center">
                            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-[#87CEEB]"></div>
                        </div>
                    ) : (
                        <div
                            ref={containerRef}
                            className="flex-1"
                            dangerouslySetInnerHTML={{ __html: html }}
                        />
                    )}
                </div>
            );
        };

        const App = () => {
            const [history, setHistory] = useState(['WELCOME']);
            const [devMenuOpen, setDevMenuOpen] = useState(false);
            const [animKey, setAnimKey] = useState(0);

            const currentScreen = history[history.length - 1];

            const navigate = (newScreen) => {
                if (newScreen === currentScreen) return;
                setHistory(prev => [...prev, newScreen]);
                setAnimKey(prev => prev + 1);
            };

            const goBack = () => {
                if (history.length > 1) {
                    setHistory(prev => prev.slice(0, -1));
                    setAnimKey(prev => prev + 1);
                }
            };

            useEffect(() => {
                const handleExternalNavigate = (e) => {
                    if (SCREEN_MAP[e.detail]) navigate(e.detail);
                };
                window.addEventListener('navigate', handleExternalNavigate);
                return () => window.removeEventListener('navigate', handleExternalNavigate);
            }, [currentScreen]);

            return (
                <div className="app-shell">
                    <div className="screen-container">
                        <div key={animKey} className="h-full slide-in">
                            <Screen
                                screenKey={currentScreen}
                                onNavigate={navigate}
                                onBack={goBack}
                            />
                        </div>
                    </div>

                    {/* Quick Access Dev Menu */}
                    <div className="dev-menu-btn" onClick={() => setDevMenuOpen(!devMenuOpen)}>
                        <span className="material-symbols-outlined">menu</span>
                    </div>

                    {devMenuOpen && (
                        <div className="dev-menu">
                            <div className="text-[10px] font-bold text-gray-400 mb-2 px-3 uppercase tracking-wider">Switch Flow</div>
                            <button onClick={() => { navigate('WELCOME'); setDevMenuOpen(false); }}>Welcome Screen</button>
                            <button onClick={() => { navigate('CLIENT_HOME'); setDevMenuOpen(false); }}>Client App</button>
                            <button onClick={() => { navigate('PROVIDER_WELCOME'); setDevMenuOpen(false); }}>Provider App</button>
                            <button onClick={() => { navigate('ADMIN_LOGIN'); setDevMenuOpen(false); }}>Admin Panel</button>
                            <div className="mt-2 pt-2 border-t border-gray-100 text-[9px] text-center text-gray-400">
                                Prototype Navigation Control
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
