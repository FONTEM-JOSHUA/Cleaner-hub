<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner Hub - Home Service Professional Platform</title>
    <!-- Load React, ReactDOM, and Babel from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Material Icons and Symbols -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Montserrat', sans-serif;
            background-color: #f5f5f5;
        }
        #root {
            min-height: 100vh;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        .app-shell {
            max-width: 450px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .screen-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }
        /* Custom scrollbar for a better look */
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 2px;
        }
        .screen-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Floating Action Menu for Demo */
        .dev-menu-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #87CEEB;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .dev-menu-btn:hover {
            opacity: 1;
        }
        .dev-menu {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 10px;
            z-index: 1001;
            width: 200px;
            border: 1px solid #eee;
        }
        .dev-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            transition: background 0.2s;
        }
        .dev-menu button:hover {
            background: #f0f9ff;
            color: #87CEEB;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SCREEN_MAP = {
            'WELCOME': 'welcome_screen/code.html',
            'SIGNUP': 'login/signup_screen/code.html',
            'LOGIN': 'login/signup_screen/code.html',
            'CLIENT_HOME': 'home_screen_(main_dashboard)_for_client_app/code.html',
            'FIND_SERVICES': 'find_services_screen_for_client_app/code.html',
            'PROVIDER_PROFILE': 'service_provider_profile_screen_for_client_app/code.html',
            'BOOKING': 'booking_screen_for_client_app/code.html',
            'MY_BOOKINGS': 'my_bookings_screen_for_client_app_1/code.html',
            'MESSAGES': 'messages_screen_for_client_app/code.html',
            'PROFILE': 'profile_screen_for_client_app/code.html',
            'PROVIDER_WELCOME': 'provider_welcome_screen/code.html',
            'PROVIDER_SETUP': 'provider_setup_screen/code.html',
            'PROVIDER_DASHBOARD': 'provider_dashboard_screen_1/code.html',
            'PROVIDER_SCHEDULE': 'my_schedule_screen_for_provider_app/code.html',
            'PROVIDER_REQUESTS': 'booking_requests_screen_for_provider_app/code.html',
            'PROVIDER_CLIENTS': 'my_clients_screen_for_provider_app_(with_report_feature)/code.html',
            'ADMIN_LOGIN': 'admin_login_screen/code.html',
            'ADMIN_DASHBOARD': 'admin_dashboard_screen_1/code.html',
            'ADMIN_USERS': 'manage_users_screen_for_admin_app/code.html',
            'ADMIN_BOOKINGS': 'manage_bookings_screen_for_admin_app/code.html',
            'ADMIN_SETTINGS': 'app_settings_screen_for_admin_app/code.html',
            'EMERGENCY_MODE': 'emergency_mode_feature_screen/code.html',
            'SMART_SEARCH': 'smart_search_screen/code.html',
            'TRACKING': 'real-time_tracking_screen/code.html',
            'PAYMENTS': 'easy_payments_feature_screen/code.html',
            'FAMILY_SHARING': 'family_sharing_feature_screen/code.html',
            'LANGUAGES': 'multi-language_support_screen/code.html',
            'PHOTO_VERIFICATION': 'photo_verification_feature_screen/code.html'
        };

        const Screen = ({ screenKey, onNavigate }) => {
            const [html, setHtml] = useState('');
            const [bodyClass, setBodyClass] = useState('');
            const [loading, setLoading] = useState(true);
            const containerRef = useRef(null);

            useEffect(() => {
                const fetchContent = async () => {
                    setLoading(true);
                    try {
                        const path = `extracted_code/stitch_cleaners_hub/${SCREEN_MAP[screenKey]}`;
                        const response = await fetch(path);
                        const text = await response.text();

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');

                        // 1. Cleanup old screen assets
                        document.querySelectorAll('[data-screen-assets]').forEach(el => el.remove());

                        // 2. Extract Styles and Tailwind Config from Head
                        const headAssets = Array.from(doc.head.children).filter(el =>
                            el.tagName === 'STYLE' ||
                            (el.tagName === 'SCRIPT' && (el.id === 'tailwind-config' || el.innerText.includes('tailwind.config')))
                        );

                        headAssets.forEach(asset => {
                            let newAsset;
                            if (asset.tagName === 'SCRIPT') {
                                newAsset = document.createElement('script');
                                Array.from(asset.attributes).forEach(attr => newAsset.setAttribute(attr.name, attr.value));
                                newAsset.text = asset.text;
                            } else {
                                newAsset = asset.cloneNode(true);
                            }
                            newAsset.setAttribute('data-screen-assets', 'true');
                            document.head.appendChild(newAsset);
                        });

                        // 3. Extract Body Content and Classes
                        let bodyHtml = doc.body.innerHTML;
                        // Remove min-h-screen to avoid layout issues in SPA shell
                        bodyHtml = bodyHtml.replace(/min-h-screen/g, 'min-h-full');
                        setHtml(bodyHtml);
                        setBodyClass(doc.body.className);
                        // Also apply any classes from html tag to our container
                        const hClass = doc.documentElement.className;
                        if (containerRef.current) {
                            containerRef.current.closest('.app-shell').className = `app-shell ${hClass}`;
                        }
                    } catch (error) {
                        console.error('Failed to load screen:', error);
                        setHtml('<div class="p-10 text-center">Failed to load screen.</div>');
                    }
                    setLoading(false);
                };
                fetchContent();

                return () => {
                    document.querySelectorAll('[data-screen-assets]').forEach(el => el.remove());
                };
            }, [screenKey]);

            // Execute scripts and attach listeners
            useEffect(() => {
                if (!loading && containerRef.current) {
                    const container = containerRef.current;

                    // 1. Manually execute any script tags found in the HTML
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });

                    // 2. Ensure cursor-pointer on interactive elements
                    const interactives = container.querySelectorAll('button, a, [role="button"], [onclick]');
                    interactives.forEach(el => el.classList.add('cursor-pointer'));

                    // 3. Auth Mode Patching (Login vs Signup toggle)
                    const patchAuthMode = (mode) => {
                        const title = container.querySelector('h1.text-xl');
                        const subtitle = container.querySelector('.text-center.mb-6 p.text-sm');
                        const submitBtn = container.querySelector('button span');
                        const footerText = container.querySelector('div.mt-auto p.text-sm');
                        const radioInputs = container.querySelectorAll('input[name="auth-mode"]');
                        const tabs = Array.from(container.querySelectorAll('label.group'));

                        if (mode === 'login') {
                            if (title) title.innerText = 'Welcome Back';
                            if (subtitle) subtitle.innerText = 'Log in to your account to continue';
                            if (submitBtn) submitBtn.innerText = 'Log In';
                            if (footerText) footerText.innerHTML = 'Don\'t have an account? <a class="font-semibold text-primary hover:text-primary-dark transition-colors" href="#">Sign Up</a>';

                            container.querySelectorAll('input[placeholder="Full Name"], input[placeholder="Phone Number"], label.flex.items-start').forEach(el => {
                                (el.closest('.relative') || el).style.display = 'none';
                            });

                            radioInputs.forEach(input => input.checked = (input.value === 'login'));
                            tabs.forEach(tab => {
                                const input = tab.querySelector('input');
                                if (input && input.value === 'login') {
                                    tab.classList.add('bg-primary', 'shadow-sm');
                                    tab.querySelector('span')?.classList.remove('text-text-subtle', 'dark:text-gray-400');
                                    tab.querySelector('span')?.classList.add('text-white', 'font-semibold');
                                } else {
                                    tab.classList.remove('bg-primary', 'shadow-sm');
                                    tab.querySelector('span')?.classList.add('text-text-subtle', 'dark:text-gray-400');
                                    tab.querySelector('span')?.classList.remove('text-white', 'font-semibold');
                                }
                            });
                        } else {
                            if (title) title.innerText = 'Find your perfect helper';
                            if (subtitle) subtitle.innerText = 'Join our community of trusted professionals';
                            if (submitBtn) submitBtn.innerText = 'Create Account';
                            if (footerText) footerText.innerHTML = 'Already have an account? <a class="font-semibold text-primary hover:text-primary-dark transition-colors" href="#">Login</a>';

                            container.querySelectorAll('input[placeholder="Full Name"], input[placeholder="Phone Number"], label.flex.items-start').forEach(el => {
                                (el.closest('.relative') || el).style.display = 'flex';
                            });

                            radioInputs.forEach(input => input.checked = (input.value === 'signup'));
                            tabs.forEach(tab => {
                                const input = tab.querySelector('input');
                                if (input && input.value === 'signup') {
                                    tab.classList.add('bg-primary', 'shadow-sm');
                                    tab.querySelector('span')?.classList.remove('text-text-subtle', 'dark:text-gray-400');
                                    tab.querySelector('span')?.classList.add('text-white', 'font-semibold');
                                } else {
                                    tab.classList.remove('bg-primary', 'shadow-sm');
                                    tab.querySelector('span')?.classList.add('text-text-subtle', 'dark:text-gray-400');
                                    tab.querySelector('span')?.classList.remove('text-white', 'font-semibold');
                                }
                            });
                        }
                    };

                    if ((screenKey === 'LOGIN' || screenKey === 'SIGNUP') && container) {
                        patchAuthMode(screenKey === 'LOGIN' ? 'login' : 'signup');
                    }

                    // 4. Attach Click Listeners for Navigation
                    const handleGlobalClick = (e) => {
                        const target = e.target.closest('button, a, [role="button"], .cursor-pointer, [onclick]');
                        if (!target) return;

                        // Normalize text for comparison
                        const text = target.innerText.trim().replace(/\s+/g, ' ').toLowerCase();
                        const icons = Array.from(target.querySelectorAll('.material-symbols-outlined, .material-icons-round'))
                                           .map(i => i.innerText.trim().toLowerCase());

                        // 3.1. Auth Toggle Heuristic
                        if (target.tagName === 'A' && (screenKey === 'LOGIN' || screenKey === 'SIGNUP')) {
                            if (text === 'sign up') { e.preventDefault(); patchAuthMode('signup'); return; }
                            if (text === 'login') { e.preventDefault(); patchAuthMode('login'); return; }
                        }
                        if (target.tagName === 'LABEL' && (screenKey === 'LOGIN' || screenKey === 'SIGNUP')) {
                            const val = target.querySelector('input')?.value;
                            if (val) { patchAuthMode(val); return; }
                        }

                        // Navigation Logic Heuristics
                        if (text.includes('sign up') || text.includes('create account')) {
                            if (text.includes('provider')) {
                                if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP');
                                else onNavigate('PROVIDER_WELCOME');
                            }
                            else onNavigate('SIGNUP');
                        } else if (text.includes('log in') || text.includes('login') || text.includes('sign in')) {
                            if (text.includes('admin')) onNavigate('ADMIN_LOGIN');
                            else if (screenKey === 'ADMIN_LOGIN') onNavigate('ADMIN_DASHBOARD');
                            else if (text.includes('provider')) onNavigate('PROVIDER_DASHBOARD');
                            else if (screenKey === 'WELCOME') onNavigate('LOGIN');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('continue as guest')) {
                            onNavigate('CLIENT_HOME');
                        } else if (text.includes('book now')) {
                            onNavigate('BOOKING');
                        } else if (text.includes('find services') || text.includes('explore') || icons.includes('search') || icons.includes('grid_view')) {
                            onNavigate('FIND_SERVICES');
                        } else if (text.includes('view profile') || text.includes('view full profile')) {
                            onNavigate('PROVIDER_PROFILE');
                        } else if (text.includes('get started')) {
                            if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('complete setup') || text.includes('finish') || text.includes('complete account') || text.includes('save & continue') || text.includes('save and continue')) {
                            if (screenKey === 'PROVIDER_SETUP') onNavigate('PROVIDER_DASHBOARD');
                            else onNavigate('PROVIDER_DASHBOARD');
                        } else if (text.includes('home') || icons.includes('home') || icons.includes('dashboard')) {
                            if (screenKey.startsWith('PROVIDER_')) onNavigate('PROVIDER_DASHBOARD');
                            else if (screenKey.startsWith('ADMIN_')) onNavigate('ADMIN_DASHBOARD');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('bookings') || icons.includes('calendar_today') || icons.includes('calendar_month') || icons.includes('event_note')) {
                            if (screenKey.startsWith('ADMIN_')) onNavigate('ADMIN_BOOKINGS');
                            else onNavigate('MY_BOOKINGS');
                        } else if (text.includes('messages') || icons.includes('mail') || icons.includes('chat_bubble')) {
                            onNavigate('MESSAGES');
                        } else if (text.includes('profile') || icons.includes('person')) {
                            onNavigate('PROFILE');
                        } else if (text.includes('manage users') || icons.includes('manage_accounts') || text.includes('users')) {
                            onNavigate('ADMIN_USERS');
                        } else if (text.includes('bookings') && screenKey.startsWith('ADMIN_')) {
                            onNavigate('ADMIN_BOOKINGS');
                        } else if (text.includes('my schedule') || icons.includes('calendar_month') || text.includes('calendar')) {
                            if (screenKey.startsWith('PROVIDER_')) onNavigate('PROVIDER_SCHEDULE');
                            else onNavigate('MY_BOOKINGS');
                        } else if (text.includes('new requests') || icons.includes('inbox') || text.includes('requests')) {
                            onNavigate('PROVIDER_REQUESTS');
                        } else if (text.includes('my clients') || icons.includes('groups') || text.includes('clients')) {
                            onNavigate('PROVIDER_CLIENTS');
                        } else if (text.includes('earnings') || icons.includes('account_balance_wallet') || icons.includes('attach_money')) {
                            if (screenKey.startsWith('PROVIDER_')) onNavigate('PROVIDER_DASHBOARD'); // Or an EARNINGS screen if we had one
                        } else if (icons.includes('arrow_back')) {
                            window.dispatchEvent(new CustomEvent('goBack'));
                        }
                    };

                    container.addEventListener('click', handleGlobalClick);
                    return () => container.removeEventListener('click', handleGlobalClick);
                }
            }, [html, loading, screenKey]);

            return (
                <div className={`h-full flex flex-col ${bodyClass}`}>
                    {loading ? (
                        <div className="flex-1 flex items-center justify-center">
                            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-[#87CEEB]"></div>
                        </div>
                    ) : (
                        <div
                            ref={containerRef}
                            className="flex-1 h-full"
                            dangerouslySetInnerHTML={{ __html: html }}
                        />
                    )}
                </div>
            );
        };

        const App = () => {
            const [history, setHistory] = useState(['WELCOME']);
            const [devMenuOpen, setDevMenuOpen] = useState(false);

            const currentScreen = history[history.length - 1];

            const navigate = (nextScreen) => {
                if (nextScreen === currentScreen) return;
                setHistory(prev => [...prev, nextScreen]);
            };

            const goBack = () => {
                if (history.length > 1) {
                    setHistory(prev => prev.slice(0, -1));
                }
            };

            useEffect(() => {
                const handleExternalNavigate = (e) => {
                    if (SCREEN_MAP[e.detail]) navigate(e.detail);
                };
                const handleGoBack = () => goBack();

                window.addEventListener('navigate', handleExternalNavigate);
                window.addEventListener('goBack', handleGoBack);
                return () => {
                    window.removeEventListener('navigate', handleExternalNavigate);
                    window.removeEventListener('goBack', handleGoBack);
                };
            }, [currentScreen, history]);

            return (
                <div className="app-shell">
                    <div className="screen-container animate-fade-in" key={currentScreen}>
                        <Screen screenKey={currentScreen} onNavigate={navigate} />
                    </div>

                    {/* Quick Access Dev Menu */}
                    <div className="dev-menu-btn" onClick={() => setDevMenuOpen(!devMenuOpen)}>
                        <span className="material-symbols-outlined">menu</span>
                    </div>

                    {devMenuOpen && (
                        <div className="dev-menu">
                            <div className="text-[10px] font-bold text-gray-400 mb-2 px-3 uppercase tracking-wider">Switch Flow</div>
                            <button onClick={() => { navigate('WELCOME'); setDevMenuOpen(false); }}>Welcome Screen</button>
                            <button onClick={() => { navigate('CLIENT_HOME'); setDevMenuOpen(false); }}>Client App</button>
                            <button onClick={() => { navigate('PROVIDER_WELCOME'); setDevMenuOpen(false); }}>Provider App</button>
                            <button onClick={() => { navigate('ADMIN_LOGIN'); setDevMenuOpen(false); }}>Admin Panel</button>
                            <div className="mt-2 pt-2 border-t border-gray-100 text-[9px] text-center text-gray-400">
                                Prototype Navigation Control
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
