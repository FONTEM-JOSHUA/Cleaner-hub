<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner Hub - Home Service Professional Platform</title>
    <!-- Load React, ReactDOM, and Babel from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Material Icons and Symbols -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Montserrat', sans-serif;
            background-color: #f5f5f5;
        }
        #root {
            min-height: 100vh;
        }
        .app-shell {
            max-width: 450px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .screen-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }
        /* Custom scrollbar */
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: #87CEEB;
            border-radius: 2px;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fadeIn {
            animation: fadeIn 0.3s ease-in-out;
        }

        .ripple {
            position: absolute;
            background: rgba(135, 206, 235, 0.4);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
        }
        @keyframes ripple-animation {
            to {
                transform: translate(-50%, -50%) scale(4);
                opacity: 0;
            }
        }

        @keyframes sparkle-animation {
            0% { transform: scale(0) rotate(0deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(180deg); opacity: 1; }
            100% { transform: scale(0) rotate(360deg); opacity: 0; }
        }

        .sparkle {
            position: absolute;
            pointer-events: none;
            z-index: 1000;
            width: 20px;
            height: 20px;
        }

        /* Dev Menu */
        .dev-menu-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #87CEEB;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .dev-menu-btn:hover {
            opacity: 1;
        }
        .dev-menu {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 10px;
            z-index: 1001;
            width: 220px;
            border: 1px solid #eee;
            max-height: 400px;
            overflow-y: auto;
        }
        .dev-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #333;
            transition: background 0.2s;
        }
        .dev-menu button:hover {
            background: #f0f9ff;
            color: #87CEEB;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SCREEN_MAP = {
            'WELCOME': 'welcome_screen/code.html',
            'SIGNUP': 'login/signup_screen/code.html',
            'LOGIN': 'login/signup_screen/code.html',
            'CLIENT_HOME': 'home_screen_(main_dashboard)_for_client_app/code.html',
            'FIND_SERVICES': 'find_services_screen_for_client_app/code.html',
            'PROVIDER_PROFILE_PUBLIC': 'provider_profile_(public_view)_screen/code.html',
            'PROVIDER_PROFILE': 'service_provider_profile_screen_for_client_app/code.html',
            'BOOKING': 'booking_screen_for_client_app/code.html',
            'MY_BOOKINGS': 'my_bookings_screen_for_client_app_1/code.html',
            'MY_BOOKINGS_2': 'my_bookings_screen_for_client_app_2/code.html',
            'MY_BOOKINGS_3': 'my_bookings_screen_for_client_app_3/code.html',
            'MESSAGES': 'messages_screen_for_client_app/code.html',
            'CHANNELS_CLIENT': 'channels_screen_(client_app_flow)_/code.html',
            'PROFILE': 'profile_screen_for_client_app/code.html',
            'PROVIDER_WELCOME': 'provider_welcome_screen/code.html',
            'PROVIDER_SETUP': 'provider_setup_screen/code.html',
            'PROVIDER_DASHBOARD': 'provider_dashboard_screen_1/code.html',
            'PROVIDER_DASHBOARD_2': 'provider_dashboard_screen_2/code.html',
            'BOOKING_REQUESTS_PROVIDER': 'booking_requests_screen_for_provider_app/code.html',
            'MY_SCHEDULE_PROVIDER': 'my_schedule_screen_for_provider_app/code.html',
            'MY_CLIENTS_PROVIDER': 'my_clients_screen_for_provider_app_(with_report_feature)/code.html',
            'REPORT_CLIENT': 'report_client_screen_for_provider_app/code.html',
            'CLIENT_REPORT_CONFIRMATION': 'client_report_confirmation_screen_(provider_app)_/code.html',
            'CHANNEL_MANAGEMENT': 'channel_management_screen_(provider/admin_app)_/code.html',
            'CHANNEL_MEMBER_MANAGEMENT': 'channel_member_management_screen_(provider/admin_app)_/code.html',
            'CREATE_CHANNEL': 'create_new_channel_flow_(provider/admin_app)_/code.html',
            'ADMIN_LOGIN': 'admin_login_screen/code.html',
            'ADMIN_DASHBOARD': 'admin_dashboard_screen_1/code.html',
            'ADMIN_DASHBOARD_2': 'admin_dashboard_screen_2/code.html',
            'ADMIN_DASHBOARD_3': 'admin_dashboard_screen_3/code.html',
            'ADMIN_DASHBOARD_4': 'admin_dashboard_screen_4/code.html',
            'ADMIN_PROFILE_EDIT': 'admin_profile_edit_screen/code.html',
            'MANAGE_BOOKINGS_ADMIN': 'manage_bookings_screen_for_admin_app/code.html',
            'MANAGE_USERS_ADMIN': 'manage_users_screen_for_admin_app/code.html',
            'APP_SETTINGS_ADMIN': 'app_settings_screen_for_admin_app/code.html',
            'EASY_PAYMENTS': 'easy_payments_feature_screen/code.html',
            'EMERGENCY_MODE': 'emergency_mode_feature_screen/code.html',
            'FAMILY_SHARING': 'family_sharing_feature_screen/code.html',
            'MULTI_LANGUAGE': 'multi-language_support_screen/code.html',
            'OFFLINE_MODE': 'offline_mode_feature_screen/code.html',
            'PHOTO_VERIFICATION': 'photo_verification_feature_screen/code.html',
            'QUICK_REBOOKING': 'quick_rebooking_feature_screen/code.html',
            'REAL_TIME_TRACKING': 'real-time_tracking_screen/code.html',
            'REPORT_PROVIDER': 'report_provider_screen_for_client_app/code.html',
            'REPORT_CONFIRMATION': 'report_confirmation_screen/code.html',
            'SMART_NOTIFICATIONS': 'smart_notifications_feature_screen/code.html',
            'SMART_SEARCH': 'smart_search_screen/code.html'
        };

        const Screen = ({ screenKey, onNavigate }) => {
            const [html, setHtml] = useState('');
            const [styles, setStyles] = useState('');
            const [loading, setLoading] = useState(true);
            const containerRef = useRef(null);

            useEffect(() => {
                return () => {
                    document.querySelectorAll('[data-screen-assets]').forEach(el => el.remove());
                };
            }, []);

            useEffect(() => {
                const fetchContent = async () => {
                    setLoading(true);
                    try {
                        const path = `extracted_code/stitch_cleaners_hub/${SCREEN_MAP[screenKey]}`;
                        const response = await fetch(path);
                        const text = await response.text();

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');

                        // Clean up old screen assets
                        document.querySelectorAll('[data-screen-assets]').forEach(el => el.remove());

                        // Extract Styles
                        const styleContent = Array.from(doc.querySelectorAll('style'))
                            .map(s => s.innerHTML)
                            .join('\n');
                        setStyles(styleContent);

                        // Extract and inject head elements (Tailwind configs, etc)
                        const headElements = Array.from(doc.head.children);
                        headElements.forEach(el => {
                            if (el.tagName === 'SCRIPT' && el.innerHTML.includes('tailwind.config')) {
                                const script = document.createElement('script');
                                script.innerHTML = el.innerHTML;
                                script.setAttribute('data-screen-assets', 'true');
                                document.head.appendChild(script);
                            }
                        });

                        // Extract Body Content
                        const bodyContent = doc.body.innerHTML;
                        setHtml(bodyContent);

                    } catch (error) {
                        console.error('Failed to load screen:', error);
                        setHtml('<div class="p-10 text-center">Failed to load screen.</div>');
                    }
                    setLoading(false);
                };
                fetchContent();
            }, [screenKey]);

            useEffect(() => {
                if (!loading && containerRef.current) {
                    const container = containerRef.current;

                    // Ensure all buttons/interactables have cursor-pointer
                    container.querySelectorAll('button, .grid > div, [role="button"], a').forEach(el => {
                        el.classList.add('cursor-pointer');
                    });

                    // Handle Auth Mode Patching
                    if (screenKey === 'LOGIN' || screenKey === 'SIGNUP') {
                        const isLogin = screenKey === 'LOGIN';
                        const headerPara = container.querySelector('.text-center.mb-6 p.text-sm');
                        if (headerPara) headerPara.innerText = isLogin ? 'Welcome back! Please enter your details.' : 'Join our network of home service professionals.';

                        const footerText = container.querySelector('.mt-auto.pt-6 p.text-sm');
                        if (footerText) {
                            footerText.innerHTML = isLogin
                                ? 'Don\'t have an account? <a href="#" class="text-primary font-bold hover:underline">Sign Up</a>'
                                : 'Already have an account? <a href="#" class="text-primary font-bold hover:underline">Log In</a>';
                        }
                    }

                    // Execute scripts
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        newScript.setAttribute('data-screen-assets', 'true');
                        document.head.appendChild(newScript);
                    });
                }
            }, [html, loading, screenKey]);

            return (
                <div className="h-full flex flex-col animate-fadeIn">
                    <style dangerouslySetInnerHTML={{ __html: styles }} />
                    {loading ? (
                        <div className="flex-1 flex items-center justify-center">
                            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-[#87CEEB]"></div>
                        </div>
                    ) : (
                        <div
                            ref={containerRef}
                            className="flex-1"
                            dangerouslySetInnerHTML={{ __html: html }}
                        />
                    )}
                </div>
            );
        };

        const App = () => {
            const [history, setHistory] = useState(['WELCOME']);
            const screen = history[history.length - 1];
            const [devMenuOpen, setDevMenuOpen] = useState(false);

            const navigate = (newScreen) => {
                if (newScreen === 'BACK') {
                    if (history.length > 1) {
                        setHistory(prev => prev.slice(0, -1));
                    }
                } else if (newScreen !== screen) {
                    setHistory(prev => [...prev, newScreen]);
                }
            };

            useEffect(() => {
                const handleGlobalClick = (e) => {
                    const target = e.target.closest('button, a, [role="button"], .cursor-pointer, [onclick]');

                    // Create Ripple Effect
                    if (target) {
                        const ripple = document.createElement('span');
                        ripple.classList.add('ripple');
                        const rect = target.getBoundingClientRect();
                        const size = Math.max(rect.width, rect.height);
                        ripple.style.width = ripple.style.height = `${size}px`;
                        ripple.style.left = `${e.clientX - rect.left}px`;
                        ripple.style.top = `${e.clientY - rect.top}px`;
                        target.appendChild(ripple);
                        setTimeout(() => ripple.remove(), 600);
                    }

                    if (!target) return;

                    const text = target.innerText.replace(/\s+/g, ' ').trim().toLowerCase();
                    const icon = target.querySelector('.material-symbols-outlined, .material-icons-round')?.innerText.toLowerCase();

                    // Navigation Heuristics
                    if (text.includes('arrow_back') || text === 'back' || icon === 'arrow_back') {
                        navigate('BACK');
                        return;
                    }

                    // Sparkle on success actions
                    if (text.includes('book now') || text.includes('create account') || text.includes('confirm') || text.includes('save')) {
                        createSparkles(e.clientX, e.clientY);
                    }

                    if (text.includes('sign up') || text.includes('create account')) {
                        if (text.includes('provider')) navigate('PROVIDER_WELCOME');
                        else if (screen === 'SIGNUP') navigate('CLIENT_HOME');
                        else navigate('SIGNUP');
                    } else if (text.includes('log in') || text.includes('login') || text.includes('sign in')) {
                        if (text.includes('admin')) navigate('ADMIN_LOGIN');
                        else if (screen === 'ADMIN_LOGIN') navigate('ADMIN_DASHBOARD');
                        else if (screen === 'WELCOME') navigate('LOGIN');
                        else navigate('CLIENT_HOME');
                    } else if (text.includes('continue as guest')) {
                        navigate('CLIENT_HOME');
                    } else if (text.includes('find services') || text.includes('explore')) {
                        navigate('FIND_SERVICES');
                    } else if (text.includes('book now')) {
                        navigate('BOOKING');
                    } else if (text.includes('view profile')) {
                        navigate('PROVIDER_PROFILE');
                    } else if (text.includes('get started')) {
                        if (screen === 'PROVIDER_WELCOME') navigate('PROVIDER_SETUP');
                        else navigate('SIGNUP');
                    } else if (text.includes('complete setup') || text.includes('save & continue')) {
                        navigate('PROVIDER_DASHBOARD');
                    } else if (text.includes('manage bookings')) {
                        navigate('MANAGE_BOOKINGS_ADMIN');
                    } else if (text.includes('home') || icon === 'home') {
                        navigate('CLIENT_HOME');
                    } else if (text.includes('bookings') || icon === 'calendar_today') {
                        navigate('MY_BOOKINGS');
                    } else if (text.includes('messages') || icon === 'mail' || icon === 'chat') {
                        navigate('MESSAGES');
                    } else if (text.includes('profile') || icon === 'person') {
                        if (screen.startsWith('ADMIN')) navigate('ADMIN_PROFILE_EDIT');
                        else navigate('PROFILE');
                    } else if (text.includes('emergency')) {
                        navigate('EMERGENCY_MODE');
                    }
                };

                const createSparkles = (x, y) => {
                    for (let i = 0; i < 8; i++) {
                        const sparkle = document.createElement('div');
                        sparkle.className = 'sparkle';
                        sparkle.innerHTML = '✨';
                        sparkle.style.left = `${x + (Math.random() - 0.5) * 50}px`;
                        sparkle.style.top = `${y + (Math.random() - 0.5) * 50}px`;
                        sparkle.style.fontSize = `${Math.random() * 10 + 10}px`;
                        sparkle.style.color = ['#87CEEB', '#FFD700', '#FFFFFF'][Math.floor(Math.random() * 3)];
                        sparkle.style.animation = `sparkle-animation ${Math.random() * 0.5 + 0.5}s ease-out forwards`;
                        document.body.appendChild(sparkle);
                        setTimeout(() => sparkle.remove(), 1000);
                    }
                };

                window.addEventListener('click', handleGlobalClick);
                const handleExternalNavigate = (e) => {
                    if (SCREEN_MAP[e.detail]) navigate(e.detail);
                };
                window.addEventListener('navigate', handleExternalNavigate);
                window.addEventListener('goBack', () => navigate('BACK'));

                return () => {
                    window.removeEventListener('click', handleGlobalClick);
                    window.removeEventListener('navigate', handleExternalNavigate);
                    window.removeEventListener('goBack', () => navigate('BACK'));
                };
            }, [screen, history]);

            return (
                <div className="app-shell">
                    <div className="screen-container">
                        <Screen screenKey={screen} onNavigate={navigate} />
                    </div>

                    {/* Quick Access Dev Menu */}
                    <div className="dev-menu-btn" onClick={() => setDevMenuOpen(!devMenuOpen)}>
                        <span className="material-symbols-outlined">menu</span>
                    </div>

                    {devMenuOpen && (
                        <div className="dev-menu">
                            <div className="text-[10px] font-bold text-gray-400 mb-2 px-3 uppercase tracking-wider">Switch Flow</div>
                            <button onClick={() => { navigate('WELCOME'); setDevMenuOpen(false); }}>Welcome Screen</button>
                            <button onClick={() => { navigate('CLIENT_HOME'); setDevMenuOpen(false); }}>Client App</button>
                            <button onClick={() => { navigate('PROVIDER_WELCOME'); setDevMenuOpen(false); }}>Provider App</button>
                            <button onClick={() => { navigate('ADMIN_LOGIN'); setDevMenuOpen(false); }}>Admin Panel</button>
                            <div className="border-t my-2"></div>
                            <div className="text-[10px] font-bold text-gray-400 mb-2 px-3 uppercase tracking-wider">Features</div>
                            <button onClick={() => { navigate('EMERGENCY_MODE'); setDevMenuOpen(false); }}>Emergency Mode</button>
                            <button onClick={() => { navigate('SMART_SEARCH'); setDevMenuOpen(false); }}>Smart Search</button>
                            <button onClick={() => { navigate('PHOTO_VERIFICATION'); setDevMenuOpen(false); }}>Photo Verification</button>
                            <div className="mt-2 pt-2 border-t border-gray-100 text-[9px] text-center text-gray-400">
                                Prototype Navigation Control
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
