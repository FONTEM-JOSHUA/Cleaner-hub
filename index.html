<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner Hub - Home Service Professional Platform</title>
    <!-- Load React, ReactDOM, and Babel from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Material Icons and Symbols -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Montserrat', sans-serif;
            background-color: #f5f5f5;
        }
        #root {
            min-height: 100vh;
        }
        /* Ripple Effect */
        .ripple {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: ripple-animation 0.6s linear;
        }
        @keyframes ripple-animation {
            from { width: 0; height: 0; opacity: 0.5; }
            to { width: 400px; height: 400px; opacity: 0; }
        }
        /* Sparkle Effect */
        .sparkle {
            position: absolute;
            pointer-events: none;
            z-index: 9999;
        }
        @keyframes sparkle-animation {
            0% { transform: scale(0) rotate(0deg); opacity: 1; }
            100% { transform: scale(1.5) rotate(180deg); opacity: 0; }
        }

        .app-shell {
            max-width: 450px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .screen-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }
        /* Custom scrollbar for a better look */
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 2px;
        }
        .screen-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Floating Action Menu for Demo */
        .dev-menu-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #87CEEB;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .dev-menu-btn:hover {
            opacity: 1;
        }
        .dev-menu {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 10px;
            z-index: 1001;
            width: 200px;
            border: 1px solid #eee;
        }
        .dev-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            transition: background 0.2s;
        }
        .dev-menu button:hover {
            background: #f0f9ff;
            color: #87CEEB;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SCREEN_MAP = {
            'WELCOME': 'welcome_screen/code.html',
            'SIGNUP': 'login/signup_screen/code.html',
            'LOGIN': 'login/signup_screen/code.html',
            'CLIENT_HOME': 'home_screen_(main_dashboard)_for_client_app/code.html',
            'FIND_SERVICES': 'find_services_screen_for_client_app/code.html',
            'SERVICE_PROVIDER_PROFILE': 'service_provider_profile_screen_for_client_app/code.html',
            'BOOKING': 'booking_screen_for_client_app/code.html',
            'MY_BOOKINGS': 'my_bookings_screen_for_client_app_1/code.html',
            'MY_BOOKINGS_2': 'my_bookings_screen_for_client_app_2/code.html',
            'MY_BOOKINGS_3': 'my_bookings_screen_for_client_app_3/code.html',
            'MESSAGES': 'messages_screen_for_client_app/code.html',
            'PROFILE': 'profile_screen_for_client_app/code.html',
            'PROVIDER_WELCOME': 'provider_welcome_screen/code.html',
            'PROVIDER_SETUP': 'provider_setup_screen/code.html',
            'PROVIDER_DASHBOARD': 'provider_dashboard_screen_1/code.html',
            'PROVIDER_DASHBOARD_2': 'provider_dashboard_screen_2/code.html',
            'PROVIDER_SCHEDULE': 'my_schedule_screen_for_provider_app/code.html',
            'PROVIDER_REQUESTS': 'booking_requests_screen_for_provider_app/code.html',
            'PROVIDER_CLIENTS': 'my_clients_screen_for_provider_app_(with_report_feature)/code.html',
            'PROVIDER_PROFILE_PUBLIC': 'provider_profile_(public_view)_screen/code.html',
            'ADMIN_LOGIN': 'admin_login_screen/code.html',
            'ADMIN_DASHBOARD': 'admin_dashboard_screen_1/code.html',
            'ADMIN_DASHBOARD_2': 'admin_dashboard_screen_2/code.html',
            'ADMIN_DASHBOARD_3': 'admin_dashboard_screen_3/code.html',
            'ADMIN_DASHBOARD_4': 'admin_dashboard_screen_4/code.html',
            'ADMIN_PROFILE_EDIT': 'admin_profile_edit_screen/code.html',
            'ADMIN_MANAGE_USERS': 'manage_users_screen_for_admin_app/code.html',
            'ADMIN_MANAGE_BOOKINGS': 'manage_bookings_screen_for_admin_app/code.html',
            'ADMIN_SETTINGS': 'app_settings_screen_for_admin_app/code.html',
            'CHANNELS': 'channels_screen_(client_app_flow)_/code.html',
            'CHANNEL_MANAGEMENT': 'channel_management_screen_(provider/admin_app)_/code.html',
            'CHANNEL_MEMBER_MANAGEMENT': 'channel_member_management_screen_(provider/admin_app)_/code.html',
            'CREATE_CHANNEL': 'create_new_channel_flow_(provider/admin_app)_/code.html',
            'EMERGENCY_MODE': 'emergency_mode_feature_screen/code.html',
            'EASY_PAYMENTS': 'easy_payments_feature_screen/code.html',
            'FAMILY_SHARING': 'family_sharing_feature_screen/code.html',
            'OFFLINE_MODE': 'offline_mode_feature_screen/code.html',
            'PHOTO_VERIFICATION': 'photo_verification_feature_screen/code.html',
            'QUICK_REBOOKING': 'quick_rebooking_feature_screen/code.html',
            'REAL_TIME_TRACKING': 'real-time_tracking_screen/code.html',
            'SMART_NOTIFICATIONS': 'smart_notifications_feature_screen/code.html',
            'SMART_SEARCH': 'smart_search_screen/code.html',
            'MULTI_LANGUAGE': 'multi-language_support_screen/code.html',
            'REPORT_PROVIDER': 'report_provider_screen_for_client_app/code.html',
            'REPORT_CLIENT': 'report_client_screen_for_provider_app/code.html',
            'REPORT_CONFIRMATION': 'report_confirmation_screen/code.html',
            'CLIENT_REPORT_CONFIRMATION': 'client_report_confirmation_screen_(provider_app)_/code.html'
        };

        const Screen = ({ screenKey, onNavigate }) => {
            const [html, setHtml] = useState('');
            const [loading, setLoading] = useState(true);
            const containerRef = useRef(null);

            useEffect(() => {
                const fetchContent = async () => {
                    setLoading(true);
                    try {
                        const path = `extracted_code/stitch_cleaners_hub/${SCREEN_MAP[screenKey]}`;
                        const response = await fetch(path);
                        const text = await response.text();

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');

                        // Cleanup previous assets
                        document.querySelectorAll('[data-screen-assets]').forEach(el => el.remove());

                        // Inject Head Elements (Styles, Tailwind Configs, etc.)
                        const headElements = doc.querySelectorAll('head > style, head > script:not([src])');
                        headElements.forEach(el => {
                            const newEl = document.createElement(el.tagName);
                            Array.from(el.attributes).forEach(attr => newEl.setAttribute(attr.name, attr.value));
                            newEl.innerHTML = el.innerHTML;
                            newEl.setAttribute('data-screen-assets', 'true');
                            document.head.appendChild(newEl);
                        });

                        // Extract Body Content
                        const bodyContent = doc.body.innerHTML;
                        setHtml(bodyContent);
                    } catch (error) {
                        console.error('Failed to load screen:', error);
                        setHtml('<div class="p-10 text-center">Failed to load screen.</div>');
                    }
                    setLoading(false);
                };
                fetchContent();

                return () => {
                    document.querySelectorAll('[data-screen-assets]').forEach(el => el.remove());
                };
            }, [screenKey]);

            // Execute scripts and attach listeners
            useEffect(() => {
                if (!loading && containerRef.current) {
                    const container = containerRef.current;

                    // Auth Mode Patching
                    if (screenKey === 'LOGIN' || screenKey === 'SIGNUP') {
                        const isLogin = screenKey === 'LOGIN';
                        const labels = container.querySelectorAll('label');
                        const loginTab = Array.from(labels).find(l => l.innerText.includes('Login'));
                        const signupTab = Array.from(labels).find(l => l.innerText.includes('Sign Up'));
                        const submitBtn = container.querySelector('.mt-8 button');
                        const headerSubtext = container.querySelector('p.text-text-subtle');
                        const footerText = container.querySelector('.mt-auto.pt-6 p');
                        const footerLink = container.querySelector('.mt-auto.pt-6 a');

                        if (isLogin) {
                            if (loginTab) loginTab.className = "group flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-4 relative shadow-sm transition-all duration-200 bg-primary";
                            if (signupTab) signupTab.className = "group flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-4 relative transition-all duration-200";
                            if (loginTab) loginTab.querySelector('span').className = "z-10 text-sm font-semibold text-white";
                            if (signupTab) signupTab.querySelector('span').className = "z-10 text-sm font-medium text-text-subtle group-hover:text-text-main dark:text-gray-400 dark:group-hover:text-white transition-colors";

                            // Remove Name and Phone fields for Login
                            container.querySelectorAll('input[placeholder="Full Name"], input[placeholder="Phone Number"]').forEach(i => i.parentElement.remove());
                            // Remove T&C
                            const checkbox = container.querySelector('input[type="checkbox"]');
                            if (checkbox) checkbox.closest('label').remove();

                            if (submitBtn) {
                                const btnSpan = submitBtn.querySelector('span');
                                if (btnSpan) btnSpan.innerText = 'Login';
                            }
                            if (headerSubtext) headerSubtext.innerText = 'Welcome back! Please login to your account';
                            if (footerText) footerText.innerHTML = 'Don\'t have an account? <a class="font-semibold text-primary hover:text-primary-dark transition-colors" href="#">Sign Up</a>';
                        } else {
                             if (signupTab) signupTab.className = "group flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-4 relative shadow-sm transition-all duration-200 bg-primary";
                             if (loginTab) loginTab.className = "group flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-4 relative transition-all duration-200";
                             if (signupTab) signupTab.querySelector('span').className = "z-10 text-sm font-semibold text-white";
                             if (loginTab) loginTab.querySelector('span').className = "z-10 text-sm font-medium text-text-subtle group-hover:text-text-main dark:text-gray-400 dark:group-hover:text-white transition-colors";
                        }
                    }

                    // 1. Ensure interactive elements have cursor-pointer
                    container.querySelectorAll('button, .grid > div').forEach(el => {
                        el.classList.add('cursor-pointer');
                    });

                    // 2. Manually execute any script tags found in the Body
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.innerHTML = oldScript.innerHTML;
                        document.head.appendChild(newScript);
                        // Clean up after execution if it's a one-timer, but for now we'll just let it run
                        oldScript.remove();
                    });

                    // 3. Attach Click Listeners for Navigation
                    const handleGlobalClick = (e) => {
                        const target = e.target.closest('button, a, [role="button"], .cursor-pointer, [onclick]');
                        if (!target) return;

                        // Water Ripple Effect
                        const rect = target.getBoundingClientRect();
                        const ripple = document.createElement('span');
                        ripple.className = 'ripple';
                        ripple.style.left = `${e.clientX - rect.left}px`;
                        ripple.style.top = `${e.clientY - rect.top}px`;
                        target.style.position = 'relative';
                        target.style.overflow = 'hidden';
                        target.appendChild(ripple);
                        setTimeout(() => ripple.remove(), 600);

                        const text = target.innerText.trim().toLowerCase().replace(/\s+/g, ' ');
                        const role = screenKey.startsWith('PROVIDER') ? 'PROVIDER' : (screenKey.startsWith('ADMIN') ? 'ADMIN' : 'CLIENT');

                        // Back Button Detection Heuristic
                        const isBack = text === 'arrow_back' ||
                                       text === 'back' ||
                                       target.querySelector('.material-symbols-outlined')?.innerText === 'arrow_back' ||
                                       target.querySelector('.material-icons-round')?.innerText === 'arrow_back';

                        if (isBack) {
                            window.dispatchEvent(new CustomEvent('goBack'));
                            return;
                        }

                        // Shared Auth Toggling
                        if ((screenKey === 'SIGNUP' || screenKey === 'LOGIN') && (target.tagName === 'A' || target.tagName === 'LABEL' || target.closest('.mt-auto.pt-6'))) {
                            if (text.includes('login')) { onNavigate('LOGIN'); return; }
                            if (text.includes('sign up')) { onNavigate('SIGNUP'); return; }
                        }

                        // Navigation Logic Heuristics
                        if (text.includes('sign up') || text.includes('create account')) {
                            if (text.includes('provider')) onNavigate('PROVIDER_WELCOME');
                            else if (screenKey === 'SIGNUP') onNavigate('CLIENT_HOME');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('log in') || text.includes('login') || text.includes('sign in')) {
                            if (text.includes('admin')) onNavigate('ADMIN_LOGIN');
                            else if (screenKey === 'ADMIN_LOGIN') onNavigate('ADMIN_DASHBOARD');
                            else if (screenKey === 'WELCOME') onNavigate('LOGIN');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('continue as guest')) {
                            onNavigate('CLIENT_HOME');
                        } else if (text.includes('book now')) {
                            onNavigate('BOOKING');
                        } else if (text.includes('find services') || text.includes('explore')) {
                            onNavigate('FIND_SERVICES');
                        } else if (text.includes('view profile')) {
                            onNavigate('SERVICE_PROVIDER_PROFILE');
                        } else if (text.includes('get started')) {
                            if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('save & continue') || text.includes('complete setup') || text.includes('finish')) {
                            if (role === 'PROVIDER') onNavigate('PROVIDER_DASHBOARD');
                        } else if (text.includes('emergency clean') || text.includes('emergency mode')) {
                            onNavigate('EMERGENCY_MODE');
                        } else if (text.includes('manage bookings')) {
                            onNavigate('ADMIN_MANAGE_BOOKINGS');
                        } else if (text.includes('manage users')) {
                            onNavigate('ADMIN_MANAGE_USERS');
                        } else if (text.includes('app settings')) {
                            onNavigate('ADMIN_SETTINGS');
                        } else if (text.includes('home') || target.querySelector('.material-symbols-outlined')?.innerText === 'home') {
                            if (role === 'PROVIDER') onNavigate('PROVIDER_DASHBOARD');
                            else if (role === 'ADMIN') onNavigate('ADMIN_DASHBOARD');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('bookings') || target.querySelector('.material-symbols-outlined')?.innerText === 'calendar_today') {
                            if (role === 'PROVIDER') onNavigate('PROVIDER_SCHEDULE');
                            else onNavigate('MY_BOOKINGS');
                        } else if (text.includes('messages') || target.querySelector('.material-symbols-outlined')?.innerText === 'mail') {
                            onNavigate('MESSAGES');
                        } else if (text.includes('profile') || target.querySelector('.material-symbols-outlined')?.innerText === 'person') {
                            if (role === 'ADMIN') onNavigate('ADMIN_PROFILE_EDIT');
                            else onNavigate('PROFILE');
                        } else if (text.includes('view details') || text.includes('reschedule')) {
                             onNavigate('MY_BOOKINGS_2');
                        } else if (text.includes('add review')) {
                             onNavigate('MY_BOOKINGS_3');
                        }

                        // Sparkle Animation for Success Actions
                        const successActions = ['book now', 'confirm booking', 'create account', 'save & continue', 'complete setup', 'finish'];
                        if (successActions.some(action => text.includes(action))) {
                            for (let i = 0; i < 12; i++) {
                                const sparkle = document.createElement('div');
                                sparkle.className = 'sparkle';
                                const colors = ['#87CEEB', '#FFD700', '#FF69B4', '#00FF7F'];
                                sparkle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                                sparkle.style.width = '6px';
                                sparkle.style.height = '6px';
                                sparkle.style.borderRadius = '50%';
                                sparkle.style.left = `${e.clientX}px`;
                                sparkle.style.top = `${e.clientY}px`;
                                sparkle.style.animation = `sparkle-animation 0.8s ease-out forwards`;
                                sparkle.style.transform = `translate(${(Math.random() - 0.5) * 100}px, ${(Math.random() - 0.5) * 100}px)`;
                                document.body.appendChild(sparkle);
                                setTimeout(() => sparkle.remove(), 800);
                            }
                        }
                    };

                    container.addEventListener('click', handleGlobalClick);
                    return () => container.removeEventListener('click', handleGlobalClick);
                }
            }, [html, loading, screenKey]);

            return (
                <div className="h-full flex flex-col">
                    {loading ? (
                        <div className="flex-1 flex items-center justify-center">
                            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-[#87CEEB]"></div>
                        </div>
                    ) : (
                        <div
                            ref={containerRef}
                            className="flex-1"
                            dangerouslySetInnerHTML={{ __html: html }}
                        />
                    )}
                </div>
            );
        };

        const App = () => {
            const [history, setHistory] = useState(['WELCOME']);
            const [devMenuOpen, setDevMenuOpen] = useState(false);
            const screen = history[history.length - 1];

            const navigate = (nextScreen) => {
                if (SCREEN_MAP[nextScreen]) {
                    setHistory(prev => [...prev, nextScreen]);
                }
            };

            const goBack = () => {
                if (history.length > 1) {
                    setHistory(prev => prev.slice(0, -1));
                }
            };

            useEffect(() => {
                const handleExternalNavigate = (e) => navigate(e.detail);
                const handleGoBack = () => goBack();

                window.addEventListener('navigate', handleExternalNavigate);
                window.addEventListener('goBack', handleGoBack);
                return () => {
                    window.removeEventListener('navigate', handleExternalNavigate);
                    window.removeEventListener('goBack', handleGoBack);
                };
            }, [history]);

            return (
                <div className="app-shell">
                    <div className="screen-container">
                        <Screen screenKey={screen} onNavigate={navigate} />
                    </div>

                    {/* Quick Access Dev Menu */}
                    <div className="dev-menu-btn" onClick={() => setDevMenuOpen(!devMenuOpen)}>
                        <span className="material-symbols-outlined">menu</span>
                    </div>

                    {devMenuOpen && (
                        <div className="dev-menu">
                            <div className="text-[10px] font-bold text-gray-400 mb-2 px-3 uppercase tracking-wider">Switch Flow</div>
                            <button onClick={() => { navigate('WELCOME'); setDevMenuOpen(false); }}>Welcome Screen</button>
                            <button onClick={() => { navigate('CLIENT_HOME'); setDevMenuOpen(false); }}>Client App</button>
                            <button onClick={() => { navigate('PROVIDER_WELCOME'); setDevMenuOpen(false); }}>Provider App</button>
                            <button onClick={() => { navigate('ADMIN_LOGIN'); setDevMenuOpen(false); }}>Admin Panel</button>
                            <div className="mt-2 pt-2 border-t border-gray-100 text-[9px] text-center text-gray-400">
                                Prototype Navigation Control
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
