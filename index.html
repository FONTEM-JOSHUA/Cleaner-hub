<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner Hub - Home Service Professional Platform</title>
    <!-- Load React, ReactDOM, and Babel from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Material Icons and Symbols -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Montserrat', sans-serif;
            background-color: #f5f5f5;
        }
        #root {
            min-height: 100vh;
        }
        .app-shell {
            max-width: 450px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .screen-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }
        /* Custom scrollbar for a better look */
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 2px;
        }
        .screen-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Water Ripple Effect */
        .ripple {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
        }
        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Sparkle Animation */
        .sparkle {
            position: absolute;
            pointer-events: none;
            z-index: 2000;
            animation: sparkle-fade 0.8s ease-out forwards;
        }
        @keyframes sparkle-fade {
            0% { transform: translate(0, 0) scale(0); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(1.2); opacity: 0; }
        }

        /* Screen Transition */
        .screen-fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Floating Action Menu for Demo */
        .dev-menu-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #87CEEB;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .dev-menu-btn:hover {
            opacity: 1;
        }
        .dev-menu {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 10px;
            z-index: 1001;
            width: 200px;
            border: 1px solid #eee;
        }
        .dev-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            transition: background 0.2s;
        }
        .dev-menu button:hover {
            background: #f0f9ff;
            color: #87CEEB;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SCREEN_MAP = {
            'WELCOME': 'welcome_screen/code.html',
            'SIGNUP': 'login/signup_screen/code.html',
            'LOGIN': 'login/signup_screen/code.html',
            'CLIENT_HOME': 'home_screen_(main_dashboard)_for_client_app/code.html',
            'FIND_SERVICES': 'find_services_screen_for_client_app/code.html',
            'PROVIDER_PROFILE': 'service_provider_profile_screen_for_client_app/code.html',
            'BOOKING': 'booking_screen_for_client_app/code.html',
            'MY_BOOKINGS': 'my_bookings_screen_for_client_app_1/code.html',
            'PROVIDER_WELCOME': 'provider_welcome_screen/code.html',
            'PROVIDER_SETUP': 'provider_setup_screen/code.html',
            'PROVIDER_DASHBOARD': 'provider_dashboard_screen_1/code.html',
            'ADMIN_LOGIN': 'admin_login_screen/code.html',
            'ADMIN_DASHBOARD': 'admin_dashboard_screen_1/code.html',
            'MESSAGES': 'messages_screen_for_client_app/code.html',
            'PROFILE': 'profile_screen_for_client_app/code.html',
            'ADMIN_DASHBOARD_2': 'admin_dashboard_screen_2/code.html',
            'ADMIN_DASHBOARD_3': 'admin_dashboard_screen_3/code.html',
            'ADMIN_DASHBOARD_4': 'admin_dashboard_screen_4/code.html',
            'ADMIN_PROFILE_EDIT': 'admin_profile_edit_screen/code.html',
            'ADMIN_SETTINGS': 'app_settings_screen_for_admin_app/code.html',
            'ADMIN_MANAGE_BOOKINGS': 'manage_bookings_screen_for_admin_app/code.html',
            'ADMIN_MANAGE_USERS': 'manage_users_screen_for_admin_app/code.html',
            'PROVIDER_DASHBOARD_2': 'provider_dashboard_screen_2/code.html',
            'PROVIDER_REQUESTS': 'booking_requests_screen_for_provider_app/code.html',
            'PROVIDER_SCHEDULE': 'my_schedule_screen_for_provider_app/code.html',
            'PROVIDER_CLIENTS': 'my_clients_screen_for_provider_app_(with_report_feature)/code.html',
            'PROVIDER_PROFILE_PUBLIC': 'provider_profile_(public_view)_screen/code.html',
            'PROVIDER_REPORT_CLIENT': 'report_client_screen_for_provider_app/code.html',
            'PROVIDER_REPORT_CONFIRMATION': 'client_report_confirmation_screen_(provider_app)_/code.html',
            'PROVIDER_CHANNELS': 'channel_management_screen_(provider/admin_app)_/code.html',
            'PROVIDER_CHANNEL_MEMBERS': 'channel_member_management_screen_(provider/admin_app)_/code.html',
            'PROVIDER_CREATE_CHANNEL': 'create_new_channel_flow_(provider/admin_app)_/code.html',
            'CLIENT_BOOKINGS_2': 'my_bookings_screen_for_client_app_2/code.html',
            'CLIENT_BOOKINGS_3': 'my_bookings_screen_for_client_app_3/code.html',
            'CLIENT_CHANNELS': 'channels_screen_(client_app_flow)_/code.html',
            'CLIENT_REPORT_PROVIDER': 'report_provider_screen_for_client_app/code.html',
            'EASY_PAYMENTS': 'easy_payments_feature_screen/code.html',
            'REALTIME_TRACKING': 'real-time_tracking_screen/code.html',
            'OFFLINE_MODE': 'offline_mode_feature_screen/code.html',
            'EMERGENCY_MODE': 'emergency_mode_feature_screen/code.html',
            'SMART_SEARCH': 'smart_search_screen/code.html',
            'SMART_NOTIFICATIONS': 'smart_notifications_feature_screen/code.html',
            'FAMILY_SHARING': 'family_sharing_feature_screen/code.html',
            'MULTI_LANGUAGE': 'multi-language_support_screen/code.html',
            'QUICK_REBOOKING': 'quick_rebooking_feature_screen/code.html',
            'PHOTO_VERIFICATION': 'photo_verification_feature_screen/code.html',
            'REPORT_CONFIRMATION': 'report_confirmation_screen/code.html'
        };

        const Screen = ({ screenKey, onNavigate }) => {
            const [html, setHtml] = useState('');
            const [loading, setLoading] = useState(true);
            const containerRef = useRef(null);

            const patchAuthMode = (container, mode) => {
                // Find labels and corresponding radio inputs
                const labels = container.querySelectorAll('label');
                labels.forEach(label => {
                    const input = label.querySelector('input[name="auth-mode"]');
                    if (input) {
                        const isTarget = input.value === mode.toLowerCase();
                        if (isTarget) {
                            label.className = "group flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-4 relative shadow-sm transition-all duration-200 bg-primary";
                            label.querySelector('span').className = "z-10 text-sm font-semibold text-white";
                            input.checked = true;
                        } else {
                            label.className = "group flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-4 relative transition-all duration-200";
                            label.querySelector('span').className = "z-10 text-sm font-medium text-text-subtle group-hover:text-text-main dark:text-gray-400 dark:group-hover:text-white transition-colors";
                            input.checked = false;
                        }
                    }
                });

                // Patch Header text if needed
                const subtext = container.querySelector('p.text-text-subtle');
                if (subtext) {
                    subtext.innerText = mode === 'LOGIN' ? "Welcome back! Please login to your account" : "Join our community of trusted professionals";
                }

                // Patch Main Action Button
                const actionBtn = container.querySelector('button.bg-primary span');
                if (actionBtn) {
                    actionBtn.innerText = mode === 'LOGIN' ? "Log In" : "Create Account";
                }

                // Patch Footer Text
                const footerText = container.querySelector('.mt-auto.pt-6 p');
                if (footerText) {
                    if (mode === 'LOGIN') {
                        footerText.innerHTML = `Don't have an account? <a class="font-semibold text-primary hover:text-primary-dark transition-colors" href="#">Sign Up</a>`;
                    } else {
                        footerText.innerHTML = `Already have an account? <a class="font-semibold text-primary hover:text-primary-dark transition-colors" href="#">Login</a>`;
                    }
                }

                // Hide/Show Name and Phone fields for Login
                const fields = container.querySelectorAll('.flex.flex-col.gap-4 > .relative');
                fields.forEach(field => {
                    const placeholder = field.querySelector('input')?.placeholder?.toLowerCase() || '';
                    if (mode === 'LOGIN') {
                        if (placeholder.includes('name') || placeholder.includes('phone') || field.querySelector('label')) {
                            field.style.display = 'none';
                        }
                    } else {
                        field.style.display = 'block';
                    }
                });
            };

            useEffect(() => {
                const fetchContent = async () => {
                    setLoading(true);
                    try {
                        const path = `extracted_code/stitch_cleaners_hub/${SCREEN_MAP[screenKey]}`;
                        const response = await fetch(path);
                        const text = await response.text();

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');

                        // Cleanup previous screen assets
                        document.querySelectorAll('[data-screen-assets]').forEach(el => el.remove());

                        // Extract and Inject Styles
                        doc.querySelectorAll('style').forEach(style => {
                            const newStyle = document.createElement('style');
                            newStyle.innerHTML = style.innerHTML;
                            newStyle.setAttribute('data-screen-assets', 'true');
                            document.head.appendChild(newStyle);
                        });

                        // Extract and Inject Scripts from Head (Tailwind configs, etc)
                        doc.querySelectorAll('head script').forEach(script => {
                            const newScript = document.createElement('script');
                            Array.from(script.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                            newScript.innerHTML = script.innerHTML;
                            newScript.setAttribute('data-screen-assets', 'true');
                            document.head.appendChild(newScript);
                        });

                        // Extract Body Content
                        const body = doc.body;

                        // Apply Auth Mode Patching if applicable
                        if (screenKey === 'LOGIN' || screenKey === 'SIGNUP') {
                            patchAuthMode(body, screenKey);
                        }

                        setHtml(body.innerHTML);
                    } catch (error) {
                        console.error('Failed to load screen:', error);
                        setHtml('<div class="p-10 text-center">Failed to load screen.</div>');
                    }
                    setLoading(false);
                };
                fetchContent();

                return () => {
                    document.querySelectorAll('[data-screen-assets]').forEach(el => el.remove());
                };
            }, [screenKey]);

            // Execute scripts and attach listeners
            useEffect(() => {
                if (!loading && containerRef.current) {
                    const container = containerRef.current;

                    // 1. Manually execute any script tags found in the HTML body
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });

                    // 2. Attach Click Listeners for Navigation
                    const handleGlobalClick = (e) => {
                        const target = e.target.closest('button, a, [role="button"], .cursor-pointer, [onclick]');
                        if (!target) return;

                        const text = target.innerText.replace(/\s+/g, ' ').trim().toLowerCase();
                        const icon = target.querySelector('.material-symbols-outlined, .material-icons-round')?.innerText.trim() || '';

                        // Back Navigation Heuristic
                        if (icon === 'arrow_back' || text === 'back' || icon === 'chevron_left') {
                            window.dispatchEvent(new CustomEvent('goBack'));
                            return;
                        }

                        // Navigation Logic Heuristics
                        if (text.includes('sign up') || text.includes('create account')) {
                            if (text.includes('provider')) {
                                if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP');
                                else onNavigate('PROVIDER_WELCOME');
                            }
                            else if (screenKey === 'SIGNUP') onNavigate('CLIENT_HOME');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('log in') || text.includes('login') || text.includes('sign in')) {
                            if (text.includes('admin')) onNavigate('ADMIN_LOGIN');
                            else if (screenKey === 'ADMIN_LOGIN') onNavigate('ADMIN_DASHBOARD');
                            else if (screenKey === 'WELCOME' || screenKey === 'SIGNUP') onNavigate('LOGIN');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('continue as guest')) {
                            onNavigate('CLIENT_HOME');
                        } else if (text.includes('book now')) {
                            onNavigate('BOOKING');
                        } else if (text.includes('find services') || text.includes('explore')) {
                            onNavigate('FIND_SERVICES');
                        } else if (text.includes('view profile')) {
                            onNavigate('PROVIDER_PROFILE');
                        } else if (text.includes('get started')) {
                            if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('save') || text.includes('complete setup') || text.includes('finish')) {
                            if (screenKey === 'PROVIDER_SETUP') onNavigate('PROVIDER_DASHBOARD');
                        } else if (text.includes('home') || icon === 'home') {
                            if (screenKey.startsWith('ADMIN_')) onNavigate('ADMIN_DASHBOARD');
                            else if (screenKey.startsWith('PROVIDER_')) onNavigate('PROVIDER_DASHBOARD');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('manage bookings') || icon === 'event_note') {
                            onNavigate('ADMIN_MANAGE_BOOKINGS');
                        } else if (text.includes('manage users') || icon === 'group_add') {
                            onNavigate('ADMIN_MANAGE_USERS');
                        } else if (text.includes('bookings') || icon === 'calendar_today' || icon === 'event') {
                            if (screenKey.startsWith('PROVIDER_')) onNavigate('PROVIDER_REQUESTS');
                            else onNavigate('MY_BOOKINGS');
                        } else if (text.includes('messages') || icon === 'mail' || icon === 'chat' || icon === 'forum') {
                            if (screenKey.startsWith('PROVIDER_')) onNavigate('PROVIDER_CHANNELS');
                            else onNavigate('MESSAGES');
                        } else if (text.includes('profile') || icon === 'person' || icon === 'account_circle') {
                            if (screenKey.startsWith('ADMIN_')) onNavigate('ADMIN_PROFILE_EDIT');
                            else onNavigate('PROFILE');
                        } else if (text.includes('schedule') || icon === 'schedule') {
                            onNavigate('PROVIDER_SCHEDULE');
                        } else if (text.includes('clients') || icon === 'groups') {
                            onNavigate('PROVIDER_CLIENTS');
                        } else if (text.includes('emergency')) {
                            onNavigate('EMERGENCY_MODE');
                        } else if (text.includes('search') || icon === 'search') {
                            onNavigate('SMART_SEARCH');
                        } else if (text.includes('settings') || icon === 'settings') {
                            if (screenKey.startsWith('ADMIN_')) onNavigate('ADMIN_SETTINGS');
                        }
                    };

                    container.addEventListener('click', handleGlobalClick);
                    return () => container.removeEventListener('click', handleGlobalClick);
                }
            }, [html, loading, screenKey]);

            const createRipple = (e) => {
                const button = e.currentTarget;
                const ripple = document.createElement('span');
                const rect = button.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const x = e.clientX - rect.left - size / 2;
                const y = e.clientY - rect.top - size / 2;

                ripple.style.width = ripple.style.height = `${size}px`;
                ripple.style.left = `${x}px`;
                ripple.style.top = `${y}px`;
                ripple.classList.add('ripple');

                const existingRipple = button.querySelector('.ripple');
                if (existingRipple) existingRipple.remove();

                button.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            };

            const animateSparkles = (x, y) => {
                const colors = ['#87CEEB', '#FFD700', '#FF69B4', '#00FF7F', '#FFFFFF'];
                for (let i = 0; i < 12; i++) {
                    const sparkle = document.createElement('div');
                    sparkle.className = 'sparkle';
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const size = Math.random() * 8 + 4;
                    const dx = (Math.random() - 0.5) * 150;
                    const dy = (Math.random() - 0.5) * 150;

                    sparkle.style.left = `${x}px`;
                    sparkle.style.top = `${y}px`;
                    sparkle.style.width = `${size}px`;
                    sparkle.style.height = `${size}px`;
                    sparkle.style.backgroundColor = color;
                    sparkle.style.borderRadius = '50%';
                    sparkle.style.setProperty('--dx', `${dx}px`);
                    sparkle.style.setProperty('--dy', `${dy}px`);

                    document.body.appendChild(sparkle);
                    setTimeout(() => sparkle.remove(), 800);
                }
            };

            useEffect(() => {
                if (!loading && containerRef.current) {
                    const buttons = containerRef.current.querySelectorAll('button, .grid > div');
                    buttons.forEach(btn => {
                        btn.classList.add('cursor-pointer');
                        btn.addEventListener('mousedown', createRipple);
                    });
                    return () => {
                        buttons.forEach(btn => btn.removeEventListener('mousedown', createRipple));
                    };
                }
            }, [html, loading]);

            return (
                <div className="h-full flex flex-col">
                    {loading ? (
                        <div className="flex-1 flex items-center justify-center">
                            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-[#87CEEB]"></div>
                        </div>
                    ) : (
                        <div
                            ref={containerRef}
                            className="flex-1 screen-fade-in"
                            dangerouslySetInnerHTML={{ __html: html }}
                            onClick={(e) => {
                                const target = e.target.closest('button');
                                if (target) {
                                    const text = target.innerText.toLowerCase();
                                    if (text.includes('book') || text.includes('create') || text.includes('save') || text.includes('confirm')) {
                                        animateSparkles(e.clientX, e.clientY);
                                    }
                                }
                            }}
                        />
                    )}
                </div>
            );
        };

        const App = () => {
            const [history, setHistory] = useState(['WELCOME']);
            const [devMenuOpen, setDevMenuOpen] = useState(false);

            const currentScreen = history[history.length - 1];

            const handleNavigate = (newScreen) => {
                if (newScreen === currentScreen) return;
                setHistory(prev => [...prev, newScreen]);
            };

            const handleBack = () => {
                if (history.length > 1) {
                    setHistory(prev => prev.slice(0, -1));
                }
            };

            useEffect(() => {
                const handleExternalNavigate = (e) => {
                    if (SCREEN_MAP[e.detail]) handleNavigate(e.detail);
                };
                const handleGoBack = () => handleBack();

                window.addEventListener('navigate', handleExternalNavigate);
                window.addEventListener('goBack', handleGoBack);
                return () => {
                    window.removeEventListener('navigate', handleExternalNavigate);
                    window.removeEventListener('goBack', handleGoBack);
                };
            }, [currentScreen]);

            return (
                <div className="app-shell">
                    <div className="screen-container">
                        <Screen screenKey={currentScreen} onNavigate={handleNavigate} />
                    </div>

                    {/* Quick Access Dev Menu */}
                    <div className="dev-menu-btn" onClick={() => setDevMenuOpen(!devMenuOpen)}>
                        <span className="material-symbols-outlined">menu</span>
                    </div>

                    {devMenuOpen && (
                        <div className="dev-menu">
                            <div className="text-[10px] font-bold text-gray-400 mb-2 px-3 uppercase tracking-wider">Switch Flow</div>
                            <button onClick={() => { handleNavigate('WELCOME'); setDevMenuOpen(false); }}>Welcome Screen</button>
                            <button onClick={() => { handleNavigate('CLIENT_HOME'); setDevMenuOpen(false); }}>Client App</button>
                            <button onClick={() => { handleNavigate('PROVIDER_WELCOME'); setDevMenuOpen(false); }}>Provider App</button>
                            <button onClick={() => { handleNavigate('ADMIN_LOGIN'); setDevMenuOpen(false); }}>Admin Panel</button>
                            <button onClick={() => { handleNavigate('EMERGENCY_MODE'); setDevMenuOpen(false); }}>Emergency Mode</button>
                            <div className="mt-2 pt-2 border-t border-gray-100 text-[9px] text-center text-gray-400">
                                Prototype Navigation Control
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
