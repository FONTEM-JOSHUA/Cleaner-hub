<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner Hub - Home Service Professional Platform</title>
    <!-- Load React, ReactDOM, and Babel from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Material Icons and Symbols -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Montserrat', sans-serif;
            background-color: #f5f5f5;
            overflow: hidden;
        }
        #root {
            min-height: 100vh;
        }
        .app-shell {
            max-width: 450px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .screen-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
        }
        /* Custom scrollbar for a better look */
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: #87CEEB;
            border-radius: 2px;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fadeIn {
            animation: fadeIn 0.3s ease-in-out;
        }

        /* Ripple Effect */
        .ripple {
            position: absolute;
            background: rgba(135, 206, 235, 0.4);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
            z-index: 9999;
        }
        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Floating Action Menu for Demo */
        .dev-menu-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #87CEEB;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .dev-menu-btn:hover {
            opacity: 1;
        }
        .dev-menu {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 10px;
            z-index: 1001;
            width: 200px;
            border: 1px solid #eee;
        }
        .dev-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            transition: background 0.2s;
        }
        .dev-menu button:hover {
            background: #f0f9ff;
            color: #87CEEB;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SCREEN_MAP = {
            'WELCOME': 'welcome_screen/code.html',
            'AUTH': 'login/signup_screen/code.html',
            'CLIENT_HOME': 'home_screen_(main_dashboard)_for_client_app/code.html',
            'FIND_SERVICES': 'find_services_screen_for_client_app/code.html',
            'SMART_SEARCH': 'smart_search_screen/code.html',
            'PROVIDER_PROFILE': 'service_provider_profile_screen_for_client_app/code.html',
            'PROVIDER_PROFILE_PUBLIC': 'provider_profile_(public_view)_screen/code.html',
            'BOOKING': 'booking_screen_for_client_app/code.html',
            'MY_BOOKINGS_1': 'my_bookings_screen_for_client_app_1/code.html',
            'MY_BOOKINGS_2': 'my_bookings_screen_for_client_app_2/code.html',
            'MY_BOOKINGS_3': 'my_bookings_screen_for_client_app_3/code.html',
            'CLIENT_MESSAGES': 'messages_screen_for_client_app/code.html',
            'CLIENT_CHANNELS': 'channels_screen_(client_app_flow)_/code.html',
            'CLIENT_PROFILE': 'profile_screen_for_client_app/code.html',
            'REPORT_PROVIDER': 'report_provider_screen_for_client_app/code.html',
            'REPORT_CONFIRMATION': 'report_confirmation_screen/code.html',

            'PROVIDER_WELCOME': 'provider_welcome_screen/code.html',
            'PROVIDER_SETUP': 'provider_setup_screen/code.html',
            'PROVIDER_DASHBOARD_1': 'provider_dashboard_screen_1/code.html',
            'PROVIDER_DASHBOARD_2': 'provider_dashboard_screen_2/code.html',
            'PROVIDER_SCHEDULE': 'my_schedule_screen_for_provider_app/code.html',
            'PROVIDER_REQUESTS': 'booking_requests_screen_for_provider_app/code.html',
            'PROVIDER_CLIENTS': 'my_clients_screen_for_provider_app_(with_report_feature)/code.html',
            'REPORT_CLIENT': 'report_client_screen_for_provider_app/code.html',
            'CLIENT_REPORT_CONFIRMATION': 'client_report_confirmation_screen_(provider_app)_/code.html',

            'ADMIN_LOGIN': 'admin_login_screen/code.html',
            'ADMIN_DASHBOARD_1': 'admin_dashboard_screen_1/code.html',
            'ADMIN_DASHBOARD_2': 'admin_dashboard_screen_2/code.html',
            'ADMIN_DASHBOARD_3': 'admin_dashboard_screen_3/code.html',
            'ADMIN_DASHBOARD_4': 'admin_dashboard_screen_4/code.html',
            'ADMIN_MANAGE_USERS': 'manage_users_screen_for_admin_app/code.html',
            'ADMIN_MANAGE_BOOKINGS': 'manage_bookings_screen_for_admin_app/code.html',
            'ADMIN_SETTINGS': 'app_settings_screen_for_admin_app/code.html',
            'ADMIN_PROFILE_EDIT': 'admin_profile_edit_screen/code.html',

            'CHANNEL_MANAGEMENT': 'channel_management_screen_(provider/admin_app)_/code.html',
            'CHANNEL_MEMBER_MANAGEMENT': 'channel_member_management_screen_(provider/admin_app)_/code.html',
            'CREATE_CHANNEL': 'create_new_channel_flow_(provider/admin_app)_/code.html',

            'FEATURE_EASY_PAYMENTS': 'easy_payments_feature_screen/code.html',
            'FEATURE_EMERGENCY_MODE': 'emergency_mode_feature_screen/code.html',
            'FEATURE_FAMILY_SHARING': 'family_sharing_feature_screen/code.html',
            'FEATURE_MULTI_LANGUAGE': 'multi-language_support_screen/code.html',
            'FEATURE_OFFLINE_MODE': 'offline_mode_feature_screen/code.html',
            'FEATURE_PHOTO_VERIFICATION': 'photo_verification_feature_screen/code.html',
            'FEATURE_QUICK_REBOOKING': 'quick_rebooking_feature_screen/code.html',
            'FEATURE_REAL_TIME_TRACKING': 'real-time_tracking_screen/code.html',
            'FEATURE_SMART_NOTIFICATIONS': 'smart_notifications_feature_screen/code.html'
        };

        const Screen = ({ screenKey, onNavigate, screenHistory }) => {
            const [html, setHtml] = useState('');
            const [loading, setLoading] = useState(true);
            const containerRef = useRef(null);

            useEffect(() => {
                const fetchContent = async () => {
                    setLoading(true);
                    try {
                        const path = `extracted_code/stitch_cleaners_hub/${SCREEN_MAP[screenKey]}`;
                        const response = await fetch(path);
                        const text = await response.text();

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');

                        // 1. Extract and Clean up previous assets
                        document.querySelectorAll('[data-screen-assets]').forEach(el => el.remove());

                        // 2. Extract Tailwind Config
                        const scripts = Array.from(doc.querySelectorAll('script'));
                        const tailwindScript = scripts.find(s => s.innerHTML.includes('tailwind.config'));
                        if (tailwindScript) {
                            try {
                                const configMatch = tailwindScript.innerHTML.match(/tailwind\.config\s*=\s*({[\s\S]*?});/);
                                if (configMatch && configMatch[1]) {
                                    // Use a safer way to evaluate the config if possible, but for this prototype:
                                    const config = new Function(`return ${configMatch[1]}`)();
                                    window.tailwind.config = config;
                                }
                            } catch (e) { console.error("Tailwind config error", e); }
                        }

                        // 3. Extract Styles
                        Array.from(doc.querySelectorAll('style')).forEach(s => {
                            const newStyle = document.createElement('style');
                            newStyle.innerHTML = s.innerHTML;
                            newStyle.setAttribute('data-screen-assets', 'true');
                            document.head.appendChild(newStyle);
                        });

                        // 4. Handle Head Scripts (like CDN loads)
                        Array.from(doc.head.querySelectorAll('script')).forEach(s => {
                            if (s.src && !s.src.includes('tailwind')) {
                                const newScript = document.createElement('script');
                                newScript.src = s.src;
                                newScript.setAttribute('data-screen-assets', 'true');
                                document.head.appendChild(newScript);
                            }
                        });

                        // 5. Set Body Content
                        setHtml(doc.body.innerHTML);

                        // 6. Execute Body Scripts
                        setTimeout(() => {
                            if (containerRef.current) {
                                const bodyScripts = containerRef.current.querySelectorAll('script');
                                bodyScripts.forEach(oldScript => {
                                    const newScript = document.createElement('script');
                                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                                    newScript.textContent = oldScript.textContent;
                                    document.head.appendChild(newScript); // Append to head for execution
                                    newScript.setAttribute('data-screen-assets', 'true');
                                    oldScript.remove();
                                });
                            }
                        }, 50);

                    } catch (error) {
                        console.error('Failed to load screen:', error);
                        setHtml('<div class="p-10 text-center">Failed to load screen.</div>');
                    }
                    setLoading(false);
                };
                fetchContent();
            }, [screenKey]);

            // Attach listeners
            useEffect(() => {
                if (!loading && containerRef.current) {
                    const container = containerRef.current;

                    // Ensure all buttons and clickable divs have cursor-pointer
                    container.querySelectorAll('button, .grid > div').forEach(el => {
                        el.classList.add('cursor-pointer');
                    });

                    // Attach Click Listeners for Navigation
                    const handleGlobalClick = (e) => {
                        const target = e.target.closest('button, a, [role="button"], .cursor-pointer, [onclick]');

                        // Ripple Effect
                        if (target) {
                            const rect = target.getBoundingClientRect();
                            const ripple = document.createElement('span');
                            ripple.className = 'ripple';
                            ripple.style.left = `${e.clientX - rect.left}px`;
                            ripple.style.top = `${e.clientY - rect.top}px`;
                            const size = Math.max(rect.width, rect.height);
                            ripple.style.width = ripple.style.height = `${size}px`;
                            target.style.position = 'relative';
                            target.style.overflow = 'hidden';
                            target.appendChild(ripple);
                            setTimeout(() => ripple.remove(), 600);
                        }

                        if (!target) return;

                        // Normalize text for heuristics
                        const text = target.innerText.replace(/\s+/g, ' ').trim().toLowerCase();
                        const icons = Array.from(target.querySelectorAll('.material-icons-round, .material-symbols-outlined'))
                                          .map(i => i.innerText.trim().toLowerCase());

                        // Back navigation
                        if (text === 'arrow_back' || icons.includes('arrow_back') || text === 'back') {
                            window.dispatchEvent(new CustomEvent('goBack'));
                            return;
                        }

                        // Role Detection (Heuristic based on current screen)
                        const isAdminFlow = screenKey.startsWith('ADMIN');
                        const isProviderFlow = screenKey.startsWith('PROVIDER') || screenKey.includes('SCHEDULE') || screenKey.includes('REQUESTS');

                        // Auth Mode Patching & Mode-specific navigation
                        if (screenKey === 'AUTH') {
                            const isSwitch = target.tagName === 'A' || target.closest('label') || target.closest('.mt-auto.pt-6');
                            if (isSwitch && (text === 'login' || text === 'sign up')) {
                                const headerP = container.querySelector('.text-center.mb-6 p.text-sm') || container.querySelector('.text-center.mb-6 p');
                                const footerP = container.querySelector('.mt-auto.pt-6 p');
                                const submitBtnSpan = container.querySelector('button.bg-primary span');

                                if (text.includes('login')) {
                                    if (headerP) headerP.innerText = 'Welcome back! Please enter your details.';
                                    if (footerP) footerP.innerHTML = 'Don\'t have an account? <a href="#" class="text-primary font-bold">Sign Up</a>';
                                    if (submitBtnSpan) submitBtnSpan.innerText = 'Log In';
                                    return;
                                } else if (text.includes('sign up')) {
                                    if (headerP) headerP.innerText = 'Join our community of trusted professionals';
                                    if (footerP) footerP.innerHTML = 'Already have an account? <a href="#" class="text-primary font-bold">Login</a>';
                                    if (submitBtnSpan) submitBtnSpan.innerText = 'Create Account';
                                    return;
                                }
                            }
                        }

                        // Navigation Logic Heuristics
                        if (text.includes('sign up') || text.includes('create account')) {
                            if (text.includes('provider')) onNavigate('PROVIDER_WELCOME');
                            else if (screenKey === 'AUTH') onNavigate('CLIENT_HOME');
                            else onNavigate('AUTH');
                        } else if (text.includes('log in') || text.includes('login') || text.includes('sign in')) {
                            if (text.includes('admin')) onNavigate('ADMIN_LOGIN');
                            else if (screenKey === 'ADMIN_LOGIN') onNavigate('ADMIN_DASHBOARD_1');
                            else if (screenKey === 'WELCOME') onNavigate('AUTH');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('continue as guest')) {
                            onNavigate('CLIENT_HOME');
                        } else if (text.includes('book now')) {
                            onNavigate('BOOKING');
                        } else if (text.includes('find services') || text.includes('explore')) {
                            onNavigate('FIND_SERVICES');
                        } else if (text.includes('view profile')) {
                            onNavigate('PROVIDER_PROFILE');
                        } else if (text.includes('get started')) {
                            if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP');
                            else onNavigate('AUTH');
                        } else if (text.includes('save & continue') || text.includes('complete setup') || text.includes('finish')) {
                            if (isProviderFlow) onNavigate('PROVIDER_DASHBOARD_1');
                        } else if (text.includes('home') || icons.includes('home')) {
                            if (isAdminFlow) onNavigate('ADMIN_DASHBOARD_1');
                            else if (isProviderFlow) onNavigate('PROVIDER_DASHBOARD_1');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('bookings') || icons.includes('calendar_today') || icons.includes('event_note')) {
                            if (isAdminFlow) onNavigate('ADMIN_MANAGE_BOOKINGS');
                            else if (isProviderFlow) onNavigate('PROVIDER_SCHEDULE');
                            else onNavigate('MY_BOOKINGS_1');
                        } else if (text.includes('messages') || icons.includes('mail') || icons.includes('chat') || icons.includes('forum')) {
                            if (isProviderFlow || isAdminFlow) onNavigate('CHANNEL_MANAGEMENT');
                            else onNavigate('CLIENT_MESSAGES');
                        } else if (text.includes('profile') || icons.includes('person') || icons.includes('account_circle')) {
                            if (isAdminFlow) onNavigate('ADMIN_PROFILE_EDIT');
                            else if (isProviderFlow) onNavigate('PROVIDER_PROFILE_PUBLIC');
                            else onNavigate('CLIENT_PROFILE');
                        } else if (text.includes('manage users') || icons.includes('group')) {
                            onNavigate('ADMIN_MANAGE_USERS');
                        } else if (text.includes('settings') || icons.includes('settings')) {
                            onNavigate('ADMIN_SETTINGS');
                        }
                    };

                    container.addEventListener('click', handleGlobalClick);
                    return () => container.removeEventListener('click', handleGlobalClick);
                }
            }, [html, loading, screenKey]);

            return (
                <div className="h-full flex flex-col">
                    {loading ? (
                        <div className="flex-1 flex items-center justify-center">
                            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-[#87CEEB]"></div>
                        </div>
                    ) : (
                        <div
                            ref={containerRef}
                            className="flex-1"
                            dangerouslySetInnerHTML={{ __html: html }}
                        />
                    )}
                </div>
            );
        };

        const App = () => {
            const [screen, setScreen] = useState('WELCOME');
            const [history, setHistory] = useState(['WELCOME']);
            const [devMenuOpen, setDevMenuOpen] = useState(false);

            const navigate = (newScreen, replace = false) => {
                if (SCREEN_MAP[newScreen]) {
                    setScreen(newScreen);
                    if (replace) {
                        setHistory(prev => [...prev.slice(0, -1), newScreen]);
                    } else {
                        setHistory(prev => [...prev, newScreen]);
                    }
                }
            };

            const goBack = () => {
                if (history.length > 1) {
                    const newHistory = [...history];
                    newHistory.pop();
                    const prevScreen = newHistory[newHistory.length - 1];
                    setHistory(newHistory);
                    setScreen(prevScreen);
                }
            };

            useEffect(() => {
                const handleExternalNavigate = (e) => {
                    if (SCREEN_MAP[e.detail]) navigate(e.detail);
                };
                const handleGoBack = () => goBack();

                window.addEventListener('navigate', handleExternalNavigate);
                window.addEventListener('goBack', handleGoBack);
                return () => {
                    window.removeEventListener('navigate', handleExternalNavigate);
                    window.removeEventListener('goBack', handleGoBack);
                };
            }, [history]);

            return (
                <div className="app-shell">
                    <div className="screen-container" key={screen}>
                        <div className="animate-fadeIn h-full">
                            <Screen screenKey={screen} onNavigate={navigate} screenHistory={history} />
                        </div>
                    </div>

                    {/* Quick Access Dev Menu */}
                    <div className="dev-menu-btn" onClick={() => setDevMenuOpen(!devMenuOpen)}>
                        <span className="material-symbols-outlined">menu</span>
                    </div>

                    {devMenuOpen && (
                        <div className="dev-menu">
                            <div className="text-[10px] font-bold text-gray-400 mb-1 px-3 uppercase tracking-wider">Switch Flow</div>
                            <button onClick={() => { navigate('WELCOME'); setDevMenuOpen(false); }}>Welcome Screen</button>

                            <div className="mt-2 text-[9px] font-bold text-gray-400 px-3 uppercase">Client</div>
                            <button onClick={() => { navigate('CLIENT_HOME'); setDevMenuOpen(false); }}>Dashboard</button>
                            <button onClick={() => { navigate('FIND_SERVICES'); setDevMenuOpen(false); }}>Services</button>
                            <button onClick={() => { navigate('MY_BOOKINGS_1'); setDevMenuOpen(false); }}>My Bookings</button>

                            <div className="mt-2 text-[9px] font-bold text-gray-400 px-3 uppercase">Provider</div>
                            <button onClick={() => { navigate('PROVIDER_WELCOME'); setDevMenuOpen(false); }}>Join Now</button>
                            <button onClick={() => { navigate('PROVIDER_DASHBOARD_1'); setDevMenuOpen(false); }}>Dashboard</button>
                            <button onClick={() => { navigate('PROVIDER_SCHEDULE'); setDevMenuOpen(false); }}>Schedule</button>

                            <div className="mt-2 text-[9px] font-bold text-gray-400 px-3 uppercase">Admin</div>
                            <button onClick={() => { navigate('ADMIN_LOGIN'); setDevMenuOpen(false); }}>Login</button>
                            <button onClick={() => { navigate('ADMIN_DASHBOARD_1'); setDevMenuOpen(false); }}>Dashboard</button>
                            <button onClick={() => { navigate('ADMIN_MANAGE_USERS'); setDevMenuOpen(false); }}>Users</button>

                            <div className="mt-2 text-[9px] font-bold text-gray-400 px-3 uppercase">Extras</div>
                            <button onClick={() => { navigate('FEATURE_EMERGENCY_MODE'); setDevMenuOpen(false); }}>Emergency Mode</button>
                            <button onClick={() => { navigate('CREATE_CHANNEL'); setDevMenuOpen(false); }}>Create Channel</button>

                            <div className="mt-2 pt-2 border-t border-gray-100 text-[9px] text-center text-gray-400">
                                Prototype Navigation Control
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
