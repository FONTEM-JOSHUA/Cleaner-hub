<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner Hub - Home Service Professional Platform</title>
    <!-- Load React, ReactDOM, and Babel from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Material Icons and Symbols -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#87CEEB',
                        'primary-dark': '#6FB3D9',
                    },
                    fontFamily: {
                        display: ['Inter', 'Montserrat', 'sans-serif'],
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Montserrat', sans-serif;
            background-color: #f8fafc;
            height: 100vh;
            overflow: hidden;
        }
        #root {
            height: 100vh;
        }
        .app-shell {
            max-width: 450px;
            margin: 0 auto;
            height: 100vh;
            background-color: white;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .screen-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
        }
        /* Custom scrollbar */
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 2px;
        }

        /* Screen Transitions */
        @keyframes slideIn {
            from { transform: translateX(30px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .slide-in {
            animation: slideIn 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Floating Action Menu for Demo */
        .dev-menu-btn {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 28px;
            background: #87CEEB;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(135, 206, 235, 0.4);
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .dev-menu-btn:hover {
            transform: scale(1.05) rotate(90deg);
            background: #6FB3D9;
        }
        .dev-menu {
            position: absolute;
            bottom: 90px;
            right: 24px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            padding: 16px;
            z-index: 1001;
            width: 280px;
            max-height: 75vh;
            overflow-y: auto;
            border: 1px solid #f1f5f9;
        }
        .dev-menu-section {
            margin-bottom: 16px;
        }
        .dev-menu-title {
            font-size: 11px;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 4px 12px;
            margin-bottom: 6px;
            border-left: 3px solid #87CEEB;
        }
        .dev-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            color: #334155;
            transition: all 0.2s;
        }
        .dev-menu button:hover {
            background: #f0f9ff;
            color: #87CEEB;
            transform: translateX(4px);
        }
        .dev-menu button.active {
            background: #87CEEB;
            color: white;
        }

        /* Sparkle Animation */
        @keyframes sparkle {
            0% { transform: scale(0) rotate(0deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(180deg); opacity: 1; }
            100% { transform: scale(1) rotate(360deg); opacity: 0; }
        }
        .sparkle {
            position: absolute;
            pointer-events: none;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, #87CEEB 0%, transparent 70%);
            animation: sparkle 0.6s ease-out forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SCREEN_MAP = {
            // Main & Auth
            'WELCOME': 'welcome_screen/code.html',
            'SIGNUP': 'login/signup_screen/code.html',
            'LOGIN': 'login/signup_screen/code.html',

            // Client Flow
            'CLIENT_HOME': 'home_screen_(main_dashboard)_for_client_app/code.html',
            'FIND_SERVICES': 'find_services_screen_for_client_app/code.html',
            'SERVICE_PROVIDER_PROFILE': 'service_provider_profile_screen_for_client_app/code.html',
            'BOOKING': 'booking_screen_for_client_app/code.html',
            'MY_BOOKINGS_1': 'my_bookings_screen_for_client_app_1/code.html',
            'MY_BOOKINGS_2': 'my_bookings_screen_for_client_app_2/code.html',
            'MY_BOOKINGS_3': 'my_bookings_screen_for_client_app_3/code.html',
            'MESSAGES': 'messages_screen_for_client_app/code.html',
            'CHANNELS': 'channels_screen_(client_app_flow)_/code.html',
            'PROFILE': 'profile_screen_for_client_app/code.html',
            'REPORT_PROVIDER': 'report_provider_screen_for_client_app/code.html',
            'REPORT_CONFIRMATION': 'report_confirmation_screen/code.html',

            // Provider Flow
            'PROVIDER_WELCOME': 'provider_welcome_screen/code.html',
            'PROVIDER_SETUP': 'provider_setup_screen/code.html',
            'PROVIDER_DASHBOARD': 'provider_dashboard_screen_1/code.html',
            'PROVIDER_DASHBOARD_2': 'provider_dashboard_screen_2/code.html',
            'PROVIDER_SCHEDULE': 'my_schedule_screen_for_provider_app/code.html',
            'PROVIDER_REQUESTS': 'booking_requests_screen_for_provider_app/code.html',
            'PROVIDER_CLIENTS': 'my_clients_screen_for_provider_app_(with_report_feature)/code.html',
            'PROVIDER_PROFILE_PUBLIC': 'provider_profile_(public_view)_screen/code.html',
            'PROVIDER_REPORT_CLIENT': 'report_client_screen_for_provider_app/code.html',
            'PROVIDER_REPORT_CONFIRM': 'client_report_confirmation_screen_(provider_app)_/code.html',
            'PROVIDER_CHANNELS': 'channel_management_screen_(provider/admin_app)_/code.html',
            'PROVIDER_CHANNEL_MEMBERS': 'channel_member_management_screen_(provider/admin_app)_/code.html',
            'PROVIDER_CREATE_CHANNEL': 'create_new_channel_flow_(provider/admin_app)_/code.html',

            // Admin Flow
            'ADMIN_LOGIN': 'admin_login_screen/code.html',
            'ADMIN_DASHBOARD_1': 'admin_dashboard_screen_1/code.html',
            'ADMIN_DASHBOARD_2': 'admin_dashboard_screen_2/code.html',
            'ADMIN_DASHBOARD_3': 'admin_dashboard_screen_3/code.html',
            'ADMIN_DASHBOARD_4': 'admin_dashboard_screen_4/code.html',
            'ADMIN_USERS': 'manage_users_screen_for_admin_app/code.html',
            'ADMIN_BOOKINGS': 'manage_bookings_screen_for_admin_app/code.html',
            'ADMIN_PROFILE_EDIT': 'admin_profile_edit_screen/code.html',
            'ADMIN_SETTINGS': 'app_settings_screen_for_admin_app/code.html',

            // Features
            'SMART_SEARCH': 'smart_search_screen/code.html',
            'EMERGENCY_MODE': 'emergency_mode_feature_screen/code.html',
            'REALTIME_TRACKING': 'real-time_tracking_screen/code.html',
            'PHOTO_VERIFICATION': 'photo_verification_feature_screen/code.html',
            'EASY_PAYMENTS': 'easy_payments_feature_screen/code.html',
            'SMART_NOTIFICATIONS': 'smart_notifications_feature_screen/code.html',
            'FAMILY_SHARING': 'family_sharing_feature_screen/code.html',
            'MULTI_LANGUAGE': 'multi-language_support_screen/code.html',
            'OFFLINE_MODE': 'offline_mode_feature_screen/code.html',
            'QUICK_REBOOKING': 'quick_rebooking_feature_screen/code.html',
        };

        // Aliases
        SCREEN_MAP['HOME'] = SCREEN_MAP['CLIENT_HOME'];

        const Screen = ({ screenKey, onNavigate, authMode, setAuthMode }) => {
            const [html, setHtml] = useState('');
            const [styles, setStyles] = useState('');
            const [links, setLinks] = useState([]);
            const [bodyClass, setBodyClass] = useState('');
            const [loading, setLoading] = useState(true);
            const containerRef = useRef(null);

            useEffect(() => {
                const fetchContent = async () => {
                    setLoading(true);
                    try {
                        const path = `extracted_code/stitch_cleaners_hub/${SCREEN_MAP[screenKey]}`;
                        const response = await fetch(path);
                        const text = await response.text();

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');

                        // Extract Body Class
                        setBodyClass(doc.body.className || '');

                        // Extract Styles
                        const styleContent = Array.from(doc.querySelectorAll('style'))
                            .map(s => s.innerHTML)
                            .join('\n');
                        setStyles(styleContent);

                        // Extract External Links (CSS)
                        const linkHrefs = Array.from(doc.querySelectorAll('link[rel="stylesheet"]'))
                            .map(l => l.getAttribute('href'));
                        setLinks(linkHrefs);

                        // Extract Body Content
                        setHtml(doc.body.innerHTML);

                    } catch (error) {
                        console.error('Failed to load screen:', error);
                        setHtml('<div class="p-10 text-center text-red-500 font-bold">Failed to load screen: ' + screenKey + '</div>');
                    }
                    setLoading(false);
                };
                fetchContent();
            }, [screenKey]);

            // Auth Mode Patching
            useEffect(() => {
                if (!loading && (screenKey === 'LOGIN' || screenKey === 'SIGNUP') && containerRef.current) {
                    const container = containerRef.current;
                    const isLogin = authMode === 'login';

                    // Update UI Labels
                    const labels = Array.from(container.querySelectorAll('label'));
                    const loginTab = labels.find(l => l.innerText.trim().toLowerCase().includes('login'));
                    const signupTab = labels.find(l => l.innerText.trim().toLowerCase().includes('sign up'));

                    if (loginTab && signupTab) {
                        if (isLogin) {
                            loginTab.className = loginTab.className.replace(/bg-transparent|text-text-subtle/g, '').trim() + ' bg-primary shadow-sm';
                            loginTab.querySelector('span').className = 'z-10 text-sm font-semibold text-white';
                            signupTab.className = signupTab.className.replace(/bg-primary|shadow-sm/g, '').trim() + ' bg-transparent';
                            signupTab.querySelector('span').className = 'z-10 text-sm font-medium text-text-subtle';
                        } else {
                            signupTab.className = signupTab.className.replace(/bg-transparent|text-text-subtle/g, '').trim() + ' bg-primary shadow-sm';
                            signupTab.querySelector('span').className = 'z-10 text-sm font-semibold text-white';
                            loginTab.className = loginTab.className.replace(/bg-primary|shadow-sm/g, '').trim() + ' bg-transparent';
                            loginTab.querySelector('span').className = 'z-10 text-sm font-medium text-text-subtle';
                        }
                    }

                    // Toggle Fields
                    const inputs = Array.from(container.querySelectorAll('input'));
                    inputs.forEach(input => {
                        const placeholder = (input.placeholder || '').toLowerCase();
                        if (isLogin && (placeholder.includes('name') || placeholder.includes('phone'))) {
                            input.closest('.relative').style.display = 'none';
                        } else {
                            input.closest('.relative').style.display = 'block';
                        }
                    });

                    // Hide Terms for Login
                    const terms = container.querySelector('label.flex.items-start');
                    if (terms) terms.style.display = isLogin ? 'none' : 'flex';

                    // Update Button Text
                    const btn = container.querySelector('button.bg-primary span');
                    if (btn) btn.innerText = isLogin ? 'Log In' : 'Create Account';

                    // Update Footer
                    const footerText = container.querySelector('.mt-auto p');
                    if (footerText) {
                        footerText.innerHTML = isLogin ?
                            `Don't have an account? <a class="font-semibold text-primary hover:text-primary-dark transition-colors" href="#">Sign Up</a>` :
                            `Already have an account? <a class="font-semibold text-primary hover:text-primary-dark transition-colors" href="#">Login</a>`;
                    }
                }
            }, [html, loading, screenKey, authMode]);

            // Interactions
            useEffect(() => {
                if (!loading && containerRef.current) {
                    const container = containerRef.current;

                    // Re-inject scripts
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });

                    const handleInteractions = (e) => {
                        const target = e.target.closest('button, a, [role="button"], label');
                        if (!target) return;

                        // Tab Switch on Auth Screen
                        if (target.tagName === 'LABEL' && (screenKey === 'LOGIN' || screenKey === 'SIGNUP')) {
                            const val = target.querySelector('input')?.value;
                            if (val) {
                                e.preventDefault();
                                setAuthMode(val);
                                onNavigate(val === 'login' ? 'LOGIN' : 'SIGNUP');
                                return;
                            }
                        }

                        const text = target.innerText.trim().toLowerCase().replace(/\s+/g, ' ');
                        const icon = target.querySelector('.material-symbols-outlined, .material-icons-round, .material-icons')?.innerText;

                        // Back Navigation
                        if (icon === 'arrow_back' || icon === 'chevron_left') {
                            window.dispatchEvent(new CustomEvent('goBack'));
                            return;
                        }

                        // Navigation Logic
                        if (text.includes('sign up') || text.includes('create account')) {
                            if (text.includes('provider')) onNavigate('PROVIDER_WELCOME');
                            else if (screenKey === 'SIGNUP' || screenKey === 'LOGIN') onNavigate('CLIENT_HOME');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('log in') || text.includes('login') || text.includes('sign in')) {
                            if (text.includes('admin')) onNavigate('ADMIN_LOGIN');
                            else if (screenKey === 'ADMIN_LOGIN') onNavigate('ADMIN_DASHBOARD_1');
                            else if (screenKey === 'WELCOME') { setAuthMode('login'); onNavigate('LOGIN'); }
                            else if (screenKey === 'SIGNUP' || screenKey === 'LOGIN') onNavigate('CLIENT_HOME');
                            else { setAuthMode('login'); onNavigate('LOGIN'); }
                        } else if (text.includes('continue as guest')) {
                            onNavigate('CLIENT_HOME');
                        } else if (text.includes('book now') || text.includes('book this service')) {
                            onNavigate('BOOKING');
                        } else if (text.includes('find services') || text.includes('explore')) {
                            onNavigate('FIND_SERVICES');
                        } else if (text.includes('view profile')) {
                            onNavigate('SERVICE_PROVIDER_PROFILE');
                        } else if (text.includes('get started')) {
                            if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP');
                            else onNavigate('SIGNUP');
                        } else if (text.includes('save & continue') || text.includes('complete setup') || text.includes('finish')) {
                            onNavigate('PROVIDER_DASHBOARD');
                        } else if (text.includes('home') || icon === 'home') {
                            if (screenKey.startsWith('ADMIN')) onNavigate('ADMIN_DASHBOARD_1');
                            else if (screenKey.startsWith('PROVIDER')) onNavigate('PROVIDER_DASHBOARD');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('bookings') || icon === 'calendar_today' || icon === 'event_note') {
                            onNavigate('MY_BOOKINGS_1');
                        } else if (text.includes('messages') || icon === 'mail' || icon === 'chat' || icon === 'forum') {
                            onNavigate('MESSAGES');
                        } else if (text.includes('profile') || icon === 'person' || icon === 'account_circle') {
                            onNavigate('PROFILE');
                        } else if (text.includes('dashboard') || icon === 'dashboard') {
                            if (screenKey.startsWith('ADMIN')) onNavigate('ADMIN_DASHBOARD_1');
                            else onNavigate('PROVIDER_DASHBOARD');
                        } else if (text.includes('logout') || text.includes('log out')) {
                            onNavigate('WELCOME');
                        }
                    };

                    container.addEventListener('click', handleInteractions);
                    return () => container.removeEventListener('click', handleInteractions);
                }
            }, [html, loading, screenKey, authMode]);

            return (
                <div className={`h-full flex flex-col ${bodyClass} slide-in`} key={screenKey}>
                    {links.map((href, i) => <link key={i} rel="stylesheet" href={href} />)}
                    <style dangerouslySetInnerHTML={{ __html: styles }} />
                    {loading ? (
                        <div className="flex-1 flex items-center justify-center bg-white">
                            <div className="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-[#87CEEB]"></div>
                        </div>
                    ) : (
                        <div
                            ref={containerRef}
                            className="flex-1"
                            dangerouslySetInnerHTML={{ __html: html }}
                        />
                    )}
                </div>
            );
        };

        const App = () => {
            const [history, setHistory] = useState(['WELCOME']);
            const [authMode, setAuthMode] = useState('signup');
            const [devMenuOpen, setDevMenuOpen] = useState(false);

            const currentScreen = history[history.length - 1];

            const navigate = (next) => {
                if (next === currentScreen) return;
                setHistory(prev => [...prev, next]);
            };

            const goBack = () => {
                if (history.length > 1) {
                    setHistory(prev => prev.slice(0, -1));
                }
            };

            useEffect(() => {
                const handleExternalNavigate = (e) => {
                    if (SCREEN_MAP[e.detail]) navigate(e.detail);
                };
                const handleGoBack = () => goBack();

                window.addEventListener('navigate', handleExternalNavigate);
                window.addEventListener('goBack', handleGoBack);
                return () => {
                    window.removeEventListener('navigate', handleExternalNavigate);
                    window.removeEventListener('goBack', handleGoBack);
                };
            }, [history]);

            return (
                <div className="app-shell">
                    <div className="screen-container">
                        <Screen
                            screenKey={currentScreen}
                            onNavigate={navigate}
                            authMode={authMode}
                            setAuthMode={setAuthMode}
                        />
                    </div>

                    {/* Developer Menu Button */}
                    <div className="dev-menu-btn" role="button" aria-label="menu" onClick={() => setDevMenuOpen(!devMenuOpen)}>
                        <span className="material-symbols-outlined">
                            {devMenuOpen ? 'close' : 'menu'}
                        </span>
                    </div>

                    {devMenuOpen && (
                        <div className="dev-menu">
                            <div className="dev-menu-section">
                                <div className="dev-menu-title">Main Screens</div>
                                <button className={currentScreen === 'WELCOME' ? 'active' : ''} onClick={() => { navigate('WELCOME'); setDevMenuOpen(false); }}>Welcome Screen</button>
                                <button className={currentScreen === 'SIGNUP' ? 'active' : ''} onClick={() => { setAuthMode('signup'); navigate('SIGNUP'); setDevMenuOpen(false); }}>Auth: Signup</button>
                                <button className={currentScreen === 'LOGIN' ? 'active' : ''} onClick={() => { setAuthMode('login'); navigate('LOGIN'); setDevMenuOpen(false); }}>Auth: Login</button>
                            </div>

                            <div className="dev-menu-section">
                                <div className="dev-menu-title">Client Flow</div>
                                <button className={currentScreen === 'CLIENT_HOME' ? 'active' : ''} onClick={() => { navigate('CLIENT_HOME'); setDevMenuOpen(false); }}>Home Dashboard</button>
                                <button className={currentScreen === 'FIND_SERVICES' ? 'active' : ''} onClick={() => { navigate('FIND_SERVICES'); setDevMenuOpen(false); }}>Find Services</button>
                                <button className={currentScreen === 'BOOKING' ? 'active' : ''} onClick={() => { navigate('BOOKING'); setDevMenuOpen(false); }}>Booking Screen</button>
                                <button className={currentScreen === 'MY_BOOKINGS_1' ? 'active' : ''} onClick={() => { navigate('MY_BOOKINGS_1'); setDevMenuOpen(false); }}>My Bookings</button>
                                <button className={currentScreen === 'MESSAGES' ? 'active' : ''} onClick={() => { navigate('MESSAGES'); setDevMenuOpen(false); }}>Messages</button>
                                <button className={currentScreen === 'PROFILE' ? 'active' : ''} onClick={() => { navigate('PROFILE'); setDevMenuOpen(false); }}>Profile</button>
                            </div>

                            <div className="dev-menu-section">
                                <div className="dev-menu-title">Provider Flow</div>
                                <button className={currentScreen === 'PROVIDER_WELCOME' ? 'active' : ''} onClick={() => { navigate('PROVIDER_WELCOME'); setDevMenuOpen(false); }}>Provider Welcome</button>
                                <button className={currentScreen === 'PROVIDER_DASHBOARD' ? 'active' : ''} onClick={() => { navigate('PROVIDER_DASHBOARD'); setDevMenuOpen(false); }}>Provider Dashboard</button>
                                <button className={currentScreen === 'PROVIDER_SCHEDULE' ? 'active' : ''} onClick={() => { navigate('PROVIDER_SCHEDULE'); setDevMenuOpen(false); }}>My Schedule</button>
                                <button className={currentScreen === 'PROVIDER_REQUESTS' ? 'active' : ''} onClick={() => { navigate('PROVIDER_REQUESTS'); setDevMenuOpen(false); }}>Booking Requests</button>
                            </div>

                            <div className="dev-menu-section">
                                <div className="dev-menu-title">Admin Panel</div>
                                <button className={currentScreen === 'ADMIN_LOGIN' ? 'active' : ''} onClick={() => { navigate('ADMIN_LOGIN'); setDevMenuOpen(false); }}>Admin Login</button>
                                <button className={currentScreen === 'ADMIN_DASHBOARD_1' ? 'active' : ''} onClick={() => { navigate('ADMIN_DASHBOARD_1'); setDevMenuOpen(false); }}>Admin Dashboard</button>
                                <button className={currentScreen === 'ADMIN_USERS' ? 'active' : ''} onClick={() => { navigate('ADMIN_USERS'); setDevMenuOpen(false); }}>Manage Users</button>
                            </div>

                            <div className="dev-menu-section">
                                <div className="dev-menu-title">Features</div>
                                <button className={currentScreen === 'SMART_SEARCH' ? 'active' : ''} onClick={() => { navigate('SMART_SEARCH'); setDevMenuOpen(false); }}>Smart Search</button>
                                <button className={currentScreen === 'EMERGENCY_MODE' ? 'active' : ''} onClick={() => { navigate('EMERGENCY_MODE'); setDevMenuOpen(false); }}>Emergency Mode</button>
                                <button className={currentScreen === 'EASY_PAYMENTS' ? 'active' : ''} onClick={() => { navigate('EASY_PAYMENTS'); setDevMenuOpen(false); }}>Easy Payments</button>
                                <button className={currentScreen === 'FAMILY_SHARING' ? 'active' : ''} onClick={() => { navigate('FAMILY_SHARING'); setDevMenuOpen(false); }}>Family Sharing</button>
                                <button className={currentScreen === 'SMART_NOTIFICATIONS' ? 'active' : ''} onClick={() => { navigate('SMART_NOTIFICATIONS'); setDevMenuOpen(false); }}>Smart Notifications</button>
                                <button className={currentScreen === 'OFFLINE_MODE' ? 'active' : ''} onClick={() => { navigate('OFFLINE_MODE'); setDevMenuOpen(false); }}>Offline Mode</button>
                            </div>

                            <div className="mt-4 pt-4 border-t border-gray-100 text-[10px] text-center text-gray-400 font-medium">
                                CLEANER HUB • PROTOTYPE
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
