<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cleaners Hub - Welcome</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet"/>
</head>
<body class="bg-[#f0f9ff] font-['Montserrat'] text-slate-800 min-h-screen flex flex-col items-center justify-center p-6 antialiased text-center">
    <main class="w-full max-w-md flex flex-col items-center">
        <div role="img" aria-label="Broom icon" class="w-32 h-32 mb-8 bg-[#1d4ed8] rounded-full flex items-center justify-center shadow-xl text-5xl transition-transform hover:rotate-12">🧹</div>
        <h1 class="text-3xl font-bold text-slate-900 mb-2 uppercase tracking-tight">Cleaners Hub</h1>
        <p class="text-[10px] font-bold text-slate-600 uppercase tracking-[0.3em] mb-12">The Harmony Network</p>
        <div class="mb-10 px-4">
            <h2 class="text-xl font-semibold text-slate-700 mb-2">Your Home, Perfectly Managed</h2>
            <p class="text-slate-500 text-sm leading-relaxed">Find trusted professionals for cleaning in just a few taps.</p>
        </div>
        <div class="w-full space-y-3">
            <button class="w-full py-4 bg-[#1d4ed8] hover:bg-[#1e40af] text-white font-bold rounded-xl shadow-lg transition-all active:scale-95 focus-visible:ring-4 focus-visible:ring-blue-200 outline-none">Sign Up</button>
            <button class="w-full py-4 bg-white border-2 border-[#1d4ed8] text-[#1d4ed8] font-bold rounded-xl transition-all hover:bg-blue-50 active:scale-95 focus-visible:ring-4 focus-visible:ring-blue-200 outline-none">Log In</button>
        </div>
        <button class="mt-8 text-slate-600 text-sm font-semibold hover:text-slate-800 transition-colors focus-visible:underline outline-none">Continue as Guest</button>
    </main>
    <footer class="mt-auto py-6 text-[10px] text-slate-600">By continuing, you agree to our Terms & Privacy Policy</footer>
</body>
</html>
