<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner Hub - Home Service Professional Platform</title>
    <!-- Load React, ReactDOM, and Babel from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Material Icons and Symbols -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Montserrat', sans-serif;
            background-color: #f5f5f5;
            overflow: hidden;
        }
        #root {
            height: 100vh;
            width: 100vw;
        }
        .app-shell {
            max-width: 450px;
            margin: 0 auto;
            height: 100vh;
            background-color: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .screen-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .screen-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            background: white;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }

        /* Transitions */
        .slide-from-right { transform: translateX(100%); }
        .slide-from-left { transform: translateX(-100%); }
        .slide-to-right { transform: translateX(100%); }
        .slide-to-left { transform: translateX(-100%); }
        .slide-active { transform: translateX(0); }

        /* Custom scrollbar */
        .screen-wrapper::-webkit-scrollbar {
            width: 4px;
        }
        .screen-wrapper::-webkit-scrollbar-track {
            background: transparent;
        }
        .screen-wrapper::-webkit-scrollbar-thumb {
            background: #87CEEB;
            border-radius: 2px;
        }

        /* Floating Action Menu for Demo */
        .dev-menu-btn {
            position: absolute;
            bottom: 80px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #87CEEB;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .dev-menu-btn:hover {
            opacity: 1;
        }
        .dev-menu {
            position: absolute;
            bottom: 130px;
            right: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 10px;
            z-index: 1001;
            width: 200px;
            border: 1px solid #eee;
            max-height: 400px;
            overflow-y: auto;
        }
        .dev-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            transition: background 0.2s;
        }
        .dev-menu button:hover {
            background: #f0f9ff;
            color: #87CEEB;
        }

        /* Back Button Overlay */
        .back-btn-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 50;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const SCREEN_MAP = {
            'WELCOME': 'welcome_screen/code.html',
            'SIGNUP': 'login/signup_screen/code.html',
            'LOGIN': 'login/signup_screen/code.html',
            'CLIENT_HOME': 'home_screen_(main_dashboard)_for_client_app/code.html',
            'FIND_SERVICES': 'find_services_screen_for_client_app/code.html',
            'PROVIDER_PROFILE': 'service_provider_profile_screen_for_client_app/code.html',
            'BOOKING': 'booking_screen_for_client_app/code.html',
            'MY_BOOKINGS': 'my_bookings_screen_for_client_app_1/code.html',
            'MESSAGES': 'messages_screen_for_client_app/code.html',
            'PROFILE': 'profile_screen_for_client_app/code.html',
            'PROVIDER_WELCOME': 'provider_welcome_screen/code.html',
            'PROVIDER_SETUP': 'provider_setup_screen/code.html',
            'PROVIDER_DASHBOARD': 'provider_dashboard_screen_1/code.html',
            'PROVIDER_SCHEDULE': 'my_schedule_screen_for_provider_app/code.html',
            'PROVIDER_REQUESTS': 'booking_requests_screen_for_provider_app/code.html',
            'PROVIDER_CLIENTS': 'my_clients_screen_for_provider_app_(with_report_feature)/code.html',
            'ADMIN_LOGIN': 'admin_login_screen/code.html',
            'ADMIN_DASHBOARD': 'admin_dashboard_screen_1/code.html',
            'ADMIN_USERS': 'manage_users_screen_for_admin_app/code.html',
            'ADMIN_BOOKINGS': 'manage_bookings_screen_for_admin_app/code.html',
            'ADMIN_SETTINGS': 'app_settings_screen_for_admin_app/code.html',
            'EMERGENCY': 'emergency_mode_feature_screen/code.html',
            'SMART_SEARCH': 'smart_search_screen/code.html',
            'TRACKING': 'real-time_tracking_screen/code.html'
        };

        const Screen = ({ screenKey, onNavigate, isActive, direction, isVisible, isTransitioning }) => {
            const [content, setContent] = useState({ html: '', styles: [], scripts: [] });
            const [loading, setLoading] = useState(true);
            const containerRef = useRef(null);
            const [transitionClass, setTransitionClass] = useState('');

            useEffect(() => {
                const fetchContent = async () => {
                    setLoading(true);
                    try {
                        const path = `extracted_code/stitch_cleaners_hub/${SCREEN_MAP[screenKey]}`;
                        const response = await fetch(path);
                        const text = await response.text();
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');
                        const styles = Array.from(doc.querySelectorAll('style, link[rel="stylesheet"]'))
                            .map(el => el.tagName === 'STYLE' ? { type: 'inline', content: el.innerHTML } : { type: 'link', href: el.href });
                        const scripts = Array.from(doc.querySelectorAll('script'))
                            .map(el => el.src ? { type: 'src', src: el.src } : { type: 'inline', content: el.innerHTML, id: el.id });
                        setContent({ html: doc.body.innerHTML, styles, scripts });
                    } catch (error) {
                        console.error('Failed to load screen:', error);
                        setContent({ html: '<div class="p-10 text-center">Failed to load screen.</div>', styles: [], scripts: [] });
                    }
                    setLoading(false);
                };
                fetchContent();
            }, [screenKey]);

            useEffect(() => {
                if (isActive) {
                    setTransitionClass(direction === 'next' ? 'slide-from-right' : direction === 'prev' ? 'slide-from-left' : 'slide-active');
                    setTimeout(() => setTransitionClass('slide-active'), 50);
                } else {
                    setTransitionClass(direction === 'next' ? 'slide-to-left' : direction === 'prev' ? 'slide-to-right' : '');
                }
            }, [isActive, direction]);

            useEffect(() => {
                // Only load and cleanup assets when NOT transitioning or when becoming active
                if (isActive && !loading && !isTransitioning) {
                    // Cleanup old assets
                    document.querySelectorAll('[data-screen-assets]').forEach(el => el.remove());

                    // Add new assets
                    content.styles.forEach(style => {
                        if (style.type === 'inline') {
                            const s = document.createElement('style'); s.innerHTML = style.content; s.setAttribute('data-screen-assets', 'true'); document.head.appendChild(s);
                        } else {
                            const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = style.href; l.setAttribute('data-screen-assets', 'true'); document.head.appendChild(l);
                        }
                    });
                    content.scripts.forEach(script => {
                        const s = document.createElement('script');
                        if (script.type === 'src') {
                            if (script.src.includes('tailwindcss')) return; s.src = script.src;
                        } else {
                            if (script.id === 'tailwind-config') {
                                try {
                                    const configStr = script.content.replace('tailwind.config =', 'window.tempConfig =');
                                    eval(configStr);
                                    if (window.tailwind && window.tempConfig) window.tailwind.config = window.tempConfig;
                                } catch(e) {}
                                return;
                            }
                            s.innerHTML = script.content;
                        }
                        s.setAttribute('data-screen-assets', 'true'); document.head.appendChild(s);
                    });
                    if (screenKey === 'LOGIN' || screenKey === 'SIGNUP') setupAuthToggle(screenKey);
                }
            }, [isActive, loading, content, screenKey, isTransitioning]);

            const setupAuthToggle = (initialMode) => {
                setTimeout(() => {
                    const container = containerRef.current;
                    if (!container) return;
                    const labels = container.querySelectorAll('label');
                    const loginLabel = Array.from(labels).find(l => l.innerText.includes('Login'));
                    const signupLabel = Array.from(labels).find(l => l.innerText.includes('Sign Up'));
                    const updateUI = (mode) => {
                        const isLogin = mode === 'login';
                        if (loginLabel && signupLabel) {
                            if (isLogin) {
                                loginLabel.className = 'group flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-4 relative transition-all duration-200 bg-primary shadow-sm';
                                loginLabel.querySelector('span').className = 'z-10 text-sm font-semibold text-white';
                                signupLabel.className = 'group flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-4 relative transition-all duration-200';
                                signupLabel.querySelector('span').className = 'z-10 text-sm font-medium text-text-subtle group-hover:text-text-main dark:text-gray-400 dark:group-hover:text-white transition-colors';
                            } else {
                                signupLabel.className = 'group flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-4 relative transition-all duration-200 bg-primary shadow-sm';
                                signupLabel.querySelector('span').className = 'z-10 text-sm font-semibold text-white';
                                loginLabel.className = 'group flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-4 relative transition-all duration-200';
                                loginLabel.querySelector('span').className = 'z-10 text-sm font-medium text-text-subtle group-hover:text-text-main dark:text-gray-400 dark:group-hover:text-white transition-colors';
                            }
                        }
                        const inputs = container.querySelectorAll('input[placeholder]');
                        inputs.forEach(input => {
                            const placeholder = input.placeholder.toLowerCase();
                            const parent = input.closest('.relative');
                            if (isLogin && (placeholder.includes('name') || placeholder.includes('phone') || input.type === 'checkbox' || input.closest('label')?.innerText.includes('agree'))) {
                                if (parent) parent.style.display = 'none'; else if (input.type === 'checkbox') input.closest('label').style.display = 'none';
                            } else {
                                if (parent) parent.style.display = 'block'; else if (input.type === 'checkbox') input.closest('label').style.display = 'flex';
                            }
                        });
                        const mainBtn = container.querySelector('button.bg-primary span');
                        if (mainBtn) mainBtn.innerText = isLogin ? 'Login' : 'Create Account';
                    };
                    updateUI(initialMode.toLowerCase());
                    container.querySelectorAll('input[name="auth-mode"]').forEach(radio => radio.addEventListener('change', (e) => updateUI(e.target.value)));
                    const footerLink = container.querySelector('.mt-auto a');
                    if (footerLink) footerLink.addEventListener('click', (e) => { e.preventDefault(); const currentMode = footerLink.innerText.includes('Login') ? 'login' : 'signup'; updateUI(currentMode); });
                }, 100);
            };

            useEffect(() => {
                if (isActive && !loading && containerRef.current) {
                    const handleGlobalClick = (e) => {
                        const target = e.target.closest('button, a, [role="button"]');
                        if (!target) return;
                        const text = target.innerText.trim().replace(/\s+/g, ' ').toLowerCase();
                        const icon = target.querySelector('.material-symbols-outlined, .material-icons-round')?.innerText;

                        if (text.includes('sign up') || text.includes('create account')) {
                            if (text.includes('provider')) onNavigate('PROVIDER_WELCOME'); else onNavigate('SIGNUP');
                        } else if (text.includes('log in') || text.includes('login') || text.includes('sign in')) {
                            if (text.includes('admin') && screenKey !== 'ADMIN_LOGIN') onNavigate('ADMIN_LOGIN');
                            else if (screenKey === 'ADMIN_LOGIN') onNavigate('ADMIN_DASHBOARD');
                            else if (screenKey === 'WELCOME') onNavigate('LOGIN');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('continue as guest')) onNavigate('CLIENT_HOME');
                        else if (text.includes('book now') || text.includes('book this service')) onNavigate('BOOKING');
                        else if (text.includes('find services') || text.includes('explore') || icon === 'search' || text.includes('grid_view')) onNavigate('FIND_SERVICES');
                        else if (text.includes('view profile')) onNavigate('PROVIDER_PROFILE');
                        else if (text.includes('get started')) {
                            if (screenKey === 'PROVIDER_WELCOME') onNavigate('PROVIDER_SETUP'); else onNavigate('SIGNUP');
                        } else if (text.includes('complete setup') || text.includes('finish')) onNavigate('PROVIDER_DASHBOARD');
                        else if (text.includes('dashboard') || icon === 'dashboard' || icon === 'home') {
                            if (screenKey.startsWith('ADMIN')) onNavigate('ADMIN_DASHBOARD');
                            else if (screenKey.startsWith('PROVIDER')) onNavigate('PROVIDER_DASHBOARD');
                            else onNavigate('CLIENT_HOME');
                        } else if (text.includes('bookings') || icon === 'calendar_today' || icon === 'calendar_month' || icon === 'event_note') {
                            if (screenKey.startsWith('ADMIN')) onNavigate('ADMIN_BOOKINGS');
                            else if (screenKey.startsWith('PROVIDER')) onNavigate('PROVIDER_REQUESTS');
                            else onNavigate('MY_BOOKINGS');
                        } else if (text.includes('messages') || icon === 'chat' || icon === 'chat_bubble') onNavigate('MESSAGES');
                        else if (text.includes('profile') || icon === 'person') onNavigate('PROFILE');
                        else if (text.includes('manage users') || icon === 'manage_accounts' || icon === 'group') onNavigate('ADMIN_USERS');
                        else if (text.includes('settings') || icon === 'settings') {
                            if (screenKey.startsWith('ADMIN')) onNavigate('ADMIN_SETTINGS'); else onNavigate('PROFILE');
                        } else if (text.includes('schedule') || icon === 'schedule') onNavigate('PROVIDER_SCHEDULE');
                        else if (text.includes('emergency')) onNavigate('EMERGENCY');
                    };
                    containerRef.current.addEventListener('click', handleGlobalClick);
                    return () => containerRef.current?.removeEventListener('click', handleGlobalClick);
                }
            }, [isActive, loading, screenKey, onNavigate]);

            return (
                <div
                    ref={containerRef}
                    className={`screen-wrapper ${isActive ? 'z-20' : 'z-10'} ${transitionClass}`}
                    style={{ display: isVisible ? 'block' : 'none' }}
                >
                    {loading ? (
                        <div className="h-full flex items-center justify-center"><div className="animate-spin rounded-full h-10 w-10 border-b-2 border-[#87CEEB]"></div></div>
                    ) : (
                        <div dangerouslySetInnerHTML={{ __html: content.html }} />
                    )}
                </div>
            );
        };

        const App = () => {
            const [history, setHistory] = useState(['WELCOME']);
            const [direction, setDirection] = useState('next');
            const [devMenuOpen, setDevMenuOpen] = useState(false);
            const [isTransitioning, setIsTransitioning] = useState(false);
            const currentScreen = history[history.length - 1];
            const [prevScreen, setPrevScreen] = useState(null);

            const navigate = useCallback((screenKey, isBack = false) => {
                if (screenKey === currentScreen || isTransitioning) return;
                setIsTransitioning(true); setPrevScreen(currentScreen); setDirection(isBack ? 'prev' : 'next');
                if (isBack) setHistory(prev => prev.slice(0, -1)); else setHistory(prev => [...prev, screenKey]);
                setTimeout(() => { setIsTransitioning(false); setPrevScreen(null); }, 450);
            }, [currentScreen, isTransitioning]);

            useEffect(() => {
                const handleExternalNavigate = (e) => { if (SCREEN_MAP[e.detail]) navigate(e.detail); };
                window.addEventListener('navigate', handleExternalNavigate);
                return () => window.removeEventListener('navigate', handleExternalNavigate);
            }, [navigate]);

            return (
                <div className="app-shell">
                    {history.length > 1 && (
                        <div className="back-btn-overlay" onClick={() => navigate(null, true)}>
                            <span className="material-symbols-outlined">arrow_back</span>
                        </div>
                    )}
                    <div className="screen-container">
                        {prevScreen && <Screen key={prevScreen + '_prev'} screenKey={prevScreen} onNavigate={navigate} isActive={false} direction={direction} isVisible={true} isTransitioning={isTransitioning} />}
                        <Screen key={currentScreen} screenKey={currentScreen} onNavigate={navigate} isActive={true} direction={direction} isVisible={true} isTransitioning={isTransitioning} />
                    </div>
                    <div className="dev-menu-btn" onClick={() => setDevMenuOpen(!devMenuOpen)}><span className="material-symbols-outlined">menu</span></div>
                    {devMenuOpen && (
                        <div className="dev-menu">
                            <div className="text-[10px] font-bold text-gray-400 mb-2 px-3 uppercase tracking-wider">Client Flow</div>
                            <button onClick={() => { navigate('WELCOME'); setDevMenuOpen(false); }}>Welcome</button>
                            <button onClick={() => { navigate('CLIENT_HOME'); setDevMenuOpen(false); }}>Home</button>
                            <button onClick={() => { navigate('FIND_SERVICES'); setDevMenuOpen(false); }}>Find Services</button>
                            <div className="text-[10px] font-bold text-gray-400 mt-3 mb-2 px-3 uppercase tracking-wider">Provider Flow</div>
                            <button onClick={() => { navigate('PROVIDER_WELCOME'); setDevMenuOpen(false); }}>Provider Welcome</button>
                            <button onClick={() => { navigate('PROVIDER_DASHBOARD'); setDevMenuOpen(false); }}>Provider Dash</button>
                            <div className="text-[10px] font-bold text-gray-400 mt-3 mb-2 px-3 uppercase tracking-wider">Admin Flow</div>
                            <button onClick={() => { navigate('ADMIN_LOGIN'); setDevMenuOpen(false); }}>Admin Login</button>
                            <button onClick={() => { navigate('ADMIN_DASHBOARD'); setDevMenuOpen(false); }}>Admin Dash</button>
                        </div>
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
